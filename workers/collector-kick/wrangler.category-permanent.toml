name = "viewloom-collector-kick"
main = "src/entry.ts"
compatibility_date = "2026-05-18"

# Production-enable execution candidate for #912. Keep this pull request Draft
# while exact transformed validation runs. Merge only the frozen transformed
# head after all gates are green.
[vars]
INTRADAY_GENERATION_ENABLED = "true"
CATEGORY_CAPTURE_ENABLED = "true"
HISTORY_CATEGORY_GENERATION_ENABLED = "true"
HISTORY_CATEGORY_START_DAY = "2026-08-17"

[triggers]
crons = ["*/5 * * * *"]

# Existing Kick secrets and optional credentials remain unchanged:
#   KICK_INGEST_TOKEN
#   KICK_CLIENT_ID
#   KICK_CLIENT_SECRET
#   KICK_ACCESS_TOKEN
#   KICK_USE_AUTHENTICATED_CHANNEL_READS

[[d1_databases]]
binding = "DB_KICK_HOT"
database_name = "vl_kick_hot"
database_id = "ed1e082f-85ac-4dd0-a44e-5d3e200667d5"
