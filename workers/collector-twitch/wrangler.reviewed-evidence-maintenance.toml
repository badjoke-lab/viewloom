name = "viewloom-collector-twitch"
main = "src/reviewed-evidence-maintenance.ts"
compatibility_date = "2026-05-18"
keep_vars = true

# Manual reviewed-evidence maintenance preview only.
# This config MUST NOT be used with `wrangler deploy` and intentionally has:
# - no [triggers] / cron;
# - no D1 binding;
# - no production deployment path.
# The manual GitHub Actions harness may only create a non-production preview
# version through `wrangler versions upload --preview-alias`.

[secrets]
required = ["TWITCH_CLIENT_ID", "TWITCH_CLIENT_SECRET"]
