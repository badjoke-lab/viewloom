name: Analytics 12A6 Twitch Day Flow Category Public Cutover

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a6-twitch-day-flow-category-public-cutover.yml'
      - '.github/workflows/analytics-12a6-twitch-day-flow-category-candidate.yml'
      - '.github/workflows/quality-u10g-architecture.yml'
      - 'docs/audits/12a6-twitch-day-flow-category-public-cutover-decision.json'
      - 'docs/work-in-progress/u10g-architecture.md'
      - 'scripts/verify-12a6-twitch-day-flow-category-public-cutover.mjs'
      - 'scripts/verify-quality-u10g-architecture.mjs'
      - 'scripts/verify-quality-u10g-browser-evidence.mjs'
      - 'apps/web/scripts/twitch-day-flow-category-public-production-acceptance.mjs'
      - 'apps/web/scripts/verify-production-source.mjs'
      - 'apps/web/scripts/quality-u10g-architecture-browser.mjs'
      - 'apps/web/functions/api/day-flow.ts'
      - 'apps/web/src/live/day-flow-category-preview-entry.ts'
      - 'apps/web/src/live/day-flow-twitch-entry.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a6-twitch-day-flow-category-public-cutover.yml'
      - '.github/workflows/analytics-12a6-twitch-day-flow-category-candidate.yml'
      - '.github/workflows/quality-u10g-architecture.yml'
      - 'docs/audits/12a6-twitch-day-flow-category-public-cutover-decision.json'
      - 'docs/work-in-progress/u10g-architecture.md'
      - 'scripts/verify-12a6-twitch-day-flow-category-public-cutover.mjs'
      - 'scripts/verify-quality-u10g-architecture.mjs'
      - 'scripts/verify-quality-u10g-browser-evidence.mjs'
      - 'apps/web/scripts/twitch-day-flow-category-public-production-acceptance.mjs'
      - 'apps/web/scripts/verify-production-source.mjs'
      - 'apps/web/scripts/quality-u10g-architecture-browser.mjs'
      - 'apps/web/functions/api/day-flow.ts'
      - 'apps/web/src/live/day-flow-category-preview-entry.ts'
      - 'apps/web/src/live/day-flow-twitch-entry.ts'

permissions:
  contents: read

concurrency:
  group: analytics-12a6-twitch-day-flow-category-public-cutover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Verify public-cutover, U10G-maintenance, or compatibility-hotfix scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          cutover='^(\.github/workflows/analytics-12a6-twitch-day-flow-category-public-cutover\.yml|\.github/workflows/analytics-12a6-twitch-day-flow-category-candidate\.yml|docs/audits/12a6-twitch-day-flow-category-public-cutover-decision\.json|scripts/verify-12a6-twitch-day-flow-category-public-cutover\.mjs|apps/web/scripts/twitch-day-flow-category-public-production-acceptance\.mjs|apps/web/scripts/verify-production-source\.mjs|apps/web/functions/api/day-flow\.ts|apps/web/src/live/day-flow-category-preview-entry\.ts|apps/web/src/live/day-flow-twitch-entry\.ts)$'
          maintenance='^(\.github/workflows/analytics-12a6-twitch-day-flow-category-public-cutover\.yml|\.github/workflows/quality-u10g-architecture\.yml|docs/work-in-progress/u10g-architecture\.md|scripts/verify-quality-u10g-architecture\.mjs|scripts/verify-quality-u10g-browser-evidence\.mjs|apps/web/scripts/quality-u10g-architecture-browser\.mjs|apps/web/src/live/day-flow-twitch-entry\.ts)$'
          compatibility='^(\.github/workflows/analytics-12a6-twitch-day-flow-category-public-cutover\.yml|scripts/verify-12a6-twitch-day-flow-category-public-cutover\.mjs|scripts/verify-quality-u10g-architecture\.mjs|apps/web/scripts/verify-production-source\.mjs|apps/web/src/live/day-flow-category-preview-entry\.ts)$'
          exact_scope() {
            local expected="$1"
            local regex="$2"
            [[ "${#changed[@]}" -eq "$expected" ]] || return 1
            for file in "${changed[@]}"; do [[ "$file" =~ $regex ]] || return 1; done
          }
          if exact_scope 9 "$cutover"; then
            echo 'Validated original public-cutover scope.'
          elif exact_scope 7 "$maintenance"; then
            echo 'Validated bounded U10G public-category maintenance scope.'
          elif exact_scope 5 "$compatibility"; then
            echo 'Validated bounded public-category compatibility hotfix scope.'
          else
            echo 'Unexpected public-cutover/U10G/compatibility scope.' >&2
            exit 1
          fi
      - name: Verify accepted public-cutover decision
        run: node scripts/verify-12a6-twitch-day-flow-category-public-cutover.mjs
      - name: Verify retained category projection semantics
        run: node apps/web/scripts/day-flow-category-core.test.mjs
      - name: Verify retained Day Flow and source contracts
        working-directory: apps/web
        run: |
          node scripts/verify-production-source.mjs
          node scripts/verify-dayflow-qa.mjs
      - name: Verify retained cross-site analysis contracts
        run: |
          node scripts/verify-quality-u10d-analysis-coherence.mjs
          node scripts/verify-quality-u10g-architecture.mjs
      - name: Typecheck and build web
        run: |
          pnpm --filter @viewloom/web typecheck:app
          pnpm --filter @viewloom/web typecheck:functions
          pnpm build:web
      - name: Verify provider bootstrap boundary after build
        run: |
          test -f apps/web/dist/twitch/day-flow/index.html
          test -f apps/web/dist/kick/day-flow/index.html
          grep -Fq '/assets/' apps/web/dist/twitch/day-flow/index.html
          grep -Fq '/assets/' apps/web/dist/kick/day-flow/index.html

  production-acceptance:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUTPUT_DIR: artifacts/12a6-twitch-day-flow-category-public-production-acceptance
      VIEWLOOM_ORIGIN: https://www.viewloom.net
      DAYFLOW_VALIDATION_DATE: '2026-08-08'
      EXPECTED_PRODUCTION_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install playwright@1.52.0 --no-save --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - id: browser
        name: Accept public Twitch Day Flow category cutover in production
        continue-on-error: true
        run: node apps/web/scripts/twitch-day-flow-category-public-production-acceptance.mjs
      - name: Upload public production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-12a6-twitch-day-flow-category-public-production-acceptance
          path: artifacts/12a6-twitch-day-flow-category-public-production-acceptance/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence upload when public acceptance rejects
        if: steps.browser.outcome != 'success'
        run: exit 1
