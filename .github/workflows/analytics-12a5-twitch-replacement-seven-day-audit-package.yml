name: Analytics 12A5 Twitch Replacement Seven-Day Audit Package

on:
  pull_request:
    branches: [main]
    paths: &audit_paths
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/README.md'
      - 'docs/product/twitch-replacement-seven-day-audit-spec.md'
      - 'docs/product/current-roadmap.md'
      - 'docs/product/current-schedule.md'
      - 'docs/audits/12a2-current-gate-state.json'
      - 'docs/audits/12a5-twitch-replacement-seven-day-audit-package-contract.json'
      - 'docs/audits/12a5-twitch-category-source-v2-semantic-clock-decision.json'
      - 'docs/audits/12a5-twitch-category-source-v2-stability-clock-acceptance.json'
      - 'docs/audits/12a5-twitch-replacement-seven-day-audit-runner-repair-acceptance.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-package-contract.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-package-acceptance.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-evidence.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-retirement.json'
      - 'docs/work-in-progress/phase12a4-category-parallel-execution.md'
      - 'scripts/run-12a5-twitch-replacement-seven-day-audit.mjs'
      - 'scripts/test-12a5-twitch-replacement-seven-day-audit.mjs'
      - 'scripts/verify-12a5-twitch-category-source-v2-stability-clock-acceptance.mjs'
      - 'scripts/verify-12a5-twitch-replacement-audit-checkpoint-retirement.mjs'
      - 'scripts/verify-category-rollout-policy.mjs'
      - 'scripts/verify-development-policy.mjs'
      - 'workers/collector-twitch/wrangler.category-permanent.toml'
      - 'workers/collector-twitch/wrangler.toml'
      - 'workers/collector-kick/wrangler.category-permanent.toml'
      - 'workers/collector-kick/wrangler.toml'
      - '.github/workflows/analytics-12a5-twitch-replacement-seven-day-audit-package.yml'
      - '.github/workflows/category-rollout-policy.yml'
  push:
    branches: [main]
    paths: *audit_paths

permissions:
  contents: read

concurrency:
  group: analytics-12a5-twitch-replacement-seven-day-audit-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-current-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Parse current read-only runner and clock verifier
        run: |
          node --check scripts/run-12a5-twitch-replacement-seven-day-audit.mjs
          node --check scripts/test-12a5-twitch-replacement-seven-day-audit.mjs
          node --check scripts/verify-12a5-twitch-category-source-v2-stability-clock-acceptance.mjs
          node --check scripts/verify-12a5-twitch-replacement-audit-checkpoint-retirement.mjs
      - name: Verify failed checkpoint evidence and retired path
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-retirement.mjs
      - name: Verify accepted revised stability clock
        run: node scripts/verify-12a5-twitch-category-source-v2-stability-clock-acceptance.mjs
      - name: Test exact replacement audit window and slot accounting
        run: node scripts/test-12a5-twitch-replacement-seven-day-audit.mjs
      - name: Verify current category rollout policy
        run: node scripts/verify-category-rollout-policy.mjs
      - name: Verify current development policy
        run: node scripts/verify-development-policy.mjs
      - name: Typecheck web
        run: pnpm typecheck:web
      - name: Build web
        run: pnpm build:web
      - name: Verify production build still contains no public category controls
        run: |
          test -f apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'heatmap-category-preview-controls' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/twitch/heatmap/index.html
          test -f apps/web/dist/kick/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/kick/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/kick/heatmap/index.html
      - name: Summarize active revised stability clock
        run: |
          {
            echo '## Twitch replacement seven-day stability clock'
            echo
            echo '- Semantic decision: PR #699 / `ec4792712c24c5e1ed05cfa8a0ba5e600e748b8e`'
            echo '- Clock acceptance: PR #700'
            echo '- Window: `[2026-07-31T17:00:00Z, 2026-08-07T17:00:00Z)`'
            echo '- JST: `2026-08-01 02:00` to `2026-08-08 02:00`'
            echo '- Expected five-minute slots: `2016`'
            echo '- Manual action at start boundary: no'
            echo '- Existing Twitch collector continues: yes'
            echo '- Worker/D1/binding/cadence/Kick/domain change: no'
            echo '- Public category filter authorized: no'
            echo '- Final mode before end boundary: prohibited'
          } >> "$GITHUB_STEP_SUMMARY"
