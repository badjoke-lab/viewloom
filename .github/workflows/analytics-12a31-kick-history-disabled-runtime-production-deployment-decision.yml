name: Analytics 12A31 Kick History Disabled Runtime Production Deployment Decision

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a31-kick-history-disabled-runtime-production-deployment-decision.yml'
      - 'docs/audits/12a31-kick-history-disabled-runtime-production-deployment-decision.json'
      - 'scripts/verify-12a31-kick-history-disabled-runtime-production-deployment-decision.mjs'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: analytics-12a31-kick-history-disabled-runtime-production-deployment-decision-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify exact 12A31 repository-only scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          expected=(
            '.github/workflows/analytics-12a31-kick-history-disabled-runtime-production-deployment-decision.yml'
            'docs/audits/12a31-kick-history-disabled-runtime-production-deployment-decision.json'
            'scripts/verify-12a31-kick-history-disabled-runtime-production-deployment-decision.mjs'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$path"
          done

      - name: Verify 12A31 decision and accepted production evidence
        run: node scripts/verify-12a31-kick-history-disabled-runtime-production-deployment-decision.mjs

      - name: Re-audit exact Draft candidate from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/badjoke-lab/viewloom'
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsSL "${auth[@]}" "$api/pulls/898" > /tmp/candidate-pr.json
          jq -e '.state == "open"' /tmp/candidate-pr.json
          jq -e '.draft == true' /tmp/candidate-pr.json
          jq -e '.merged == false' /tmp/candidate-pr.json
          jq -e '.base.ref == "main"' /tmp/candidate-pr.json
          jq -e '.base.sha == "09784eb48d026242c6ca43631aecd503b8765a95"' /tmp/candidate-pr.json
          jq -e '.head.sha == "6b4e95da258476ba104e4e3598ae5793f9153dcd"' /tmp/candidate-pr.json
          jq -e '.changed_files == 4' /tmp/candidate-pr.json

          curl -fsSL "${auth[@]}" "$api/pulls/898/files?per_page=100" > /tmp/candidate-files.json
          test "$(jq 'length' /tmp/candidate-files.json)" -eq 4
          expected_entry='workers/collector-kick/'"src/entry.ts"
          expected=(
            '.github/workflows/analytics-12a30-kick-history-category-runtime-wiring-candidate.yml'
            'docs/audits/12a30-kick-history-category-runtime-wiring-candidate.json'
            'scripts/verify-12a30-kick-history-category-runtime-wiring-candidate.mjs'
            "$expected_entry"
          )
          mapfile -t actual < <(jq -r '.[].filename' /tmp/candidate-files.json | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${actual[*]}" = "${wanted[*]}"
          forbidden_wrangler='workers/collector-kick/'"wrangler.toml"
          ! jq -e --arg path "$forbidden_wrangler" 'any(.[]; .filename == $path)' /tmp/candidate-files.json

      - name: Revalidate current production PASS and collector contracts
        run: |
          node scripts/verify-12a26-kick-history-category-reprobe-pass.mjs
          node scripts/verify-collector-contracts.mjs
          pnpm typecheck:collectors

      - name: Verify repository-only Decision workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/analytics-12a31-kick-history-disabled-runtime-production-deployment-decision.yml').read_text()
          forbidden = [
              '\n  ' + 'push:',
              'workflow_' + 'dispatch:',
              'sched' + 'ule:',
              'CLOUDFLARE_' + 'API_TOKEN',
              'CLOUDFLARE_' + 'ACCOUNT_ID',
              'wrangler ' + 'deploy',
              'wrangler@4 ' + 'deploy',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'production-capable Decision workflow surface: {token}')
          PY

      - name: Publish Decision boundary
        if: always()
        run: |
          {
            echo '## Kick History Category — 12A31 production deployment decision'
            echo
            echo '- Decision: GO for exact disabled-by-default candidate #898 head 6b4e95da258476ba104e4e3598ae5793f9153dcd'
            echo '- This Decision PR itself deploys production: no'
            echo '- Candidate remains Draft until explicit operator execution instruction: yes'
            echo '- Candidate Ready/merge before that instruction: forbidden'
            echo '- Expected future production deploy provider: Kick only'
            echo '- Twitch deployment in future execution: must remain skipped'
            echo '- History Category generator production enablement: still unauthorized'
            echo '- Production startDay configuration: still unauthorized'
            echo '- API/UI/Twitch rollout/backfill/new cron/raw-retention change: still unauthorized'
            echo '- Production cost PASS retained: 16,117 / 250,000 rows_read'
          } >> "$GITHUB_STEP_SUMMARY"
