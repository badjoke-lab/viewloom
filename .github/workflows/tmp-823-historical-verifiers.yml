name: TMP 823 Historical Battle Lines Verifiers

on:
  push:
    branches: [work-823-kick-battle-lines-category-public-cutover]
    paths:
      - '.github/workflows/tmp-823-historical-verifiers.yml'
      - 'scripts/tmp-823-historical-verifiers.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work-823-kick-battle-lines-category-public-cutover
          fetch-depth: 0
      - name: Convert hidden verifiers to historical authority
        run: python scripts/tmp-823-historical-verifiers.py
      - name: Verify converted syntax
        run: |
          node --check scripts/verify-12a10-kick-battle-lines-category-candidate.mjs
          node --check scripts/verify-12a10-kick-battle-lines-category-hidden-production-evidence.mjs
      - name: Commit historical verifier conversion
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add scripts/verify-12a10-kick-battle-lines-category-candidate.mjs scripts/verify-12a10-kick-battle-lines-category-hidden-production-evidence.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Pin hidden Battle Lines verifiers to accepted product SHA'
          git push origin HEAD:work-823-kick-battle-lines-category-public-cutover
