name: Analytics 12A8 Kick Heatmap Category Public Cutover Decision

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'docs/audits/12a8-kick-heatmap-category-public-cutover-decision.json'
      - 'scripts/verify-12a8-kick-heatmap-category-public-cutover-decision.mjs'
      - '.github/workflows/analytics-12a8-kick-heatmap-category-public-cutover-decision.yml'

permissions:
  contents: read

concurrency:
  group: analytics-12a8-kick-heatmap-category-public-cutover-decision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout decision head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify accepted corrected hidden evidence remains authoritative
        run: node scripts/verify-12a8-kick-heatmap-category-hidden-production-evidence.mjs

      - name: Verify Kick Heatmap public category cutover decision
        run: node scripts/verify-12a8-kick-heatmap-category-public-cutover-decision.mjs

      - name: Verify decision-only PR scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(docs/audits/12a8-kick-heatmap-category-public-cutover-decision\.json|scripts/verify-12a8-kick-heatmap-category-public-cutover-decision\.mjs|\.github/workflows/analytics-12a8-kick-heatmap-category-public-cutover-decision\.yml)$'
          test "${#changed[@]}" -eq 3
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "Unexpected non-decision change: $path" >&2; exit 1; }
          done

      - name: Publish decision boundary
        if: always()
        run: |
          {
            echo '## Kick Heatmap category public-cutover decision'
            echo
            echo '- Decision: authorize public Kick Heatmap Category + Top controls'
            echo '- Default: All categories / Top 50'
            echo '- Allowed Top: 20 / 50 / 100'
            echo '- Filter: category before Top N'
            echo '- Legacy categoryPreview=1: compatible but not required'
            echo '- Unknown/unavailable selected categories: explicit empty state; never inferred'
            echo '- Selected-category momentum: same-category compatible observations only; otherwise N/A'
            echo '- Normal Kick route: public controls authorized only after a later implementation PR'
            echo '- Production browser acceptance: required after implementation'
            echo '- Kick Day Flow / Battle Lines / History category UI: not authorized'
            echo '- Twitch runtime semantics: unchanged'
            echo '- Collector / Worker / D1 / cadence / retention / backfill / credentials: unchanged'
          } >> "$GITHUB_STEP_SUMMARY"
