name: Twitch City Sant Cugat Recall Probe

on:
  push:
    branches:
      - feature/twitch-city-reference-point-review-probe-batch-2
    paths:
      - .github/workflows/twitch-city-sant-cugat-recall-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recall-sant-cugat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Search Natural Earth v5.1.2 alternate Sant Cugat labels
        shell: bash
        run: |
          node <<'NODE'
          const version = '5.1.2';
          const url = `https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v${version}/geojson/ne_10m_populated_places_simple.geojson`;
          const response = await fetch(url);
          if (!response.ok) throw new Error(`Natural Earth fetch failed: ${response.status}`);
          const collection = await response.json();
          const candidates = collection.features.filter((feature) => {
            const p = feature.properties ?? {};
            if (p.iso_a2 !== 'ES') return false;
            return Object.values(p).some((value) => typeof value === 'string' && value.toLowerCase().includes('cugat'));
          }).map((feature) => ({
            properties: Object.fromEntries(Object.entries(feature.properties ?? {}).filter(([, value]) =>
              typeof value === 'string' && (value.toLowerCase().includes('cugat') || ['name','nameascii','adm0name','adm1name','iso_a2','featurecla'].includes(''))
            )),
            name: feature.properties?.name ?? null,
            nameascii: feature.properties?.nameascii ?? null,
            adm0name: feature.properties?.adm0name ?? null,
            adm1name: feature.properties?.adm1name ?? null,
            iso_a2: feature.properties?.iso_a2 ?? null,
            featurecla: feature.properties?.featurecla ?? null,
            ne_id: feature.properties?.ne_id ?? null,
            geometry: feature.geometry ?? null,
          }));
          console.log(JSON.stringify({ version, candidateCount: candidates.length, candidates }));
          NODE
