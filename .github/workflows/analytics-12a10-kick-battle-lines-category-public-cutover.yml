name: Analytics 12A10 Kick Battle Lines Category Public Cutover

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a10-kick-battle-lines-category-public-cutover.yml'
      - 'scripts/verify-12a10-kick-battle-lines-category-public-cutover.mjs'
      - 'scripts/verify-12a10-kick-battle-lines-category-candidate.mjs'
      - 'scripts/verify-12a10-kick-battle-lines-category-hidden-production-evidence.mjs'
      - 'apps/web/scripts/kick-battle-lines-category-public-production-acceptance.mjs'
      - 'apps/web/functions/api/kick-battle-lines.ts'
      - 'apps/web/src/live/battle-lines-current-shell-entry.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a10-kick-battle-lines-category-public-cutover.yml'
      - 'scripts/verify-12a10-kick-battle-lines-category-public-cutover.mjs'
      - 'scripts/verify-12a10-kick-battle-lines-category-candidate.mjs'
      - 'scripts/verify-12a10-kick-battle-lines-category-hidden-production-evidence.mjs'
      - 'apps/web/scripts/kick-battle-lines-category-public-production-acceptance.mjs'
      - 'apps/web/functions/api/kick-battle-lines.ts'
      - 'apps/web/src/live/battle-lines-current-shell-entry.ts'

permissions:
  contents: read

concurrency:
  group: analytics-12a10-kick-battle-lines-category-public-cutover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Verify exact seven-file public cutover scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(\.github/workflows/analytics-12a10-kick-battle-lines-category-public-cutover\.yml|scripts/verify-12a10-kick-battle-lines-category-public-cutover\.mjs|scripts/verify-12a10-kick-battle-lines-category-candidate\.mjs|scripts/verify-12a10-kick-battle-lines-category-hidden-production-evidence\.mjs|apps/web/scripts/kick-battle-lines-category-public-production-acceptance\.mjs|apps/web/functions/api/kick-battle-lines\.ts|apps/web/src/live/battle-lines-current-shell-entry\.ts)$'
          test "${#changed[@]}" -eq 7
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected public cutover change: $file" >&2; exit 1; }
          done
      - name: Verify public cutover authority and runtime
        run: node scripts/verify-12a10-kick-battle-lines-category-public-cutover.mjs
      - name: Verify historical hidden authorities remain auditable
        run: |
          node scripts/verify-12a10-kick-battle-lines-category-candidate.mjs
          node scripts/verify-12a10-kick-battle-lines-category-hidden-production-evidence.mjs
      - name: Run retained Battle Lines fixtures
        working-directory: apps/web
        run: |
          node scripts/verify-battle-lines-core.mjs
          node scripts/verify-kick-battle-lines-category-candidate.mjs
      - name: Verify retained architecture and production boundaries
        run: |
          node scripts/verify-quality-u10g-architecture.mjs
          node scripts/verify-quality-u10d-analysis-coherence.mjs
          cd apps/web
          node scripts/verify-production-source.mjs
      - name: Verify browser acceptance syntax
        run: node --check apps/web/scripts/kick-battle-lines-category-public-production-acceptance.mjs
      - name: Typecheck and build web
        run: |
          pnpm typecheck:web
          pnpm build:web
      - name: Publish public cutover boundary
        if: always()
        run: |
          {
            echo '## Kick Battle Lines public Category cutover'
            echo
            echo '- Decision authority: #821 / PR #822'
            echo '- Normal Kick route: Category control public, default All'
            echo '- Legacy categoryPreview=1: compatible, removed after public Category interaction'
            echo '- Direct API without category: retained unfiltered fallback'
            echo '- Filter order: category -> candidate compaction -> Top N -> Recommended Battle scoring'
            echo '- Point states and category missing-penalty boundaries: unchanged'
            echo '- Unknown category: zero category lines/battles; no global substitution'
            echo '- Top: 3 / 5 / 10, default 5; metrics Viewers / Indexed; display buckets 5m / 10m'
            echo '- Mobile Category touch target: >=44px'
            echo '- Twitch Battle Lines Category controls: absent'
            echo '- Exact-production public browser acceptance after merge: required'
          } >> "$GITHUB_STEP_SUMMARY"

  production-acceptance:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OUTPUT_DIR: artifacts/12a10-kick-battle-lines-category-public-production-acceptance
      VIEWLOOM_ORIGIN: https://www.viewloom.net
      BATTLE_VALIDATION_DATE: '2026-08-10'
      EXPECTED_PRODUCTION_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: source
        name: Wait for exact public implementation SHA through Pages Git integration
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          success=false
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$VIEWLOOM_ORIGIN/deployment.json?kickBattleCategoryPublic=$GITHUB_RUN_ID-$attempt" -o "$OUTPUT_DIR/last-deployment.json"; then
              observed_sha=$(jq -r '.commit_sha // ""' "$OUTPUT_DIR/last-deployment.json")
              observed_env=$(jq -r '.environment // ""' "$OUTPUT_DIR/last-deployment.json")
              observed_branch=$(jq -r '.branch // ""' "$OUTPUT_DIR/last-deployment.json")
              if [[ "$observed_sha" == "$EXPECTED_PRODUCTION_SHA" && "$observed_env" == production && "$observed_branch" == main ]]; then success=true; break; fi
            fi
            sleep 5
          done
          [[ "$success" == true ]]
      - uses: actions/setup-node@v4
        if: steps.source.outcome == 'success'
        with:
          node-version: 22
      - name: Install Playwright
        if: steps.source.outcome == 'success'
        run: npm install playwright@1.52.0 --no-save --no-audit --no-fund
      - name: Install Chromium
        if: steps.source.outcome == 'success'
        run: npx playwright install --with-deps chromium
      - id: browser
        name: Accept public Kick Battle Lines Category in production
        if: steps.source.outcome == 'success'
        continue-on-error: true
        run: node apps/web/scripts/kick-battle-lines-category-public-production-acceptance.mjs
      - name: Upload public production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-12a10-kick-battle-lines-category-public-production-acceptance
          path: artifacts/12a10-kick-battle-lines-category-public-production-acceptance/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence upload when exact source or browser rejects
        if: steps.source.outcome != 'success' || steps.browser.outcome != 'success'
        run: exit 1
