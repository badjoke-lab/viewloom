name: Analytics 12A29 Kick History Runtime Wiring Candidate Decision

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a29-kick-history-category-runtime-wiring-candidate-decision.yml'
      - 'docs/audits/12a29-kick-history-category-runtime-wiring-candidate-decision.json'
      - 'scripts/verify-12a29-kick-history-category-runtime-wiring-candidate-decision.mjs'

permissions:
  contents: read

concurrency:
  group: analytics-12a29-kick-history-runtime-candidate-decision-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify exact 12A29 decision scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          expected=(
            '.github/workflows/analytics-12a29-kick-history-category-runtime-wiring-candidate-decision.yml'
            'docs/audits/12a29-kick-history-category-runtime-wiring-candidate-decision.json'
            'scripts/verify-12a29-kick-history-category-runtime-wiring-candidate-decision.mjs'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$path"
          done

      - name: Verify runtime wiring candidate decision
        run: node scripts/verify-12a29-kick-history-category-runtime-wiring-candidate-decision.mjs

      - name: Revalidate accepted package and production evidence
        run: |
          node scripts/verify-12a28-kick-history-category-permanent-generator-integration-package.mjs
          node scripts/verify-12a27-kick-history-category-permanent-generator-decision.mjs
          node scripts/verify-12a26-kick-history-category-reprobe-pass.mjs
          node scripts/verify-12a15-kick-history-category-aggregate-generator.mjs
          python3 scripts/test-12a15-kick-history-category-aggregate.py
          pnpm typecheck:collectors
          pnpm verify:collectors
          pnpm typecheck:web
          pnpm build:web

      - name: Verify repository-only decision workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/analytics-12a29-kick-history-category-runtime-wiring-candidate-decision.yml').read_text()
          forbidden = [
              '\n  ' + 'push:',
              'workflow_' + 'dispatch:',
              'sched' + 'ule:',
              'CLOUDFLARE_' + 'API_TOKEN',
              'CLOUDFLARE_' + 'ACCOUNT_ID',
              'wrangler@4 ' + 'deploy',
              'actions/' + 'upload-artifact',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'production-capable decision workflow surface: {token}')
          PY

      - name: Publish decision boundary
        if: always()
        run: |
          {
            echo '## Kick History Category — 12A29 runtime wiring candidate decision'
            echo
            echo '- Decision: YES, prepare exactly one Draft disabled-by-default runtime wiring candidate only'
            echo '- Candidate merge: not authorized'
            echo '- Production Collector Worker deployment: not authorized'
            echo '- Production generator enablement: not authorized'
            echo '- Candidate must remain Draft after CI: yes'
            echo '- New cron/backfill/raw-retention change: none'
            echo '- History Category API/UI and Twitch: still unauthorized'
            echo '- Later explicit production-deployment decision required before merge'
          } >> "$GITHUB_STEP_SUMMARY"
