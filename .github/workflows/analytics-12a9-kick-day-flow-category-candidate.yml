name: Analytics 12A9 Kick Day Flow Historical Category Candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/verify-12a9-kick-day-flow-category-candidate.mjs'
      - '.github/workflows/analytics-12a9-kick-day-flow-category-candidate.yml'

permissions:
  contents: read

concurrency:
  group: analytics-12a9-kick-day-flow-historical-category-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-historical-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify accepted hidden candidate at fixed authority SHA
        run: node scripts/verify-12a9-kick-day-flow-category-candidate.mjs
      - name: Verify shared projection semantics remain valid
        run: node apps/web/scripts/day-flow-category-core.test.mjs
      - name: Publish historical boundary
        if: always()
        run: |
          {
            echo '## Kick Day Flow historical hidden candidate'
            echo
            echo '- Fixed hidden product authority: 27b3cca084d62d8badd512c068be415c6865965e'
            echo '- Current public runtime is intentionally not evaluated as hidden candidate state.'
            echo '- Hidden candidate remains auditable after public cutover.'
          } >> "$GITHUB_STEP_SUMMARY"
