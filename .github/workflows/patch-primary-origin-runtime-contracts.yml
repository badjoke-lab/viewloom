name: Patch primary origin runtime contracts

on:
  push:
    branches:
      - fix-primary-origin-runtime-contracts
    paths:
      - '.github/workflows/patch-primary-origin-runtime-contracts.yml'

permissions:
  contents: write

concurrency:
  group: patch-primary-origin-runtime-contracts
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-primary-origin-runtime-contracts
          fetch-depth: 0
      - name: Synchronize non-workflow primary origin sources
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const oldOrigin = 'https://vl.badjoke-lab.com'
          const primaryOrigin = 'https://www.viewloom.net'
          const allowedExtensions = new Set(['.html', '.ts', '.js', '.mjs', '.json', '.xml', '.txt'])
          const intentionalLegacyFiles = new Set([
            path.join('apps', 'web', 'vite.config.ts'),
            path.join('apps', 'web', 'scripts', 'normalize-built-head.mjs'),
            path.join('apps', 'web', 'scripts', 'verify-primary-domain-cutover.mjs'),
          ])
          const changed = []

          function updateFile(file) {
            if (intentionalLegacyFiles.has(file)) return
            const source = fs.readFileSync(file, 'utf8')
            if (!source.includes(oldOrigin)) return
            fs.writeFileSync(file, source.replaceAll(oldOrigin, primaryOrigin))
            changed.push(file)
          }

          function walk(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const target = path.join(directory, entry.name)
              if (entry.isDirectory()) {
                if (entry.name !== 'node_modules' && entry.name !== 'dist') walk(target)
                continue
              }
              if (!entry.isFile() || !allowedExtensions.has(path.extname(entry.name))) continue
              updateFile(target)
            }
          }

          walk(path.join('apps', 'web'))

          const rootScripts = [
            'scripts/collect-12a0-capacity-baseline.mjs',
            'scripts/collect-12a2-binding-size-production-evidence.mjs',
            'scripts/collect-12a2-remote-schema-production-evidence.mjs',
          ]
          for (const file of rootScripts) updateFile(file)

          if (changed.length === 0) throw new Error('No primary-origin changes were applied')

          const unexpected = []
          function verifyDirectory(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const target = path.join(directory, entry.name)
              if (entry.isDirectory()) {
                if (entry.name !== 'node_modules' && entry.name !== 'dist') verifyDirectory(target)
                continue
              }
              if (!entry.isFile() || !allowedExtensions.has(path.extname(entry.name))) continue
              if (intentionalLegacyFiles.has(target)) continue
              if (fs.readFileSync(target, 'utf8').includes(oldOrigin)) unexpected.push(target)
            }
          }
          verifyDirectory(path.join('apps', 'web'))
          for (const file of rootScripts) {
            if (fs.readFileSync(file, 'utf8').includes(oldOrigin)) unexpected.push(file)
          }
          if (unexpected.length) throw new Error(`Unexpected legacy origins remain: ${unexpected.join(', ')}`)

          console.log(JSON.stringify({ changedCount: changed.length, changed, intentionalLegacyFiles: [...intentionalLegacyFiles] }, null, 2))
          NODE
      - name: Commit synchronized non-workflow sources
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web scripts/collect-12a0-capacity-baseline.mjs scripts/collect-12a2-binding-size-production-evidence.mjs scripts/collect-12a2-remote-schema-production-evidence.mjs
          git commit -m 'Synchronize primary origin source contracts'
          git push origin HEAD:fix-primary-origin-runtime-contracts
