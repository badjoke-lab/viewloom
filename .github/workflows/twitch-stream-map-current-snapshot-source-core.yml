name: Twitch Stream Map Current Snapshot Source Core

on:
  pull_request:
    paths:
      - 'apps/web/functions/api/twitch-stream-map-current-snapshot-source-core.mjs'
      - 'apps/web/functions/api/twitch-stream-map-current-snapshot-source-core.d.mts'
      - 'scripts/verify-twitch-stream-map-current-snapshot-source-core.mjs'
      - 'scripts/twitch-stream-map-current-response-core.mjs'
      - 'docs/audits/twitch-stream-map-current-response-fixture-v0.1.json'
      - '.github/workflows/twitch-stream-map-current-snapshot-source-core.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/functions/api/twitch-stream-map-current-snapshot-source-core.mjs'
      - 'apps/web/functions/api/twitch-stream-map-current-snapshot-source-core.d.mts'
      - 'scripts/verify-twitch-stream-map-current-snapshot-source-core.mjs'
      - 'scripts/twitch-stream-map-current-response-core.mjs'
      - 'docs/audits/twitch-stream-map-current-response-fixture-v0.1.json'
      - '.github/workflows/twitch-stream-map-current-snapshot-source-core.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Twitch Current snapshot source to response contract
        run: node scripts/verify-twitch-stream-map-current-snapshot-source-core.mjs
