name: Twitch Stream Map Current Review Queue Result

on:
  pull_request:
    paths:
      - 'docs/audits/twitch-stream-map-current-review-queue-live-result-2026-08-28.json'
      - 'scripts/verify-twitch-stream-map-current-review-queue-live-result.mjs'
      - '.github/workflows/twitch-stream-map-current-review-queue-result.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/audits/twitch-stream-map-current-review-queue-live-result-2026-08-28.json'
      - 'scripts/verify-twitch-stream-map-current-review-queue-live-result.mjs'
      - '.github/workflows/twitch-stream-map-current-review-queue-result.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Current / IRL live review queue result
        run: node scripts/verify-twitch-stream-map-current-review-queue-live-result.mjs
