name: Analytics 12A5 Twitch Replacement Audit Final

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a5-twitch-replacement-audit-final.yml'
      - 'docs/audits/12a5-twitch-replacement-audit-final-execution-package-contract.json'
      - 'docs/audits/12a5-twitch-replacement-audit-final-trigger-contract.json'
      - 'docs/audits/12a5-twitch-replacement-audit-final-trigger.json'
      - 'docs/audits/12a5-twitch-replacement-seven-day-audit-package-contract.json'
      - 'docs/audits/12a5-twitch-category-source-v2-semantic-clock-decision.json'
      - 'docs/audits/12a5-twitch-category-source-v2-stability-clock-acceptance.json'
      - 'docs/product/twitch-replacement-seven-day-audit-spec.md'
      - 'docs/product/current-roadmap.md'
      - 'docs/product/current-schedule.md'
      - 'docs/work-in-progress/phase12a4-category-parallel-execution.md'
      - 'scripts/run-12a5-twitch-replacement-seven-day-audit.mjs'
      - 'scripts/test-12a5-twitch-replacement-seven-day-audit.mjs'
      - 'scripts/verify-12a5-twitch-replacement-audit-final-execution-package.mjs'
      - 'scripts/verify-category-rollout-policy.mjs'
      - 'scripts/verify-development-policy.mjs'
      - 'workers/collector-twitch/wrangler.category-permanent.toml'
      - 'workers/collector-twitch/wrangler.toml'
      - 'workers/collector-kick/wrangler.category-permanent.toml'
      - 'workers/collector-kick/wrangler.toml'
  push:
    branches: [main]
    paths:
      - 'docs/audits/12a5-twitch-replacement-audit-final-trigger.json'

permissions:
  contents: read

concurrency:
  group: analytics-12a5-twitch-replacement-audit-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trigger_present: ${{ steps.classify.outputs.trigger_present }}
    steps:
      - uses: actions/checkout@v4
      - id: classify
        name: Detect exact Twitch final audit trigger
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const path = 'docs/audits/12a5-twitch-replacement-audit-final-trigger.json'
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `trigger_present=${fs.existsSync(path)}\n`)
          NODE

  verify-package:
    if: github.event_name == 'pull_request' && needs.classify.outputs.trigger_present != 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Confirm production trigger is absent
        run: test ! -f docs/audits/12a5-twitch-replacement-audit-final-trigger.json
      - name: Parse final execution package and accepted runner
        run: |
          node --check scripts/verify-12a5-twitch-replacement-audit-final-execution-package.mjs
          node --check scripts/run-12a5-twitch-replacement-seven-day-audit.mjs
          node --check scripts/test-12a5-twitch-replacement-seven-day-audit.mjs
      - name: Verify dormant final execution package
        run: node scripts/verify-12a5-twitch-replacement-audit-final-execution-package.mjs
      - name: Test exact replacement audit window and slot accounting
        run: node scripts/test-12a5-twitch-replacement-seven-day-audit.mjs
      - name: Verify current category rollout policy
        run: node scripts/verify-category-rollout-policy.mjs
      - name: Verify current development policy
        run: node scripts/verify-development-policy.mjs
      - name: Typecheck web
        run: pnpm typecheck:web
      - name: Build web
        run: pnpm build:web
      - name: Verify production build still contains no public category controls
        run: |
          test -f apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'heatmap-category-preview-controls' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/twitch/heatmap/index.html
          test -f apps/web/dist/kick/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/kick/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/kick/heatmap/index.html
      - name: Summarize dormant final boundary
        run: |
          {
            echo '## Twitch replacement final audit execution package'
            echo
            echo '- Mode: `final` only'
            echo '- Window: `[2026-07-31T17:00:00Z, 2026-08-07T17:00:00Z)`'
            echo '- Expected slots: `2016`'
            echo '- Production credentials or execution on package PR: no'
            echo '- D1 statements during later execution: `SELECT` / `WITH` only'
            echo '- Worker/D1/binding/cadence/retention/Kick/public UI mutation: no'
            echo '- Separate package acceptance and one-file trigger required: yes'
          } >> "$GITHUB_STEP_SUMMARY"

  validate-trigger:
    if: needs.classify.outputs.trigger_present == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate accepted final package identity and exact trigger
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const packageContract = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-replacement-audit-final-execution-package-contract.json', 'utf8'))
          const triggerContract = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-replacement-audit-final-trigger-contract.json', 'utf8'))
          const trigger = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-replacement-audit-final-trigger.json', 'utf8'))
          if (packageContract.status !== 'accepted') throw new Error('final_execution_package_not_accepted')
          if (triggerContract.status !== 'accepted') throw new Error('final_trigger_contract_not_accepted')
          if (trigger.schemaVersion !== triggerContract.trigger.schemaVersion) throw new Error('trigger_schema_mismatch')
          if (trigger.status !== 'armed' || trigger.provider !== 'twitch' || trigger.mode !== 'final' || trigger.oneTime !== true) throw new Error('trigger_identity_invalid')
          if (trigger.confirmation !== triggerContract.trigger.confirmation) throw new Error('trigger_confirmation_invalid')
          if (trigger.packagePr !== packageContract.acceptance.packagePr || trigger.packageMergeSha !== packageContract.acceptance.packageMergeSha) throw new Error('package_identity_mismatch')
          if (trigger.packagePr !== triggerContract.acceptedPackageIdentity.packagePr || trigger.packageMergeSha !== triggerContract.acceptedPackageIdentity.packageMergeSha) throw new Error('trigger_contract_package_identity_mismatch')
          if (trigger.executeNotBefore !== triggerContract.trigger.executeNotBefore || trigger.executeNotBefore !== packageContract.window.endExclusiveAt) throw new Error('trigger_boundary_mismatch')
          if (Date.now() < Date.parse(trigger.executeNotBefore)) throw new Error('final_audit_boundary_not_reached')
          NODE

  final:
    if: github.event_name == 'push' && needs.classify.outputs.trigger_present == 'true'
    needs:
      - classify
      - validate-trigger
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OUTPUT_DIR: artifacts/12a5-twitch-replacement-audit-final/run
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Require existing Cloudflare read credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - id: audit
        name: Run governed final read-only Twitch audit
        continue-on-error: true
        run: AUDIT_MODE=final node scripts/run-12a5-twitch-replacement-seven-day-audit.mjs
      - name: Upload sanitized final audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-12a5-twitch-replacement-audit-final
          path: artifacts/12a5-twitch-replacement-audit-final/run/evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence upload when final audit is rejected
        if: steps.audit.outcome != 'success'
        run: exit 1
