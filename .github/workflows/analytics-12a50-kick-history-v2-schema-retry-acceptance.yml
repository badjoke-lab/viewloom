name: Analytics 12A50 Kick History V2 Schema Retry Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a50-kick-history-v2-schema-retry-acceptance.yml'
      - 'docs/audits/12a50-kick-history-v2-schema-retry-acceptance-contract.json'
      - 'docs/audits/12a50-kick-history-v2-schema-retry-acceptance-evidence.json'
      - 'scripts/verify-12a50-kick-history-v2-schema-retry-acceptance.mjs'
      - 'docs/audits/12a49-kick-history-v2-schema-apply-retry-trigger.json'
      - 'scripts/verify-12a49-kick-history-v2-schema-apply-retry-trigger.mjs'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact six-file canonical closeout scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          expected=(
            '.github/workflows/analytics-12a50-kick-history-v2-schema-retry-acceptance.yml'
            'docs/audits/12a49-kick-history-v2-schema-apply-retry-trigger.json'
            'docs/audits/12a50-kick-history-v2-schema-retry-acceptance-contract.json'
            'docs/audits/12a50-kick-history-v2-schema-retry-acceptance-evidence.json'
            'scripts/verify-12a49-kick-history-v2-schema-apply-retry-trigger.mjs'
            'scripts/verify-12a50-kick-history-v2-schema-retry-acceptance.mjs'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fxq "$path"; done

      - name: Verify consumed 12A49 trigger lifecycle
        run: node scripts/verify-12a49-kick-history-v2-schema-apply-retry-trigger.mjs

      - name: Verify canonical 12A50 PASS closeout
        run: node scripts/verify-12a50-kick-history-v2-schema-retry-acceptance.mjs

      - name: Revalidate accepted v2 candidate and unchanged v1 runtime
        run: |
          set -euo pipefail
          node scripts/verify-12a42-kick-history-chunked-v2-candidate.mjs
          grep -F 'candidateStreamerCategoryRows > streamerCategoryRowCap' workers/shared/history-category-aggregate.ts
          grep -F 'HISTORY_CATEGORY_GENERATION_ENABLED = "true"' workers/collector-kick/wrangler.category-permanent.toml
          grep -F 'HISTORY_CATEGORY_START_DAY = "2026-08-17"' workers/collector-kick/wrangler.category-permanent.toml
          grep -F 'crons = ["*/5 * * * *"]' workers/collector-kick/wrangler.category-permanent.toml
