name: Analytics 12A51 Kick History V2 Generator Migration Decision

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a51-kick-history-v2-generator-migration-decision.yml'
      - 'docs/audits/12a51-kick-history-v2-generator-migration-decision.json'
      - 'scripts/verify-12a51-kick-history-v2-generator-migration-decision.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify exact Decision scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          expected=(
            '.github/workflows/analytics-12a51-kick-history-v2-generator-migration-decision.yml'
            'docs/audits/12a51-kick-history-v2-generator-migration-decision.json'
            'scripts/verify-12a51-kick-history-v2-generator-migration-decision.mjs'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fxq "$path"; done

      - name: Verify Decision and accepted production schema truth
        run: node scripts/verify-12a51-kick-history-v2-generator-migration-decision.mjs

      - name: Revalidate accepted v2 candidate and schema acceptance
        run: |
          node scripts/verify-12a42-kick-history-chunked-v2-candidate.mjs
          node scripts/verify-12a50-kick-history-v2-schema-retry-acceptance.mjs

      - name: Verify no active runtime or production surface
        run: |
          set -euo pipefail
          git diff --exit-code "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- workers db apps packages
          file='.github/workflows/analytics-12a51-kick-history-v2-generator-migration-decision.yml'
          ! grep -Eq '^  (push|workflow_dispatch|schedule):' "$file"
          secret_needle='sec''rets.'
          remote_needle='--re''mote'
          d1_needle='d1'' execute'
          deploy_needle='wrangler@4'' deploy'
          ! grep -Fq "$secret_needle" "$file"
          ! grep -Fq "$remote_needle" "$file"
          ! grep -Fq "$d1_needle" "$file"
          ! grep -Fq "$deploy_needle" "$file"
