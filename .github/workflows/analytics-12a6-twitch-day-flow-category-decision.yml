name: Analytics 12A6 Twitch Day Flow Category Decision

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/audits/12a6-twitch-day-flow-category-feasibility-decision.json'
      - 'scripts/verify-12a6-twitch-day-flow-category-feasibility-decision.mjs'
      - '.github/workflows/analytics-12a6-twitch-day-flow-category-decision.yml'

permissions:
  contents: read

concurrency:
  group: analytics-12a6-twitch-day-flow-category-decision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout decision head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify decision semantics and unchanged runtime basis
        run: node scripts/verify-12a6-twitch-day-flow-category-feasibility-decision.mjs

      - name: Verify decision-only PR scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(docs/audits/12a6-twitch-day-flow-category-feasibility-decision\.json|scripts/verify-12a6-twitch-day-flow-category-feasibility-decision\.mjs|\.github/workflows/analytics-12a6-twitch-day-flow-category-decision\.yml)$'
          for path in "${changed[@]}"; do
            if ! [[ "$path" =~ $allowed ]]; then
              echo "Unexpected non-decision change: $path" >&2
              exit 1
            fi
          done
          test "${#changed[@]}" -le 3

      - name: Publish decision boundary
        if: always()
        run: |
          {
            echo '## Twitch Day Flow category feasibility decision'
            echo
            echo '- Source: existing DB_TWITCH_HOT minute snapshots + provider category dictionary'
            echo '- Category membership: per observed snapshot'
            echo '- Latest-category back-projection: prohibited'
            echo '- Full Share denominator: all observed Twitch viewers per bucket'
            echo '- Top Focus Share denominator: displayed selected-category Top N'
            echo '- Missing category metadata: coverage gap, never inferred zero'
            echo '- Hidden candidate implementation: authorized on decision merge'
            echo '- Default-route public exposure: not authorized'
            echo '- Kick / History category UI: not authorized'
            echo '- Collector / D1 / cadence / retention / backfill change: not authorized'
          } >> "$GITHUB_STEP_SUMMARY"
