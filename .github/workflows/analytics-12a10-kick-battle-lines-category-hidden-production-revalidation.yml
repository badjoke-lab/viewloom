name: Analytics 12A10 Kick Battle Lines Category Hidden Production Revalidation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a10-kick-battle-lines-category-hidden-production-revalidation.yml'
      - 'docs/audits/12a10-kick-battle-lines-category-hidden-production-revalidation-contract.json'
      - 'apps/web/scripts/kick-battle-lines-category-hidden-production-revalidation.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a10-kick-battle-lines-category-hidden-production-revalidation.yml'
      - 'docs/audits/12a10-kick-battle-lines-category-hidden-production-revalidation-contract.json'
      - 'apps/web/scripts/kick-battle-lines-category-hidden-production-revalidation.mjs'

permissions:
  contents: read

concurrency:
  group: analytics-12a10-kick-battle-lines-hidden-production-revalidation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Verify exact three-file validation scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(\.github/workflows/analytics-12a10-kick-battle-lines-category-hidden-production-revalidation\.yml|docs/audits/12a10-kick-battle-lines-category-hidden-production-revalidation-contract\.json|apps/web/scripts/kick-battle-lines-category-hidden-production-revalidation\.mjs)$'
          test "${#changed[@]}" -eq 3
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected revalidation change: $file" >&2; exit 1; }
          done
      - name: Verify revalidation contract and browser syntax
        run: |
          node --check apps/web/scripts/kick-battle-lines-category-hidden-production-revalidation.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const contract=JSON.parse(fs.readFileSync('docs/audits/12a10-kick-battle-lines-category-hidden-production-revalidation-contract.json','utf8'))
          if(contract.schemaVersion!=='viewloom-12a10-kick-battle-lines-category-hidden-production-revalidation-contract-v1') throw new Error('contract_version')
          if(contract.status!=='ready_for_validation'||contract.trackingIssue!==817||contract.implementationIssue!==815||contract.decisionIssue!==813) throw new Error('contract_identity')
          if(contract.productAuthority.sha!=='a802e7fe1e964180904c72744b7228c549a54660'||contract.productAuthority.implementationPr!==816) throw new Error('product_authority')
          if(contract.productAuthority.implementationState!=='hidden_candidate'||contract.productAuthority.publicExposureAuthorized!==false) throw new Error('product_state')
          if(contract.productionAuthority.mode!=='cloudflare_pages_git_integration'||contract.productionAuthority.productRuntimeEquivalenceRequired!==true) throw new Error('production_authority')
          if(contract.productionAuthority.allowedDifferenceFromProductAuthority.length!==3) throw new Error('diff_allowlist')
          if(contract.requiredScenarios.length!==6) throw new Error('scenario_count')
          if(contract.hiddenSemantics.pointStates.join('|')!=='observed|outside_category|category_unavailable|offline|not_observed|missing') throw new Error('point_states')
          if(contract.hiddenSemantics.repositoryFixtureAuthority!=='apps/web/scripts/verify-kick-battle-lines-category-candidate.mjs') throw new Error('fixture_authority')
          for(const [key,value] of Object.entries(contract.boundary)){ if(key==='readOnly'){if(value!==true) throw new Error(key)} else if(value!==false) throw new Error(key) }
          NODE
      - name: Verify hidden candidate authority and deterministic category states
        run: |
          node scripts/verify-12a10-kick-battle-lines-category-candidate.mjs
          cd apps/web
          node scripts/verify-battle-lines-core.mjs
          node scripts/verify-kick-battle-lines-category-candidate.mjs
      - name: Verify retained architecture and production boundaries
        run: |
          node scripts/verify-quality-u10g-architecture.mjs
          node scripts/verify-quality-u10d-analysis-coherence.mjs
          cd apps/web
          node scripts/verify-production-source.mjs
      - name: Typecheck and build unchanged product
        run: |
          pnpm typecheck:web
          pnpm build:web
      - name: Publish revalidation boundary
        if: always()
        run: |
          {
            echo '## Kick Battle Lines hidden Category production revalidation'
            echo
            echo '- Product authority: a802e7fe1e964180904c72744b7228c549a54660'
            echo '- Validation merge SHA: deployment identity only'
            echo '- Production authority: Pages Git integration / primary deployment.json'
            echo '- Six read-only scenarios'
            echo '- Deterministic category-switch fixture remains authority for exact outside/unavailable sequences'
            echo '- Public exposure remains unauthorized'
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    if: github.event_name == 'push'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OUTPUT_DIR: artifacts/12a10-kick-battle-lines-category-hidden-production-revalidation
      VIEWLOOM_ORIGIN: https://www.viewloom.net
      BATTLE_VALIDATION_DATE: '2026-08-10'
      PRODUCT_AUTHORITY_SHA: a802e7fe1e964180904c72744b7228c549a54660
      EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove validation deployment is product-runtime equivalent
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          mapfile -t changed < <(git diff --name-only "$PRODUCT_AUTHORITY_SHA" "$EXPECTED_DEPLOYMENT_SHA")
          printf '%s\n' "${changed[@]}" | tee "$OUTPUT_DIR/product-to-deployment-files.txt"
          allowed='^(\.github/workflows/analytics-12a10-kick-battle-lines-category-hidden-production-revalidation\.yml|docs/audits/12a10-kick-battle-lines-category-hidden-production-revalidation-contract\.json|apps/web/scripts/kick-battle-lines-category-hidden-production-revalidation\.mjs)$'
          test "${#changed[@]}" -eq 3
          for file in "${changed[@]}"; do [[ "$file" =~ $allowed ]] || { echo "Product runtime drift: $file" >&2; exit 1; }; done
      - id: source
        name: Wait for exact validation SHA through Pages Git integration
        continue-on-error: true
        run: |
          set -euo pipefail
          success=false
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$VIEWLOOM_ORIGIN/deployment.json?kickBattleCategoryHidden=$GITHUB_RUN_ID-$attempt" -o "$OUTPUT_DIR/last-deployment.json"; then
              observed_sha=$(jq -r '.commit_sha // ""' "$OUTPUT_DIR/last-deployment.json")
              observed_env=$(jq -r '.environment // ""' "$OUTPUT_DIR/last-deployment.json")
              observed_branch=$(jq -r '.branch // ""' "$OUTPUT_DIR/last-deployment.json")
              if [[ "$observed_sha" == "$EXPECTED_DEPLOYMENT_SHA" && "$observed_env" == production && "$observed_branch" == main ]]; then success=true; break; fi
            fi
            sleep 5
          done
          [[ "$success" == true ]]
      - uses: actions/setup-node@v4
        if: steps.source.outcome == 'success'
        with:
          node-version: 22
      - name: Install Playwright
        if: steps.source.outcome == 'success'
        run: npm install playwright@1.52.0 --no-save --no-audit --no-fund
      - name: Install Chromium
        if: steps.source.outcome == 'success'
        run: npx playwright install --with-deps chromium
      - id: browser
        name: Revalidate hidden Kick Battle Lines Category against production
        if: steps.source.outcome == 'success'
        continue-on-error: true
        run: node apps/web/scripts/kick-battle-lines-category-hidden-production-revalidation.mjs
      - name: Upload hidden production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-12a10-kick-battle-lines-category-hidden-production-revalidation
          path: artifacts/12a10-kick-battle-lines-category-hidden-production-revalidation/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence upload when source or browser rejects
        if: steps.source.outcome != 'success' || steps.browser.outcome != 'success'
        run: exit 1
