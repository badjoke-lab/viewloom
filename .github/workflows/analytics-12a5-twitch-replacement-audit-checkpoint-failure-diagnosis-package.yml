name: Analytics 12A5 Twitch Replacement Audit Checkpoint Failure Diagnosis Package

on:
  pull_request:
    branches: [main]
    paths: &diagnosis_paths
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/README.md'
      - 'docs/product/current-roadmap.md'
      - 'docs/product/current-schedule.md'
      - 'docs/product/twitch-replacement-seven-day-audit-spec.md'
      - 'docs/audits/12a2-current-gate-state.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-evidence.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-retirement.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package-contract.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package-acceptance.json'
      - 'docs/work-in-progress/phase12a4-category-parallel-execution.md'
      - 'scripts/run-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis.mjs'
      - 'scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package.mjs'
      - 'scripts/verify-12a5-twitch-replacement-audit-checkpoint-retirement.mjs'
      - 'scripts/verify-category-rollout-policy.mjs'
      - 'scripts/verify-development-policy.mjs'
      - 'workers/collector-twitch/src/index-category.ts'
      - 'workers/shared/category-capture.ts'
      - 'workers/collector-twitch/wrangler.toml'
      - 'workers/collector-twitch/wrangler.category-permanent.toml'
      - 'workers/collector-kick/wrangler.toml'
      - 'workers/collector-kick/wrangler.category-permanent.toml'
      - 'apps/web/**'
      - '.github/workflows/analytics-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package.yml'
      - '.github/workflows/category-rollout-policy.yml'
  push:
    branches: [main]
    paths: *diagnosis_paths

permissions:
  contents: read

concurrency:
  group: analytics-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Parse diagnosis package
        run: |
          node --check scripts/run-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis.mjs
          node --check scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package.mjs
          node --check scripts/verify-12a5-twitch-replacement-audit-checkpoint-retirement.mjs
      - name: Verify checkpoint failure diagnosis package
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package.mjs
      - name: Verify failed checkpoint evidence and retired path
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-retirement.mjs
      - name: Verify current category rollout policy
        run: node scripts/verify-category-rollout-policy.mjs
      - name: Verify current development policy
        run: node scripts/verify-development-policy.mjs
      - name: Typecheck web
        run: pnpm typecheck:web
      - name: Build web
        run: pnpm build:web
      - name: Verify production build still contains no public category controls
        run: |
          test -f apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'heatmap-category-preview-controls' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/twitch/heatmap/index.html
          test -f apps/web/dist/kick/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/kick/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/kick/heatmap/index.html
      - name: Summarize diagnosis package boundary
        run: |
          {
            echo '## Accepted Twitch checkpoint-failure diagnosis package'
            echo
            echo '- Package PR / acceptance PR: `#670` / `#671`'
            echo '- Source checkpoint run: `30478338654`'
            echo '- Missing buckets: `07:20`, `07:25`, `07:30` UTC'
            echo '- Missing category refs: `248`'
            echo '- Queries: D1 `SELECT` / `WITH` only'
            echo '- Package PR production credentials or execution: no'
            echo '- Mutation, rerun, threshold change, clock reset, final mode: no'
            echo '- Public category filter authorized: no'
            echo '- Next gate: separately accepted one-time diagnosis execution package'
          } >> "$GITHUB_STEP_SUMMARY"
