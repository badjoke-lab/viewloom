name: One-time 12A5 Twitch Recovery Canonical V33

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-time-12a5-twitch-recovery-canonical-v33.yml'
      - 'scripts/apply-12a5-twitch-recovery-canonical-v33.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-12a5-twitch-recovery-canonical-v33.yml'

permissions:
  contents: write

concurrency:
  group: one-time-12a5-twitch-recovery-canonical-v33-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify synchronizer syntax
        run: node --check scripts/apply-12a5-twitch-recovery-canonical-v33.mjs

      - name: Apply canonical recovery acceptance
        run: node scripts/apply-12a5-twitch-recovery-canonical-v33.mjs

      - name: Verify category rollout policy
        run: node scripts/verify-category-rollout-policy.mjs

      - name: Verify immutable safety boundaries
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          const gate = JSON.parse(fs.readFileSync('docs/audits/12a2-current-gate-state.json', 'utf8'))
          const recovery = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-permanent-category-recovery-contract.json', 'utf8'))
          assert.equal(gate.schemaVersion, 'viewloom-12a2-current-gate-state-v33')
          assert.equal(gate.currentWorkstream.twitchPermanentCaptureActive, true)
          assert.equal(gate.currentWorkstream.kickPermanentCaptureActive, true)
          assert.equal(gate.currentWorkstream.existingFiveMinuteCronPreserved, true)
          assert.equal(gate.currentWorkstream.twitchHeatmapCategoryFilterPublicExposureAuthorized, false)
          assert.equal(gate.categoryCapture.categoryUiPublicExposureAuthorized, false)
          assert.equal(gate.categoryCapture.twitchHeatmapCategoryFilterPublicExposureAuthorized, false)
          assert.equal(gate.categoryCapture.newCronAuthorized, false)
          assert.equal(gate.categoryCapture.backfillAuthorized, false)
          assert.equal(gate.categoryCapture.retentionExpansionAuthorized, false)
          assert.equal(recovery.acceptance.kickChanged, false)
          assert.equal(recovery.acceptance.remoteD1MutationPerformed, false)
          assert.equal(recovery.acceptance.publicExposureEnabled, false)
          NODE

      - name: Retire one-time synchronizer
        run: |
          rm scripts/apply-12a5-twitch-recovery-canonical-v33.mjs
          rm .github/workflows/one-time-12a5-twitch-recovery-canonical-v33.yml

      - name: Verify bounded diff
        run: |
          git diff --check
          git diff --name-only | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/one-time-12a5-twitch-recovery-canonical-v33.yml
          docs/audits/12a2-current-gate-state.json
          docs/audits/12a5-twitch-heatmap-category-filter-hidden-controls-contract.json
          docs/audits/12a5-twitch-heatmap-category-filter-hidden-decision-contract.json
          docs/audits/12a5-twitch-permanent-category-recovery-contract.json
          docs/product/current-roadmap.md
          docs/product/current-schedule.md
          docs/work-in-progress/phase12a4-category-parallel-execution.md
          scripts/apply-12a5-twitch-recovery-canonical-v33.mjs
          scripts/verify-category-rollout-policy.mjs
          EOF
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit synchronized canonical state
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Accept Twitch recovery and restart seven-day clock'
          git push origin HEAD:main
