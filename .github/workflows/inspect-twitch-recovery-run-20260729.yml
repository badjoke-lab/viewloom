name: Inspect Twitch Recovery Run 20260729

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-twitch-recovery-run-20260729.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect recovery push run and sanitized artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 40ab1cf6eb4ff4117c4ab6d69e2e5b8cb631b7e4
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          headers=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28')
          runs="$(curl --fail-with-body --silent --show-error "${headers[@]}" "${api}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=100")"
          echo "$runs" | jq -c '.workflow_runs[] | {id,name,event,status,conclusion,head_sha,created_at,updated_at,html_url}'
          run_id="$(echo "$runs" | jq -r '.workflow_runs[] | select(.name == "Analytics 12A5 Twitch Permanent Category Recovery") | .id' | head -n1)"
          test -n "$run_id"
          echo "TARGET_RUN_ID=${run_id}"
          curl --fail-with-body --silent --show-error "${headers[@]}" "${api}/actions/runs/${run_id}/jobs?per_page=100" \
            | jq -c '.jobs[] | {id,name,status,conclusion,started_at,completed_at,steps:[.steps[]? | {name,status,conclusion}]}'
          artifacts="$(curl --fail-with-body --silent --show-error "${headers[@]}" "${api}/actions/runs/${run_id}/artifacts?per_page=100")"
          echo "$artifacts" | jq -c '.artifacts[] | {id,name,size_in_bytes,expired,created_at,updated_at,digest}'
          artifact_id="$(echo "$artifacts" | jq -r '.artifacts[] | select(.name == "analytics-12a5-twitch-permanent-category-recovery-start") | .id' | head -n1)"
          test -n "$artifact_id"
          curl --fail-with-body --silent --show-error -L "${headers[@]}" "${api}/actions/artifacts/${artifact_id}/zip" -o /tmp/recovery.zip
          mkdir -p /tmp/recovery
          unzip -q /tmp/recovery.zip -d /tmp/recovery
          find /tmp/recovery -type f -name '*.json' | sort | while IFS= read -r file; do
            jq -c --arg file "${file#/tmp/recovery/}" '{file:$file,schemaVersion,status,outcome,observedAt,provider,identity,bindings,storage,data,gates,warnings,hardStops,error,deploy,observations,rollback,kick,boundaries}' "$file"
          done
