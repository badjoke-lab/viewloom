name: Analytics 12A8 Kick Heatmap Category API Package

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'docs/audits/12a8-kick-heatmap-category-api-package-contract.json'
      - 'apps/web/functions/api/kick-heatmap.ts'
      - 'scripts/verify-12a8-kick-heatmap-category-api-package.mjs'
      - '.github/workflows/analytics-12a8-kick-heatmap-category-api-package.yml'

permissions:
  contents: read

concurrency:
  group: analytics-12a8-kick-heatmap-category-api-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Parse package verifier
        run: node --check scripts/verify-12a8-kick-heatmap-category-api-package.mjs
      - name: Verify hidden Kick category API contract and accepted decision boundary
        run: node scripts/verify-12a8-kick-heatmap-category-api-package.mjs
      - name: Verify current category rollout policy
        run: node scripts/verify-category-rollout-policy.mjs
      - name: Typecheck web
        run: pnpm typecheck:web
      - name: Build web
        run: pnpm build:web
      - name: Publish package summary
        if: always()
        run: |
          {
            echo '## ViewLoom hidden Kick Heatmap category API package'
            echo
            echo '- Provider: Kick only'
            echo '- API category metadata and hidden query contract: yes'
            echo '- Accepted decision artifact: verified by package verifier'
            echo '- Pre-change decision verifier: intentionally not rerun after authorized runtime transition'
            echo '- Existing accepted storage only: yes'
            echo '- Primary category source: official-livestreams'
            echo '- Fallback without usable metadata: partial/unavailable, never inferred'
            echo '- Filter before Top N: yes'
            echo '- Selected-category momentum: compatible same-category observations only'
            echo '- Public category controls: no'
            echo '- UI change: no'
            echo '- Twitch runtime change: no'
            echo '- Collector / Worker / D1 / cadence / retention / backfill / credentials: unchanged'
          } >> "$GITHUB_STEP_SUMMARY"
