name: Twitch Stream Map Country Canonical

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/functions/api/twitch-stream-map.ts'
      - 'apps/web/functions/api/twitch-stream-map-reviewed-evidence-batch-*.mjs'
      - 'docs/audits/twitch-stream-map-country-review-result-*.json'
      - 'docs/audits/twitch-stream-map-country-review-apply-*.json'
      - 'scripts/verify-twitch-stream-map-country-review-result.mjs'
      - 'scripts/verify-twitch-stream-map-country-canonical.mjs'
      - '.github/workflows/twitch-stream-map-country-batch-b-canonical.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/functions/api/twitch-stream-map.ts'
      - 'apps/web/functions/api/twitch-stream-map-reviewed-evidence-batch-*.mjs'
      - 'docs/audits/twitch-stream-map-country-review-result-*.json'
      - 'docs/audits/twitch-stream-map-country-review-apply-*.json'
      - 'scripts/verify-twitch-stream-map-country-review-result.mjs'
      - 'scripts/verify-twitch-stream-map-country-canonical.mjs'
      - '.github/workflows/twitch-stream-map-country-batch-b-canonical.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revalidate every present Country review result
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          results=(docs/audits/twitch-stream-map-country-review-result-[a-l]-*.json)
          if (( ${#results[@]} == 0 )); then
            echo 'No Country batch result artifacts found.' >&2
            exit 1
          fi
          for result in "${results[@]}"; do
            echo "Validating ${result}"
            node scripts/verify-twitch-stream-map-country-review-result.mjs "$result"
          done
      - name: Verify canonical application alignment for every applied batch
        run: node scripts/verify-twitch-stream-map-country-canonical.mjs
      - name: Publish canonical application boundary
        shell: bash
        run: |
          {
            echo '## Twitch Country canonical applications'
            echo '- Validator scope: all present A-L canonical batch modules'
            echo '- Rejected/no-qualifying rows may not be applied'
            echo '- Country-only accepted placement enforced'
            echo '- City placements introduced: 0'
            echo '- Current Location introduced: 0'
            echo '- Address/coordinates introduced: 0'
            echo '- Provider requests: 0'
            echo '- D1 mutation: 0'
            echo '- Production deploy requested: no'
          } >> "$GITHUB_STEP_SUMMARY"
