name: Analytics 12A9 Kick Day Flow Category Hidden Production Revalidation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a9-kick-day-flow-category-hidden-production-revalidation.yml'
      - 'docs/audits/12a9-kick-day-flow-category-hidden-production-revalidation-contract.json'
      - 'apps/web/scripts/kick-day-flow-category-hidden-production-revalidation.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a9-kick-day-flow-category-hidden-production-revalidation.yml'
      - 'docs/audits/12a9-kick-day-flow-category-hidden-production-revalidation-contract.json'
      - 'apps/web/scripts/kick-day-flow-category-hidden-production-revalidation.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: analytics-12a9-kick-day-flow-category-hidden-production-revalidation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout revalidation package
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify three-file package scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(\.github/workflows/analytics-12a9-kick-day-flow-category-hidden-production-revalidation\.yml|docs/audits/12a9-kick-day-flow-category-hidden-production-revalidation-contract\.json|apps/web/scripts/kick-day-flow-category-hidden-production-revalidation\.mjs)$'
          test "${#changed[@]}" -eq 3
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected production-revalidation change: $file" >&2; exit 1; }
          done

      - name: Verify read-only contract and retained candidate boundary
        run: |
          node --check apps/web/scripts/kick-day-flow-category-hidden-production-revalidation.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const read = (p) => fs.readFileSync(p, 'utf8')
          const contract = JSON.parse(read('docs/audits/12a9-kick-day-flow-category-hidden-production-revalidation-contract.json'))
          const api = read('apps/web/functions/api/kick-day-flow.ts')
          const controls = read('apps/web/src/live/day-flow-category-preview-entry.ts')
          const kickEntry = read('apps/web/src/live/day-flow-kick-entry.ts')
          const kickHtml = read('apps/web/kick/day-flow/index.html')
          const twitchApi = read('apps/web/functions/api/day-flow.ts')
          const twitchEntry = read('apps/web/src/live/day-flow-twitch-entry.ts')

          const productSha = '98c7e61056e2b6385f7ea31ea72af4d8ea2f8d48'
          if (contract.status !== 'ready_for_validation') throw new Error('revalidation_contract_status_invalid')
          if (contract.parentTrackingIssue !== 623 || contract.trackingIssue !== 797) throw new Error('tracking_identity_invalid')
          if (contract.provider !== 'kick' || contract.feature !== 'day_flow_category_filter') throw new Error('feature_identity_invalid')
          if (contract.candidate.decisionIssue !== 793 || contract.candidate.decisionPr !== 794) throw new Error('decision_identity_invalid')
          if (contract.candidate.implementationIssue !== 795 || contract.candidate.implementationPr !== 796) throw new Error('implementation_identity_invalid')
          if (contract.candidate.mergeSha !== productSha) throw new Error('candidate_product_sha_mismatch')
          if (contract.candidate.implementationState !== 'hidden_candidate' || contract.candidate.publicCutoverAuthorized !== false) throw new Error('candidate_state_invalid')
          if (contract.productionAuthority.expectedProductSha !== productSha) throw new Error('production_authority_product_sha_mismatch')
          if (contract.productionAuthority.primaryOrigin !== 'https://www.viewloom.net') throw new Error('production_origin_changed')
          if (contract.productionAuthority.validationPackageShaIsProductAuthority !== false) throw new Error('validation_package_must_not_be_product_authority')
          if (contract.productionAuthority.singleDeploymentEvidenceSourceRequired !== true) throw new Error('single_deployment_source_required')
          if (contract.execution.productionOnPullRequest !== false || contract.execution.productionOnMainPush !== true) throw new Error('execution_boundary_invalid')
          if (contract.execution.readOnlyBrowser !== true || contract.execution.evidenceUploadOnFailure !== true || contract.execution.screenshotsRequired !== true) throw new Error('evidence_execution_contract_invalid')

          for (const [key, value] of Object.entries(contract.requiredChecks)) {
            if (value !== true) throw new Error(`required_check_${key}_not_enabled`)
          }
          for (const [key, value] of Object.entries(contract.boundary)) {
            if (key === 'readOnly') {
              if (value !== true) throw new Error('revalidation_must_be_read_only')
            } else if (value !== false) {
              throw new Error(`boundary_${key}_must_remain_false`)
            }
          }

          for (const fragment of [
            "const categoryCandidateRequested = url.searchParams.has('category')",
            "provider: 'kick'",
            "bucketAggregation: 'average'",
            "implementationState: 'hidden_candidate'",
            'publicExposureAuthorized: false',
            "requestedCategory === 'all'",
            'makeGlobalOthers',
            "fullShareDenominator: 'all_observed_kick_viewers_per_bucket'",
            "topFocusShareDenominator: 'displayed_selected_category_top_n_viewers_per_bucket'",
          ]) if (!api.includes(fragment)) throw new Error(`kick_api_contract_missing:${fragment}`)
          if (api.includes('DB_TWITCH_HOT')) throw new Error('kick_api_crossed_twitch_d1')

          for (const fragment of [
            "const publicProvider = provider === 'twitch'",
            'const enabled = publicProvider || legacyPreviewAtLoad',
            "provider === 'kick' ? '/api/kick-day-flow' : '/api/day-flow'",
            "filter.implementationState === 'public' && filter.publicExposureAuthorized === true",
            "filter.implementationState === 'hidden_candidate' && filter.publicExposureAuthorized === false",
          ]) if (!controls.includes(fragment)) throw new Error(`shared_control_contract_missing:${fragment}`)

          if (!kickEntry.includes("import './day-flow-category-preview-entry'")) throw new Error('kick_category_boundary_import_missing')
          if (!kickEntry.includes("import('./day-flow-current-shell-entry')")) throw new Error('kick_current_shell_import_missing')
          if (!kickHtml.includes('/src/live/day-flow-kick-entry.ts')) throw new Error('kick_provider_entry_missing')
          if (kickHtml.includes('dayflow-category-preview-controls')) throw new Error('kick_hidden_controls_statically_exposed')

          if (!twitchEntry.includes("import './day-flow-category-preview-entry'")) throw new Error('twitch_public_category_entry_missing')
          if (!twitchApi.includes("implementationState: 'public'")) throw new Error('twitch_public_state_missing')
          if (!twitchApi.includes('publicExposureAuthorized: true')) throw new Error('twitch_public_authorization_missing')
          NODE

      - name: Verify candidate and shared projection contracts
        run: |
          node scripts/verify-12a9-kick-day-flow-category-candidate.mjs
          node apps/web/scripts/day-flow-category-core.test.mjs

      - name: Typecheck and build web
        run: |
          pnpm typecheck:web
          pnpm build:web

      - name: Verify built pages contain no static category controls
        run: |
          test -f apps/web/dist/kick/day-flow/index.html
          test -f apps/web/dist/twitch/day-flow/index.html
          ! grep -q 'dayflow-category-preview-controls' apps/web/dist/kick/day-flow/index.html
          ! grep -q 'dayflow-category-preview-controls' apps/web/dist/twitch/day-flow/index.html

      - name: Publish contract boundary
        if: always()
        run: |
          {
            echo '## Kick Day Flow hidden production revalidation contract'
            echo
            echo '- Product authority: 98c7e61056e2b6385f7ea31ea72af4d8ea2f8d48'
            echo '- Validation package SHA is not product authority'
            echo '- PR: contract/static/type/build only'
            echo '- Main push: read-only production browser revalidation'
            echo '- Evidence: 5 scenarios + screenshots + evidence.json'
            echo '- Deployment identity: one workflow-produced deployment.json source'
            echo '- Public Kick Day Flow category cutover: still unauthorized'
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    if: github.event_name == 'push'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUTPUT_DIR: artifacts/12a9-kick-day-flow-category-hidden-production-revalidation
      VIEWLOOM_ORIGIN: https://www.viewloom.net
      DAYFLOW_VALIDATION_DATE: '2026-08-10'
      EXPECTED_PRODUCT_SHA: 98c7e61056e2b6385f7ea31ea72af4d8ea2f8d48
    steps:
      - name: Checkout validation package
        uses: actions/checkout@v4

      - name: Resolve successful Pages deployment for exact product SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          found=''
          for attempt in $(seq 1 90); do
            response=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-web-pages.yml/runs?branch=main&event=push&per_page=50")
            row=$(jq -c --arg sha "$EXPECTED_PRODUCT_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty' <<<"$response")
            if [[ -n "$row" ]]; then
              status=$(jq -r '.status' <<<"$row")
              conclusion=$(jq -r '.conclusion // ""' <<<"$row")
              if [[ "$status" == 'completed' && "$conclusion" == 'success' ]]; then
                found="$row"
                break
              fi
              if [[ "$status" == 'completed' && "$conclusion" != 'success' ]]; then
                echo "Matching Deploy Web Pages run failed: $row" >&2
                exit 1
              fi
            fi
            sleep 5
          done
          test -n "$found"
          printf '%s\n' "$found" | jq '{id,name,head_sha,status,conclusion,run_number,event,created_at,updated_at,html_url}' > "$OUTPUT_DIR/deploy-run.json"
          echo "DEPLOY_RUN_ID=$(jq -r '.id' <<<"$found")" >> "$GITHUB_ENV"

      - name: Wait for exact product SHA on primary production
        run: |
          set -euo pipefail
          accepted=''
          for attempt in $(seq 1 90); do
            payload=$(curl -fsSL -H 'Cache-Control: no-cache' "$VIEWLOOM_ORIGIN/deployment.json?sourceCheck=$(date +%s%N)" || true)
            if [[ -n "$payload" ]] && jq -e --arg sha "$EXPECTED_PRODUCT_SHA" '.commit_sha == $sha and .environment == "production" and .branch == "main"' <<<"$payload" >/dev/null 2>&1; then
              accepted="$payload"
              break
            fi
            sleep 5
          done
          test -n "$accepted"
          printf '%s\n' "$accepted" | jq '.' > "$OUTPUT_DIR/last-deployment.json"
          jq '{commit_sha,environment,branch,pages_url,observed_at}' "$OUTPUT_DIR/last-deployment.json" || cat "$OUTPUT_DIR/last-deployment.json"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install playwright@1.52.0 --no-save --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - id: browser
        name: Revalidate hidden Kick Day Flow category candidate against production
        continue-on-error: true
        run: node apps/web/scripts/kick-day-flow-category-hidden-production-revalidation.mjs

      - name: Upload production revalidation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-12a9-kick-day-flow-category-hidden-production-revalidation
          path: artifacts/12a9-kick-day-flow-category-hidden-production-revalidation/
          if-no-files-found: error
          retention-days: 30

      - name: Fail after evidence upload when production revalidation rejects
        if: steps.browser.outcome != 'success'
        run: exit 1
