name: Analytics 12A9 Kick Day Flow Category Hidden Production Revalidation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a9-kick-day-flow-category-hidden-production-revalidation.yml'
      - 'docs/audits/12a9-kick-day-flow-category-hidden-production-revalidation-contract.json'
      - 'apps/web/scripts/kick-day-flow-category-hidden-production-revalidation.mjs'
      - 'apps/web/scripts/normalize-built-head.mjs'
      - 'apps/web/scripts/verify-production-source.mjs'
      - 'apps/web/scripts/verify-dayflow-qa.mjs'
      - 'apps/web/scripts/verify-launch-readiness.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a9-kick-day-flow-category-hidden-production-revalidation.yml'
      - 'docs/audits/12a9-kick-day-flow-category-hidden-production-revalidation-contract.json'
      - 'apps/web/scripts/kick-day-flow-category-hidden-production-revalidation.mjs'
      - 'apps/web/scripts/normalize-built-head.mjs'
      - 'apps/web/scripts/verify-production-source.mjs'
      - 'apps/web/scripts/verify-dayflow-qa.mjs'
      - 'apps/web/scripts/verify-launch-readiness.mjs'

permissions:
  contents: read

concurrency:
  group: analytics-12a9-kick-day-flow-category-hidden-production-revalidation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout recovery package
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify seven-file recovery scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(\.github/workflows/analytics-12a9-kick-day-flow-category-hidden-production-revalidation\.yml|docs/audits/12a9-kick-day-flow-category-hidden-production-revalidation-contract\.json|apps/web/scripts/kick-day-flow-category-hidden-production-revalidation\.mjs|apps/web/scripts/normalize-built-head\.mjs|apps/web/scripts/verify-production-source\.mjs|apps/web/scripts/verify-dayflow-qa\.mjs|apps/web/scripts/verify-launch-readiness\.mjs)$'
          test "${#changed[@]}" -eq 7
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected production-path recovery change: $file" >&2; exit 1; }
          done

      - name: Verify recovered production authority and retained candidate boundary
        run: |
          node --check apps/web/scripts/kick-day-flow-category-hidden-production-revalidation.mjs
          node --check apps/web/scripts/verify-production-source.mjs
          node --check apps/web/scripts/verify-dayflow-qa.mjs
          node --check apps/web/scripts/verify-launch-readiness.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const read = (p) => fs.readFileSync(p, 'utf8')
          const contract = JSON.parse(read('docs/audits/12a9-kick-day-flow-category-hidden-production-revalidation-contract.json'))
          const browser = read('apps/web/scripts/kick-day-flow-category-hidden-production-revalidation.mjs')
          const normalize = read('apps/web/scripts/normalize-built-head.mjs')
          const productionVerifier = read('apps/web/scripts/verify-production-source.mjs')
          const dayFlowVerifier = read('apps/web/scripts/verify-dayflow-qa.mjs')
          const launchVerifier = read('apps/web/scripts/verify-launch-readiness.mjs')
          const api = read('apps/web/functions/api/kick-day-flow.ts')
          const controls = read('apps/web/src/live/day-flow-category-preview-entry.ts')
          const kickEntry = read('apps/web/src/live/day-flow-kick-entry.ts')
          const kickHtml = read('apps/web/kick/day-flow/index.html')
          const twitchApi = read('apps/web/functions/api/day-flow.ts')
          const twitchEntry = read('apps/web/src/live/day-flow-twitch-entry.ts')

          const productSha = '98c7e61056e2b6385f7ea31ea72af4d8ea2f8d48'
          if (contract.schemaVersion !== 'viewloom-12a9-kick-day-flow-category-hidden-production-revalidation-contract-v2') throw new Error('revalidation_contract_version_invalid')
          if (contract.status !== 'ready_for_recovery_validation') throw new Error('revalidation_contract_status_invalid')
          if (contract.parentTrackingIssue !== 623 || contract.trackingIssue !== 797 || contract.recoveryIssue !== 799) throw new Error('tracking_identity_invalid')
          if (contract.provider !== 'kick' || contract.feature !== 'day_flow_category_filter') throw new Error('feature_identity_invalid')
          if (contract.candidate.decisionIssue !== 793 || contract.candidate.decisionPr !== 794) throw new Error('decision_identity_invalid')
          if (contract.candidate.implementationIssue !== 795 || contract.candidate.implementationPr !== 796) throw new Error('implementation_identity_invalid')
          if (contract.candidate.mergeSha !== productSha) throw new Error('candidate_product_sha_mismatch')
          if (contract.candidate.implementationState !== 'hidden_candidate' || contract.candidate.publicCutoverAuthorized !== false) throw new Error('candidate_state_invalid')

          const failed = contract.failedAttempt
          if (failed.validationPr !== 798 || failed.validationMergeSha !== '67d716a1714a5a42ec127ba6a4d16e67940fad7d') throw new Error('failed_attempt_identity_invalid')
          if (failed.workflowRun !== 31469820123 || failed.contractJob !== 93710464554 || failed.productionJob !== 93710560540) throw new Error('failed_attempt_run_identity_invalid')
          if (failed.browserExecuted !== false || failed.productFailureEstablished !== false) throw new Error('failed_attempt_misclassified')
          if (failed.matchingManualDeployRun !== 31469245987 || failed.matchingManualDeployConclusion !== 'failure') throw new Error('manual_deploy_failure_not_frozen')
          if (failed.classification !== 'manual_wrangler_deploy_success_was_incorrectly_required') throw new Error('failed_attempt_classification_changed')

          const authority = contract.productionAuthority
          if (authority.expectedProductSha !== productSha) throw new Error('product_authority_sha_mismatch')
          if (authority.primaryOrigin !== 'https://www.viewloom.net') throw new Error('production_origin_changed')
          if (authority.deploymentSha !== 'recovery_merge_sha' || authority.deploymentShaMayDifferFromProductSha !== true) throw new Error('deployment_authority_not_separated')
          if (authority.validationPackageShaIsProductAuthority !== false) throw new Error('validation_package_became_product_authority')
          if (authority.manualDeployWorkflowIsAuthority !== false || authority.pagesGitIntegrationIsAuthority !== true) throw new Error('pages_git_authority_invalid')
          if (authority.singleDeploymentEvidenceSourceRequired !== true || authority.browserNetworkRefetchOfDeploymentIdentityAllowed !== false) throw new Error('single_source_boundary_invalid')
          if (authority.productRuntimeEquivalenceRequired !== true) throw new Error('product_runtime_equivalence_not_required')
          if (!Array.isArray(authority.allowedRecoveryDifferenceFromFailedValidation) || authority.allowedRecoveryDifferenceFromFailedValidation.length !== 7) throw new Error('recovery_difference_allowlist_invalid')
          for (const expected of ['apps/web/scripts/verify-production-source.mjs','apps/web/scripts/verify-dayflow-qa.mjs','apps/web/scripts/verify-launch-readiness.mjs']) {
            if (!authority.allowedRecoveryDifferenceFromFailedValidation.includes(expected)) throw new Error(`recovery_allowlist_missing:${expected}`)
          }
          if (contract.execution.productionOnPullRequest !== false || contract.execution.productionOnMainPush !== true) throw new Error('execution_boundary_invalid')
          if (contract.execution.readOnlyBrowser !== true || contract.execution.evidenceUploadOnFailure !== true || contract.execution.screenshotsRequired !== true || contract.execution.sourceTouchBehaviorNeutral !== true) throw new Error('evidence_execution_contract_invalid')

          for (const [key, value] of Object.entries(contract.requiredChecks)) if (value !== true) throw new Error(`required_check_${key}_not_enabled`)
          for (const [key, value] of Object.entries(contract.boundary)) {
            if (key === 'readOnly') {
              if (value !== true) throw new Error('revalidation_must_be_read_only')
            } else if (value !== false) throw new Error(`boundary_${key}_must_remain_false`)
          }

          for (const fragment of ['PRODUCT_AUTHORITY_SHA','EXPECTED_DEPLOYMENT_SHA','expectedProductSha: PRODUCT_AUTHORITY_SHA','expectedDeploymentSha: EXPECTED_DEPLOYMENT_SHA','deployment?.commit_sha === EXPECTED_DEPLOYMENT_SHA']) {
            if (!browser.includes(fragment)) throw new Error(`browser_provenance_missing:${fragment}`)
          }
          if (browser.includes('EXPECTED_PRODUCT_SHA')) throw new Error('browser_retained_conflated_product_deployment_sha')
          if (!normalize.includes('Issue #799') || !normalize.includes('product authority remains the #796 merge SHA')) throw new Error('recovery_source_touch_missing')

          for (const fragment of [
            "{ path:'kick/day-flow/index.html', entry:'/src/live/day-flow-kick-entry.ts' }",
            "'src/live/day-flow-kick-entry.ts'",
            "const enabled = publicProvider || legacyPreviewAtLoad",
            "root.dataset.dayflowCategoryPreview = publicProvider ? 'public' : 'hidden'",
            "return legacyPreviewAtLoad && filter.implementationState === 'hidden_candidate' && filter.publicExposureAuthorized === false",
          ]) if (!productionVerifier.includes(fragment)) throw new Error(`production_verifier_compatibility_missing:${fragment}`)

          for (const fragment of [
            "const kickEntryPath = 'src/live/day-flow-kick-entry.ts'",
            "isTwitch ? '/src/live/day-flow-twitch-entry.ts' : '/src/live/day-flow-kick-entry.ts'",
            "assertEqual('Kick Day Flow shared-controller import count'",
            "assertEqual('Kick Day Flow category-boundary import count'",
          ]) if (!dayFlowVerifier.includes(fragment)) throw new Error(`dayflow_qa_compatibility_missing:${fragment}`)

          if (!launchVerifier.includes("['kick/day-flow/index.html', '/src/live/day-flow-kick-entry.ts']")) throw new Error('launch_readiness_kick_entry_not_aligned')

          for (const fragment of [
            "const categoryCandidateRequested = url.searchParams.has('category')",
            "provider: 'kick'",
            "bucketAggregation: 'average'",
            "implementationState: 'hidden_candidate'",
            'publicExposureAuthorized: false',
            "requestedCategory === 'all'",
            'makeGlobalOthers',
            "fullShareDenominator: 'all_observed_kick_viewers_per_bucket'",
            "topFocusShareDenominator: 'displayed_selected_category_top_n_viewers_per_bucket'",
          ]) if (!api.includes(fragment)) throw new Error(`kick_api_contract_missing:${fragment}`)
          if (api.includes('DB_TWITCH_HOT')) throw new Error('kick_api_crossed_twitch_d1')

          for (const fragment of [
            "const publicProvider = provider === 'twitch'",
            'const enabled = publicProvider || legacyPreviewAtLoad',
            "provider === 'kick' ? '/api/kick-day-flow' : '/api/day-flow'",
            "filter.implementationState === 'public' && filter.publicExposureAuthorized === true",
            "filter.implementationState === 'hidden_candidate' && filter.publicExposureAuthorized === false",
          ]) if (!controls.includes(fragment)) throw new Error(`shared_control_contract_missing:${fragment}`)

          if (!kickEntry.includes("import './day-flow-category-preview-entry'")) throw new Error('kick_category_boundary_import_missing')
          if (!kickEntry.includes("import('./day-flow-current-shell-entry')")) throw new Error('kick_current_shell_import_missing')
          if (!kickHtml.includes('/src/live/day-flow-kick-entry.ts')) throw new Error('kick_provider_entry_missing')
          if (kickHtml.includes('dayflow-category-preview-controls')) throw new Error('kick_hidden_controls_statically_exposed')
          if (!twitchEntry.includes("import './day-flow-category-preview-entry'")) throw new Error('twitch_public_category_entry_missing')
          if (!twitchApi.includes("implementationState: 'public'") || !twitchApi.includes('publicExposureAuthorized: true')) throw new Error('twitch_public_boundary_changed')
          NODE

      - name: Verify candidate and shared projection contracts
        run: |
          node scripts/verify-12a9-kick-day-flow-category-candidate.mjs
          node apps/web/scripts/day-flow-category-core.test.mjs

      - name: Verify retained production, Day Flow, and launch contracts
        working-directory: apps/web
        run: |
          node scripts/verify-production-source.mjs
          node scripts/verify-dayflow-qa.mjs
          node scripts/verify-launch-readiness.mjs

      - name: Typecheck and build web
        run: |
          pnpm typecheck:web
          pnpm build:web

      - name: Verify built pages contain no static category controls
        run: |
          test -f apps/web/dist/kick/day-flow/index.html
          test -f apps/web/dist/twitch/day-flow/index.html
          ! grep -q 'dayflow-category-preview-controls' apps/web/dist/kick/day-flow/index.html
          ! grep -q 'dayflow-category-preview-controls' apps/web/dist/twitch/day-flow/index.html

      - name: Publish recovered authority boundary
        if: always()
        run: |
          {
            echo '## Kick Day Flow hidden production revalidation recovery'
            echo
            echo '- Product authority: 98c7e61056e2b6385f7ea31ea72af4d8ea2f8d48'
            echo '- Recovery merge SHA: deployment identity only'
            echo '- Authority: Cloudflare Pages Git integration / primary deployment.json'
            echo '- Manual Deploy Web Pages success: not required'
            echo '- Production, Day Flow QA, and launch verifiers only aligned to accepted provider bootstraps'
            echo '- Browser consumes one workflow-produced deployment identity file'
            echo '- PR: contract/static/type/build only'
            echo '- Main push: same five read-only production scenarios'
            echo '- Public Kick Day Flow category cutover: still unauthorized'
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    if: github.event_name == 'push'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUTPUT_DIR: artifacts/12a9-kick-day-flow-category-hidden-production-revalidation
      VIEWLOOM_ORIGIN: https://www.viewloom.net
      DAYFLOW_VALIDATION_DATE: '2026-08-10'
      PRODUCT_AUTHORITY_SHA: 98c7e61056e2b6385f7ea31ea72af4d8ea2f8d48
      EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout recovery deployment source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove recovery deployment is product-runtime equivalent
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          mapfile -t changed < <(git diff --name-only "$PRODUCT_AUTHORITY_SHA" "$EXPECTED_DEPLOYMENT_SHA")
          printf '%s\n' "${changed[@]}" | tee "$OUTPUT_DIR/product-to-deployment-files.txt"
          allowed='^(\.github/workflows/analytics-12a9-kick-day-flow-category-hidden-production-revalidation\.yml|docs/audits/12a9-kick-day-flow-category-hidden-production-revalidation-contract\.json|apps/web/scripts/kick-day-flow-category-hidden-production-revalidation\.mjs|apps/web/scripts/normalize-built-head\.mjs|apps/web/scripts/verify-production-source\.mjs|apps/web/scripts/verify-dayflow-qa\.mjs|apps/web/scripts/verify-launch-readiness\.mjs)$'
          test "${#changed[@]}" -eq 7
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Product runtime drift detected between authority and deployment: $file" >&2; exit 1; }
          done
          git diff "$PRODUCT_AUTHORITY_SHA" "$EXPECTED_DEPLOYMENT_SHA" -- apps/web/scripts/normalize-built-head.mjs > "$OUTPUT_DIR/normalize-source-touch.diff"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const diff = fs.readFileSync(process.env.OUTPUT_DIR + '/normalize-source-touch.diff', 'utf8')
          const changedLines = diff.split('\n').filter((line) => /^[+-][^+-]/.test(line))
          if (!changedLines.length) throw new Error('normalize_source_touch_diff_missing')
          for (const line of changedLines) {
            if (!line.includes('Issue #799') && !line.includes('unchanged; this source-path commit ensures Pages Git integration publishes the') && !line.includes('recovery deployment SHA while product authority remains the #796 merge SHA.')) {
              throw new Error(`normalize_source_touch_not_comment_only:${line}`)
            }
          }
          NODE

      - id: source
        name: Wait for recovery SHA through Pages Git integration
        continue-on-error: true
        run: |
          set -euo pipefail
          success=false
          for attempt in $(seq 1 90); do
            observed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$VIEWLOOM_ORIGIN/deployment.json?kickDayFlowRecovery=$GITHUB_RUN_ID-$attempt" -o /tmp/deployment.json; then
              cp /tmp/deployment.json "$OUTPUT_DIR/last-deployment.json"
              observed_sha=$(jq -r '.commit_sha // ""' /tmp/deployment.json)
              jq -n \
                --arg schema 'viewloom-12a9-kick-day-flow-production-source-probe-v1' \
                --arg product "$PRODUCT_AUTHORITY_SHA" \
                --arg expected "$EXPECTED_DEPLOYMENT_SHA" \
                --arg observed "$observed_sha" \
                --arg observed_at "$observed_at" \
                --argjson attempt "$attempt" \
                --slurpfile deployment /tmp/deployment.json \
                '{schema:$schema,product_authority_sha:$product,expected_deployment_sha:$expected,observed_deployment_sha:$observed,observed_at:$observed_at,attempt:$attempt,deployment:$deployment[0]}' \
                > "$OUTPUT_DIR/source-probe.json"
              if [[ "$observed_sha" == "$EXPECTED_DEPLOYMENT_SHA" ]] \
                && [[ "$(jq -r '.environment // ""' /tmp/deployment.json)" == 'production' ]] \
                && [[ "$(jq -r '.branch // ""' /tmp/deployment.json)" == 'main' ]]; then
                success=true
                break
              fi
            else
              jq -n \
                --arg schema 'viewloom-12a9-kick-day-flow-production-source-probe-v1' \
                --arg product "$PRODUCT_AUTHORITY_SHA" \
                --arg expected "$EXPECTED_DEPLOYMENT_SHA" \
                --arg observed_at "$observed_at" \
                --argjson attempt "$attempt" \
                '{schema:$schema,product_authority_sha:$product,expected_deployment_sha:$expected,observed_deployment_sha:null,observed_at:$observed_at,attempt:$attempt,fetch_error:true}' \
                > "$OUTPUT_DIR/source-probe.json"
            fi
            sleep 5
          done
          if [[ "$success" != true ]]; then
            jq -n \
              --arg schema 'viewloom-12a9-kick-day-flow-production-path-failure-v1' \
              --arg product "$PRODUCT_AUTHORITY_SHA" \
              --arg expected "$EXPECTED_DEPLOYMENT_SHA" \
              --slurpfile probe "$OUTPUT_DIR/source-probe.json" \
              '{schema:$schema,product_authority_sha:$product,expected_deployment_sha:$expected,product_failure_established:false,classification:"pages_git_integration_exact_sha_not_observed",last_probe:$probe[0]}' \
              > "$OUTPUT_DIR/production-path-failure.json"
            exit 1
          fi
          jq '.' "$OUTPUT_DIR/source-probe.json"

      - name: Setup Node.js
        if: steps.source.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        if: steps.source.outcome == 'success'
        run: npm install playwright@1.52.0 --no-save --no-audit --no-fund

      - name: Install Chromium
        if: steps.source.outcome == 'success'
        run: npx playwright install --with-deps chromium

      - id: browser
        name: Revalidate hidden Kick Day Flow category candidate against production
        if: steps.source.outcome == 'success'
        continue-on-error: true
        run: node apps/web/scripts/kick-day-flow-category-hidden-production-revalidation.mjs

      - name: Upload production revalidation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-12a9-kick-day-flow-category-hidden-production-revalidation
          path: artifacts/12a9-kick-day-flow-category-hidden-production-revalidation/
          if-no-files-found: error
          retention-days: 30

      - name: Fail after evidence upload when source or browser rejects
        if: steps.source.outcome != 'success' || steps.browser.outcome != 'success'
        run: exit 1
