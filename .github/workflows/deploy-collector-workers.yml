name: Deploy Collector Workers

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-collector-workers.yml'
      - 'workers/shared/**'
      - 'workers/collector-twitch/**'
      - 'workers/collector-kick/**'
      - 'scripts/plan-collector-worker-deploy.mjs'
      - 'scripts/verify-12a2-controlled-remote-apply.mjs'
      - 'scripts/verify-12a2-collector-worker-deploy.mjs'
      - 'docs/audits/12a2-current-gate-state.json'
      - 'docs/audits/12a2-collector-worker-deploy-contract.json'
      - 'docs/audits/12a2-collector-worker-deploy-evidence.json'
      - 'docs/operations/12a2-collector-worker-deploy-acceptance-*.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-collector-workers.yml'
      - 'workers/shared/**'
      - 'workers/collector-twitch/**'
      - 'workers/collector-kick/**'
      - 'scripts/plan-collector-worker-deploy.mjs'
      - 'docs/audits/12a2-current-gate-state.json'
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to deploy using its canonical active configuration
        required: true
        type: choice
        options:
          - twitch
          - kick
          - both

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || 'viewloom-collector-worker-production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify deployment workflow contract
        run: node scripts/verify-12a2-collector-worker-deploy.mjs

      - name: Verify controlled schema apply parity
        run: node scripts/verify-12a2-controlled-remote-apply.mjs

      - name: Typecheck and verify collectors
        run: pnpm check:collectors

  plan:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_twitch: ${{ steps.plan.outputs.deploy_twitch }}
      deploy_kick: ${{ steps.plan.outputs.deploy_kick }}
      any_deploy: ${{ steps.plan.outputs.any_deploy }}
      twitch_config: ${{ steps.plan.outputs.twitch_config }}
      kick_config: ${{ steps.plan.outputs.kick_config }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: plan
        name: Plan provider-scoped deployment
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          DEPLOY_PROVIDER: ${{ inputs.provider }}
        run: node scripts/plan-collector-worker-deploy.mjs

  deploy-twitch:
    if: needs.plan.outputs.deploy_twitch == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler 4
        run: npm install --global wrangler@4

      - name: Require Cloudflare deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy Twitch collector from canonical active configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TWITCH_CONFIG: ${{ needs.plan.outputs.twitch_config }}
        run: wrangler deploy --config "$TWITCH_CONFIG"

  deploy-kick:
    if: needs.plan.outputs.deploy_kick == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler 4
        run: npm install --global wrangler@4

      - name: Require Cloudflare deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy Kick collector from canonical active configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KICK_CONFIG: ${{ needs.plan.outputs.kick_config }}
        run: wrangler deploy --config "$KICK_CONFIG"

  verify-remote-schema:
    if: >-
      always() &&
      needs.plan.outputs.any_deploy == 'true' &&
      (needs.deploy-twitch.result == 'success' || needs.deploy-twitch.result == 'skipped') &&
      (needs.deploy-kick.result == 'success' || needs.deploy-kick.result == 'skipped')
    needs:
      - plan
      - deploy-twitch
      - deploy-kick
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VIEWLOOM_PRODUCTION_ORIGIN: https://www.viewloom.net
      ARTIFACT_DIR: artifacts/12a2-collector-worker-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Poll production schema gate
        shell: bash
        run: |
          mkdir -p "$ARTIFACT_DIR"
          passed=false
          for attempt in $(seq 1 30); do
            echo "Remote schema attempt $attempt/30"
            node scripts/collect-12a2-remote-schema-production-evidence.mjs "$ARTIFACT_DIR/schema-evidence.json"
            node scripts/verify-12a2-remote-schema-production-evidence.mjs "$ARTIFACT_DIR/schema-evidence.json"
            if node -e "const fs=require('fs');const e=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.exit(e.gate.remoteSchemaGatePass?0:1)" "$ARTIFACT_DIR/schema-evidence.json"; then
              passed=true
              break
            fi
            sleep 30
          done
          if [ "$passed" != true ]; then
            echo 'Remote schema gate did not pass within 15 minutes.' >&2
            exit 1
          fi

      - name: Publish deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## ViewLoom Collector Worker Deployment'
            echo
            echo '- Deployment method: Wrangler 4 CLI'
            echo "- Twitch Worker deployed: ${{ needs.plan.outputs.deploy_twitch }}"
            echo "- Twitch canonical config: ${{ needs.plan.outputs.twitch_config }}"
            echo "- Kick Worker deployed: ${{ needs.plan.outputs.deploy_kick }}"
            echo "- Kick canonical config: ${{ needs.plan.outputs.kick_config }}"
            if [ -f "$ARTIFACT_DIR/schema-evidence.json" ]; then
              echo "- Twitch schema complete: $(jq -r '.providers.twitch.schemaComplete' "$ARTIFACT_DIR/schema-evidence.json")"
              echo "- Twitch observed objects: $(jq -r '.providers.twitch.observedObjectCount' "$ARTIFACT_DIR/schema-evidence.json")/3"
              echo "- Kick schema complete: $(jq -r '.providers.kick.schemaComplete' "$ARTIFACT_DIR/schema-evidence.json")"
              echo "- Kick observed objects: $(jq -r '.providers.kick.observedObjectCount' "$ARTIFACT_DIR/schema-evidence.json")/3"
              echo "- Remote schema gate: $(jq -r '.gate.remoteSchemaGatePass' "$ARTIFACT_DIR/schema-evidence.json")"
            else
              echo '- Remote schema evidence: missing'
            fi
            echo '- Cross-provider deployment: blocked by changed-path planning'
            echo '- Backfill: none'
            echo '- Runtime generation: none'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12a2-collector-worker-deploy
          path: artifacts/12a2-collector-worker-deploy/schema-evidence.json
          if-no-files-found: warn
