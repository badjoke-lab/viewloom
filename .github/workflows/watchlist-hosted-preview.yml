name: Watchlist Hosted Preview (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchlist-hosted-preview-retired-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record retired W5A preview boundary
        run: |
          echo 'The June 25 W5A hosted Preview acceptance is frozen historical evidence.'
          echo 'This workflow is manual-only and performs no hosted Preview or production request.'
          echo 'Current deployment acceptance is owned by Watchlist Production Acceptance on https://www.viewloom.net.'
