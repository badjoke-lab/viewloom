name: Analytics 12A5 Twitch Checkpoint Failure Diagnosis Evidence Retirement

on:
  pull_request:
    branches: [main]
    paths: &retirement_paths
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/README.md'
      - 'docs/product/current-roadmap.md'
      - 'docs/product/current-schedule.md'
      - 'docs/product/twitch-replacement-seven-day-audit-spec.md'
      - 'docs/work-in-progress/phase12a4-category-parallel-execution.md'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-evidence.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-retirement.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-trigger.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-execution-package-contract.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-execution-package-acceptance.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-trigger-contract.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package-contract.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package-acceptance.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-evidence.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-retirement.json'
      - 'scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-evidence-retirement.mjs'
      - 'scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-execution-package.mjs'
      - 'scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package.mjs'
      - 'scripts/verify-12a5-twitch-replacement-audit-checkpoint-retirement.mjs'
      - 'scripts/verify-category-rollout-policy.mjs'
      - 'scripts/verify-development-policy.mjs'
      - '.github/workflows/analytics-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-execution.yml'
      - '.github/workflows/analytics-12a5-twitch-checkpoint-failure-diagnosis-reporter.yml'
      - '.github/workflows/analytics-12a5-twitch-checkpoint-failure-diagnosis-evidence-retirement.yml'
      - '.github/workflows/category-rollout-policy.yml'
      - 'apps/web/**'
  push:
    branches: [main]
    paths: *retirement_paths

permissions:
  contents: read

concurrency:
  group: analytics-12a5-twitch-checkpoint-failure-diagnosis-evidence-retirement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Parse diagnosis evidence retirement package
        run: |
          node --check scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-evidence-retirement.mjs
          node --check scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package.mjs
          node --check scripts/verify-12a5-twitch-replacement-audit-checkpoint-retirement.mjs
      - name: Verify sanitized diagnosis evidence and retired path
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-evidence-retirement.mjs
      - name: Verify accepted diagnosis query package
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package.mjs
      - name: Verify original checkpoint evidence and retirement
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-retirement.mjs
      - name: Verify current category rollout policy
        run: node scripts/verify-category-rollout-policy.mjs
      - name: Verify current development policy
        run: node scripts/verify-development-policy.mjs
      - name: Typecheck web
        run: pnpm typecheck:web
      - name: Build web
        run: pnpm build:web
      - name: Verify production build still contains no public category controls
        run: |
          test -f apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'heatmap-category-preview-controls' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/twitch/heatmap/index.html
          test -f apps/web/dist/kick/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/kick/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/kick/heatmap/index.html
      - name: Summarize diagnosis evidence retirement
        run: |
          {
            echo '## Twitch checkpoint-failure diagnosis evidence retirement'
            echo
            echo '- Sanitized diagnosis evidence frozen: yes'
            echo '- Exact trigger retired: yes'
            echo '- One-time execution workflow retired: yes'
            echo '- Temporary reporter retired: yes'
            echo '- Checkpoint rerun or threshold relaxation: no'
            echo '- Recovery or stability-clock decision made here: no'
            echo '- Worker/D1/Kick/final/public UI mutation: no'
            echo '- Next gate: separate recovery/no-recovery and stability-clock decision'
          } >> "$GITHUB_STEP_SUMMARY"
