name: Analytics 12A42 Kick History Chunked V2 Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a42-kick-history-chunked-v2-candidate.yml'
      - 'docs/prototypes/12a42-kick-history-chunked-v2-candidate.sql'
      - 'workers/dormant/history-category-chunked-v2-candidate.ts'
      - 'scripts/benchmark-12a42-kick-history-chunked-v2-candidate.py'
      - 'docs/audits/12a42-kick-history-chunked-v2-candidate-benchmark-evidence.json'
      - 'scripts/verify-12a42-kick-history-chunked-v2-candidate.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify exact candidate scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          expected=(
            '.github/workflows/analytics-12a42-kick-history-chunked-v2-candidate.yml'
            'docs/prototypes/12a42-kick-history-chunked-v2-candidate.sql'
            'workers/dormant/history-category-chunked-v2-candidate.ts'
            'scripts/benchmark-12a42-kick-history-chunked-v2-candidate.py'
            'docs/audits/12a42-kick-history-chunked-v2-candidate-benchmark-evidence.json'
            'scripts/verify-12a42-kick-history-chunked-v2-candidate.mjs'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fxq "$path"; done

      - name: Verify concrete candidate contract
        run: node scripts/verify-12a42-kick-history-chunked-v2-candidate.mjs

      - name: Re-run deterministic SQLite benchmark
        run: |
          set -euo pipefail
          python3 scripts/benchmark-12a42-kick-history-chunked-v2-candidate.py --output /tmp/12a42-recheck.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          canonical = json.loads(Path('docs/audits/12a42-kick-history-chunked-v2-candidate-benchmark-evidence.json').read_text())
          recheck = json.loads(Path('/tmp/12a42-recheck.json').read_text())
          assert recheck['status'] == 'PASS'
          assert recheck['stableBenchmarkSignatureSha256'] == canonical['stableBenchmarkSignatureSha256']
          assert recheck['fixedContract'] == canonical['fixedContract']
          assert recheck['fixtures'] == canonical['fixtures']
          assert recheck['measurement'] == canonical['measurement']
          PY

      - name: Typecheck dormant generator/query candidate
        run: |
          pnpm exec tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,WebWorker workers/dormant/history-category-chunked-v2-candidate.ts

      - name: Revalidate 12A41 fixed boundary
        run: node scripts/verify-12a41-kick-history-chunked-encoded-byte-fail-close-decision.mjs

      - name: Verify repository-only and production-v1 boundaries
        run: |
          set -euo pipefail
          file='.github/workflows/analytics-12a42-kick-history-chunked-v2-candidate.yml'
          ! grep -Eq '^  (push|workflow_dispatch|schedule):' "$file"
          ! grep -Fq 'CLOUDFLARE_API_TOKEN' "$file"
          ! grep -Fq 'CLOUDFLARE_ACCOUNT_ID' "$file"
          test ! -e db/d1/007_history_category_chunked_contributors.sql
          grep -F 'history_category_streamer_daily' db/d1/006_history_category_aggregate.sql
          grep -F 'candidateStreamerCategoryRows > streamerCategoryRowCap' workers/shared/history-category-aggregate.ts
          grep -F 'HISTORY_CATEGORY_GENERATION_ENABLED = "true"' workers/collector-kick/wrangler.category-permanent.toml
          grep -F 'HISTORY_CATEGORY_START_DAY = "2026-08-17"' workers/collector-kick/wrangler.category-permanent.toml
          grep -F 'crons = ["*/5 * * * *"]' workers/collector-kick/wrangler.category-permanent.toml
