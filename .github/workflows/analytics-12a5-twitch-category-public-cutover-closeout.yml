name: Analytics 12A5 Twitch Category Public Cutover Closeout

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a5-twitch-category-public-cutover-closeout.yml'
      - 'docs/audits/12a5-twitch-heatmap-category-public-production-evidence.json'
      - 'docs/audits/12a5-twitch-heatmap-category-public-cutover-acceptance.json'
      - 'docs/audits/12a5-twitch-heatmap-category-public-cutover-decision.json'
      - 'scripts/verify-12a5-twitch-heatmap-category-public-cutover-acceptance.mjs'
      - 'scripts/verify-category-rollout-policy.mjs'
      - 'docs/product/current-roadmap.md'
      - 'docs/product/current-schedule.md'
      - 'docs/work-in-progress/phase12a4-category-parallel-execution.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a5-twitch-category-public-cutover-closeout.yml'
      - 'docs/audits/12a5-twitch-heatmap-category-public-production-evidence.json'
      - 'docs/audits/12a5-twitch-heatmap-category-public-cutover-acceptance.json'
      - 'scripts/verify-12a5-twitch-heatmap-category-public-cutover-acceptance.mjs'
      - 'scripts/verify-category-rollout-policy.mjs'
      - 'docs/product/current-roadmap.md'
      - 'docs/product/current-schedule.md'

permissions:
  contents: read

concurrency:
  group: analytics-12a5-twitch-category-public-cutover-closeout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify accepted public deployment and browser evidence
        run: |
          node --check scripts/verify-12a5-twitch-heatmap-category-public-cutover-acceptance.mjs
          node scripts/verify-12a5-twitch-heatmap-category-public-cutover-acceptance.mjs
          node scripts/verify-category-rollout-policy.mjs
      - name: Verify no broader category surface became authorized
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const acceptance = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-heatmap-category-public-cutover-acceptance.json', 'utf8'))
          if (acceptance.authorization.kickCategoryUiAuthorized !== false) throw new Error('kick_category_ui_must_remain_false')
          if (acceptance.authorization.dayFlowCategoryUiAuthorized !== false) throw new Error('day_flow_category_ui_must_remain_false')
          if (acceptance.authorization.historyCategoryUiAuthorized !== false) throw new Error('history_category_ui_must_remain_false')
          NODE
