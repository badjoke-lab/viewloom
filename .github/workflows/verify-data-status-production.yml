name: Verify Data Status Production

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live feature labels after deployment
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            /twitch/heatmap/
            /twitch/day-flow/
            /twitch/battle-lines/
            /twitch/history/
            /kick/heatmap/
            /kick/day-flow/
            /kick/battle-lines/
            /kick/history/
          )

          for attempt in {1..12}; do
            failures=0
            echo "===== attempt ${attempt} ====="
            for path in "${urls[@]}"; do
              url="https://www.viewloom.net${path}?production-check=${GITHUB_SHA}-${attempt}"
              body="$(mktemp)"
              status="$(curl --silent --show-error --location --max-time 30 --header 'Cache-Control: no-cache' --output "$body" --write-out '%{http_code}' "$url")"
              echo "${path} HTTP=${status}"
              if [[ "$status" != "200" ]]; then
                failures=$((failures + 1))
                continue
              fi
              grep -Fq '>Data Status</a>' "$body" || failures=$((failures + 1))
              if [[ "$path" == */history/ ]]; then
                grep -Fq '>Open Data Status</a>' "$body" || failures=$((failures + 1))
              fi
            done
            echo "FAILURES=${failures}"
            if [[ "$failures" -eq 0 ]]; then
              exit 0
            fi
            sleep 10
          done

          echo 'Production did not expose the merged labels within the bounded verification window.'
          exit 1
