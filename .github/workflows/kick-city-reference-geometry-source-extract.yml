name: Kick City reference geometry source extract

on:
  push:
    branches:
      - work-map-kick-city-reference-geometry-20260910
    paths:
      - '.github/workflows/kick-city-reference-geometry-source-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Natural Earth v5.1.2 and print accepted city records
        shell: bash
        run: |
          set -euo pipefail
          for dataset in ne_10m_populated_places_simple ne_10m_populated_places; do
            curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/${dataset}.geojson" \
              --output "/tmp/${dataset}.geojson"
          done
          node <<'NODE'
          const fs = require('fs')
          const targets = [
            { countryCode: 'TR', names: ['Istanbul', 'İstanbul'] },
            { countryCode: 'PL', names: ['Wroclaw', 'Wrocław'] },
            { countryCode: 'BR', names: ['Rio de Janeiro'] },
            { countryCode: 'IN', names: ['Fazilka'], region: 'Punjab' },
            { countryCode: 'IN', names: ['Mumbai'] },
          ]
          for (const dataset of ['ne_10m_populated_places_simple', 'ne_10m_populated_places']) {
            const fc = JSON.parse(fs.readFileSync(`/tmp/${dataset}.geojson`, 'utf8'))
            console.log(`DATASET ${dataset} features=${fc.features.length}`)
            for (const target of targets) {
              const matches = fc.features.filter((feature) => {
                const p = feature.properties ?? {}
                const names = [p.NAME, p.NAMEASCII, p.name, p.nameascii].filter(Boolean)
                const code = p.ISO_A2 ?? p.iso_a2
                const region = p.ADM1NAME ?? p.adm1name
                return code === target.countryCode && target.names.some((name) => names.includes(name)) && (!target.region || region === target.region)
              })
              console.log(JSON.stringify({ dataset, target, matchCount: matches.length, matches: matches.map((feature) => ({ geometry: feature.geometry, properties: feature.properties })) }))
            }
            const fuzzyFazilka = fc.features.filter((feature) => {
              const p = feature.properties ?? {}
              const names = [p.NAME, p.NAMEASCII, p.name, p.nameascii].filter(Boolean).join(' ').toLowerCase()
              const code = p.ISO_A2 ?? p.iso_a2
              return code === 'IN' && names.includes('faz')
            })
            console.log(JSON.stringify({ dataset, fuzzyFazilka: fuzzyFazilka.map((feature) => ({ geometry: feature.geometry, properties: feature.properties })) }))
          }
          NODE
