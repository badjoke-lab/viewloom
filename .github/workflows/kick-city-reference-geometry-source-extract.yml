name: Kick City reference geometry source extract

on:
  push:
    branches:
      - work-map-kick-city-reference-geometry-20260910
    paths:
      - '.github/workflows/kick-city-reference-geometry-source-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Kick City runtime geometry contract
        run: node scripts/verify-kick-stream-map-city-runtime.mjs

      - name: Verify Natural Earth v5.1.2 source records
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_populated_places_simple.geojson' \
            --output /tmp/ne_10m_populated_places_simple.geojson
          node <<'NODE'
          const assert = require('assert/strict')
          const fs = require('fs')
          const fc = JSON.parse(fs.readFileSync('/tmp/ne_10m_populated_places_simple.geojson', 'utf8'))
          const find = (countryCode, names, region = null) => fc.features.filter((feature) => {
            const p = feature.properties ?? {}
            const featureNames = [p.name, p.nameascii].filter(Boolean)
            return p.iso_a2 === countryCode
              && names.some((name) => featureNames.includes(name))
              && (!region || p.adm1name === region)
          })
          const cases = [
            ['TR', ['Istanbul', 'İstanbul'], null, [28.974277, 41.017602], 1159151579],
            ['PL', ['Wroclaw', 'Wrocław'], null, [17.030009, 51.110432], 1159139051],
            ['BR', ['Rio de Janeiro'], null, [-43.212117, -22.907308], 1159151619],
            ['IN', ['Mumbai'], null, [72.875839, 19.068408], 1159151611],
          ]
          for (const [countryCode, names, region, coordinates, featureId] of cases) {
            const matches = find(countryCode, names, region)
            assert.equal(matches.length, 1)
            assert.deepEqual(matches[0].geometry.coordinates, coordinates)
            assert.equal(matches[0].properties.ne_id, featureId)
          }
          assert.equal(find('IN', ['Fazilka'], 'Punjab').length, 0)
          console.log(JSON.stringify({ ok: true, referencePoints: 4, fazilka: 'no_geometry' }))
          NODE
