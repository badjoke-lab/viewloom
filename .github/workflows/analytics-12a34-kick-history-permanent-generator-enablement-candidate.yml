name: Analytics 12A34 Kick History Permanent Generator Enablement Execution Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a34-kick-history-permanent-generator-enablement-candidate.yml'
      - 'docs/audits/12a34-kick-history-permanent-generator-enablement-candidate.json'
      - 'scripts/verify-12a34-kick-history-permanent-generator-enablement-candidate.mjs'
      - 'workers/collector-kick/wrangler.category-permanent.toml'

permissions:
  contents: read

concurrency:
  group: analytics-12a34-kick-history-generator-execution-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Require Draft PR state while validating transformed head
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: test "$IS_DRAFT" = 'true'

      - name: Verify exact transformed four-file scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          expected=(
            '.github/workflows/analytics-12a34-kick-history-permanent-generator-enablement-candidate.yml'
            'docs/audits/12a34-kick-history-permanent-generator-enablement-candidate.json'
            'scripts/verify-12a34-kick-history-permanent-generator-enablement-candidate.mjs'
            'workers/collector-kick/wrangler.category-permanent.toml'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$path"
          done

      - name: Verify execution-ready 12A34 candidate and accepted authority chain
        run: node scripts/verify-12a34-kick-history-permanent-generator-enablement-candidate.mjs

      - name: Verify PR deploy planner remains no-op
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          : > /tmp/12a34-plan-output
          GITHUB_EVENT_NAME=pull_request \
          GITHUB_EVENT_BEFORE='' \
          GITHUB_SHA="$HEAD_SHA" \
          GITHUB_OUTPUT=/tmp/12a34-plan-output \
          DEPLOY_PROVIDER='' \
          node scripts/plan-collector-worker-deploy.mjs > /tmp/12a34-plan.json
          cat /tmp/12a34-plan.json
          grep -Fxq 'deploy_twitch=false' /tmp/12a34-plan-output
          grep -Fxq 'deploy_kick=false' /tmp/12a34-plan-output
          grep -Fxq 'any_deploy=false' /tmp/12a34-plan-output

      - name: Revalidate invariant production cost and generator semantics
        run: |
          node scripts/verify-12a26-kick-history-category-reprobe-pass.mjs
          node scripts/verify-12a15-kick-history-category-aggregate-generator.mjs
          python3 scripts/test-12a15-kick-history-category-aggregate.py
          pnpm typecheck:collectors
          pnpm verify:collectors

      - name: Verify transformed production config exact values
        run: |
          set -euo pipefail
          config='workers/collector-kick/wrangler.category-permanent.toml'
          grep -Fxq 'INTRADAY_GENERATION_ENABLED = "true"' "$config"
          grep -Fxq 'CATEGORY_CAPTURE_ENABLED = "true"' "$config"
          grep -Fxq 'HISTORY_CATEGORY_GENERATION_ENABLED = "true"' "$config"
          grep -Fxq 'HISTORY_CATEGORY_START_DAY = "2026-08-17"' "$config"
          grep -Fxq 'crons = ["*/5 * * * *"]' "$config"
          test "$(grep -Fc 'HISTORY_CATEGORY_GENERATION_ENABLED' "$config")" -eq 1
          test "$(grep -Fc 'HISTORY_CATEGORY_START_DAY' "$config")" -eq 1
          ! grep -Fxq 'HISTORY_CATEGORY_GENERATION_ENABLED = "false"' "$config"

      - name: Bundle Kick collector without deploying
        run: |
          mkdir -p artifacts/12a34-kick
          cd workers/collector-kick
          pnpm dlx wrangler@4 deploy --config wrangler.category-permanent.toml --dry-run --outdir ../../artifacts/12a34-kick

      - name: Verify PR-only execution validation workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/analytics-12a34-kick-history-permanent-generator-enablement-candidate.yml').read_text()
          forbidden = [
              '\n  ' + 'push:',
              'workflow_' + 'dispatch:',
              'sched' + 'ule:',
              'CLOUDFLARE_' + 'API_TOKEN',
              'CLOUDFLARE_' + 'ACCOUNT_ID',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'production-capable PR validation surface: {token}')
          for line in text.splitlines():
              if 'wrangler@4 deploy' in line and '--dry-run' not in line:
                  raise SystemExit(f'non-dry-run Wrangler deploy in PR workflow: {line}')
          PY

      - name: Publish execution candidate boundary
        if: always()
        run: |
          {
            echo '## Kick History Category — 12A34 execution-ready candidate'
            echo
            echo '- PR remains Draft during transformed validation: yes'
            echo '- Execution UTC startDay: 2026-08-17'
            echo '- History generation flag: true'
            echo '- PR deploy planner: no-op required'
            echo '- Production deploy from this PR workflow: no'
            echo '- Exact transformed head must be frozen in #912 before Ready: yes'
            echo '- Main merge after freeze is expected to deploy Kick only'
            echo '- API/UI/Twitch/backfill/new cron/raw-retention changes: none'
          } >> "$GITHUB_STEP_SUMMARY"
