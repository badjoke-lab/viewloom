name: Diagnose Twitch Regression V32

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-twitch-regression-v32.yml'
      - 'scripts/apply-12a5-twitch-regression-v32.mjs'
      - 'scripts/verify-category-rollout-policy.mjs'
      - 'scripts/verify-12a2-collector-worker-deploy.mjs'
      - 'scripts/verify-12a5-twitch-permanent-category-recovery-package.mjs'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical transform in workspace only
        run: node scripts/apply-12a5-twitch-regression-v32.mjs
      - name: Diagnose all bounded verifiers
        run: |
          mkdir -p artifacts/v32-diagnostic
          set +e
          node scripts/verify-category-rollout-policy.mjs > artifacts/v32-diagnostic/category-policy.log 2>&1
          category_status=$?
          node scripts/verify-12a2-collector-worker-deploy.mjs > artifacts/v32-diagnostic/deployment.log 2>&1
          deploy_status=$?
          node scripts/verify-12a5-twitch-permanent-category-recovery-package.mjs > artifacts/v32-diagnostic/recovery.log 2>&1
          recovery_status=$?
          printf '{"categoryStatus":%s,"deployStatus":%s,"recoveryStatus":%s}\n' "$category_status" "$deploy_status" "$recovery_status" > artifacts/v32-diagnostic/status.json
          cat artifacts/v32-diagnostic/status.json
          exit 0
      - name: Upload bounded verifier diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: twitch-regression-v32-diagnostic
          path: artifacts/v32-diagnostic/*
          if-no-files-found: error
          retention-days: 7
