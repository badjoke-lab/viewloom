name: Analytics 12A5 Twitch Checkpoint Failure Diagnosis Execution

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-execution.yml'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-execution-package-contract.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-trigger-contract.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-trigger.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package-contract.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package-acceptance.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-evidence.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-retirement.json'
      - 'docs/audits/12a2-current-gate-state.json'
      - 'docs/product/current-roadmap.md'
      - 'docs/product/current-schedule.md'
      - 'docs/product/twitch-replacement-seven-day-audit-spec.md'
      - 'docs/work-in-progress/phase12a4-category-parallel-execution.md'
      - 'scripts/run-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis.mjs'
      - 'scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-execution-package.mjs'
      - 'scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package.mjs'
      - 'scripts/verify-12a5-twitch-replacement-audit-checkpoint-retirement.mjs'
      - 'scripts/verify-category-rollout-policy.mjs'
      - 'scripts/verify-development-policy.mjs'
      - 'workers/collector-twitch/wrangler.toml'
      - 'workers/collector-twitch/wrangler.category-permanent.toml'
      - 'workers/collector-kick/wrangler.toml'
      - 'workers/collector-kick/wrangler.category-permanent.toml'
      - 'apps/web/**'
  push:
    branches: [main]
    paths:
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-trigger.json'

permissions:
  contents: read

concurrency:
  group: analytics-12a5-twitch-checkpoint-failure-diagnosis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trigger_present: ${{ steps.classify.outputs.trigger_present }}
      start_at: ${{ steps.classify.outputs.start_at }}
    steps:
      - uses: actions/checkout@v4
      - id: classify
        name: Detect exact Twitch checkpoint-failure diagnosis trigger
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const path = 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-trigger.json'
          const present = fs.existsSync(path)
          const trigger = present ? JSON.parse(fs.readFileSync(path, 'utf8')) : null
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `trigger_present=${present}\nstart_at=${trigger?.startAt ?? ''}\n`)
          NODE

  verify-package:
    if: github.event_name == 'pull_request' && needs.classify.outputs.trigger_present != 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Confirm exact diagnosis trigger is absent
        run: test ! -f docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-trigger.json
      - name: Parse diagnosis execution package and accepted runner
        run: |
          node --check scripts/run-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis.mjs
          node --check scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-execution-package.mjs
          node --check scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package.mjs
          node --check scripts/verify-12a5-twitch-replacement-audit-checkpoint-retirement.mjs
      - name: Verify dormant diagnosis execution package
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-execution-package.mjs
      - name: Verify accepted diagnosis query package
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package.mjs
      - name: Verify failed checkpoint evidence and retired checkpoint path
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-retirement.mjs
      - name: Verify current category rollout policy
        run: node scripts/verify-category-rollout-policy.mjs
      - name: Verify current development policy
        run: node scripts/verify-development-policy.mjs
      - name: Typecheck web
        run: pnpm typecheck:web
      - name: Build web
        run: pnpm build:web
      - name: Verify production build still contains no public category controls
        run: |
          test -f apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'heatmap-category-preview-controls' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/twitch/heatmap/index.html
          test -f apps/web/dist/kick/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/kick/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/kick/heatmap/index.html
      - name: Summarize dormant diagnosis execution boundary
        run: |
          {
            echo '## Twitch checkpoint-failure diagnosis execution package'
            echo
            echo '- Accepted diagnosis query package: `#670` / `#671`'
            echo '- Production trigger present on package PR: no'
            echo '- Production credentials or queries on package PR: no'
            echo '- D1 execution after acceptance and exact trigger: `SELECT` / `WITH` only'
            echo '- Worker/D1/Kick/public UI mutation: no'
            echo '- Checkpoint rerun, threshold relaxation, recovery, clock reset, final mode: no'
            echo '- Separate package acceptance and exact one-file trigger required: yes'
          } >> "$GITHUB_STEP_SUMMARY"

  validate-trigger:
    if: needs.classify.outputs.trigger_present == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate accepted diagnosis execution package identity and exact trigger
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const packageContract = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-execution-package-contract.json', 'utf8'))
          const triggerContract = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-trigger-contract.json', 'utf8'))
          const trigger = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-trigger.json', 'utf8'))
          if (packageContract.status !== 'accepted') throw new Error('diagnosis_execution_package_not_accepted')
          if (triggerContract.status !== 'accepted') throw new Error('diagnosis_trigger_contract_not_accepted')
          if (trigger.schemaVersion !== triggerContract.trigger.schemaVersion) throw new Error('trigger_schema_mismatch')
          if (trigger.status !== 'armed' || trigger.provider !== 'twitch' || trigger.mode !== 'checkpoint_failure_diagnosis' || trigger.oneTime !== true) throw new Error('trigger_identity_invalid')
          if (trigger.confirmation !== triggerContract.trigger.confirmation) throw new Error('trigger_confirmation_invalid')
          if (trigger.packagePr !== packageContract.acceptance.packagePr) throw new Error('package_pr_mismatch')
          if (trigger.packageMergeSha !== packageContract.acceptance.packageMergeSha) throw new Error('package_sha_mismatch')
          if (trigger.acceptancePr !== packageContract.acceptance.acceptancePr) throw new Error('acceptance_pr_mismatch')
          if (trigger.packagePr !== triggerContract.acceptedPackageIdentity.packagePr) throw new Error('trigger_contract_package_pr_mismatch')
          if (trigger.packageMergeSha !== triggerContract.acceptedPackageIdentity.packageMergeSha) throw new Error('trigger_contract_package_sha_mismatch')
          if (trigger.acceptancePr !== triggerContract.acceptedPackageIdentity.acceptancePr) throw new Error('trigger_contract_acceptance_pr_mismatch')
          const start = Date.parse(String(trigger.startAt ?? ''))
          const now = Date.now()
          const pastSkew = Number(triggerContract.trigger.allowedPastSkewMinutes) * 60_000
          const futureLimit = Number(triggerContract.trigger.maximumStartDelayHours) * 3_600_000
          if (!Number.isFinite(start) || start < now - pastSkew || start > now + futureLimit) throw new Error('trigger_start_out_of_bounds')
          NODE

  diagnose:
    if: github.event_name == 'push' && needs.classify.outputs.trigger_present == 'true'
    needs:
      - classify
      - validate-trigger
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      START_AT: ${{ needs.classify.outputs.start_at }}
      OUTPUT_DIR: artifacts/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis/run
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Wait for exact diagnosis start boundary
        run: |
          node --input-type=module - <<'NODE'
          const start = Date.parse(process.env.START_AT)
          if (!Number.isFinite(start)) throw new Error('invalid_start_at')
          const delay = start - Date.now()
          if (delay > 3 * 3_600_000) throw new Error('start_delay_above_three_hours')
          if (delay > 0) await new Promise((resolve) => setTimeout(resolve, delay))
          NODE
      - id: diagnosis
        name: Run one-time read-only Twitch checkpoint-failure diagnosis
        continue-on-error: true
        run: node scripts/run-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis.mjs
      - name: Upload sanitized Twitch checkpoint-failure diagnosis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis
          path: artifacts/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis/run/evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence upload when diagnosis is unhealthy
        if: steps.diagnosis.outcome != 'success'
        run: exit 1
