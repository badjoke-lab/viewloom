name: Analytics 12A9 Kick Day Flow Category Public Cutover

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a9-kick-day-flow-category-public-cutover.yml'
      - '.github/workflows/analytics-12a9-kick-day-flow-category-candidate.yml'
      - 'scripts/verify-12a9-kick-day-flow-category-public-cutover.mjs'
      - 'scripts/verify-12a9-kick-day-flow-category-candidate.mjs'
      - 'apps/web/scripts/kick-day-flow-category-public-production-acceptance.mjs'
      - 'apps/web/functions/api/kick-day-flow.ts'
      - 'apps/web/src/live/day-flow-category-preview-entry.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a9-kick-day-flow-category-public-cutover.yml'
      - '.github/workflows/analytics-12a9-kick-day-flow-category-candidate.yml'
      - 'scripts/verify-12a9-kick-day-flow-category-public-cutover.mjs'
      - 'scripts/verify-12a9-kick-day-flow-category-candidate.mjs'
      - 'apps/web/scripts/kick-day-flow-category-public-production-acceptance.mjs'
      - 'apps/web/functions/api/kick-day-flow.ts'
      - 'apps/web/src/live/day-flow-category-preview-entry.ts'

permissions:
  contents: read

concurrency:
  group: analytics-12a9-kick-day-flow-category-public-cutover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Verify exact seven-file public cutover scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(\.github/workflows/analytics-12a9-kick-day-flow-category-public-cutover\.yml|\.github/workflows/analytics-12a9-kick-day-flow-category-candidate\.yml|scripts/verify-12a9-kick-day-flow-category-public-cutover\.mjs|scripts/verify-12a9-kick-day-flow-category-candidate\.mjs|apps/web/scripts/kick-day-flow-category-public-production-acceptance\.mjs|apps/web/functions/api/kick-day-flow\.ts|apps/web/src/live/day-flow-category-preview-entry\.ts)$'
          test "${#changed[@]}" -eq 7
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected #809 public cutover change: $file" >&2; exit 1; }
          done
      - name: Verify corrected hidden evidence remains authoritative
        run: node scripts/verify-12a9-kick-day-flow-category-post-repair-production-revalidation-evidence.mjs
      - name: Verify historical hidden candidate remains auditable
        run: node scripts/verify-12a9-kick-day-flow-category-candidate.mjs
      - name: Verify authorized public cutover
        run: node scripts/verify-12a9-kick-day-flow-category-public-cutover.mjs
      - name: Verify shared category projection
        run: node apps/web/scripts/day-flow-category-core.test.mjs
      - name: Verify retained production and Day Flow contracts
        working-directory: apps/web
        run: |
          node scripts/verify-production-source.mjs
          node scripts/verify-dayflow-qa.mjs
          node scripts/verify-launch-readiness.mjs
      - name: Typecheck and build web
        run: |
          pnpm typecheck:web
          pnpm build:web
      - name: Verify provider pages after build
        run: |
          test -f apps/web/dist/kick/day-flow/index.html
          test -f apps/web/dist/twitch/day-flow/index.html
          grep -Fq '/assets/' apps/web/dist/kick/day-flow/index.html
          grep -Fq '/assets/' apps/web/dist/twitch/day-flow/index.html

  production-acceptance:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUTPUT_DIR: artifacts/12a9-kick-day-flow-category-public-production-acceptance
      VIEWLOOM_ORIGIN: https://www.viewloom.net
      DAYFLOW_VALIDATION_DATE: '2026-08-10'
      EXPECTED_PRODUCTION_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: source
        name: Wait for exact public implementation SHA through Pages Git integration
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          success=false
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$VIEWLOOM_ORIGIN/deployment.json?kickDayFlowPublic=$GITHUB_RUN_ID-$attempt" -o "$OUTPUT_DIR/last-deployment.json"; then
              observed_sha=$(jq -r '.commit_sha // ""' "$OUTPUT_DIR/last-deployment.json")
              observed_env=$(jq -r '.environment // ""' "$OUTPUT_DIR/last-deployment.json")
              observed_branch=$(jq -r '.branch // ""' "$OUTPUT_DIR/last-deployment.json")
              if [[ "$observed_sha" == "$EXPECTED_PRODUCTION_SHA" && "$observed_env" == 'production' && "$observed_branch" == 'main' ]]; then
                success=true
                break
              fi
            fi
            sleep 5
          done
          [[ "$success" == true ]]
      - uses: actions/setup-node@v4
        if: steps.source.outcome == 'success'
        with:
          node-version: 22
      - name: Install Playwright
        if: steps.source.outcome == 'success'
        run: npm install playwright@1.52.0 --no-save --no-audit --no-fund
      - name: Install Chromium
        if: steps.source.outcome == 'success'
        run: npx playwright install --with-deps chromium
      - id: browser
        name: Accept public Kick Day Flow category cutover in production
        if: steps.source.outcome == 'success'
        continue-on-error: true
        run: node apps/web/scripts/kick-day-flow-category-public-production-acceptance.mjs
      - name: Upload public production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-12a9-kick-day-flow-category-public-production-acceptance
          path: artifacts/12a9-kick-day-flow-category-public-production-acceptance/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence upload when exact source or browser rejects
        if: steps.source.outcome != 'success' || steps.browser.outcome != 'success'
        run: exit 1
