name: Analytics 12A14 Kick History Category Schema Final Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/audits/12a14-kick-history-category-schema-final-acceptance.json'
      - 'docs/audits/12a14-kick-history-category-schema-apply-trigger.json'
      - 'scripts/verify-12a14-kick-history-category-schema-final-acceptance.mjs'
      - '.github/workflows/analytics-12a14-kick-history-category-schema-final-acceptance.yml'
      - '.github/workflows/analytics-12a14-kick-history-category-schema-apply.yml'
      - '.github/workflows/analytics-12a14-kick-history-schema-readonly-diagnosis.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify final production schema acceptance
        run: node scripts/verify-12a14-kick-history-category-schema-final-acceptance.mjs

      - name: Verify exact acceptance scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(docs/audits/12a14-kick-history-category-schema-final-acceptance\.json|docs/audits/12a14-kick-history-category-schema-apply-trigger\.json|scripts/verify-12a14-kick-history-category-schema-final-acceptance\.mjs|\.github/workflows/analytics-12a14-kick-history-category-schema-final-acceptance\.yml|\.github/workflows/analytics-12a14-kick-history-category-schema-apply\.yml|\.github/workflows/analytics-12a14-kick-history-schema-readonly-diagnosis\.yml)$'
          for path in "${changed[@]}"; do
            if ! [[ "$path" =~ $allowed ]]; then
              echo "Unexpected acceptance change: $path" >&2
              exit 1
            fi
          done
          test "${#changed[@]}" -eq 6

      - name: Verify retained architecture and web build
        run: |
          node scripts/verify-quality-u10g-architecture.mjs
          node scripts/verify-quality-u10d-analysis-coherence.mjs
          pnpm typecheck:web
          pnpm build:web

      - name: Publish accepted boundary
        run: |
          {
            echo '## Kick History category aggregate production schema acceptance'
            echo
            echo '- Initial failed run retained: 31670411266'
            echo '- Clean absent-state diagnosis: run 31670727423 attempt 1 / artifact 9169595791'
            echo '- Repair package: PR #841'
            echo '- Successful retry: run 31671344704 / job 94356487028 / artifact 9170134736'
            echo '- DDL order: 3 tables + 2 indexes; total first apply 5; second apply 0'
            echo '- Independent post-apply read-only revalidation: run 31670727423 attempt 2 / artifact 9170185311'
            echo '- Production schema: complete; aggregate rows: 0; leakage: 0'
            echo '- Post-apply latest Kick snapshot: 2026-08-13T06:00:40.134Z / 100 streams / authenticated'
            echo '- Empty schema observed size increase: 110592 bytes'
            echo '- Temporary schema and diagnostic Workers: deleted / 404'
            echo '- One-time execution and diagnosis workflows: retired'
            echo '- Aggregate generator production enablement: still unauthorized'
          } >> "$GITHUB_STEP_SUMMARY"
