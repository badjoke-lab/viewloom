name: Analytics 12A47 Kick History V2 Schema Apply Retry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a47-kick-history-v2-schema-apply-retry.yml'
      - 'docs/audits/12a47-kick-history-v2-schema-apply-retry-repair-contract.json'
      - 'docs/audits/12a47-kick-history-v2-schema-failure-diagnosis-evidence.json'
      - 'scripts/verify-12a47-kick-history-v2-schema-apply-retry-repair.mjs'
      - 'scripts/verify-12a47-kick-history-v2-schema-apply-retry-trigger.mjs'
      - 'docs/audits/12a47-kick-history-v2-schema-apply-retry-trigger.json'
  push:
    branches: [main]
    paths:
      - 'docs/audits/12a47-kick-history-v2-schema-apply-retry-trigger.json'

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: analytics-12a47-kick-history-v2-schema-apply-retry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  TRIGGER_FILE: docs/audits/12a47-kick-history-v2-schema-apply-retry-trigger.json
  DIAGNOSIS_FILE: docs/audits/12a47-kick-history-v2-schema-failure-diagnosis-evidence.json
  ARTIFACT_DIR: artifacts/12a47-kick-history-v2-schema-apply-retry

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify repair package or retry trigger
        run: |
          set -euo pipefail
          if [[ -f "$TRIGGER_FILE" ]]; then
            node scripts/verify-12a47-kick-history-v2-schema-apply-retry-trigger.mjs "$TRIGGER_FILE"
            VIEWLOOM_ALLOW_12A47_TRIGGER=true node scripts/verify-12a47-kick-history-v2-schema-apply-retry-repair.mjs
          else
            node scripts/verify-12a47-kick-history-v2-schema-apply-retry-repair.mjs
          fi

      - name: Verify exact PR scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          repair_expected=(
            '.github/workflows/analytics-12a47-kick-history-v2-schema-apply-retry.yml'
            'docs/audits/12a47-kick-history-v2-schema-apply-retry-repair-contract.json'
            'docs/audits/12a47-kick-history-v2-schema-failure-diagnosis-evidence.json'
            'scripts/verify-12a47-kick-history-v2-schema-apply-retry-repair.mjs'
            'scripts/verify-12a47-kick-history-v2-schema-apply-retry-trigger.mjs'
          )
          if [[ -f "$TRIGGER_FILE" ]]; then
            test "${#changed[@]}" -eq 1
            [[ "${changed[0]}" == "$TRIGGER_FILE" ]]
            node scripts/verify-12a47-kick-history-v2-schema-apply-retry-trigger.mjs "$TRIGGER_FILE"
          else
            test "${#changed[@]}" -eq "${#repair_expected[@]}"
            for path in "${repair_expected[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fxq "$path"; done
          fi

      - name: Revalidate clean diagnosis and schema package locally
        run: |
          set -euo pipefail
          [[ $(jq -r '.classification' "$DIAGNOSIS_FILE") == 'SAFE_RETRY_ABSENT' ]]
          [[ $(jq -r '.productionState.v1Schema.complete' "$DIAGNOSIS_FILE") == 'true' ]]
          [[ $(jq -r '.productionState.v2Schema.absent' "$DIAGNOSIS_FILE") == 'true' ]]
          [[ $(jq -r '.productionState.v2Schema.partial' "$DIAGNOSIS_FILE") == 'false' ]]
          [[ $(jq -r '.productionState.v2Schema.totalRows' "$DIAGNOSIS_FILE") == '0' ]]
          [[ $(jq -r '.diagnosisQueryMetrics.rowsWritten' "$DIAGNOSIS_FILE") == '0' ]]
          [[ $(jq -r '.diagnosisQueryMetrics.changes' "$DIAGNOSIS_FILE") == '0' ]]
          python3 scripts/test-12a43-kick-history-v2-schema-apply.py
          pnpm exec tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022 --types @cloudflare/workers-types workers/history-category-v2-schema-apply/src/index.ts workers/history-category-v2-schema-apply/src/schema.ts
          pnpm dlx wrangler@4 deploy --dry-run --config workers/history-category-v2-schema-apply/wrangler.kick.toml

      - name: Revalidate accepted v2 benchmark and unchanged v1 runtime
        run: |
          set -euo pipefail
          node scripts/verify-12a42-kick-history-chunked-v2-candidate.mjs
          grep -F 'candidateStreamerCategoryRows > streamerCategoryRowCap' workers/shared/history-category-aggregate.ts
          grep -F 'HISTORY_CATEGORY_GENERATION_ENABLED = "true"' workers/collector-kick/wrangler.category-permanent.toml
          grep -F 'HISTORY_CATEGORY_START_DAY = "2026-08-17"' workers/collector-kick/wrangler.category-permanent.toml
          grep -F 'crons = ["*/5 * * * *"]' workers/collector-kick/wrangler.category-permanent.toml

  production-schema-retry:
    needs: contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify exact retry trigger, repair package, and clean diagnosis
        run: |
          set -euo pipefail
          test -f "$TRIGGER_FILE"
          mapfile -t changed < <(git diff --name-only "${{ github.event.before }}" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          [[ "${changed[0]}" == "$TRIGGER_FILE" ]]
          node scripts/verify-12a47-kick-history-v2-schema-apply-retry-trigger.mjs "$TRIGGER_FILE"
          [[ $(jq -r '.sourceMainSha' "$TRIGGER_FILE") == '${{ github.event.before }}' ]]
          [[ $(jq -r '.classification' "$DIAGNOSIS_FILE") == 'SAFE_RETRY_ABSENT' ]]
          [[ $(jq -r '.conclusion.cleanAbsentForControlledRetry' "$DIAGNOSIS_FILE") == 'true' ]]
          [[ $(jq -r '.diagnosis.runId' "$DIAGNOSIS_FILE") == '32333818009' ]]
          [[ $(jq -r '.diagnosis.artifactId' "$DIAGNOSIS_FILE") == '9393922941' ]]
          repair_number=$(jq -r '.repairPackagePr' "$TRIGGER_FILE")
          repair=$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$repair_number")
          [[ $(jq -r '.merged_at // empty' <<<"$repair") != '' ]]
          [[ $(jq -r '.head.sha' <<<"$repair") == $(jq -r '.expectedRepairPackageHeadSha' "$TRIGGER_FILE") ]]
          repair_merge=$(jq -r '.merge_commit_sha' <<<"$repair")
          [[ "$repair_merge" == $(jq -r '.expectedRepairPackageMergeSha' "$TRIGGER_FILE") ]]
          git cat-file -e "$repair_merge^{commit}"
          git merge-base --is-ancestor "$repair_merge" HEAD
          VIEWLOOM_ALLOW_12A47_TRIGGER=true node scripts/verify-12a47-kick-history-v2-schema-apply-retry-repair.mjs

      - name: Execute hardened controlled Kick-only v2 schema apply retry
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ARTIFACT_DIR/raw"
          service='viewloom-history-category-v2-schema-apply-kick'
          raw="$ARTIFACT_DIR/raw"
          evidence="$ARTIFACT_DIR/evidence.json"
          config="$raw/wrangler.kick.toml"
          retryOfRunId=32332864208
          diagnosisRunId=32333818009
          stage='initialize'
          url=''
          APPLY_TOKEN=''
          deployed=false
          post_delete_status=-1

          summarize_state() {
            local path="$1"
            if [[ ! -s "$path" ]] || ! jq -e . "$path" >/dev/null 2>&1; then
              printf 'null'
              return
            fi
            jq -c '{ok:(.ok // false),error:(.error // null),state:{v1Schema:(.state.v1Schema // null),v2Schema:(.state.v2Schema // null),v2AggregateRows:(.state.v2AggregateRows // null),providerLeakageRows:(.state.providerLeakageRows // null),databaseSizeBytes:(.state.databaseSizeBytes // null),latestCollectedAt:(.state.operational.latestSnapshot.collected_at // null)}}' "$path"
          }

          cleanup_worker() {
            if [[ "$deployed" == 'true' ]]; then
              curl -sS -X DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H 'Content-Type: application/json' \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/$service" \
                > "$raw/delete-response.json" 2>/dev/null || true
              post_delete_status=$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/$service" || true)
            fi
          }

          write_failure_evidence() {
            local failure_summary
            failure_summary=$(summarize_state "$raw/failure-inspect.json")
            jq -n \
              --arg schemaVersion 'viewloom-12a47-kick-history-v2-schema-apply-retry-evidence-v1' \
              --arg status 'failure' \
              --arg failedAtStage "$stage" \
              --arg headSha "$GITHUB_SHA" \
              --argjson retryOfRunId "$retryOfRunId" \
              --argjson diagnosisRunId "$diagnosisRunId" \
              --argjson failureInspect "$failure_summary" \
              --argjson postDeleteHttpStatus "$post_delete_status" \
              '{schemaVersion:$schemaVersion,status:$status,provider:"kick",failedAtStage:$failedAtStage,headSha:$headSha,retryOfRunId:$retryOfRunId,diagnosisRunId:$diagnosisRunId,failureInspect:$failureInspect,temporaryWorkerDeleted:($postDeleteHttpStatus==404),postDeleteHttpStatus:$postDeleteHttpStatus,boundaries:{v1GeneratorChanged:false,v2GeneratorEnabled:false,collectorChanged:false,newCron:false,backfill:false,retentionChanged:false,twitchChanged:false}}' \
              > "$evidence"
          }

          failure_handler() {
            local exit_code=$?
            set +e
            if [[ "$deployed" == 'true' && -n "$url" && -n "$APPLY_TOKEN" ]]; then
              curl -sS -o "$raw/failure-inspect.json" -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $APPLY_TOKEN" "$url/inspect" > "$raw/failure-inspect.status" 2>/dev/null || true
            fi
            cleanup_worker
            write_failure_evidence
            exit "$exit_code"
          }
          trap failure_handler ERR

          stage='verify_temporary_worker_absent'
          existing=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/$service")
          [[ "$existing" == '404' ]]

          cp workers/history-category-v2-schema-apply/wrangler.kick.toml "$config"
          sed -i "s|main = \"src/index.ts\"|main = \"$GITHUB_WORKSPACE/workers/history-category-v2-schema-apply/src/index.ts\"|" "$config"
          APPLY_TOKEN=$(openssl rand -hex 32)

          stage='deploy_temporary_worker'
          pnpm dlx wrangler@4 deploy --config "$config" > "$raw/deploy.log" 2>&1
          deployed=true

          stage='resolve_worker_url'
          url=$(grep -Eo 'https://[^ ]+workers.dev' "$raw/deploy.log" | tail -1 || true)
          test -n "$url"

          stage='configure_apply_token'
          printf '%s' "$APPLY_TOKEN" | pnpm dlx wrangler@4 secret put APPLY_TOKEN --config "$config" > "$raw/secret.log" 2>&1

          stage='pre_inspect'
          inspected=false
          for attempt in $(seq 1 40); do
            status=$(curl -sS -o "$raw/pre.json" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $APPLY_TOKEN" "$url/inspect" || true)
            if [[ "$status" == '200' && $(jq -r '.ok // false' "$raw/pre.json") == 'true' ]]; then inspected=true; break; fi
            sleep 5
          done
          [[ "$inspected" == 'true' ]]
          [[ $(jq -r '.state.v1Schema.complete // false' "$raw/pre.json") == 'true' ]]
          [[ $(jq -r '.state.v2Schema.absent // false' "$raw/pre.json") == 'true' ]]
          [[ $(jq -r '.state.v2Schema.partial // true' "$raw/pre.json") == 'false' ]]
          [[ $(jq -r '.state.v2AggregateRows.total // -1' "$raw/pre.json") == '0' ]]
          [[ $(jq -r '.state.providerLeakageRows // -1' "$raw/pre.json") == '0' ]]
          pre_collected=$(jq -r '.state.operational.latestSnapshot.collected_at // empty' "$raw/pre.json")
          test -n "$pre_collected"
          node -e "const t=Date.parse(process.argv[1]); if(!Number.isFinite(t)||Date.now()-t>20*60*1000) process.exit(1)" "$pre_collected"
          pre_size=$(jq -r '.state.databaseSizeBytes // empty' "$raw/pre.json")

          stage='first_apply_tables_then_indexes'
          first_status=$(curl -sS -o "$raw/first.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $APPLY_TOKEN" \
            -H 'x-viewloom-confirm: APPLY_KICK_HISTORY_CATEGORY_V2_SCHEMA_ONLY' \
            "$url/apply")
          [[ "$first_status" == '200' ]]
          [[ $(jq -r '.ok // false' "$raw/first.json") == 'true' ]]
          [[ $(jq -r '.apply.applied // false' "$raw/first.json") == 'true' ]]
          [[ $(jq -r '.apply.tableStageStatementCount // -1' "$raw/first.json") == '3' ]]
          [[ $(jq -r '.apply.indexStageStatementCount // -1' "$raw/first.json") == '2' ]]
          [[ $(jq -r '.apply.metrics.statementCount // -1' "$raw/first.json") == '5' ]]
          [[ $(jq -r '.post.v1Schema.complete // false' "$raw/first.json") == 'true' ]]
          [[ $(jq -r '.post.v2Schema.complete // false' "$raw/first.json") == 'true' ]]
          [[ $(jq -r '.post.v2AggregateRows.total // -1' "$raw/first.json") == '0' ]]
          first_wall=$(jq -r '.workerWallMs // 999999' "$raw/first.json")
          [[ "$first_wall" -le 15000 ]]

          stage='second_apply_noop'
          second_status=$(curl -sS -o "$raw/second.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $APPLY_TOKEN" \
            -H 'x-viewloom-confirm: APPLY_KICK_HISTORY_CATEGORY_V2_SCHEMA_ONLY' \
            "$url/apply")
          [[ "$second_status" == '200' ]]
          [[ $(jq -r '.ok // false' "$raw/second.json") == 'true' ]]
          [[ $(jq -r '.apply.reason // empty' "$raw/second.json") == 'already-complete' ]]
          [[ $(jq -r '.apply.metrics.statementCount // -1' "$raw/second.json") == '0' ]]

          stage='wait_for_new_natural_snapshot'
          fresh=false
          for attempt in $(seq 1 90); do
            status=$(curl -sS -o "$raw/post-candidate.json" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $APPLY_TOKEN" "$url/inspect" || true)
            if [[ "$status" == '200' ]]; then
              candidate=$(jq -r '.state.operational.latestSnapshot.collected_at // empty' "$raw/post-candidate.json")
              if [[ -n "$candidate" && "$candidate" != "$pre_collected" ]]; then
                cp "$raw/post-candidate.json" "$raw/post.json"
                fresh=true
                break
              fi
            fi
            sleep 10
          done
          [[ "$fresh" == 'true' ]]
          [[ $(jq -r '.state.v1Schema.complete // false' "$raw/post.json") == 'true' ]]
          [[ $(jq -r '.state.v2Schema.complete // false' "$raw/post.json") == 'true' ]]
          [[ $(jq -r '.state.v2AggregateRows.total // -1' "$raw/post.json") == '0' ]]
          [[ $(jq -r '.state.providerLeakageRows // -1' "$raw/post.json") == '0' ]]
          post_size=$(jq -r '.state.databaseSizeBytes // empty' "$raw/post.json")
          if [[ -n "$pre_size" && -n "$post_size" ]]; then
            delta=$((post_size-pre_size))
            [[ "$delta" -ge 0 && "$delta" -le 5242880 ]]
          else
            delta=-1
          fi

          stage='cleanup_temporary_worker'
          cleanup_worker
          [[ "$post_delete_status" == '404' ]]
          deployed=false

          stage='write_success_evidence'
          trap - ERR
          jq -n \
            --arg schemaVersion 'viewloom-12a47-kick-history-v2-schema-apply-retry-evidence-v1' \
            --arg status 'pass' \
            --arg headSha "$GITHUB_SHA" \
            --arg preCollected "$pre_collected" \
            --arg postCollected "$(jq -r '.state.operational.latestSnapshot.collected_at' "$raw/post.json")" \
            --argjson retryOfRunId "$retryOfRunId" \
            --argjson diagnosisRunId "$diagnosisRunId" \
            --argjson firstStatements "$(jq -r '.apply.metrics.statementCount' "$raw/first.json")" \
            --argjson secondStatements "$(jq -r '.apply.metrics.statementCount' "$raw/second.json")" \
            --argjson workerWallMs "$first_wall" \
            --argjson sizeDelta "$delta" \
            --argjson postDeleteHttpStatus "$post_delete_status" \
            '{schemaVersion:$schemaVersion,status:$status,provider:"kick",headSha:$headSha,retryOfRunId:$retryOfRunId,diagnosisRunId:$diagnosisRunId,preCollectedAt:$preCollected,postCollectedAt:$postCollected,firstApplyStatementCount:$firstStatements,secondApplyStatementCount:$secondStatements,firstApplyWorkerWallMs:$workerWallMs,databaseSizeDeltaBytes:$sizeDelta,v1SchemaCompleteAfter:true,v2SchemaCompleteAfter:true,v2AggregateRowsAfter:0,providerLeakageRowsAfter:0,temporaryWorkerDeleted:true,postDeleteHttpStatus:$postDeleteHttpStatus,boundaries:{v1GeneratorChanged:false,v2GeneratorEnabled:false,collectorChanged:false,newCron:false,backfill:false,retentionChanged:false,twitchChanged:false}}' \
            > "$evidence"

      - name: Upload stage-aware sanitized retry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12a47-kick-history-v2-schema-apply-retry
          path: artifacts/12a47-kick-history-v2-schema-apply-retry/evidence.json
          retention-days: 30
          if-no-files-found: error
