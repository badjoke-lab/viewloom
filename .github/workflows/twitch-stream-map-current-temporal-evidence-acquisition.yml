name: Twitch Stream Map Current Temporal Evidence Acquisition

on:
  pull_request:
    paths:
      - 'tools/twitch-stream-map-current-location/temporal-evidence-acquisition.mjs'
      - 'docs/audits/twitch-stream-map-current-temporal-evidence-acquisition-plan-2026-08-29.json'
      - 'docs/audits/twitch-stream-map-current-review-batch-2026-08-28.json'
      - 'workers/collector-twitch/scripts/current-location-evidence-eligibility.mjs'
      - 'scripts/verify-twitch-stream-map-current-temporal-evidence-acquisition.mjs'
      - '.github/workflows/twitch-stream-map-current-temporal-evidence-acquisition.yml'
  push:
    branches: [main]
    paths:
      - 'tools/twitch-stream-map-current-location/temporal-evidence-acquisition.mjs'
      - 'docs/audits/twitch-stream-map-current-temporal-evidence-acquisition-plan-2026-08-29.json'
      - 'docs/audits/twitch-stream-map-current-review-batch-2026-08-28.json'
      - 'workers/collector-twitch/scripts/current-location-evidence-eligibility.mjs'
      - 'scripts/verify-twitch-stream-map-current-temporal-evidence-acquisition.mjs'
      - '.github/workflows/twitch-stream-map-current-temporal-evidence-acquisition.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Current accepted-class acquisition queue
        run: node scripts/verify-twitch-stream-map-current-temporal-evidence-acquisition.mjs
