name: Analytics 12A15 Kick History Category Cost Probe Retired

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a15-kick-history-category-cost-probe-execution.yml'
      - 'scripts/verify-12a15-kick-history-category-cost-probe-execution-package.mjs'
      - 'docs/audits/12a15-kick-history-category-cost-probe-trigger.json'
      - 'docs/audits/12a15-kick-history-category-cost-probe-production-failure.json'

permissions:
  contents: read

concurrency:
  group: analytics-12a15-kick-history-category-cost-probe-retired-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  retired-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify retired execution package
        run: node scripts/verify-12a15-kick-history-category-cost-probe-execution-package.mjs

      - name: Verify PR scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"

          workflow='.github/workflows/analytics-12a15-kick-history-category-cost-probe-execution.yml'
          verifier='scripts/verify-12a15-kick-history-category-cost-probe-execution-package.mjs'
          trigger='docs/audits/12a15-kick-history-category-cost-probe-trigger.json'
          evidence='docs/audits/12a15-kick-history-category-cost-probe-production-failure.json'

          if [[ "${#changed[@]}" -eq 2 ]]; then
            if printf '%s\n' "${changed[@]}" | grep -Fxq "$workflow" \
              && printf '%s\n' "${changed[@]}" | grep -Fxq "$verifier"; then
              echo 'Accepted retirement maintenance scope: workflow + verifier.'
              exit 0
            fi
            if printf '%s\n' "${changed[@]}" | grep -Fxq "$trigger" \
              && printf '%s\n' "${changed[@]}" | grep -Fxq "$evidence"; then
              [[ $(jq -r '.status' "$trigger") == 'consumed_performance_failed_retired' ]]
              [[ $(jq -r '.status' "$evidence") == 'performance_failed_cleanup_safe' ]]
              [[ $(jq -r '.productionRun' "$evidence") == '31769000044' ]]
              [[ $(jq -r '.productionJob' "$evidence") == '94670847874' ]]
              [[ $(jq -r '.artifactId' "$evidence") == '9207424532' ]]
              [[ $(jq -r '.measured.totalProbeRowsRead' "$evidence") == '843288' ]]
              [[ $(jq -r '.thresholds.totalProbeRowsReadMax' "$evidence") == '250000' ]]
              exit 0
            fi
          fi

          echo 'Unexpected retired 12A15 scope.' >&2
          exit 1

      - name: Revalidate generator semantics and permanent-runtime boundary
        run: |
          node scripts/verify-12a15-kick-history-category-aggregate-generator.mjs
          python3 scripts/test-12a15-kick-history-category-aggregate.py
          pnpm typecheck:collectors
          pnpm verify:collectors
          pnpm typecheck:web
          pnpm build:web

      - name: Publish retirement boundary
        if: always()
        run: |
          {
            echo '## Kick History category aggregate cost probe — retired execution path'
            echo
            echo '- Production execution path: retired'
            echo '- Cloudflare credentials reachable from this workflow: no'
            echo '- Accepted production run: none'
            echo '- Observed run 31769000044: performance failure; cleanup safe'
            echo '- Measured rows read: 843,288 > 250,000 limit'
            echo '- Permanent generator enablement: unauthorized'
            echo '- Next gate: read-cost optimization before any new production probe'
          } >> "$GITHUB_STEP_SUMMARY"
