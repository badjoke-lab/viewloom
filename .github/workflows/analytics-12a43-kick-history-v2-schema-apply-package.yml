name: Analytics 12A43 Kick History V2 Schema Apply Package

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a43-kick-history-v2-schema-apply-package.yml'
      - 'docs/audits/12a43-kick-history-v2-schema-apply-package-contract.json'
      - 'scripts/verify-12a43-kick-history-v2-schema-apply-package.mjs'
      - 'scripts/test-12a43-kick-history-v2-schema-apply.py'
      - 'workers/history-category-v2-schema-apply/**'
      - 'docs/audits/12a43-kick-history-v2-schema-apply-trigger.json'
  push:
    branches: [main]
    paths:
      - 'docs/audits/12a43-kick-history-v2-schema-apply-trigger.json'

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: analytics-12a43-kick-history-v2-schema-apply-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  TRIGGER_FILE: docs/audits/12a43-kick-history-v2-schema-apply-trigger.json
  ARTIFACT_DIR: artifacts/12a43-kick-history-v2-schema-apply

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify package
        run: node scripts/verify-12a43-kick-history-v2-schema-apply-package.mjs

      - name: Verify local schema fixtures
        run: python3 scripts/test-12a43-kick-history-v2-schema-apply.py

      - name: Verify package-only PR scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          expected=(
            '.github/workflows/analytics-12a43-kick-history-v2-schema-apply-package.yml'
            'docs/audits/12a43-kick-history-v2-schema-apply-package-contract.json'
            'scripts/verify-12a43-kick-history-v2-schema-apply-package.mjs'
            'scripts/test-12a43-kick-history-v2-schema-apply.py'
            'workers/history-category-v2-schema-apply/src/index.ts'
            'workers/history-category-v2-schema-apply/src/schema.ts'
            'workers/history-category-v2-schema-apply/wrangler.kick.toml'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fxq "$path"; done
          test ! -e "$TRIGGER_FILE"

      - name: Typecheck and bundle temporary Worker without deploying
        run: |
          pnpm exec tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,WebWorker --types @cloudflare/workers-types workers/history-category-v2-schema-apply/src/index.ts workers/history-category-v2-schema-apply/src/schema.ts
          pnpm dlx wrangler@4 deploy --dry-run --config workers/history-category-v2-schema-apply/wrangler.kick.toml

      - name: Revalidate accepted v2 candidate
        run: |
          node scripts/verify-12a42-kick-history-chunked-v2-candidate.mjs
          python3 scripts/benchmark-12a42-kick-history-chunked-v2-candidate.py --output /tmp/12a42-recheck.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          canonical = json.loads(Path('docs/audits/12a42-kick-history-chunked-v2-candidate-benchmark-evidence.json').read_text())
          recheck = json.loads(Path('/tmp/12a42-recheck.json').read_text())
          assert recheck['stableBenchmarkSignatureSha256'] == canonical['stableBenchmarkSignatureSha256']
          assert recheck['status'] == 'PASS'
          PY

      - name: Verify current production v1 runtime remains outside package
        run: |
          grep -F 'candidateStreamerCategoryRows > streamerCategoryRowCap' workers/shared/history-category-aggregate.ts
          grep -F 'HISTORY_CATEGORY_GENERATION_ENABLED = "true"' workers/collector-kick/wrangler.category-permanent.toml
          grep -F 'HISTORY_CATEGORY_START_DAY = "2026-08-17"' workers/collector-kick/wrangler.category-permanent.toml
          grep -F 'crons = ["*/5 * * * *"]' workers/collector-kick/wrangler.category-permanent.toml

  production-schema-apply:
    needs: contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify exact one-file trigger and accepted package
        run: |
          set -euo pipefail
          test -f "$TRIGGER_FILE"
          mapfile -t changed < <(git diff --name-only "${{ github.event.before }}" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          [[ "${changed[0]}" == "$TRIGGER_FILE" ]]
          [[ $(jq -r '.status' "$TRIGGER_FILE") == 'armed_for_one_time_main_push' ]]
          [[ $(jq -r '.confirmation' "$TRIGGER_FILE") == 'APPLY_KICK_HISTORY_CATEGORY_V2_SCHEMA_ONLY' ]]
          [[ $(jq -r '.oneTime' "$TRIGGER_FILE") == 'true' ]]
          [[ $(jq -r '.provider' "$TRIGGER_FILE") == 'kick' ]]
          [[ $(jq -r '.acceptedCandidatePr' "$TRIGGER_FILE") == '927' ]]
          package_number=$(jq -r '.packagePr' "$TRIGGER_FILE")
          package=$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$package_number")
          [[ $(jq -r '.merged_at // empty' <<<"$package") != '' ]]
          [[ $(jq -r '.head.sha' <<<"$package") == $(jq -r '.expectedPackageHeadSha' "$TRIGGER_FILE") ]]
          package_merge=$(jq -r '.merge_commit_sha' <<<"$package")
          git cat-file -e "$package_merge^{commit}"
          git merge-base --is-ancestor "$package_merge" HEAD
          node scripts/verify-12a43-kick-history-v2-schema-apply-package.mjs

      - name: Execute controlled Kick-only v2 schema apply
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR/raw"
          service='viewloom-history-category-v2-schema-apply-kick'
          raw="$ARTIFACT_DIR/raw"
          config="$raw/wrangler.kick.toml"
          cp workers/history-category-v2-schema-apply/wrangler.kick.toml "$config"
          sed -i "s|main = \"src/index.ts\"|main = \"$GITHUB_WORKSPACE/workers/history-category-v2-schema-apply/src/index.ts\"|" "$config"
          APPLY_TOKEN=$(openssl rand -hex 32)
          export APPLY_TOKEN
          deployed=false

          cleanup() {
            if [[ "$deployed" == 'true' ]]; then
              curl -sS -X DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H 'Content-Type: application/json' \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/$service" \
                > "$raw/delete-response.json" || true
            fi
          }
          trap cleanup EXIT

          existing=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/$service")
          [[ "$existing" == '404' ]]

          pnpm dlx wrangler@4 deploy --config "$config" > "$raw/deploy.log" 2>&1
          deployed=true
          printf '%s' "$APPLY_TOKEN" | pnpm dlx wrangler@4 secret put APPLY_TOKEN --config "$config" >> "$raw/deploy.log" 2>&1
          url=$(grep -Eo 'https://[^ ]+workers.dev' "$raw/deploy.log" | tail -1)
          test -n "$url"

          for attempt in $(seq 1 40); do
            status=$(curl -sS -o "$raw/pre.json" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $APPLY_TOKEN" "$url/inspect" || true)
            if [[ "$status" == '200' && $(jq -r '.ok // false' "$raw/pre.json") == 'true' ]]; then break; fi
            sleep 5
          done
          [[ $(jq -r '.state.v1Schema.complete // false' "$raw/pre.json") == 'true' ]]
          [[ $(jq -r '.state.v2Schema.absent // false' "$raw/pre.json") == 'true' ]]
          [[ $(jq -r '.state.v2Schema.partial // true' "$raw/pre.json") == 'false' ]]
          [[ $(jq -r '.state.v2AggregateRows.total // -1' "$raw/pre.json") == '0' ]]
          [[ $(jq -r '.state.providerLeakageRows // -1' "$raw/pre.json") == '0' ]]
          pre_collected=$(jq -r '.state.operational.latestSnapshot.collected_at // empty' "$raw/pre.json")
          test -n "$pre_collected"
          node -e "const t=Date.parse(process.argv[1]); if(!Number.isFinite(t)||Date.now()-t>20*60*1000) process.exit(1)" "$pre_collected"
          pre_size=$(jq -r '.state.databaseSizeBytes // empty' "$raw/pre.json")

          first_status=$(curl -sS -o "$raw/first.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $APPLY_TOKEN" \
            -H 'x-viewloom-confirm: APPLY_KICK_HISTORY_CATEGORY_V2_SCHEMA_ONLY' \
            "$url/apply")
          [[ "$first_status" == '200' ]]
          [[ $(jq -r '.ok // false' "$raw/first.json") == 'true' ]]
          [[ $(jq -r '.apply.applied // false' "$raw/first.json") == 'true' ]]
          [[ $(jq -r '.apply.tableStageStatementCount // -1' "$raw/first.json") == '3' ]]
          [[ $(jq -r '.apply.indexStageStatementCount // -1' "$raw/first.json") == '2' ]]
          [[ $(jq -r '.apply.metrics.statementCount // -1' "$raw/first.json") == '5' ]]
          [[ $(jq -r '.post.v1Schema.complete // false' "$raw/first.json") == 'true' ]]
          [[ $(jq -r '.post.v2Schema.complete // false' "$raw/first.json") == 'true' ]]
          [[ $(jq -r '.post.v2AggregateRows.total // -1' "$raw/first.json") == '0' ]]
          first_wall=$(jq -r '.workerWallMs // 999999' "$raw/first.json")
          [[ "$first_wall" -le 15000 ]]

          second_status=$(curl -sS -o "$raw/second.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $APPLY_TOKEN" \
            -H 'x-viewloom-confirm: APPLY_KICK_HISTORY_CATEGORY_V2_SCHEMA_ONLY' \
            "$url/apply")
          [[ "$second_status" == '200' ]]
          [[ $(jq -r '.ok // false' "$raw/second.json") == 'true' ]]
          [[ $(jq -r '.apply.reason // empty' "$raw/second.json") == 'already-complete' ]]
          [[ $(jq -r '.apply.metrics.statementCount // -1' "$raw/second.json") == '0' ]]

          fresh=false
          for attempt in $(seq 1 90); do
            status=$(curl -sS -o "$raw/post-candidate.json" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $APPLY_TOKEN" "$url/inspect" || true)
            if [[ "$status" == '200' ]]; then
              candidate=$(jq -r '.state.operational.latestSnapshot.collected_at // empty' "$raw/post-candidate.json")
              if [[ -n "$candidate" && "$candidate" != "$pre_collected" ]]; then
                cp "$raw/post-candidate.json" "$raw/post.json"
                fresh=true
                break
              fi
            fi
            sleep 10
          done
          [[ "$fresh" == 'true' ]]
          [[ $(jq -r '.state.v1Schema.complete // false' "$raw/post.json") == 'true' ]]
          [[ $(jq -r '.state.v2Schema.complete // false' "$raw/post.json") == 'true' ]]
          [[ $(jq -r '.state.v2AggregateRows.total // -1' "$raw/post.json") == '0' ]]
          [[ $(jq -r '.state.providerLeakageRows // -1' "$raw/post.json") == '0' ]]
          post_size=$(jq -r '.state.databaseSizeBytes // empty' "$raw/post.json")
          if [[ -n "$pre_size" && -n "$post_size" ]]; then
            delta=$((post_size-pre_size))
            [[ "$delta" -ge 0 && "$delta" -le 5242880 ]]
          else
            delta=-1
          fi

          cleanup
          deployed=false
          trap - EXIT
          delete_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/$service")
          [[ "$delete_status" == '404' ]]

          mkdir -p "$ARTIFACT_DIR"
          jq -n \
            --arg schemaVersion 'viewloom-12a43-kick-history-v2-schema-apply-evidence-v1' \
            --arg headSha "$GITHUB_SHA" \
            --arg preCollected "$pre_collected" \
            --arg postCollected "$(jq -r '.state.operational.latestSnapshot.collected_at' "$raw/post.json")" \
            --argjson firstStatements "$(jq -r '.apply.metrics.statementCount' "$raw/first.json")" \
            --argjson secondStatements "$(jq -r '.apply.metrics.statementCount' "$raw/second.json")" \
            --argjson workerWallMs "$first_wall" \
            --argjson preSize "${pre_size:-null}" \
            --argjson postSize "${post_size:-null}" \
            --argjson sizeDelta "$delta" \
            --argjson postDeleteHttpStatus "$delete_status" \
            '{schemaVersion:$schemaVersion,status:"pass",provider:"kick",headSha:$headSha,preCollectedAt:$preCollected,postCollectedAt:$postCollected,firstApplyStatementCount:$firstStatements,secondApplyStatementCount:$secondStatements,firstApplyWorkerWallMs:$workerWallMs,preDatabaseSizeBytes:$preSize,postDatabaseSizeBytes:$postSize,databaseSizeDeltaBytes:$sizeDelta,v1SchemaCompleteAfter:true,v2SchemaCompleteAfter:true,v2AggregateRowsAfter:0,providerLeakageRowsAfter:0,temporaryWorkerDeleted:true,postDeleteHttpStatus:$postDeleteHttpStatus,boundaries:{v1GeneratorChanged:false,v2GeneratorEnabled:false,collectorChanged:false,newCron:false,backfill:false,retentionChanged:false,twitchChanged:false}}' \
            > "$ARTIFACT_DIR/evidence.json"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12a43-kick-history-v2-schema-apply
          path: artifacts/12a43-kick-history-v2-schema-apply/evidence.json
          retention-days: 30
          if-no-files-found: error
