name: Analytics 12A32 Kick History Disabled Runtime Production Deployment Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a32-kick-history-disabled-runtime-production-deployment-acceptance.yml'
      - 'docs/audits/12a32-kick-history-disabled-runtime-production-deployment-acceptance.json'
      - 'scripts/verify-12a32-kick-history-disabled-runtime-production-deployment-acceptance.mjs'

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: analytics-12a32-kick-history-disabled-runtime-production-deployment-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify exact repository-only acceptance scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          expected=(
            '.github/workflows/analytics-12a32-kick-history-disabled-runtime-production-deployment-acceptance.yml'
            'docs/audits/12a32-kick-history-disabled-runtime-production-deployment-acceptance.json'
            'scripts/verify-12a32-kick-history-disabled-runtime-production-deployment-acceptance.mjs'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$path"
          done

      - name: Verify canonical 12A32 acceptance contract
        run: node scripts/verify-12a32-kick-history-disabled-runtime-production-deployment-acceptance.mjs

      - name: Re-audit merged candidate and exact deployment run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/badjoke-lab/viewloom'
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')

          curl -fsSL "${auth[@]}" "$api/pulls/898" > /tmp/pr898.json
          jq -e '.state == "closed" and .merged == true' /tmp/pr898.json
          jq -e '.head.sha == "6b4e95da258476ba104e4e3598ae5793f9153dcd"' /tmp/pr898.json
          jq -e '.merge_commit_sha == "acdb274ee03887d3247fb9498acda85fabfebcd5"' /tmp/pr898.json
          jq -e '.changed_files == 4' /tmp/pr898.json

          curl -fsSL "${auth[@]}" "$api/actions/runs/32029471351" > /tmp/deploy-run.json
          jq -e '.name == "Deploy Collector Workers"' /tmp/deploy-run.json
          jq -e '.event == "push" and .status == "completed" and .conclusion == "success"' /tmp/deploy-run.json
          jq -e '.head_sha == "acdb274ee03887d3247fb9498acda85fabfebcd5"' /tmp/deploy-run.json

          curl -fsSL "${auth[@]}" "$api/actions/runs/32029471351/jobs?per_page=100" > /tmp/deploy-jobs.json
          jq -e 'any(.jobs[]; .id == 95385985029 and .name == "verify" and .conclusion == "success")' /tmp/deploy-jobs.json
          jq -e 'any(.jobs[]; .id == 95386043376 and .name == "plan" and .conclusion == "success")' /tmp/deploy-jobs.json
          jq -e 'any(.jobs[]; .id == 95386092161 and .name == "deploy-kick" and .conclusion == "success")' /tmp/deploy-jobs.json
          jq -e 'any(.jobs[]; .id == 95386093460 and .name == "deploy-twitch" and .conclusion == "skipped")' /tmp/deploy-jobs.json
          jq -e 'any(.jobs[]; .id == 95386158294 and .name == "verify-remote-schema" and .conclusion == "success")' /tmp/deploy-jobs.json

          curl -fsSL "${auth[@]}" "$api/actions/runs/32029471351/artifacts?per_page=100" > /tmp/deploy-artifacts.json
          jq -e 'any(.artifacts[]; .id == 9288336433 and .name == "phase12a2-collector-worker-deploy" and .expired == false and .digest == "sha256:8a70143ea598d7ac4d9920a3b367e8faa141b52f62079b6bc13026faa4b592cc")' /tmp/deploy-artifacts.json

      - name: Verify deployed canonical config keeps History generator disabled
        run: |
          set -euo pipefail
          config='workers/collector-kick/wrangler.category-permanent.toml'
          grep -Fxq 'INTRADAY_GENERATION_ENABLED = "true"' "$config"
          grep -Fxq 'CATEGORY_CAPTURE_ENABLED = "true"' "$config"
          grep -Fxq 'crons = ["*/5 * * * *"]' "$config"
          if grep -Fq 'HISTORY_CATEGORY_GENERATION_ENABLED' "$config"; then
            echo 'History Category generation unexpectedly configured' >&2
            exit 1
          fi
          if grep -Fq 'HISTORY_CATEGORY_START_DAY' "$config"; then
            echo 'History Category start day unexpectedly configured' >&2
            exit 1
          fi

      - name: Read-only live health and status acceptance
        run: |
          set -euo pipefail
          origin='https://viewloom-collector-kick.badjoke-lab.workers.dev'
          curl -fsS --retry 3 --retry-delay 2 "$origin/health" -o /tmp/kick-health.json
          curl -fsS --retry 3 --retry-delay 2 "$origin/status" -o /tmp/kick-status.json

          jq -e '.ok == true and .provider == "kick" and .storage == "DB_KICK_HOT"' /tmp/kick-health.json
          jq -e '.ok == true and .provider == "kick"' /tmp/kick-status.json
          jq -e '(.storage | type == "string") and (.storage | contains("DB_KICK_HOT"))' /tmp/kick-status.json
          jq -e '(.rows | type == "number") and .rows >= 0' /tmp/kick-status.json
          jq -e '.lastCollectionResult != null' /tmp/kick-status.json
          jq -e '(.lastCollectionResult.bucket_minute | type == "string") and (.lastCollectionResult.bucket_minute | length > 0)' /tmp/kick-status.json
          jq -e '(.sourceMode | type == "string") and (.sourceMode | length > 0)' /tmp/kick-status.json

          {
            echo '## Live read-only Kick collector acceptance'
            echo
            echo "- health ok: $(jq -r '.ok' /tmp/kick-health.json)"
            echo "- status ok: $(jq -r '.ok' /tmp/kick-status.json)"
            echo "- source mode: $(jq -r '.sourceMode' /tmp/kick-status.json)"
            echo "- latest bucket: $(jq -r '.lastCollectionResult.bucket_minute' /tmp/kick-status.json)"
            echo "- written stream count: $(jq -r '.writtenStreamCount' /tmp/kick-status.json)"
            echo '- methods used: GET only'
            echo '- production mutation: none'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Revalidate production cost PASS and current collector contracts
        run: |
          node scripts/verify-12a26-kick-history-category-reprobe-pass.mjs
          node scripts/verify-collector-contracts.mjs
          pnpm typecheck:collectors

      - name: Verify acceptance workflow has no deployment surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/analytics-12a32-kick-history-disabled-runtime-production-deployment-acceptance.yml').read_text()
          forbidden = [
              '\n  ' + 'push:',
              'workflow_' + 'dispatch:',
              'sched' + 'ule:',
              'CLOUDFLARE_' + 'API_TOKEN',
              'CLOUDFLARE_' + 'ACCOUNT_ID',
              'wrangler ' + 'deploy',
              'wrangler@4 ' + 'deploy',
              'HISTORY_CATEGORY_GENERATION_ENABLED=true',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'production-capable acceptance surface: {token}')
          PY

      - name: Publish acceptance boundary
        if: always()
        run: |
          {
            echo '## Kick History Category — 12A32 disabled runtime deployment acceptance'
            echo
            echo '- exact candidate #898 deployed: yes'
            echo '- production main: acdb274ee03887d3247fb9498acda85fabfebcd5'
            echo '- deployment run: 32029471351'
            echo '- Kick deploy: success'
            echo '- Twitch deploy: skipped'
            echo '- remote schema: success'
            echo '- History Category generation configured: no'
            echo '- History Category startDay configured: no'
            echo '- generator enabled by this acceptance: no'
            echo '- next gate after acceptance: independent permanent generator-enable decision'
          } >> "$GITHUB_STEP_SUMMARY"
