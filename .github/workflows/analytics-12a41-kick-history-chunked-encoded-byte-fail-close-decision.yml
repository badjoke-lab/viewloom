name: Analytics 12A41 Kick History Chunked Encoded Byte Fail Close Decision

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a41-kick-history-chunked-encoded-byte-fail-close-decision.yml'
      - 'docs/audits/12a41-kick-history-chunked-encoded-byte-fail-close-decision.json'
      - 'scripts/verify-12a41-kick-history-chunked-encoded-byte-fail-close-decision.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify exact Decision scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          expected=(
            '.github/workflows/analytics-12a41-kick-history-chunked-encoded-byte-fail-close-decision.yml'
            'docs/audits/12a41-kick-history-chunked-encoded-byte-fail-close-decision.json'
            'scripts/verify-12a41-kick-history-chunked-encoded-byte-fail-close-decision.mjs'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fxq "$path"; done

      - name: Verify 12A41 Decision
        run: node scripts/verify-12a41-kick-history-chunked-encoded-byte-fail-close-decision.mjs

      - name: Revalidate accepted local prototype
        run: |
          set -euo pipefail
          python3 scripts/benchmark-12a40-kick-history-chunked-contributors.py --output /tmp/12a40-recheck.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          canonical = json.loads(Path('docs/audits/12a40-kick-history-chunked-contributor-benchmark-evidence.json').read_text())
          recheck = json.loads(Path('/tmp/12a40-recheck.json').read_text())
          assert recheck['status'] == 'PASS'
          assert recheck['winner']['chunkSize'] == 128
          assert recheck['stableBenchmarkSignatureSha256'] == canonical['stableBenchmarkSignatureSha256']
          assert recheck['measurements'][2]['maximumEncodedBytesPerDay'] == 47196
          assert recheck['measurements'][2]['incrementalMiBWithSafety'] == 30.05
          assert recheck['measurements'][2]['projectedKickMiB'] == 399.73
          assert recheck['theoreticalSourceMaximumStress']['measurements']['128']['encodedBytes'] == 1275301
          assert recheck['theoreticalSourceMaximumStress']['requiresEncodedByteFailCloseBeforeProduction'] is True
          PY
          node scripts/verify-12a40-kick-history-chunked-contributor-benchmark.mjs

      - name: Verify repository-only boundary
        run: |
          set -euo pipefail
          file='.github/workflows/analytics-12a41-kick-history-chunked-encoded-byte-fail-close-decision.yml'
          ! grep -Eq '^  (push|workflow_dispatch|schedule):' "$file"
          ! grep -Fq 'CLOUDFLARE_API_TOKEN' "$file"
          ! grep -Fq 'CLOUDFLARE_ACCOUNT_ID' "$file"
          test ! -e db/d1/007_history_category_chunked_contributors.sql

      - name: Verify active production implementation remains v1
        run: |
          grep -F 'history_category_streamer_daily' db/d1/006_history_category_aggregate.sql
          grep -F 'candidateStreamerCategoryRows > streamerCategoryRowCap' workers/shared/history-category-aggregate.ts
          grep -F 'HISTORY_CATEGORY_GENERATION_ENABLED = "true"' workers/collector-kick/wrangler.category-permanent.toml
          grep -F 'HISTORY_CATEGORY_START_DAY = "2026-08-17"' workers/collector-kick/wrangler.category-permanent.toml
          grep -F 'crons = ["*/5 * * * *"]' workers/collector-kick/wrangler.category-permanent.toml
