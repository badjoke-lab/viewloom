name: TMP 823 Minimal U10G Battle Lines Fix

on:
  push:
    branches: [work-823-kick-battle-lines-category-public-cutover]
    paths:
      - '.github/workflows/tmp-823-minimal-u10g-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work-823-kick-battle-lines-category-public-cutover
          fetch-depth: 0
      - name: Restore U10G browser from main and patch only Battle Lines category expectation
        run: |
          git fetch origin main
          git checkout origin/main -- apps/web/scripts/quality-u10g-architecture-browser.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/scripts/quality-u10g-architecture-browser.mjs')
          text = path.read_text()
          old = "  assert.equal(initial.categoryParam, null, `${id}: Battle Lines emitted Day Flow category state`)"
          new = "  const expectedCategoryParam = provider === 'kick' ? 'all' : null\n  assert.equal(initial.categoryParam, expectedCategoryParam, `${id}: Battle Lines category URL state mismatch`)"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one U10G Battle Lines category assertion, got {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
      - name: Commit minimal U10G compatibility fix
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add apps/web/scripts/quality-u10g-architecture-browser.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Allow public Kick Battle Lines category state in U10G browser'
          git push origin HEAD:work-823-kick-battle-lines-category-public-cutover
