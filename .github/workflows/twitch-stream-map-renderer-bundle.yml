name: Twitch Stream Map Renderer Bundle

on:
  pull_request:
    paths:
      - 'apps/web/package.json'
      - 'apps/web/twitch/map/index.html'
      - 'apps/web/public/data/geo/**'
      - 'apps/web/src/features/twitch-stream-map/maplibre-bootstrap.ts'
      - 'apps/web/src/features/twitch-stream-map/stream-map-entry.ts'
      - 'apps/web/src/features/twitch-stream-map/stream-map-runtime.ts'
      - 'apps/web/src/features/twitch-stream-map/city-render-guard.ts'
      - 'apps/web/src/features/twitch-stream-map/city-aggregate-core.mjs'
      - 'apps/web/src/features/twitch-stream-map/city-aggregate-core.d.mts'
      - 'apps/web/src/features/twitch-stream-map/city-reference-geometry-registry.mjs'
      - 'apps/web/src/features/twitch-stream-map/city-reference-point-core.mjs'
      - 'apps/web/src/features/twitch-stream-map/city-reference-point-core.d.mts'
      - 'apps/web/src/features/twitch-stream-map/country-regions.ts'
      - 'apps/web/src/features/twitch-stream-map/country-minimal-basemap.ts'
      - 'apps/web/src/features/twitch-stream-map/country-focus-bounds.ts'
      - 'apps/web/src/features/twitch-stream-map/country-ui-density.ts'
      - 'apps/web/src/features/twitch-stream-map/country-ui-density.css'
      - 'apps/web/scripts/install-ci-playwright.mjs'
      - 'apps/web/scripts/twitch-stream-map-renderer-browser.mjs'
      - 'apps/web/scripts/twitch-stream-map-city-aggregate-browser.mjs'
      - 'apps/web/scripts/twitch-stream-map-city-reference-point-browser.mjs'
      - 'apps/web/scripts/twitch-stream-map-country-regions-default-browser.mjs'
      - 'apps/web/scripts/twitch-stream-map-country-minimal-basemap-browser.mjs'
      - 'apps/web/scripts/twitch-stream-map-country-focus-browser.mjs'
      - 'apps/web/scripts/twitch-stream-map-country-mobile-world-browser.mjs'
      - 'apps/web/scripts/twitch-stream-map-country-ui-density-browser.mjs'
      - 'scripts/verify-twitch-stream-map-renderer-bundle.mjs'
      - '.github/workflows/twitch-stream-map-renderer-bundle.yml'

permissions:
  contents: read

concurrency:
  group: twitch-stream-map-renderer-bundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify bundled Stream Map renderer contract
        run: node scripts/verify-twitch-stream-map-renderer-bundle.mjs
      - name: Build web application
        run: pnpm build:web
      - name: Rebuild PR-only Cloudflare Pages preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          CF_PAGES: '1'
          CF_PAGES_BRANCH: pr-${{ github.event.pull_request.number }}
          CF_PAGES_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          CF_PAGES_URL: https://pr-${{ github.event.pull_request.number }}.viewloom.pages.dev
        run: pnpm build:web
      - name: Install Wrangler 4
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: npm install --global wrangler@4
      - name: Deploy PR-only Cloudflare Pages preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/twitch-country-pages-preview"
          wrangler pages deploy dist \
            --project-name viewloom \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "${{ github.event.pull_request.head.sha }}" \
            --commit-message "Twitch Stream Map PR #${{ github.event.pull_request.number }} preview" \
            | tee "$GITHUB_WORKSPACE/artifacts/twitch-country-pages-preview/wrangler.log"
          grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' "$GITHUB_WORKSPACE/artifacts/twitch-country-pages-preview/wrangler.log" \
            | tail -1 \
            > "$GITHUB_WORKSPACE/artifacts/twitch-country-pages-preview/url.txt"
          test -s "$GITHUB_WORKSPACE/artifacts/twitch-country-pages-preview/url.txt"
      - name: Upload Pages preview evidence
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: twitch-country-pages-preview
          path: artifacts/twitch-country-pages-preview/
          if-no-files-found: error
      - name: Start local candidate preview
        shell: bash
        run: |
          pnpm --filter @viewloom/web preview --host 127.0.0.1 --port 4173 > /tmp/twitch-stream-map-renderer-preview.log 2>&1 &
          for attempt in {1..40}; do
            curl --silent --fail http://127.0.0.1:4173/twitch/map/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/twitch-stream-map-renderer-preview.log
          exit 1
      - name: Install Playwright in isolated prefix
        working-directory: apps/web
        run: node scripts/install-ci-playwright.mjs
      - name: Install Chromium
        run: /tmp/viewloom-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify City aggregate selection and list-first fallback
        working-directory: apps/web
        env:
          STREAM_MAP_BASE_URL: http://127.0.0.1:4173
        run: node scripts/twitch-stream-map-city-aggregate-browser.mjs
      - name: Verify reviewed City aggregate reference point rendering
        working-directory: apps/web
        env:
          STREAM_MAP_BASE_URL: http://127.0.0.1:4173
        run: node scripts/twitch-stream-map-city-reference-point-browser.mjs
      - name: Verify finalized Country regions and small-country fallback
        working-directory: apps/web
        env:
          STREAM_MAP_BASE_URL: http://127.0.0.1:4173
        run: node scripts/twitch-stream-map-country-regions-default-browser.mjs
      - name: Verify Country selection and explicit World view camera
        working-directory: apps/web
        env:
          STREAM_MAP_BASE_URL: http://127.0.0.1:4173
        run: node scripts/twitch-stream-map-country-focus-browser.mjs
      - name: Verify compact Country UI density and interaction contract
        working-directory: apps/web
        env:
          STREAM_MAP_BASE_URL: http://127.0.0.1:4173
        run: node scripts/twitch-stream-map-country-ui-density-browser.mjs
      - name: Verify mobile Country world overview
        working-directory: apps/web
        env:
          STREAM_MAP_BASE_URL: http://127.0.0.1:4173
        run: node scripts/twitch-stream-map-country-mobile-world-browser.mjs
      - name: Verify bundled renderer worker and finalized Country regions
        working-directory: apps/web
        env:
          STREAM_MAP_BASE_URL: http://127.0.0.1:4173
        run: node scripts/twitch-stream-map-renderer-browser.mjs
      - name: Verify real OpenFreeMap basemap and finalized Country regions
        working-directory: apps/web
        env:
          STREAM_MAP_BASE_URL: http://127.0.0.1:4173
          STREAM_MAP_REAL_BASEMAP: '1'
        run: node scripts/twitch-stream-map-renderer-browser.mjs
      - name: Verify minimal Country basemap with real provider style
        working-directory: apps/web
        env:
          STREAM_MAP_BASE_URL: http://127.0.0.1:4173
        run: node scripts/twitch-stream-map-country-minimal-basemap-browser.mjs
