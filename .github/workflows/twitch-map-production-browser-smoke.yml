name: Twitch Map Production Browser Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * *'
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - '.github/workflows/twitch-map-production-browser-smoke.yml'

permissions:
  contents: read

concurrency:
  group: twitch-map-production-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORIGIN: https://www.viewloom.net
      ARTIFACT_DIR: artifacts/twitch-map-production-browser-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Prepare artifact directory
        run: mkdir -p "$ARTIFACT_DIR"
      - name: Resolve production identity for push smoke
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          require_exact=false
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            changed="$(git diff --name-only HEAD^ HEAD)"
            printf '%s\n' "$changed"
            if printf '%s\n' "$changed" | grep -Eq '^(apps/web/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/deploy-web-pages\.yml$)'; then
              require_exact=true
            fi
          else
            require_exact=true
          fi

          if [ "$require_exact" = false ]; then
            curl --silent --show-error --fail --max-time 30 "$ORIGIN/deployment.json?smoke=$GITHUB_RUN_ID" -o "$ARTIFACT_DIR/deployment.json"
            jq -e '.schema == "viewloom-deployment-v1" and .environment == "production" and .branch == "main" and (.commit_sha | type == "string" and length > 0)' "$ARTIFACT_DIR/deployment.json" >/dev/null
            echo 'Workflow-only smoke change: validating the current production deployment.'
            cat "$ARTIFACT_DIR/deployment.json"
            exit 0
          fi

          for attempt in {1..60}; do
            if curl --silent --show-error --fail --max-time 20 "$ORIGIN/deployment.json?attempt=$attempt&expected=$expected" -o "$ARTIFACT_DIR/deployment.json"; then
              deployed="$(jq -r '.commit_sha // empty' "$ARTIFACT_DIR/deployment.json")"
              environment="$(jq -r '.environment // empty' "$ARTIFACT_DIR/deployment.json")"
              branch="$(jq -r '.branch // empty' "$ARTIFACT_DIR/deployment.json")"
              if [ "$deployed" = "$expected" ] && [ "$environment" = 'production' ] && [ "$branch" = 'main' ]; then
                cat "$ARTIFACT_DIR/deployment.json"
                exit 0
              fi
              echo "Production is not on $expected yet (found $deployed, attempt $attempt/60)."
            else
              echo "deployment.json unavailable (attempt $attempt/60)."
            fi
            sleep 10
          done
          echo "Exact production deployment $expected was not observed." >&2
          exit 1
      - name: Record current production identity for manual or scheduled smoke
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 30 "$ORIGIN/deployment.json?smoke=$GITHUB_RUN_ID" -o "$ARTIFACT_DIR/deployment.json"
          jq -e '.schema == "viewloom-deployment-v1" and .environment == "production" and .branch == "main" and (.commit_sha | type == "string" and length > 0)' "$ARTIFACT_DIR/deployment.json" >/dev/null
          cat "$ARTIFACT_DIR/deployment.json"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright
        shell: bash
        run: |
          mkdir -p /tmp/viewloom-prod-smoke
          cd /tmp/viewloom-prod-smoke
          npm init -y >/dev/null 2>&1
          npm install playwright@1.52.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Verify production Country and City map rendering
        shell: bash
        env:
          TARGET_URL: https://www.viewloom.net/twitch/map/
        run: |
          cat > /tmp/viewloom-prod-smoke/smoke.mjs <<'NODE'
          import assert from 'node:assert/strict'
          import { chromium } from 'playwright'

          const targetUrl = process.env.TARGET_URL
          const runId = process.env.GITHUB_RUN_ID || 'manual'
          const url = `${targetUrl}?production-browser-smoke=${encodeURIComponent(runId)}`
          const browser = await chromium.launch({
            headless: true,
            args: ['--enable-webgl', '--use-gl=angle', '--use-angle=swiftshader', '--disable-gpu-sandbox'],
          })
          const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } })
          const pageErrors = []
          const consoleErrors = []
          page.on('pageerror', (error) => pageErrors.push(error.stack || error.message))
          page.on('console', (message) => {
            if (message.type() === 'error') consoleErrors.push(message.text())
          })

          async function snapshot(label) {
            await page.locator('#stream-map-root[data-map-state="basemap-ready"]').waitFor({ timeout: 45000 })
            await page.locator('[data-stream-map-status][data-state="ready"]').waitFor({ timeout: 45000 })

            const state = await page.locator('#stream-map-root').getAttribute('data-map-state')
            const canvasCount = await page.locator('#stream-map-root canvas.maplibregl-canvas').count()
            const controls = await page.locator('#stream-map-root .maplibregl-ctrl-zoom-in').count()
            const mappedText = (await page.locator('#stream-map-mapped').textContent() || '').trim()
            const mappedStreams = Number(mappedText.replaceAll(',', ''))
            const markerCount = await page.locator('.stream-map-country-marker').count()
            const visibleMarkerCount = await page.locator('.stream-map-country-marker:visible').count()
            const countryEmptyCount = await page.locator('#stream-map-country-list .stream-map-empty').count()
            const streamEmptyCount = await page.locator('#stream-map-stream-list .stream-map-empty').count()
            const countryRowCount = await page.locator('#stream-map-country-list .stream-map-country-row').count()

            assert.equal(state, 'basemap-ready')
            assert.equal(canvasCount, 1)
            assert.equal(controls, 1)
            assert.ok(Number.isFinite(mappedStreams) && mappedStreams >= 0, `${label}: expected a non-negative mapped stream count, got ${mappedText}`)

            if (label === 'country') {
              await page.waitForFunction(() => {
                const map = window.__viewloomCountryRegionMap
                return document.documentElement.classList.contains('stream-map-country-regions-active')
                  && Boolean(map?.getSource?.('viewloom-country-regions'))
                  && Boolean(map?.getLayer?.('viewloom-country-regions-fill'))
                  && Boolean(map?.getLayer?.('viewloom-country-regions-outline'))
              }, null, { timeout: 15000 })

              const regionState = await page.evaluate(() => {
                const map = window.__viewloomCountryRegionMap
                const statusText = (document.querySelector('.stream-map-region-controls__status')?.textContent || '').trim()
                return {
                  active: document.documentElement.classList.contains('stream-map-country-regions-active'),
                  sourceAvailable: Boolean(map?.getSource?.('viewloom-country-regions')),
                  fillLayerAvailable: Boolean(map?.getLayer?.('viewloom-country-regions-fill')),
                  outlineLayerAvailable: Boolean(map?.getLayer?.('viewloom-country-regions-outline')),
                  viewSwitchCount: document.querySelectorAll('[data-map-view]').length,
                  fallbackMarkerCount: document.querySelectorAll('.stream-map-country-marker--region-fallback').length,
                  statusText,
                }
              })
              assert.equal(regionState.active, true, 'country: finalized choropleth mode must be active')
              assert.equal(regionState.sourceAvailable, true, 'country: region GeoJSON source must be installed')
              assert.equal(regionState.fillLayerAvailable, true, 'country: region fill layer must be installed')
              assert.equal(regionState.outlineLayerAvailable, true, 'country: region outline layer must be installed')
              assert.equal(regionState.viewSwitchCount, 0, 'country: retired Markers/Regions A/B switch must stay absent')
              assert.ok(regionState.statusText.length > 0, 'country: region status text must be present')
              assert.equal(regionState.statusText.toLowerCase().includes('unavailable'), false, `country: region renderer reported unavailable: ${regionState.statusText}`)

              if (mappedStreams > 0) {
                assert.ok(countryRowCount > 0, `${label}: ${mappedStreams} mapped streams require at least one country aggregate row`)
              } else {
                assert.equal(markerCount, 0, `${label}: zero mapped streams must not leave stale country markers`)
                assert.ok(countryEmptyCount > 0, `${label}: zero mapped streams require an explicit country empty state`)
                assert.ok(streamEmptyCount > 0, `${label}: zero mapped streams require an explicit stream-list empty state`)
              }
            } else {
              await page.getByRole('heading', { name: 'City view', exact: true }).waitFor({ timeout: 15000 })
              await page.locator('[data-city-places]').waitFor({ timeout: 15000 })
              await page.waitForFunction(() => {
                const rows = [...document.querySelectorAll('[data-city-places] .stream-map-city-place')]
                const referenceRows = rows.filter((row) => row.getAttribute('data-city-geometry') === 'reference_point').length
                return document.querySelectorAll('.stream-map-city-reference-marker').length === referenceRows
              }, null, { timeout: 15000 })

              const cityState = await page.evaluate(() => {
                const countryList = document.getElementById('stream-map-country-list')
                const countryCard = countryList?.closest('.stream-map-results-card')
                const cityPlaces = document.querySelector('[data-city-places]')
                const cityRows = [...(cityPlaces?.querySelectorAll('.stream-map-city-place') || [])]
                const referencePointRows = cityRows.filter((row) => row.getAttribute('data-city-geometry') === 'reference_point').length
                const listOnlyRows = cityRows.filter((row) => row.getAttribute('data-city-geometry') === 'list_only').length
                const invalidGeometryRows = cityRows.length - referencePointRows - listOnlyRows
                const cityReferenceMarkers = [...document.querySelectorAll('.stream-map-city-reference-marker')]
                const cityButton = document.querySelector('[data-geography-mode="city"]')
                const currentButton = [...document.querySelectorAll('.stream-map-geography-options button')]
                  .find((button) => (button.textContent || '').trim() === 'Current / IRL')
                const cityPayload = window.__viewloomStreamMapCityPayload
                return {
                  cityMode: document.documentElement.classList.contains('stream-map-city-mode'),
                  countryCardHidden: Boolean(countryCard?.hidden),
                  cityPlacesPresent: Boolean(cityPlaces),
                  cityPlaceRows: cityRows.length,
                  cityEmptyCount: cityPlaces?.querySelectorAll('.stream-map-empty').length || 0,
                  currentLocationCount: (document.getElementById('stream-map-current-count')?.textContent || '').trim(),
                  publicCityUiActivated: cityPayload?.publicCityUiActivated,
                  currentLocationActivated: cityPayload?.currentLocationActivated,
                  cityButtonPressed: cityButton?.getAttribute('aria-pressed'),
                  currentButtonDisabled: Boolean(currentButton?.disabled),
                  currentButtonAriaDisabled: currentButton?.getAttribute('aria-disabled'),
                  referencePointRows,
                  listOnlyRows,
                  invalidGeometryRows,
                  cityReferenceMarkerCount: cityReferenceMarkers.length,
                  cityReferenceRoles: cityReferenceMarkers.map((marker) => marker.getAttribute('data-reference-role')),
                }
              })
              assert.equal(cityState.cityMode, true, 'city: City mode class must be active')
              assert.equal(cityState.countryCardHidden, true, 'city: Country aggregate card must be hidden')
              assert.equal(cityState.cityPlacesPresent, true, 'city: accepted City locations panel must be rendered')
              assert.ok(cityState.cityPlaceRows > 0 || cityState.cityEmptyCount > 0, 'city: accepted City locations panel must show rows or an explicit empty state')
              assert.equal(cityState.currentLocationCount, '0', 'city: current-location placement must remain zero')
              assert.equal(visibleMarkerCount, 0, 'city: Country-centroid markers must stay hidden; City coordinates are not inferred')
              assert.equal(cityState.publicCityUiActivated, true, 'city: production City API must report public UI activation')
              assert.equal(cityState.currentLocationActivated, false, 'city: production City API must keep Current / IRL inactive')
              assert.equal(cityState.cityButtonPressed, 'true', 'city: City geography control must be active')
              assert.equal(cityState.currentButtonDisabled, true, 'city: Current / IRL control must remain disabled')
              assert.equal(cityState.currentButtonAriaDisabled, 'true', 'city: Current / IRL control must remain aria-disabled')
              assert.equal(cityState.invalidGeometryRows, 0, 'city: every City row must be reference_point or list_only')
              assert.equal(cityState.cityPlaceRows, cityState.referencePointRows + cityState.listOnlyRows, 'city: City geometry states must reconcile to the visible City list')
              assert.equal(cityState.cityReferenceMarkerCount, cityState.referencePointRows, 'city: map markers must match only reviewed reference_point rows')
              assert.ok(cityState.cityReferenceRoles.every((role) => role === 'city_aggregate_reference'), 'city: every map point must be a City aggregate reference')
            }

            await page.screenshot({ path: `${process.env.GITHUB_WORKSPACE}/${process.env.ARTIFACT_DIR}/${label}.png`, fullPage: true })
            return { state, canvasCount, controls, markerCount, visibleMarkerCount, mappedStreams, countryRowCount, countryEmptyCount, streamEmptyCount }
          }

          try {
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 })
            const country = await snapshot('country')

            const cityButton = page.getByRole('button', { name: 'City', exact: true })
            await Promise.all([
              page.waitForURL((next) => next.searchParams.get('geography') === 'city', { timeout: 15000 }),
              cityButton.click(),
            ])
            const city = await snapshot('city')

            assert.equal(pageErrors.length, 0, `page errors: ${pageErrors.join(' | ')}`)
            assert.equal(consoleErrors.length, 0, `console errors: ${consoleErrors.join(' | ')}`)
            const result = { url, country, city, pageErrors, consoleErrors }
            console.log(JSON.stringify(result))
            await import('node:fs').then(({ writeFileSync }) => writeFileSync(
              `${process.env.GITHUB_WORKSPACE}/${process.env.ARTIFACT_DIR}/result.json`,
              `${JSON.stringify(result, null, 2)}\n`,
            ))
          } catch (error) {
            await page.screenshot({ path: `${process.env.GITHUB_WORKSPACE}/${process.env.ARTIFACT_DIR}/failure.png`, fullPage: true }).catch(() => {})
            const diagnostics = await page.evaluate(() => {
              const map = window.__viewloomCountryRegionMap
              const countryList = document.getElementById('stream-map-country-list')
              const countryCard = countryList?.closest('.stream-map-results-card')
              return {
                href: location.href,
                regionStatus: (document.querySelector('.stream-map-region-controls__status')?.textContent || '').trim(),
                regionsActive: document.documentElement.classList.contains('stream-map-country-regions-active'),
                sourceAvailable: Boolean(map?.getSource?.('viewloom-country-regions')),
                fillLayerAvailable: Boolean(map?.getLayer?.('viewloom-country-regions-fill')),
                outlineLayerAvailable: Boolean(map?.getLayer?.('viewloom-country-regions-outline')),
                countryRows: document.querySelectorAll('#stream-map-country-list .stream-map-country-row').length,
                cityMode: document.documentElement.classList.contains('stream-map-city-mode'),
                cityPlacesPresent: Boolean(document.querySelector('[data-city-places]')),
                countryCardHidden: Boolean(countryCard?.hidden),
                publicCityUiActivated: window.__viewloomStreamMapCityPayload?.publicCityUiActivated,
                currentLocationActivated: window.__viewloomStreamMapCityPayload?.currentLocationActivated,
                cityReferenceMarkers: document.querySelectorAll('.stream-map-city-reference-marker').length,
              }
            }).catch(() => ({}))
            console.error(JSON.stringify({ diagnostics, pageErrors, consoleErrors }))
            throw error
          } finally {
            await browser.close()
          }
          NODE
          cd /tmp/viewloom-prod-smoke
          node smoke.mjs
      - name: Upload production smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twitch-map-production-browser-smoke
          path: artifacts/twitch-map-production-browser-smoke/
          if-no-files-found: warn
          retention-days: 7
