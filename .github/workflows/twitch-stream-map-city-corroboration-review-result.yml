name: Twitch Stream Map City Corroboration Review Result

on:
  pull_request:
    paths:
      - 'docs/audits/twitch-stream-map-city-corroboration-review-result-2026-08-29.json'
      - 'scripts/verify-twitch-stream-map-city-corroboration-review-result.mjs'
      - '.github/workflows/twitch-stream-map-city-corroboration-review-result.yml'
      - 'docs/audits/twitch-stream-map-city-corroboration-queue-2026-08-28.json'
      - 'apps/web/functions/api/twitch-stream-map-reviewed-evidence.mjs'
  push:
    branches:
      - main
    paths:
      - 'docs/audits/twitch-stream-map-city-corroboration-review-result-2026-08-29.json'
      - 'scripts/verify-twitch-stream-map-city-corroboration-review-result.mjs'
      - '.github/workflows/twitch-stream-map-city-corroboration-review-result.yml'
      - 'docs/audits/twitch-stream-map-city-corroboration-queue-2026-08-28.json'
      - 'apps/web/functions/api/twitch-stream-map-reviewed-evidence.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify City corroboration review result
        run: node scripts/verify-twitch-stream-map-city-corroboration-review-result.mjs
