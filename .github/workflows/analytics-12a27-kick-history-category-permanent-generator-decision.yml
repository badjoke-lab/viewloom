name: Analytics 12A27 Kick History Permanent Generator Decision

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a27-kick-history-category-permanent-generator-decision.yml'
      - 'docs/audits/12a27-kick-history-category-permanent-generator-decision.json'
      - 'scripts/verify-12a27-kick-history-category-permanent-generator-decision.mjs'

permissions:
  contents: read

concurrency:
  group: analytics-12a27-kick-history-permanent-generator-decision-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify 12A27 permanent generator decision
        run: node scripts/verify-12a27-kick-history-category-permanent-generator-decision.mjs

      - name: Verify exact decision scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          expected=(
            '.github/workflows/analytics-12a27-kick-history-category-permanent-generator-decision.yml'
            'docs/audits/12a27-kick-history-category-permanent-generator-decision.json'
            'scripts/verify-12a27-kick-history-category-permanent-generator-decision.mjs'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$path"
          done

      - name: Revalidate accepted production PASS and dormant generator baseline
        run: |
          node scripts/verify-12a26-kick-history-category-reprobe-pass.mjs
          node scripts/verify-12a15-kick-history-category-aggregate-generator.mjs
          python3 scripts/test-12a15-kick-history-category-aggregate.py
          pnpm typecheck:collectors
          pnpm verify:collectors
          pnpm typecheck:web
          pnpm build:web

      - name: Verify repository-only decision surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/analytics-12a27-kick-history-category-permanent-generator-decision.yml').read_text()
          forbidden = [
              '\n  ' + 'push:',
              '\n  workflow_' + 'dispatch:',
              '\n  sched' + 'ule:',
              'CLOUDFLARE_' + 'API_TOKEN',
              'CLOUDFLARE_' + 'ACCOUNT_ID',
              'wrangler@4 ' + 'deploy',
              'actions/' + 'upload-artifact',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'production-capable decision surface remains: {token}')
          PY

      - name: Publish decision boundary
        if: always()
        run: |
          {
            echo '## Kick History Category — 12A27 permanent generator decision'
            echo
            echo '- Decision: YES, authorize exactly one dormant permanent-generator integration package only'
            echo '- Latest completed production rows_read: 16,117 / 250,000 max = PASS'
            echo '- One-shot probe authority: consumed and retired'
            echo '- Current collector runtime: unchanged'
            echo '- Kick wrangler runtime config: unchanged'
            echo '- Package merge may change production runtime: no'
            echo '- New cron/backfill/raw-retention change: not authorized'
            echo '- History Category API/UI: not authorized'
            echo '- Twitch/cross-provider rollout: not authorized'
            echo '- Runtime enablement: separate later decision required'
            echo '- Production deployment: separate later gate required'
            echo '- Next gate: build one repository-only dormant integration package'
          } >> "$GITHUB_STEP_SUMMARY"
