name: Analytics 12A6 Twitch Day Flow Category Public Production Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a6-twitch-day-flow-category-public-production-evidence.yml'
      - '.github/workflows/analytics-12a6-twitch-day-flow-category-public-cutover.yml'
      - 'docs/audits/12a6-twitch-day-flow-category-public-production-evidence.json'
      - 'docs/audits/12a6-twitch-day-flow-category-public-production-acceptance.json'
      - 'scripts/verify-12a6-twitch-day-flow-category-public-production-evidence.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a6-twitch-day-flow-category-public-production-evidence.yml'
      - '.github/workflows/analytics-12a6-twitch-day-flow-category-public-cutover.yml'
      - 'docs/audits/12a6-twitch-day-flow-category-public-production-evidence.json'
      - 'docs/audits/12a6-twitch-day-flow-category-public-production-acceptance.json'
      - 'scripts/verify-12a6-twitch-day-flow-category-public-production-evidence.mjs'

permissions:
  contents: read

concurrency:
  group: analytics-12a6-twitch-day-flow-category-public-production-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Verify evidence-acceptance scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(\.github/workflows/analytics-12a6-twitch-day-flow-category-public-production-evidence\.yml|\.github/workflows/analytics-12a6-twitch-day-flow-category-public-cutover\.yml|docs/audits/12a6-twitch-day-flow-category-public-production-evidence\.json|docs/audits/12a6-twitch-day-flow-category-public-production-acceptance\.json|scripts/verify-12a6-twitch-day-flow-category-public-production-evidence\.mjs)$'
          test "${#changed[@]}" -eq 5
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected public evidence-acceptance change: $file" >&2; exit 1; }
          done
      - name: Verify frozen public production evidence
        run: node scripts/verify-12a6-twitch-day-flow-category-public-production-evidence.mjs
      - name: Verify retained public Day Flow boundaries
        working-directory: apps/web
        run: |
          node scripts/verify-production-source.mjs
          node scripts/verify-dayflow-qa.mjs
          cd ../..
          node scripts/verify-quality-u10d-analysis-coherence.mjs
          node scripts/verify-quality-u10g-architecture.mjs
      - name: Typecheck and build unchanged product
        run: |
          pnpm --filter @viewloom/web typecheck:app
          pnpm --filter @viewloom/web typecheck:functions
          pnpm build:web
