name: One-time 12A5 Twitch Replacement Audit Runner Query Fix

on:
  push:
    branches:
      - 'work-659-twitch-replacement-audit-runner-query-fix'
    paths:
      - '.github/workflows/one-time-12a5-twitch-replacement-audit-runner-query-fix.yml'

permissions:
  contents: write

concurrency:
  group: one-time-12a5-twitch-replacement-audit-runner-query-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact runner query repair
        run: node scripts/apply-12a5-twitch-replacement-audit-runner-query-fix.mjs
      - name: Verify repaired syntax and pure regression tests
        run: |
          node --check scripts/run-12a5-twitch-replacement-seven-day-audit.mjs
          node scripts/test-12a5-twitch-replacement-seven-day-audit.mjs
      - name: Retire transformer and workflow
        run: |
          rm scripts/apply-12a5-twitch-replacement-audit-runner-query-fix.mjs
          rm .github/workflows/one-time-12a5-twitch-replacement-audit-runner-query-fix.yml
      - name: Verify bounded diff
        run: |
          git diff --check
          git diff --name-only | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/one-time-12a5-twitch-replacement-audit-runner-query-fix.yml
          scripts/apply-12a5-twitch-replacement-audit-runner-query-fix.mjs
          scripts/run-12a5-twitch-replacement-seven-day-audit.mjs
          scripts/test-12a5-twitch-replacement-seven-day-audit.mjs
          EOF
          diff -u /tmp/expected.txt /tmp/actual.txt
      - name: Commit repaired runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix replacement audit slot query scope'
          git push origin HEAD:work-659-twitch-replacement-audit-runner-query-fix
