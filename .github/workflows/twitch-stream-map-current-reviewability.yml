name: Twitch Stream Map Current Reviewability

on:
  pull_request:
    paths:
      - 'tools/twitch-stream-map-current-location/reviewability.mjs'
      - 'docs/product/stream-map-current-location-reviewability-contract-v0.1.md'
      - 'docs/audits/twitch-stream-map-current-reviewability-fixture-v0.1.json'
      - 'scripts/verify-twitch-stream-map-current-reviewability.mjs'
      - '.github/workflows/twitch-stream-map-current-reviewability.yml'
  push:
    branches: [main]
    paths:
      - 'tools/twitch-stream-map-current-location/reviewability.mjs'
      - 'docs/product/stream-map-current-location-reviewability-contract-v0.1.md'
      - 'docs/audits/twitch-stream-map-current-reviewability-fixture-v0.1.json'
      - 'scripts/verify-twitch-stream-map-current-reviewability.mjs'
      - '.github/workflows/twitch-stream-map-current-reviewability.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Current / IRL reviewability gate
        run: node scripts/verify-twitch-stream-map-current-reviewability.mjs
