name: Category rollout policy

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: &category_paths
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/README.md'
      - '.github/pull_request_template.md'
      - 'docs/product/current-roadmap.md'
      - 'docs/product/current-schedule.md'
      - 'docs/product/twitch-replacement-seven-day-audit-spec.md'
      - 'docs/product/category-capture-permanent-rollout-spec.md'
      - 'docs/product/category-capture-permanent-rollout-plan.md'
      - 'docs/audits/12a2-current-gate-state.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-*.json'
      - 'docs/audits/12a5-twitch-category-source-v2-*.json'
      - 'docs/audits/12a5-twitch-heatmap-category-filter-hidden-*.json'
      - 'docs/work-in-progress/phase12a4-category-parallel-execution.md'
      - 'docs/operations/development-and-deployment-policy.md'
      - 'execution-packages/twitch-category-source-v2-observation/**'
      - 'workers/shared/category-capture-v2-candidate.ts'
      - 'workers/collector-twitch/**'
      - 'workers/collector-kick/**'
      - 'db/d1/**'
      - 'apps/web/**'
      - 'scripts/run-12a5-twitch-replacement-seven-day-audit.mjs'
      - 'scripts/test-12a5-twitch-replacement-seven-day-audit.mjs'
      - 'scripts/run-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis.mjs'
      - 'scripts/verify-12a5-twitch-replacement-audit-checkpoint-*.mjs'
      - 'scripts/test-12a5-twitch-category-source-v2-completeness-candidate.mjs'
      - 'scripts/verify-12a5-twitch-category-source-v2-completeness-package.mjs'
      - 'scripts/verify-12a5-twitch-category-source-v2-observation-*.mjs'
      - 'scripts/verify-12a5-twitch-category-source-v2-semantic-clock-decision.mjs'
      - 'scripts/verify-12a5-twitch-category-source-v2-stability-clock-acceptance.mjs'
      - 'scripts/verify-category-rollout-policy.mjs'
      - 'scripts/verify-development-policy.mjs'
      - '.github/workflows/analytics-12a5-twitch-*.yml'
      - '.github/workflows/category-rollout-policy.yml'
      - '.github/workflows/development-policy.yml'
  push:
    branches: [main]
    paths: *category_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify original checkpoint evidence and retirement
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-retirement.mjs
      - name: Verify accepted diagnosis query package
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package.mjs
      - name: Verify diagnosis evidence and retired execution path
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-evidence-retirement.mjs
      - name: Verify diagnosis recovery decision
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-decision.mjs
      - name: Verify accepted dormant category source v2 package
        run: node scripts/verify-12a5-twitch-category-source-v2-completeness-package.mjs
      - name: Verify successful category source v2 observation evidence
        run: node scripts/verify-12a5-twitch-category-source-v2-observation-success-evidence.mjs
      - name: Verify temporary observation execution path retirement
        run: node scripts/verify-12a5-twitch-category-source-v2-observation-execution-path-retirement.mjs
      - name: Verify semantic and new clock decision
        run: node scripts/verify-12a5-twitch-category-source-v2-semantic-clock-decision.mjs
      - name: Verify accepted revised stability clock
        run: node scripts/verify-12a5-twitch-category-source-v2-stability-clock-acceptance.mjs
      - name: Verify current category rollout contract
        run: node scripts/verify-category-rollout-policy.mjs
      - name: Verify current development policy
        run: node scripts/verify-development-policy.mjs
