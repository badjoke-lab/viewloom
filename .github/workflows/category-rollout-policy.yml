name: Category rollout policy

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: &category_paths
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/README.md'
      - '.github/pull_request_template.md'
      - 'docs/product/current-roadmap.md'
      - 'docs/product/current-schedule.md'
      - 'docs/product/twitch-replacement-seven-day-audit-spec.md'
      - 'docs/product/category-capture-permanent-rollout-spec.md'
      - 'docs/product/category-capture-permanent-rollout-plan.md'
      - 'docs/audits/12a2-current-gate-state.json'
      - 'docs/audits/12a4-kick-permanent-category-final-acceptance.json'
      - 'docs/audits/12a5-twitch-permanent-category-recovery-acceptance.json'
      - 'docs/audits/12a5-twitch-replacement-seven-day-audit-package-contract.json'
      - 'docs/audits/12a5-twitch-replacement-seven-day-audit-runner-repair-acceptance.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-package-contract.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-package-acceptance.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-trigger-contract.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-evidence.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-retirement.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package-contract.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package-acceptance.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-execution-package-contract.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-execution-package-acceptance.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-trigger-contract.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-trigger.json'
      - 'docs/audits/12a5-twitch-heatmap-category-filter-hidden-*.json'
      - 'docs/work-in-progress/phase12a4-category-parallel-execution.md'
      - 'docs/operations/development-and-deployment-policy.md'
      - 'workers/collector-twitch/**'
      - 'workers/collector-kick/**'
      - 'db/d1/**'
      - 'apps/web/**'
      - 'scripts/run-12a5-twitch-replacement-seven-day-audit.mjs'
      - 'scripts/test-12a5-twitch-replacement-seven-day-audit.mjs'
      - 'scripts/run-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis.mjs'
      - 'scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package.mjs'
      - 'scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-execution-package.mjs'
      - 'scripts/verify-12a5-twitch-replacement-audit-checkpoint-retirement.mjs'
      - 'scripts/verify-category-rollout-policy.mjs'
      - 'scripts/verify-development-policy.mjs'
      - '.github/workflows/analytics-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package.yml'
      - '.github/workflows/analytics-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-execution.yml'
      - '.github/workflows/category-rollout-policy.yml'
  push:
    branches: [main]
    paths: *category_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: diagnosis-trigger
        name: Detect exact checkpoint-failure diagnosis trigger
        run: |
          path='docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-trigger.json'
          if test -f "$path"; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify checkpoint evidence and retirement
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-retirement.mjs
      - name: Verify accepted checkpoint-failure diagnosis query package
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-package.mjs
      - name: Verify accepted checkpoint-failure diagnosis execution package before trigger
        if: steps.diagnosis-trigger.outputs.present != 'true'
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-execution-package.mjs
      - name: Verify current category rollout contract before trigger
        if: steps.diagnosis-trigger.outputs.present != 'true'
        run: node scripts/verify-category-rollout-policy.mjs
      - name: Verify current development policy before trigger
        if: steps.diagnosis-trigger.outputs.present != 'true'
        run: node scripts/verify-development-policy.mjs
      - name: Verify exact one-file checkpoint-failure diagnosis trigger
        if: steps.diagnosis-trigger.outputs.present == 'true'
        run: |
          if test '${{ github.event_name }}' = 'pull_request'; then
            git fetch --no-tags --depth=1 origin main
            changed="$(git diff --name-only origin/main...HEAD)"
            test "$changed" = 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-trigger.json'
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const packageContract = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-execution-package-contract.json', 'utf8'))
          const packageAcceptance = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-execution-package-acceptance.json', 'utf8'))
          const triggerContract = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-trigger-contract.json', 'utf8'))
          const trigger = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-trigger.json', 'utf8'))
          if (packageContract.status !== 'accepted' || packageAcceptance.status !== 'accepted' || triggerContract.status !== 'accepted') throw new Error('diagnosis_package_not_accepted')
          if (trigger.schemaVersion !== triggerContract.trigger.schemaVersion) throw new Error('trigger_schema_mismatch')
          if (trigger.status !== 'armed' || trigger.provider !== 'twitch' || trigger.mode !== 'checkpoint_failure_diagnosis' || trigger.oneTime !== true) throw new Error('trigger_identity_invalid')
          if (trigger.confirmation !== 'RUN_TWITCH_CHECKPOINT_FAILURE_DIAGNOSIS') throw new Error('trigger_confirmation_invalid')
          if (trigger.packagePr !== 672 || trigger.packageMergeSha !== '02ece37cc70de4faa5251600a465d4e68d058f29' || trigger.acceptancePr !== 673) throw new Error('accepted_package_identity_mismatch')
          if (trigger.packagePr !== packageContract.acceptance.packagePr || trigger.packageMergeSha !== packageContract.acceptance.packageMergeSha || trigger.acceptancePr !== packageContract.acceptance.acceptancePr) throw new Error('package_contract_identity_mismatch')
          if (trigger.packagePr !== triggerContract.acceptedPackageIdentity.packagePr || trigger.packageMergeSha !== triggerContract.acceptedPackageIdentity.packageMergeSha || trigger.acceptancePr !== triggerContract.acceptedPackageIdentity.acceptancePr) throw new Error('trigger_contract_identity_mismatch')
          const start = Date.parse(String(trigger.startAt ?? ''))
          const now = Date.now()
          if (!Number.isFinite(start) || start < now - 10 * 60_000 || start > now + 3 * 3_600_000) throw new Error('trigger_start_out_of_bounds')
          NODE
