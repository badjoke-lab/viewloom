name: Category rollout policy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/category-rollout-policy.yml'

permissions:
  contents: read
  actions: read

jobs:
  inspect-kick-release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and extract tail release observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/8617001865/zip" \
            -o /tmp/evidence.zip
          mkdir -p /tmp/evidence
          unzip -q /tmp/evidence.zip -d /tmp/evidence
          find /tmp/evidence -type f -name '*.json' | sort | grep -Ev '/observe-[1-5]/' | while IFS= read -r file; do
            jq -c --arg file "${file#/tmp/evidence/}" '{file:$file,schemaVersion,observedAt,outcome,latestSnapshot:.data.latestSnapshot,latestCategorySnapshot:.data.latestCategorySnapshot,counts:{dictionary:.data.kickDictionaryRows,leakage:.data.providerLeakageRows,categorySinceStart:.data.categoryPayloadRowsSinceStart,normalSinceStart:.data.normalPayloadRowsSinceStart},gates,deploy,observations,rollback,twitch}' "$file"
          done
