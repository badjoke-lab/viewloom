name: Category rollout policy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/category-rollout-policy.yml'

permissions:
  contents: read
  actions: read

jobs:
  inspect-kick-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List recent main push runs for the Kick release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/analytics-12a4-kick-permanent-category-release.yml/runs?branch=main&event=push&per_page=5" \
            | jq -c '.workflow_runs[] | {id,run_number,status,conclusion,head_sha,event,created_at,updated_at,html_url}'
