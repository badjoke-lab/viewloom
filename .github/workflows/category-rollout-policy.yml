name: Category rollout policy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/category-rollout-policy.yml'

permissions:
  contents: read
  actions: read

jobs:
  inspect-kick-release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and extract final release verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/8617001865/zip" \
            -o /tmp/evidence.zip
          mkdir -p /tmp/evidence
          unzip -q /tmp/evidence.zip -d /tmp/evidence
          find /tmp/evidence -type f -name '*.json' -print0 | sort -z | while IFS= read -r -d '' file; do
            jq -c --arg file "${file#/tmp/evidence/}" '{file:$file,schemaVersion,observedAt,outcome,identity,bindings,latest:{bucket:.data.latestSnapshot.bucket_minute,collectedAt:.data.latestSnapshot.collected_at,streams:.data.latestSnapshot.stream_count,viewers:.data.latestSnapshot.total_viewers,sourceMode:.data.latestSnapshot.source_mode,contract:.data.latestSnapshot.category_contract_version,categoryBucket:.data.latestCategorySnapshot.category_bucket_minute,categoryStreams:.data.latestCategorySnapshot.category_stream_count,categoryViewers:.data.latestCategorySnapshot.category_total_viewers,categorySourceMode:.data.latestCategorySnapshot.category_source_mode},counts:{dictionary:.data.kickDictionaryRows,leakage:.data.providerLeakageRows,categorySinceStart:.data.categoryPayloadRowsSinceStart,normalSinceStart:.data.normalPayloadRowsSinceStart},gates,deploy,observations,rollback,twitch}' "$file"
          done
