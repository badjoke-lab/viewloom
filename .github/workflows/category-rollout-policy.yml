name: Category rollout policy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/category-rollout-policy.yml'

permissions:
  contents: read
  actions: read

jobs:
  inspect-pr648-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect final checks for PR 648 head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 1e45c208ada0cb235266b2dd428b8052fb51523c
        run: |
          set -euo pipefail
          runs="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100")"
          echo "$runs" | jq -c '.workflow_runs[] | select(.name == "Category rollout policy" or .name == "Analytics 12A4 Kick Permanent Category Release" or .name == "Development policy" or .name == "Web build" or .name == "Web checks") | {id,name,status,conclusion,run_number,head_sha,created_at,updated_at}'
          for run_id in $(echo "$runs" | jq -r '.workflow_runs[] | select(.name == "Category rollout policy" or .name == "Analytics 12A4 Kick Permanent Category Release") | .id'); do
            echo "RUN_DETAIL ${run_id}"
            curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              | jq -c '.jobs[] | {id,name,status,conclusion,steps:[.steps[]? | {name,status,conclusion}]}'
          done
