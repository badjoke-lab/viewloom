name: Category rollout policy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/category-rollout-policy.yml'

permissions:
  contents: read
  actions: read

jobs:
  inspect-kick-release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and print sanitized release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/8617001865/zip" \
            -o /tmp/evidence.zip
          mkdir -p /tmp/evidence
          unzip -q /tmp/evidence.zip -d /tmp/evidence
          find /tmp/evidence -type f -maxdepth 2 -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
