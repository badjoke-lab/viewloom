name: Category rollout policy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/category-rollout-policy.yml'

permissions:
  contents: read
  actions: read

jobs:
  inspect-final-kick-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List post-minimum Kick observation runs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/analytics-12a4-kick-permanent-category-observation.yml/runs?branch=main&event=schedule&per_page=12"
          runs="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$runs_url")"
          echo "$runs" | jq -c '.workflow_runs[] | {id,run_number,status,conclusion,head_sha,created_at,updated_at,html_url}'
          latest_ids="$(echo "$runs" | jq -r '.workflow_runs[0:8][]?.id')"
          for run_id in $latest_ids; do
            echo "RUN_DETAIL ${run_id}"
            curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=20" \
              | jq -c '.jobs[] | {id,name,status,conclusion,started_at,completed_at,steps:[.steps[]? | {name,status,conclusion}]}'
            curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=20" \
              | jq -c '.artifacts[]? | {id,name,size_in_bytes,expired,created_at,updated_at,digest}'
          done
