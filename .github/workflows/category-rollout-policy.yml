name: Category rollout policy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/category-rollout-policy.yml'
      - '.github/workflows/apply-category-package-acceptance-v30.yml'
      - 'scripts/apply-12a4-category-package-acceptance-v30.mjs'
      - 'scripts/fix-category-acceptance-verifiers-v30.mjs'
      - 'docs/audits/12a4-category-package-acceptance-staging.json'
      - 'docs/audits/12a4-kick-permanent-category-decision-contract.json'
      - 'docs/audits/12a4-kick-permanent-category-capture-package-contract.json'
      - 'docs/audits/12a5-twitch-heatmap-category-filter-hidden-decision-contract.json'
      - 'docs/audits/12a5-twitch-heatmap-category-filter-hidden-package-contract.json'
      - 'docs/work-in-progress/phase12a4-category-parallel-execution.md'
      - 'docs/audits/12a4-kick-permanent-category-capture-package-contract.json'
      - 'docs/audits/12a5-twitch-heatmap-category-filter-hidden-package-contract.json'

concurrency:
  group: category-acceptance-v30-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/accept-category-parallel-packages-v30'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/accept-category-parallel-packages-v30
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse one-shot updaters
        run: |
          node --check scripts/apply-12a4-category-package-acceptance-v30.mjs
          node --check scripts/fix-category-acceptance-verifiers-v30.mjs
      - name: Apply canonical package acceptance
        run: |
          node scripts/apply-12a4-category-package-acceptance-v30.mjs
          node scripts/fix-category-acceptance-verifiers-v30.mjs
      - name: Verify canonical rollout policy
        run: node scripts/verify-category-rollout-policy.mjs
      - name: Verify accepted Kick implementation package
        run: node scripts/verify-12a4-kick-permanent-category-package.mjs
      - name: Verify accepted hidden Twitch API package
        run: node scripts/verify-12a5-twitch-heatmap-category-api-package.mjs
      - name: Verify accepted Kick release package
        run: node scripts/verify-12a4-kick-permanent-category-release-package.mjs
      - name: Run Kick release fixtures
        run: node scripts/test-12a4-kick-permanent-category-release.mjs
      - name: Verify accepted hidden Twitch controls
        run: node scripts/verify-12a5-twitch-heatmap-category-controls-package.mjs
      - name: Publish canonical acceptance files
        run: |
          rm -f \
            scripts/apply-12a4-category-package-acceptance-v30.mjs \
            scripts/fix-category-acceptance-verifiers-v30.mjs \
            docs/audits/12a4-category-package-acceptance-staging.json \
            docs/audits/12a4-category-package-acceptance-verifier-failure.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            docs/audits/12a2-current-gate-state.json \
            docs/audits/12a4-kick-permanent-category-release-contract.json \
            docs/audits/12a5-twitch-heatmap-category-filter-hidden-controls-contract.json \
            docs/product/current-roadmap.md \
            docs/product/current-schedule.md \
            docs/work-in-progress/phase12a4-category-parallel-execution.md \
            scripts/verify-category-rollout-policy.mjs \
            scripts/verify-12a4-kick-permanent-category-package.mjs \
            scripts/verify-12a5-twitch-heatmap-category-api-package.mjs \
            scripts/verify-12a4-kick-permanent-category-release-package.mjs \
            scripts/verify-12a5-twitch-heatmap-category-controls-package.mjs
          git add -A -- \
            scripts/apply-12a4-category-package-acceptance-v30.mjs \
            scripts/fix-category-acceptance-verifiers-v30.mjs \
            docs/audits/12a4-category-package-acceptance-staging.json \
            docs/audits/12a4-category-package-acceptance-verifier-failure.txt
          git diff --cached --stat
          git diff --cached --quiet && { echo 'acceptance updater produced no diff' >&2; exit 1; }
          git commit -m "Accept Kick release and hidden Twitch controls"
          git push origin HEAD:agent/accept-category-parallel-packages-v30
