name: Apply Twitch Recovery Package Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-twitch-recovery-package-acceptance.yml'
      - 'scripts/apply-12a5-twitch-recovery-package-acceptance.mjs'
      - 'docs/audits/12a5-twitch-permanent-category-recovery-contract.json'

permissions:
  contents: write

concurrency:
  group: twitch-recovery-package-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/accept-twitch-permanent-category-recovery-package'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/accept-twitch-permanent-category-recovery-package
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse bounded package acceptance updater
        run: node --check scripts/apply-12a5-twitch-recovery-package-acceptance.mjs
      - name: Apply package acceptance state
        run: node scripts/apply-12a5-twitch-recovery-package-acceptance.mjs
      - name: Verify category rollout policy
        run: node scripts/verify-category-rollout-policy.mjs
      - name: Verify accepted recovery package
        run: node scripts/verify-12a5-twitch-permanent-category-recovery-package.mjs
      - name: Publish package acceptance files
        run: |
          rm -f scripts/apply-12a5-twitch-recovery-package-acceptance.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            docs/audits/12a2-current-gate-state.json \
            docs/product/current-roadmap.md \
            docs/product/current-schedule.md \
            docs/work-in-progress/phase12a4-category-parallel-execution.md \
            scripts/verify-category-rollout-policy.mjs
          git add -A -- scripts/apply-12a5-twitch-recovery-package-acceptance.mjs
          git diff --cached --stat
          git diff --cached --quiet && { echo 'package acceptance updater produced no diff' >&2; exit 1; }
          git commit -m 'Accept dormant Twitch recovery package'
          git push origin HEAD:agent/accept-twitch-permanent-category-recovery-package
