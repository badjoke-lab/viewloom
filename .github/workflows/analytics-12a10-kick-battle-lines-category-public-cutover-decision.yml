name: Analytics 12A10 Kick Battle Lines Category Public Cutover Decision

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a10-kick-battle-lines-category-public-cutover-decision.yml'
      - 'docs/audits/12a10-kick-battle-lines-category-public-cutover-decision.json'
      - 'scripts/verify-12a10-kick-battle-lines-category-public-cutover-decision.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a10-kick-battle-lines-category-public-cutover-decision.yml'
      - 'docs/audits/12a10-kick-battle-lines-category-public-cutover-decision.json'
      - 'scripts/verify-12a10-kick-battle-lines-category-public-cutover-decision.mjs'

permissions:
  contents: read

concurrency:
  group: analytics-12a10-kick-battle-lines-category-public-cutover-decision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Verify exact three-file decision scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(\.github/workflows/analytics-12a10-kick-battle-lines-category-public-cutover-decision\.yml|docs/audits/12a10-kick-battle-lines-category-public-cutover-decision\.json|scripts/verify-12a10-kick-battle-lines-category-public-cutover-decision\.mjs)$'
          test "${#changed[@]}" -eq 3
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected public-cutover decision change: $file" >&2; exit 1; }
          done
      - name: Verify public-cutover decision authority
        run: node scripts/verify-12a10-kick-battle-lines-category-public-cutover-decision.mjs
      - name: Verify hidden candidate and permanent evidence remain authoritative
        run: |
          node scripts/verify-12a10-kick-battle-lines-category-hidden-production-evidence.mjs
          node scripts/verify-12a10-kick-battle-lines-category-candidate.mjs
          cd apps/web
          node scripts/verify-battle-lines-core.mjs
          node scripts/verify-kick-battle-lines-category-candidate.mjs
      - name: Verify retained architecture and production boundaries
        run: |
          node scripts/verify-quality-u10g-architecture.mjs
          node scripts/verify-quality-u10d-analysis-coherence.mjs
          cd apps/web
          node scripts/verify-production-source.mjs
      - name: Typecheck and build unchanged product
        run: |
          pnpm typecheck:web
          pnpm build:web
      - name: Publish decision boundary
        if: always()
        run: |
          {
            echo '## Kick Battle Lines Category public-cutover decision'
            echo
            echo '- Hidden production acceptance: #819 / PR #820'
            echo '- Decision: authorize public Kick Battle Lines Category on the normal route'
            echo '- Accepted semantics: unchanged from hidden candidate'
            echo '- Default Category: All'
            echo '- Filter order: category -> candidate compaction -> Top N -> Recommended Battle scoring'
            echo '- Point states: observed / outside_category / category_unavailable / offline / not_observed / missing'
            echo '- Unknown category: zero selected-category lines/battles; no global substitution'
            echo '- Mobile requirement: 390px no overflow; Category target >=44px'
            echo '- Twitch Battle Lines Category controls: forbidden'
            echo '- Production acceptance after public implementation: required'
            echo '- Kick History Category: not authorized'
          } >> "$GITHUB_STEP_SUMMARY"
