name: Analytics 12A20/12A21 Kick History Category Re-probe Retired

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a20-kick-history-category-reprobe-execution.yml'
      - 'docs/audits/12a20-kick-history-category-reprobe-trigger.json'
      - 'docs/audits/12a22-kick-history-category-reprobe-production-failure.json'
      - 'scripts/verify-12a22-kick-history-category-reprobe-failure.mjs'

permissions:
  contents: read

concurrency:
  group: analytics-12a20-kick-history-category-reprobe-retired-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  retired-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify 12A22 failure freeze and authority retirement
        run: node scripts/verify-12a22-kick-history-category-reprobe-failure.mjs

      - name: Verify exact acceptance scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          expected=(
            '.github/workflows/analytics-12a20-kick-history-category-reprobe-execution.yml'
            'docs/audits/12a20-kick-history-category-reprobe-trigger.json'
            'docs/audits/12a22-kick-history-category-reprobe-production-failure.json'
            'scripts/verify-12a22-kick-history-category-reprobe-failure.mjs'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$path"
          done

      - name: Revalidate retained repository cost and runtime boundaries
        run: |
          node scripts/verify-12a19-kick-history-category-reprobe-authorization-decision.mjs
          node scripts/verify-12a18-kick-history-category-cost-bound.mjs
          python3 scripts/test-12a18-kick-history-category-cost-bound.py
          node scripts/verify-12a17-kick-history-category-probe-read-path.mjs
          node scripts/verify-12a16-kick-history-category-read-cost-optimization.mjs
          python3 scripts/test-12a16-kick-history-category-read-cost.py
          node scripts/verify-12a15-kick-history-category-aggregate-generator.mjs
          python3 scripts/test-12a15-kick-history-category-aggregate.py
          pnpm typecheck:collectors
          pnpm verify:collectors
          pnpm typecheck:web
          pnpm build:web

      - name: Publish retirement boundary
        if: always()
        run: |
          {
            echo '## Kick History category re-probe — consumed and retired'
            echo
            echo '- Production run: 31959926240'
            echo '- Production head: 273a3b6ceea48a858ece75651ea1c597365aa08c'
            echo '- Result: probe response failure before cost measurement (exit 32)'
            echo '- Performance determination: not measured'
            echo '- Cleanup: safe; aggregate rows 0; leakage 0; Worker final 404'
            echo '- Production execution path: retired'
            echo '- Cloudflare credentials reachable from this workflow: no'
            echo '- Push trigger: none'
            echo '- Automatic rerun: unauthorized'
            echo '- Rows-read threshold remains 250,000; no relaxation'
            echo '- Permanent generator / History category API/UI / Twitch: unauthorized'
            echo '- Next gate: repository-first diagnosis of the non-200 probe response'
          } >> "$GITHUB_STEP_SUMMARY"
