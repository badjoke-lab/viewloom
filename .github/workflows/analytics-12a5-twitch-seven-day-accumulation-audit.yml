name: Analytics 12A5 Twitch Seven-Day Accumulation Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'docs/audits/12a5-twitch-seven-day-accumulation-audit-contract.json'
      - 'scripts/run-12a5-twitch-seven-day-accumulation-audit.mjs'
      - 'scripts/verify-12a5-twitch-seven-day-accumulation-audit-package.mjs'
      - '.github/workflows/analytics-12a5-twitch-seven-day-accumulation-audit.yml'

permissions:
  contents: read

concurrency:
  group: analytics-12a5-twitch-seven-day-accumulation-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Parse audit package scripts
        run: |
          node --check scripts/run-12a5-twitch-seven-day-accumulation-audit.mjs
          node --check scripts/verify-12a5-twitch-seven-day-accumulation-audit-package.mjs
      - name: Verify audit package and boundaries
        run: node scripts/verify-12a5-twitch-seven-day-accumulation-audit-package.mjs
      - name: Verify hidden Twitch category API package
        run: node scripts/verify-12a5-twitch-heatmap-category-api-package.mjs
      - name: Verify hidden Twitch category controls package
        run: node scripts/verify-12a5-twitch-heatmap-category-controls-package.mjs
      - name: Verify current category rollout policy
        run: node scripts/verify-category-rollout-policy.mjs
      - name: Typecheck web
        run: pnpm typecheck:web
      - name: Build web
        run: pnpm build:web
      - name: Verify production HTML still has no public category controls
        run: |
          test -f apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'heatmap-category-preview-controls' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/twitch/heatmap/index.html
          test -f apps/web/dist/kick/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/kick/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/kick/heatmap/index.html

  audit-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUTPUT_DIR: artifacts/12a5-twitch-seven-day-accumulation-audit
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - id: audit
        name: Run read-only Twitch seven-day accumulation audit
        run: node scripts/run-12a5-twitch-seven-day-accumulation-audit.mjs
      - name: Upload sanitized Twitch accumulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-12a5-twitch-seven-day-accumulation-audit
          path: artifacts/12a5-twitch-seven-day-accumulation-audit/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish audit summary
        if: always()
        run: |
          {
            echo '## ViewLoom Twitch seven-day category accumulation audit'
            echo
            echo '- Provider: Twitch only'
            echo '- Read-only Cloudflare and D1 access: yes'
            echo '- Production mutation: no'
            echo '- Public cutover in this workflow: no'
            echo '- Outcome: `${{ steps.audit.outputs.outcome }}`'
            echo '- Kick change: no'
            echo '- Worker cadence change: no'
            echo '- Backfill or retention expansion: no'
          } >> "$GITHUB_STEP_SUMMARY"
