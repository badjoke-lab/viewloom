name: TMP 815 Run Battle Lines Controller Patch

on:
  push:
    branches: [work-815-kick-battle-lines-category-candidate]
    paths:
      - '.github/workflows/tmp-815-run-core-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work-815-kick-battle-lines-category-candidate
          fetch-depth: 0
      - name: Apply hidden Kick Battle Lines category controller patch
        run: python3 scripts/tmp-815-patch-controller.py
      - name: Commit controller patch
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add apps/web/src/live/battle-lines-current-shell-entry.ts
          git commit -m 'Add hidden Kick Battle Lines category controls'
          git push origin HEAD:work-815-kick-battle-lines-category-candidate
