name: TMP 815 Fix Battle Lines Category Reversal

on:
  push:
    branches: [work-815-kick-battle-lines-category-candidate]
    paths:
      - '.github/workflows/tmp-815-run-core-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work-815-kick-battle-lines-category-candidate
          fetch-depth: 0
      - name: Prevent category-boundary reversal carryover
        run: python3 scripts/tmp-815-fix-category-reversal.py
      - name: Commit category reversal fix
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add apps/web/functions/_lib/battle-lines-core.ts
          git commit -m 'Prevent category-boundary reversal carryover'
          git push origin HEAD:work-815-kick-battle-lines-category-candidate
