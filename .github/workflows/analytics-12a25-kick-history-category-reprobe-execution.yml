name: Analytics 12A25 Kick History Category Re-probe Retired

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a25-kick-history-category-reprobe-execution.yml'
      - 'docs/audits/12a25-kick-history-category-reprobe-trigger.json'
      - 'docs/audits/12a26-kick-history-category-reprobe-production-pass.json'
      - 'scripts/verify-12a26-kick-history-category-reprobe-pass.mjs'

permissions:
  contents: read

concurrency:
  group: analytics-12a25-kick-history-category-reprobe-retired-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  retired-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact 12A26 PASS acceptance scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          expected=(
            '.github/workflows/analytics-12a25-kick-history-category-reprobe-execution.yml'
            'docs/audits/12a25-kick-history-category-reprobe-trigger.json'
            'docs/audits/12a26-kick-history-category-reprobe-production-pass.json'
            'scripts/verify-12a26-kick-history-category-reprobe-pass.mjs'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$path"
          done

      - name: Verify canonical PASS and consumed authority
        run: node scripts/verify-12a26-kick-history-category-reprobe-pass.mjs

      - name: Verify production surface remains absent
        run: |
          set -euo pipefail
          workflow='.github/workflows/analytics-12a25-kick-history-category-reprobe-execution.yml'
          ! grep -Eq '^[[:space:]]*push:' "$workflow"
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/analytics-12a25-kick-history-category-reprobe-execution.yml').read_text()
          forbidden = [
              'production' + '-reprobe:',
              'CLOUDFLARE_' + 'API_TOKEN',
              'CLOUDFLARE_' + 'ACCOUNT_ID',
              'run-12a20-' + 'kick-history-category-reprobe.sh',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'production surface remains: {token}')
          PY

      - name: Publish PASS closeout boundary
        if: always()
        run: |
          {
            echo '## Kick History category re-probe — 12A26 PASS frozen'
            echo
            echo '- Production run: 31987877725'
            echo '- Production head: 33819c2ceff36c819d727d0399f85bbd789ba920'
            echo '- Result: PASS; rows_read 16,117 <= 250,000'
            echo '- Cleanup: aggregate rows 0; leakage 0; Worker final 404'
            echo '- Trigger: consumed and retired'
            echo '- Production push trigger: none'
            echo '- Production job: none'
            echo '- New production probe authority: none'
            echo '- Permanent generator / History category API/UI / Twitch: still unauthorized'
            echo '- Next gate: separate permanent-generator authorization decision'
          } >> "$GITHUB_STEP_SUMMARY"
