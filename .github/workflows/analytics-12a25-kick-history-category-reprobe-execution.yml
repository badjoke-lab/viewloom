name: Analytics 12A25 Kick History Category Re-probe Retired

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a25-kick-history-category-reprobe-execution.yml'

permissions:
  contents: read

concurrency:
  group: analytics-12a25-kick-history-category-reprobe-retired-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  retired-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact workflow-only retirement scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/analytics-12a25-kick-history-category-reprobe-execution.yml'

      - name: Verify production surface is absent
        run: |
          set -euo pipefail
          workflow='.github/workflows/analytics-12a25-kick-history-category-reprobe-execution.yml'
          ! grep -Eq '^[[:space:]]*push:' "$workflow"
          ! grep -Fq 'production-reprobe:' "$workflow"
          ! grep -Fq 'CLOUDFLARE_API_TOKEN' "$workflow"
          ! grep -Fq 'CLOUDFLARE_ACCOUNT_ID' "$workflow"
          ! grep -Fq 'run-12a20-kick-history-category-reprobe.sh' "$workflow"

      - name: Publish retirement boundary
        if: always()
        run: |
          {
            echo '## Kick History category re-probe — 12A25 production surface retired'
            echo
            echo '- Production run: 31987877725'
            echo '- Production head: 33819c2ceff36c819d727d0399f85bbd789ba920'
            echo '- Result: PASS; rows_read 16,117 <= 250,000'
            echo '- Cleanup: aggregate rows 0; leakage 0; Worker final 404'
            echo '- Push trigger: none'
            echo '- Production job: none'
            echo '- Cloudflare credentials reachable from this workflow: no'
            echo '- Permanent generator / History category API/UI / Twitch: still unauthorized'
            echo '- Next: freeze canonical PASS evidence and mark trigger consumed'
          } >> "$GITHUB_STEP_SUMMARY"
