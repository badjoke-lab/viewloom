name: Web checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck web
        shell: bash
        run: |
          set +e
          pnpm typecheck:web > web-checks-typecheck.log 2>&1
          status=$?
          cat web-checks-typecheck.log
          exit $status

      - name: Build web
        shell: bash
        run: |
          set +e
          pnpm build:web > web-checks-build.log 2>&1
          status=$?
          cat web-checks-build.log
          exit $status

      - name: Verify Battle Lines core
        run: pnpm --filter @viewloom/web verify:battle-lines

      - name: Verify Battle Lines wide UI
        run: pnpm --filter @viewloom/web verify:battle-lines-ui

      - name: Verify Kick Battle Lines category behavior
        run: node apps/web/scripts/verify-kick-battle-lines-category-candidate.mjs

      - name: Verify Day Flow production source and QA
        working-directory: apps/web
        run: |
          node scripts/verify-production-source.mjs
          node scripts/verify-dayflow-qa.mjs

      - name: Verify Twitch Stream Map live join
        run: pnpm --filter @viewloom/web verify:stream-map-live-join

      - name: Verify Twitch Stream Map source filters
        run: pnpm --filter @viewloom/web verify:stream-map-source-filters

      - name: Verify Twitch Stream Map country drilldown
        run: pnpm --filter @viewloom/web verify:stream-map-country-drilldown

      - name: Verify Twitch Stream Map unmapped reasons
        run: pnpm --filter @viewloom/web verify:stream-map-unmapped-reasons

      - name: Verify Twitch Stream Map population filters
        run: pnpm --filter @viewloom/web verify:stream-map-population-filters

      - name: Verify Twitch Current snapshot stable-ID adapter
        run: node scripts/verify-twitch-stream-map-current-snapshot-adapter-core.mjs

      - name: Verify Twitch City stable-ID contract
        run: node apps/web/scripts/verify-twitch-stream-map-city-stable-id.mjs

      - name: Verify Heatmap page boundaries
        run: pnpm --filter @viewloom/web verify:heatmap-boundaries

      - name: Verify Heatmap data-state truth
        run: pnpm --filter @viewloom/web verify:heatmap-data-state

      - name: Verify Heatmap Wide-first layout
        run: pnpm --filter @viewloom/web verify:heatmap-wide-layout

      - name: Verify Heatmap dense field
        run: pnpm --filter @viewloom/web verify:heatmap-dense-field

      - name: Verify Heatmap semantic LOD
        run: pnpm --filter @viewloom/web verify:heatmap-semantic-lod

      - name: Verify Heatmap camera controls
        run: pnpm --filter @viewloom/web verify:heatmap-camera-controls

      - name: Verify Heatmap Split viewport
        run: pnpm --filter @viewloom/web verify:heatmap-split-viewport

      - name: Verify Heatmap selected inspector
        run: pnpm --filter @viewloom/web verify:heatmap-selected-inspector

      - name: Verify Heatmap summary and legend
        run: pnpm --filter @viewloom/web verify:heatmap-summary-legend

      - name: Verify Heatmap mobile and accessibility
        run: pnpm --filter @viewloom/web verify:heatmap-mobile-accessibility

      - name: Verify Heatmap release gate
        run: pnpm --filter @viewloom/web verify:heatmap-release

      - name: Verify retired category preview controls stay absent
        run: |
          test -f apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'heatmap-category-preview-controls' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/twitch/heatmap/index.html
          test -f apps/web/dist/kick/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/kick/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/kick/heatmap/index.html

      - name: Upload web checks logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-checks-logs
          path: |
            web-checks-typecheck.log
            web-checks-build.log
