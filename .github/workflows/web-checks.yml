name: Web checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck web
        shell: bash
        run: |
          set +e
          pnpm typecheck:web > web-checks-typecheck.log 2>&1
          status=$?
          cat web-checks-typecheck.log
          exit $status

      - name: Build web
        shell: bash
        run: |
          set +e
          pnpm build:web > web-checks-build.log 2>&1
          status=$?
          cat web-checks-build.log
          exit $status

      - name: Verify Twitch Stream Map live join
        run: pnpm --filter @viewloom/web verify:stream-map-live-join

      - name: Verify Twitch Stream Map source filters
        run: pnpm --filter @viewloom/web verify:stream-map-source-filters

      - name: Probe production Twitch Stream Map route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/twitch-stream-map-production
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            https://www.viewloom.net/twitch/map/ \
            -o artifacts/twitch-stream-map-production/route.html
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            https://www.viewloom.net/api/twitch-stream-map \
            -o artifacts/twitch-stream-map-production/api.json
          grep -Fq 'Stream Map' artifacts/twitch-stream-map-production/route.html
          grep -Fq 'data-location-source' artifacts/twitch-stream-map-production/route.html
          grep -Fq 'value="official_external"' artifacts/twitch-stream-map-production/route.html
          grep -Fq 'data-location-type' artifacts/twitch-stream-map-production/route.html
          grep -Fq 'value="current_location"' artifacts/twitch-stream-map-production/route.html
          grep -Fq '/api/twitch-stream-map' artifacts/twitch-stream-map-production/route.html || true
          jq -e '
            .version == "viewloom-stream-map-live-v1" and
            .platform == "twitch" and
            .source == "real" and
            .coverage.observedStreams >= 0 and
            .coverage.mappedStreams >= 0 and
            .coverage.unmappedStreams >= 0 and
            .semantics.languageUsedForPlacement == false and
            .semantics.candidateOnlyPlacementAllowed == false and
            .semantics.nonPersonPlacementAllowed == false and
            .semantics.mappedPlusUnmappedEqualsObserved == true and
            .semantics.evidenceSourcesRemainDistinct == true
          ' artifacts/twitch-stream-map-production/api.json >/dev/null
          jq '{version,platform,source,updatedAt,coverage,semantics}' artifacts/twitch-stream-map-production/api.json

      - name: Verify Heatmap page boundaries
        run: pnpm --filter @viewloom/web verify:heatmap-boundaries

      - name: Verify Heatmap data-state truth
        run: pnpm --filter @viewloom/web verify:heatmap-data-state

      - name: Verify Heatmap Wide-first layout
        run: pnpm --filter @viewloom/web verify:heatmap-wide-layout

      - name: Verify Heatmap dense field
        run: pnpm --filter @viewloom/web verify:heatmap-dense-field

      - name: Verify Heatmap semantic LOD
        run: pnpm --filter @viewloom/web verify:heatmap-semantic-lod

      - name: Verify Heatmap camera controls
        run: pnpm --filter @viewloom/web verify:heatmap-camera-controls

      - name: Verify Heatmap Split viewport
        run: pnpm --filter @viewloom/web verify:heatmap-split-viewport

      - name: Verify Heatmap selected inspector
        run: pnpm --filter @viewloom/web verify:heatmap-selected-inspector

      - name: Verify Heatmap summary and legend
        run: pnpm --filter @viewloom/web verify:heatmap-summary-legend

      - name: Verify Heatmap mobile and accessibility
        run: pnpm --filter @viewloom/web verify:heatmap-mobile-accessibility

      - name: Verify Heatmap release gate
        run: pnpm --filter @viewloom/web verify:heatmap-release

      - name: Upload web checks logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-checks-logs
          path: |
            web-checks-typecheck.log
            web-checks-build.log
            artifacts/twitch-stream-map-production/
