name: Analytics 12A9 Kick Day Flow Category Decision

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'docs/audits/12a9-kick-day-flow-category-feasibility-decision.json'
      - 'scripts/verify-12a9-kick-day-flow-category-feasibility-decision.mjs'
      - '.github/workflows/analytics-12a9-kick-day-flow-category-decision.yml'

permissions:
  contents: read

concurrency:
  group: analytics-12a9-kick-day-flow-category-decision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout decision head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Kick Day Flow category feasibility decision
        run: |
          node --check scripts/verify-12a9-kick-day-flow-category-feasibility-decision.mjs
          node scripts/verify-12a9-kick-day-flow-category-feasibility-decision.mjs

      - name: Verify decision-only PR scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(docs/audits/12a9-kick-day-flow-category-feasibility-decision\.json|scripts/verify-12a9-kick-day-flow-category-feasibility-decision\.mjs|\.github/workflows/analytics-12a9-kick-day-flow-category-decision\.yml)$'
          test "${#changed[@]}" -eq 3
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "Unexpected non-decision change: $path" >&2; exit 1; }
          done

      - name: Publish decision boundary
        if: always()
        run: |
          {
            echo '## Kick Day Flow category feasibility decision'
            echo
            echo '- Decision: authorize a hidden Kick-only Day Flow category candidate'
            echo '- Source: existing DB_KICK_HOT minute snapshots + Kick provider category dictionary'
            echo '- Identity: (kick, categoryProviderId)'
            echo '- Membership: per observed snapshot; no latest-category backprojection'
            echo '- Ranking: selected-category viewer-minutes before Top N'
            echo '- Full Share: all observed Kick viewers per bucket'
            echo '- Top Focus Share: displayed selected-category Top N viewers per bucket'
            echo '- Coverage: observed / partial / unavailable by bucket; missing metadata is never zero'
            echo '- Existing normal Kick Day Flow route: unchanged'
            echo '- Public exposure: not authorized'
            echo '- Kick Battle Lines / History category UI: not authorized'
            echo '- Collector / Worker / D1 / schema / cadence / retention / backfill / credentials: unchanged'
          } >> "$GITHUB_STEP_SUMMARY"
