name: Analytics 12A33 Kick History Permanent Generator Enablement Decision

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a33-kick-history-permanent-generator-enablement-decision.yml'
      - 'docs/audits/12a33-kick-history-permanent-generator-enablement-decision.json'
      - 'scripts/verify-12a33-kick-history-permanent-generator-enablement-decision.mjs'

permissions:
  contents: read

concurrency:
  group: analytics-12a33-kick-history-generator-decision-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify exact repository-only Decision scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          expected=(
            '.github/workflows/analytics-12a33-kick-history-permanent-generator-enablement-decision.yml'
            'docs/audits/12a33-kick-history-permanent-generator-enablement-decision.json'
            'scripts/verify-12a33-kick-history-permanent-generator-enablement-decision.mjs'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$path"
          done

      - name: Verify 12A33 Decision and accepted prerequisites
        run: node scripts/verify-12a33-kick-history-permanent-generator-enablement-decision.mjs

      - name: Revalidate accepted production and generator semantics
        run: |
          node scripts/verify-12a32-kick-history-disabled-runtime-production-deployment-acceptance.mjs
          node scripts/verify-12a26-kick-history-category-reprobe-pass.mjs
          node scripts/verify-12a15-kick-history-category-aggregate-generator.mjs
          python3 scripts/test-12a15-kick-history-category-aggregate.py
          pnpm typecheck:collectors

      - name: Verify current production config still has no History enablement values
        run: |
          set -euo pipefail
          config='workers/collector-kick/wrangler.category-permanent.toml'
          grep -Fxq 'INTRADAY_GENERATION_ENABLED = "true"' "$config"
          grep -Fxq 'CATEGORY_CAPTURE_ENABLED = "true"' "$config"
          grep -Fxq 'crons = ["*/5 * * * *"]' "$config"
          ! grep -Fq 'HISTORY_CATEGORY_GENERATION_ENABLED' "$config"
          ! grep -Fq 'HISTORY_CATEGORY_START_DAY' "$config"

      - name: Verify repository-only Decision workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/analytics-12a33-kick-history-permanent-generator-enablement-decision.yml').read_text()
          forbidden = [
              '\n  ' + 'push:',
              'workflow_' + 'dispatch:',
              'sched' + 'ule:',
              'CLOUDFLARE_' + 'API_TOKEN',
              'CLOUDFLARE_' + 'ACCOUNT_ID',
              'wrangler ' + 'deploy',
              'wrangler@4 ' + 'deploy',
              'HISTORY_CATEGORY_' + 'GENERATION_ENABLED = "true"',
              'HISTORY_CATEGORY_' + 'START_DAY =',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'production-capable Decision surface: {token}')
          PY

      - name: Publish Decision boundary
        if: always()
        run: |
          {
            echo '## Kick History Category — 12A33 permanent generator enablement Decision'
            echo
            echo '- Decision: GO for one enablement candidate preparation'
            echo '- Production config mutation in this PR: no'
            echo '- Production deployment in this PR: no'
            echo '- Generator enabled in this PR: no'
            echo '- startDay pinned in this PR: no'
            echo '- Future startDay rule: UTC day of later authorized production enablement execution'
            echo '- New cron/backfill/raw-retention/API/UI/Twitch changes: none'
            echo '- Next gate after merge: prepare one non-deploying enablement candidate, then separate execution authorization'
          } >> "$GITHUB_STEP_SUMMARY"
