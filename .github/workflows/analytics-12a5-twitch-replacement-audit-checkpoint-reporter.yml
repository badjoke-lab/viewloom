name: Analytics 12A5 Twitch Replacement Audit Checkpoint Reporter

on:
  workflow_run:
    workflows:
      - Analytics 12A5 Twitch Replacement Audit Checkpoint
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: analytics-12a5-twitch-replacement-audit-checkpoint-reporter-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == 'ee8125ecd12f7ec620af13fd78d9a3c3c7e18f98'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record checkpoint workflow identities on Issue 659
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- viewloom-12a5-twitch-replacement-audit-checkpoint-report-v1 -->'
            const run = context.payload.workflow_run
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            })
            const checkpointJob = jobs.find((job) => job.name === 'checkpoint') ?? null
            const artifactsResponse = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            })
            const artifacts = artifactsResponse.data.artifacts.filter(
              (artifact) => artifact.name === 'analytics-12a5-twitch-replacement-audit-checkpoint',
            )
            const artifactLines = artifacts.length > 0
              ? artifacts.map((artifact) => [
                  `- Artifact ID: \`${artifact.id}\``,
                  `- Artifact name: \`${artifact.name}\``,
                  `- Artifact digest: \`${artifact.digest ?? 'unavailable'}\``,
                  `- Artifact expired: \`${artifact.expired}\``,
                ].join('\n')).join('\n')
              : '- Artifact: `not_found`'
            const body = [
              marker,
              '## Twitch replacement audit checkpoint run',
              '',
              `- Run ID: \`${run.id}\``,
              `- Run attempt: \`${run.run_attempt}\``,
              `- Conclusion: \`${run.conclusion}\``,
              `- Event: \`${run.event}\``,
              `- Head SHA: \`${run.head_sha}\``,
              `- Created at: \`${run.created_at}\``,
              `- Updated at: \`${run.updated_at}\``,
              `- Checkpoint job ID: \`${checkpointJob?.id ?? 'not_found'}\``,
              `- Checkpoint job conclusion: \`${checkpointJob?.conclusion ?? 'not_found'}\``,
              artifactLines,
              '',
              'This identity report is diagnostic only. It does not accept Issue #659 or authorize public category-filter exposure.',
            ].join('\n')
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 659,
              per_page: 100,
            })
            const existing = comments.find(
              (comment) => comment.body?.includes(marker) && comment.body?.includes(`Run ID: \`${run.id}\``),
            )
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 659,
                body,
              })
            }
