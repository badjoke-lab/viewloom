name: Kick Stream Map Stable ID Persistence

on:
  pull_request:
    paths:
      - 'workers/collector-kick/src/official-livestreams.ts'
      - 'scripts/verify-kick-stream-map-stable-id-persistence.mjs'
      - 'scripts/verify-kick-stream-map-country-public-readiness.mjs'
      - '.github/workflows/kick-stream-map-stable-id-persistence.yml'
  push:
    branches: [main]
    paths:
      - 'workers/collector-kick/src/official-livestreams.ts'
      - 'scripts/verify-kick-stream-map-stable-id-persistence.mjs'
      - 'scripts/verify-kick-stream-map-country-public-readiness.mjs'
      - '.github/workflows/kick-stream-map-stable-id-persistence.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.17.1'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck collectors
        run: pnpm typecheck:collectors
      - name: Verify Kick stable identity persistence boundary
        run: node scripts/verify-kick-stream-map-stable-id-persistence.mjs
      - name: Verify staged Kick Country readiness
        run: node scripts/verify-kick-stream-map-country-public-readiness.mjs
