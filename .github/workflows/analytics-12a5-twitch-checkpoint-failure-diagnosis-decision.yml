name: Analytics 12A5 Twitch Checkpoint Failure Diagnosis Decision

on:
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/README.md'
      - 'docs/product/current-roadmap.md'
      - 'docs/product/current-schedule.md'
      - 'docs/product/twitch-replacement-seven-day-audit-spec.md'
      - 'docs/work-in-progress/phase12a4-category-parallel-execution.md'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-decision.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-evidence.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-retirement.json'
      - 'scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-decision.mjs'
      - 'scripts/verify-category-rollout-policy.mjs'
      - 'scripts/verify-development-policy.mjs'
      - '.github/workflows/analytics-12a5-twitch-checkpoint-failure-diagnosis-decision.yml'
      - '.github/workflows/category-rollout-policy.yml'
      - 'apps/web/**'
  push:
    branches: [main]
    paths:
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-decision.json'
      - 'scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-decision.mjs'
      - '.github/workflows/analytics-12a5-twitch-checkpoint-failure-diagnosis-decision.yml'

permissions:
  contents: read

concurrency:
  group: analytics-12a5-twitch-checkpoint-failure-diagnosis-decision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Parse decision verifier
        run: node --check scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-decision.mjs
      - name: Verify diagnosis recovery decision
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-decision.mjs
      - name: Verify category rollout policy
        run: node scripts/verify-category-rollout-policy.mjs
      - name: Verify development policy
        run: node scripts/verify-development-policy.mjs
      - name: Typecheck web
        run: pnpm typecheck:web
      - name: Build web
        run: pnpm build:web
      - name: Verify public category controls remain absent
        run: |
          test -f apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'heatmap-category-preview-controls' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/twitch/heatmap/index.html
          test -f apps/web/dist/kick/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/kick/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/kick/heatmap/index.html
      - name: Summarize decision boundary
        run: |
          {
            echo '## Twitch checkpoint-failure diagnosis decision'
            echo
            echo '- Recovery required: yes'
            echo '- Original replacement window valid: no'
            echo '- New stability start fixed here: no'
            echo '- Historical backfill or threshold relaxation: no'
            echo '- Production mutation or public UI authorization: no'
            echo '- Next gate: dormant Twitch-only category-source-v2 completeness recovery package'
          } >> "$GITHUB_STEP_SUMMARY"
