name: TMP 793 Fix Verifier Literals

on:
  push:
    branches: [decision/793-kick-day-flow-category]
    paths:
      - '.github/workflows/tmp-793-fix-verifier-literals.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decision/793-kick-day-flow-category
      - name: Fix verifier literals to exact current Kick Day Flow code
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-12a9-kick-day-flow-category-feasibility-decision.mjs')
          text = path.read_text()
          replacements = {
            ".bind('kick', fromIso, toIso, MAX_ROWS)": ".bind('kick', range.start.toISOString(), range.end.toISOString()).all<Row>()",
            "const buckets = buildBuckets(fromIso, toIso, bucketMinutes)": "const bucketLabels = buckets(range.start, range.end, bucketSize)",
            "const viewerMinutes = entry.values.reduce": "totalViewerMinutes: viewers.reduce((sum, value) => sum + value * bucketSize, 0)",
            "const avg = samples[index] > 0 ? Math.round(sums[index] / samples[index]) : 0": "const viewers = acc.sums.map((sum, index) => acc.counts[index] > 0 ? Math.round(sum / acc.counts[index]) : 0)",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match for {old!r}, got {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          node --check scripts/verify-12a9-kick-day-flow-category-feasibility-decision.mjs
          git diff --check
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-12a9-kick-day-flow-category-feasibility-decision.mjs
          git commit -m 'Align Kick Day Flow decision verifier with current API'
          git push origin HEAD:decision/793-kick-day-flow-category
