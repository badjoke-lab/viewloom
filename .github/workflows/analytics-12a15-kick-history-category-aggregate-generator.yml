name: Kick History Category Aggregate Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'workers/shared/history-category-aggregate-sql.ts'
      - 'workers/shared/history-category-aggregate.ts'
      - 'workers/history-category-aggregate-cost-probe/**'
      - 'scripts/test-12a15-kick-history-category-aggregate.py'
      - 'scripts/verify-12a15-kick-history-category-aggregate-generator.mjs'
      - 'docs/audits/12a15-kick-history-category-aggregate-generator-contract.json'
      - 'docs/audits/12a16-kick-history-category-read-cost-optimization-contract.json'
      - 'scripts/test-12a16-kick-history-category-read-cost.py'
      - 'scripts/verify-12a16-kick-history-category-read-cost-optimization.mjs'
      - 'docs/audits/12a17-kick-history-category-probe-read-path-contract.json'
      - 'scripts/test-12a17-kick-history-category-probe-read-path.mjs'
      - 'scripts/verify-12a17-kick-history-category-probe-read-path.mjs'
      - 'docs/audits/12a18-kick-history-category-cost-bound-contract.json'
      - 'scripts/test-12a18-kick-history-category-cost-bound.py'
      - 'scripts/verify-12a18-kick-history-category-cost-bound.mjs'
      - '.github/workflows/analytics-12a15-kick-history-category-aggregate-generator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kick-history-category-aggregate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify aggregate generator contract and fixture
        run: |
          node scripts/verify-12a15-kick-history-category-aggregate-generator.mjs
          python3 scripts/test-12a15-kick-history-category-aggregate.py

      - name: Verify read-cost optimization contract and fixture
        run: |
          node scripts/verify-12a16-kick-history-category-read-cost-optimization.mjs
          python3 scripts/test-12a16-kick-history-category-read-cost.py

      - name: Verify probe read-path contract
        run: node scripts/verify-12a17-kick-history-category-probe-read-path.mjs

      - name: Verify bounded cost model
        run: |
          node scripts/verify-12a18-kick-history-category-cost-bound.mjs
          python3 scripts/test-12a18-kick-history-category-cost-bound.py

      - name: Typecheck and verify collectors
        run: |
          pnpm typecheck:collectors
          pnpm verify:collectors

      - name: Bundle dormant cost probe without deploying
        run: pnpm dlx wrangler@4 deploy --dry-run --config workers/history-category-aggregate-cost-probe/wrangler.kick.toml

      - name: Publish repository-only boundary
        if: always()
        run: |
          {
            echo '## Kick History category aggregate checks'
            echo
            echo '- Provider: Kick only'
            echo '- Aggregate semantics, indexed read path, probe model, and bounded cost model: verified'
            echo '- Exact historical PR file-set gates: removed'
            echo '- Production probe: unauthorized'
            echo '- Permanent generator: unauthorized'
            echo '- Production deploy: none'
          } >> "$GITHUB_STEP_SUMMARY"
