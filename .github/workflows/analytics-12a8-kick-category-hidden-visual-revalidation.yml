name: Analytics 12A8 Kick Category Hidden Visual Revalidation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a8-kick-category-hidden-visual-revalidation.yml'
      - 'docs/audits/12a8-kick-heatmap-category-hidden-visual-correction-contract.json'
      - 'scripts/verify-12a8-kick-heatmap-category-hidden-production-evidence.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a8-kick-category-hidden-visual-revalidation.yml'
      - 'docs/audits/12a8-kick-heatmap-category-hidden-visual-correction-contract.json'
      - 'scripts/verify-12a8-kick-heatmap-category-hidden-production-evidence.mjs'

permissions:
  contents: read

concurrency:
  group: analytics-12a8-kick-category-hidden-visual-revalidation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REPAIRED_PRODUCT_SHA: b921f15b127f13d7ad8a7f52976e4715d08919c1

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Verify exact deployment-authority correction scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(\.github/workflows/analytics-12a8-kick-category-hidden-visual-revalidation\.yml|docs/audits/12a8-kick-heatmap-category-hidden-visual-correction-contract\.json|scripts/verify-12a8-kick-heatmap-category-hidden-production-evidence\.mjs)$'
          test "${#changed[@]}" -eq 3
          for path in "${changed[@]}"; do [[ "$path" =~ $allowed ]] || { echo "Unexpected deployment-authority change: $path" >&2; exit 1; }; done
      - name: Verify validation-only ancestry from repaired product
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$REPAIRED_PRODUCT_SHA" "$GITHUB_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(\.github/workflows/analytics-12a8-kick-category-hidden-visual-revalidation\.yml|apps/web/scripts/kick-category-hidden-visual-revalidation\.mjs|docs/audits/12a8-kick-heatmap-category-hidden-visual-correction-contract\.json|scripts/verify-12a8-kick-heatmap-category-hidden-production-evidence\.mjs)$'
          test "${#changed[@]}" -eq 4
          for path in "${changed[@]}"; do [[ "$path" =~ $allowed ]] || { echo "Product runtime changed after repaired SHA: $path" >&2; exit 1; }; done
      - name: Verify correction contract and retained provider boundaries
        run: |
          node --check apps/web/scripts/kick-category-hidden-visual-revalidation.mjs
          node scripts/verify-12a8-kick-heatmap-category-hidden-production-evidence.mjs
          node scripts/verify-12a8-kick-heatmap-category-controls-package.mjs
          node scripts/verify-12a5-twitch-heatmap-category-public-cutover.mjs
          node scripts/verify-category-rollout-policy.mjs
      - name: Typecheck and build web
        run: |
          pnpm typecheck:web
          pnpm build:web
      - name: Verify normal Kick HTML remains category-control free
        run: |
          test -f apps/web/dist/kick/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/kick/heatmap/index.html
          ! grep -q 'heatmap-category-preview-controls' apps/web/dist/kick/heatmap/index.html

  production:
    if: github.event_name == 'push'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUTPUT_DIR: artifacts/12a8-kick-category-hidden-visual-revalidation
      VIEWLOOM_ORIGIN: https://www.viewloom.net
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify validation-only ancestry from repaired product
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$REPAIRED_PRODUCT_SHA" "$GITHUB_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(\.github/workflows/analytics-12a8-kick-category-hidden-visual-revalidation\.yml|apps/web/scripts/kick-category-hidden-visual-revalidation\.mjs|docs/audits/12a8-kick-heatmap-category-hidden-visual-correction-contract\.json|scripts/verify-12a8-kick-heatmap-category-hidden-production-evidence\.mjs)$'
          test "${#changed[@]}" -eq 4
          for path in "${changed[@]}"; do [[ "$path" =~ $allowed ]] || { echo "Product runtime changed after repaired SHA: $path" >&2; exit 1; }; done
      - name: Install Playwright
        run: npm install playwright@1.52.0 --no-save --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Confirm exact validation-only main SHA on primary production
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          success=false
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 20 "$VIEWLOOM_ORIGIN/deployment.json?kickVisualAuthority=$GITHUB_RUN_ID-$attempt" -o /tmp/deployment.json; then
              cp /tmp/deployment.json "$OUTPUT_DIR/last-deployment.json"
              observed_sha=$(jq -r '.commit_sha // ""' /tmp/deployment.json)
              environment=$(jq -r '.environment // ""' /tmp/deployment.json)
              branch=$(jq -r '.branch // ""' /tmp/deployment.json)
              printf 'attempt=%s expected=%s observed=%s environment=%s branch=%s\n' "$attempt" "$EXPECTED_SHA" "$observed_sha" "$environment" "$branch"
              if [[ "$observed_sha" == "$EXPECTED_SHA" && "$environment" == 'production' && "$branch" == 'main' ]]; then success=true; break; fi
            fi
            sleep 5
          done
          if [[ "$success" != true ]]; then
            echo "Primary production did not publish exact validation-only SHA $EXPECTED_SHA" >&2
            test -f "$OUTPUT_DIR/last-deployment.json" && cat "$OUTPUT_DIR/last-deployment.json" >&2
            exit 1
          fi
      - id: browser
        name: Revalidate repaired hidden Kick layout on bounded validation descendant
        continue-on-error: true
        run: node apps/web/scripts/kick-category-hidden-visual-revalidation.mjs
      - name: Upload visual revalidation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-12a8-kick-category-hidden-visual-revalidation
          path: artifacts/12a8-kick-category-hidden-visual-revalidation/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence upload when visual revalidation rejects
        if: steps.browser.outcome != 'success'
        run: exit 1
