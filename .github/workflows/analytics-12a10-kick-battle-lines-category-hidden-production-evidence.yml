name: Analytics 12A10 Kick Battle Lines Category Hidden Production Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a10-kick-battle-lines-category-hidden-production-evidence.yml'
      - '.github/workflows/analytics-12a10-kick-battle-lines-category-hidden-production-revalidation.yml'
      - 'docs/audits/12a10-kick-battle-lines-category-hidden-production-evidence.json'
      - 'docs/audits/12a10-kick-battle-lines-category-hidden-production-acceptance.json'
      - 'scripts/verify-12a10-kick-battle-lines-category-hidden-production-evidence.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a10-kick-battle-lines-category-hidden-production-evidence.yml'
      - '.github/workflows/analytics-12a10-kick-battle-lines-category-hidden-production-revalidation.yml'
      - 'docs/audits/12a10-kick-battle-lines-category-hidden-production-evidence.json'
      - 'docs/audits/12a10-kick-battle-lines-category-hidden-production-acceptance.json'
      - 'scripts/verify-12a10-kick-battle-lines-category-hidden-production-evidence.mjs'

permissions:
  contents: read

concurrency:
  group: analytics-12a10-kick-battle-lines-hidden-production-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Verify exact five-file evidence acceptance scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(\.github/workflows/analytics-12a10-kick-battle-lines-category-hidden-production-evidence\.yml|\.github/workflows/analytics-12a10-kick-battle-lines-category-hidden-production-revalidation\.yml|docs/audits/12a10-kick-battle-lines-category-hidden-production-evidence\.json|docs/audits/12a10-kick-battle-lines-category-hidden-production-acceptance\.json|scripts/verify-12a10-kick-battle-lines-category-hidden-production-evidence\.mjs)$'
          test "${#changed[@]}" -eq 5
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected hidden evidence acceptance change: $file" >&2; exit 1; }
          done
      - name: Verify frozen hidden production evidence
        run: node scripts/verify-12a10-kick-battle-lines-category-hidden-production-evidence.mjs
      - name: Verify retained hidden candidate source and deterministic point states
        run: |
          node scripts/verify-12a10-kick-battle-lines-category-candidate.mjs
          cd apps/web
          node scripts/verify-battle-lines-core.mjs
          node scripts/verify-kick-battle-lines-category-candidate.mjs
      - name: Verify retained architecture and production boundaries
        run: |
          node scripts/verify-quality-u10g-architecture.mjs
          node scripts/verify-quality-u10d-analysis-coherence.mjs
          cd apps/web
          node scripts/verify-production-source.mjs
      - name: Typecheck and build unchanged product
        run: |
          pnpm typecheck:web
          pnpm build:web
      - name: Publish permanent hidden acceptance boundary
        if: always()
        run: |
          {
            echo '## Kick Battle Lines hidden Category production evidence'
            echo
            echo '- Product authority: a802e7fe1e964180904c72744b7228c549a54660'
            echo '- Validation deployment: 3451d96d067e50c045387e4bbe337ee3be3f0368'
            echo '- Production run: 31519986415'
            echo '- Production job: 93874522742'
            echo '- Artifact: 9112660165'
            echo '- Scenarios: 6 / 6 pass'
            echo '- Hidden desktop: 127 category options; selected category 15; 5 lines / 6 battles'
            echo '- Production point states: 121 outside_category points observed'
            echo '- 390px mobile: no overflow; Category touch target 44px'
            echo '- Unknown category: 0 category lines / 0 battles with 288 observed buckets retained'
            echo '- Normal Kick and Twitch category-free provider boundaries: preserved'
            echo '- Human visual acceptance: pass'
            echo '- One-shot production revalidation workflow: retired'
            echo '- Public Kick Battle Lines Category: not authorized'
          } >> "$GITHUB_STEP_SUMMARY"
