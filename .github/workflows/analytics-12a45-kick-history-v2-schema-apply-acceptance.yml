name: Analytics 12A45 Kick History V2 Schema Apply Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a45-kick-history-v2-schema-apply-acceptance.yml'
      - 'docs/audits/12a45-kick-history-v2-schema-apply-acceptance-contract.json'
      - 'scripts/verify-12a45-kick-history-v2-schema-apply-acceptance.mjs'

permissions:
  contents: read
  actions: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HEAD_SHA: 1c02df8525e579cea8dd0008a6003ec3d575b61a
      SOURCE_WORKFLOW_NAME: Analytics 12A43 Kick History V2 Schema Apply Package
      SOURCE_ARTIFACT_NAME: phase12a43-kick-history-v2-schema-apply
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify repository-only acceptance contract
        run: node scripts/verify-12a45-kick-history-v2-schema-apply-acceptance.mjs

      - name: Verify exact three-file PR scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          expected=(
            '.github/workflows/analytics-12a45-kick-history-v2-schema-apply-acceptance.yml'
            'docs/audits/12a45-kick-history-v2-schema-apply-acceptance-contract.json'
            'scripts/verify-12a45-kick-history-v2-schema-apply-acceptance.mjs'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fxq "$path"; done

      - name: Resolve exact production push run and diagnose evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/12a45

          runs=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_HEAD_SHA&event=push&per_page=100")
          run_id=$(jq -r --arg name "$SOURCE_WORKFLOW_NAME" '.workflow_runs | map(select(.name == $name)) | sort_by(.id) | last | .id // empty' <<<"$runs")
          test -n "$run_id"
          run_status=$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' <<<"$runs")
          run_conclusion=$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion // empty' <<<"$runs")
          [[ "$run_status" == 'completed' ]]

          jobs=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")
          contract_job_id=$(jq -r '.jobs[] | select(.name == "contract") | .id // empty' <<<"$jobs")
          contract_conclusion=$(jq -r '.jobs[] | select(.name == "contract") | .conclusion // empty' <<<"$jobs")
          production_job_id=$(jq -r '.jobs[] | select(.name == "production-schema-apply") | .id // empty' <<<"$jobs")
          production_conclusion=$(jq -r '.jobs[] | select(.name == "production-schema-apply") | .conclusion // empty' <<<"$jobs")
          failed_steps=$(jq -c '[.jobs[] | select(.name == "production-schema-apply") | .steps[]? | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | {name,number,status,conclusion}]' <<<"$jobs")
          completed_steps=$(jq -c '[.jobs[] | select(.name == "production-schema-apply") | .steps[]? | {name,number,status,conclusion}]' <<<"$jobs")

          artifacts=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")
          artifact_id=$(jq -r --arg name "$SOURCE_ARTIFACT_NAME" '.artifacts[]? | select(.name == $name) | .id // empty' <<<"$artifacts")
          artifact_digest=$(jq -r --arg name "$SOURCE_ARTIFACT_NAME" '.artifacts[]? | select(.name == $name) | .digest // empty' <<<"$artifacts")
          artifact_found=false
          source_evidence_status=''
          first_statements=null
          second_statements=null
          v1_complete=null
          v2_complete=null
          v2_rows=null
          leakage_rows=null
          worker_deleted=null
          post_delete_status=null
          pre_collected=''
          post_collected=''
          size_delta=null

          if [[ -n "$artifact_id" ]]; then
            artifact_found=true
            gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/source.zip
            rm -rf /tmp/source-artifact
            mkdir -p /tmp/source-artifact
            unzip -q /tmp/source.zip -d /tmp/source-artifact
            evidence=$(find /tmp/source-artifact -type f -name evidence.json -print -quit || true)
            if [[ -n "$evidence" ]]; then
              source_evidence_status=$(jq -r '.status // empty' "$evidence")
              first_statements=$(jq -r '.firstApplyStatementCount // null' "$evidence")
              second_statements=$(jq -r '.secondApplyStatementCount // null' "$evidence")
              v1_complete=$(jq -r '.v1SchemaCompleteAfter // null' "$evidence")
              v2_complete=$(jq -r '.v2SchemaCompleteAfter // null' "$evidence")
              v2_rows=$(jq -r '.v2AggregateRowsAfter // null' "$evidence")
              leakage_rows=$(jq -r '.providerLeakageRowsAfter // null' "$evidence")
              worker_deleted=$(jq -r '.temporaryWorkerDeleted // null' "$evidence")
              post_delete_status=$(jq -r '.postDeleteHttpStatus // null' "$evidence")
              pre_collected=$(jq -r '.preCollectedAt // empty' "$evidence")
              post_collected=$(jq -r '.postCollectedAt // empty' "$evidence")
              size_delta=$(jq -r '.databaseSizeDeltaBytes // null' "$evidence")
            fi
          fi

          diagnostic_status='SOURCE_RUN_FAILED'
          if [[ "$run_conclusion" == 'success' && "$contract_conclusion" == 'success' && "$production_conclusion" == 'success' ]]; then
            diagnostic_status='SOURCE_RUN_SUCCESS'
          fi

          jq -n \
            --arg schemaVersion 'viewloom-12a45-kick-history-v2-schema-apply-diagnostic-v1' \
            --arg status "$diagnostic_status" \
            --arg sourceHeadSha "$SOURCE_HEAD_SHA" \
            --argjson productionRunId "$run_id" \
            --arg runStatus "$run_status" \
            --arg runConclusion "$run_conclusion" \
            --argjson contractJobId "${contract_job_id:-null}" \
            --arg contractConclusion "$contract_conclusion" \
            --argjson productionSchemaApplyJobId "${production_job_id:-null}" \
            --arg productionConclusion "$production_conclusion" \
            --argjson failedSteps "$failed_steps" \
            --argjson completedSteps "$completed_steps" \
            --argjson sourceArtifactFound "$artifact_found" \
            --argjson sourceArtifactId "${artifact_id:-null}" \
            --arg sourceArtifactDigest "$artifact_digest" \
            --arg sourceEvidenceStatus "$source_evidence_status" \
            --argjson firstApplyStatementCount "$first_statements" \
            --argjson secondApplyStatementCount "$second_statements" \
            --argjson v1SchemaCompleteAfter "$v1_complete" \
            --argjson v2SchemaCompleteAfter "$v2_complete" \
            --argjson v2AggregateRowsAfter "$v2_rows" \
            --argjson providerLeakageRowsAfter "$leakage_rows" \
            --argjson temporaryWorkerDeleted "$worker_deleted" \
            --argjson postDeleteHttpStatus "$post_delete_status" \
            --arg preCollectedAt "$pre_collected" \
            --arg postCollectedAt "$post_collected" \
            --argjson databaseSizeDeltaBytes "$size_delta" \
            '{schemaVersion:$schemaVersion,status:$status,provider:"kick",sourceHeadSha:$sourceHeadSha,productionRunId:$productionRunId,runStatus:$runStatus,runConclusion:$runConclusion,contractJobId:$contractJobId,contractConclusion:$contractConclusion,productionSchemaApplyJobId:$productionSchemaApplyJobId,productionConclusion:$productionConclusion,failedSteps:$failedSteps,completedSteps:$completedSteps,sourceArtifactFound:$sourceArtifactFound,sourceArtifactId:$sourceArtifactId,sourceArtifactDigest:$sourceArtifactDigest,sourceEvidenceStatus:$sourceEvidenceStatus,firstApplyStatementCount:$firstApplyStatementCount,secondApplyStatementCount:$secondApplyStatementCount,v1SchemaCompleteAfter:$v1SchemaCompleteAfter,v2SchemaCompleteAfter:$v2SchemaCompleteAfter,v2AggregateRowsAfter:$v2AggregateRowsAfter,providerLeakageRowsAfter:$providerLeakageRowsAfter,temporaryWorkerDeleted:$temporaryWorkerDeleted,postDeleteHttpStatus:$postDeleteHttpStatus,preCollectedAt:$preCollectedAt,postCollectedAt:$postCollectedAt,databaseSizeDeltaBytes:$databaseSizeDeltaBytes,boundaries:{diagnosticOnly:true,productionRerun:false,cloudflareAccess:false,d1Access:false,workerDeploy:false,schemaApply:false}}' \
            > artifacts/12a45/evidence.json

          cat artifacts/12a45/evidence.json

      - name: Upload sanitized acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase12a45-kick-history-v2-schema-apply-acceptance
          path: artifacts/12a45/evidence.json
          retention-days: 30
          if-no-files-found: error
