name: Analytics 12A49 Kick History V2 Schema Apply Retry Retired

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a49-kick-history-v2-schema-apply-retry.yml'

permissions:
  contents: read

jobs:
  retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact one-file retirement scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#changed[@]}" -eq 1
          [[ "${changed[0]}" == '.github/workflows/analytics-12a49-kick-history-v2-schema-apply-retry.yml' ]]

      - name: Verify consumed production trigger remains pinned
        run: |
          set -euo pipefail
          trigger='docs/audits/12a49-kick-history-v2-schema-apply-retry-trigger.json'
          test -f "$trigger"
          [[ $(jq -r '.status' "$trigger") == 'armed_for_one_time_main_push' ]]
          [[ $(jq -r '.provider' "$trigger") == 'kick' ]]
          [[ $(jq -r '.sourceMainSha' "$trigger") == 'ba3435901a1d2055f4106aa12932d0e714b999e1' ]]
          [[ $(jq -r '.expectedCorrectedPackageMergeSha' "$trigger") == 'ba3435901a1d2055f4106aa12932d0e714b999e1' ]]

      - name: Verify retired workflow has no production execution surface
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const path = '.github/workflows/analytics-12a49-kick-history-v2-schema-apply-retry.yml'
          const text = fs.readFileSync(path, 'utf8')
          const forbidden = [
            '\n  pu' + 'sh:',
            'workflow_' + 'dispatch:',
            '\n  sche' + 'dule:',
            'CLOUD' + 'FLARE_API_TOKEN',
            'CLOUD' + 'FLARE_ACCOUNT_ID',
            'production-schema-' + 'retry:',
            'run-12a49-kick-history-v2-schema-apply-' + 'retry.sh',
            'actions/upload-' + 'artifact@v4',
          ]
          for (const needle of forbidden) {
            if (text.includes(needle)) throw new Error(`retired workflow still contains production surface: ${needle}`)
          }
          NODE
