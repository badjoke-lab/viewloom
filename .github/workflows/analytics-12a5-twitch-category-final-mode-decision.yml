name: Analytics 12A5 Twitch Category Final Mode Decision

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a5-twitch-category-final-mode-decision.yml'
      - 'docs/audits/12a5-twitch-category-final-mode-decision.json'
      - 'docs/audits/12a5-twitch-replacement-audit-final-evidence.json'
      - 'docs/audits/12a5-twitch-replacement-audit-final-acceptance.json'
      - 'docs/audits/12a5-twitch-replacement-audit-final-retirement.json'
      - 'scripts/verify-12a5-twitch-category-final-mode-decision.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a5-twitch-category-final-mode-decision.yml'
      - 'docs/audits/12a5-twitch-category-final-mode-decision.json'
      - 'scripts/verify-12a5-twitch-category-final-mode-decision.mjs'

permissions:
  contents: read

concurrency:
  group: analytics-12a5-twitch-category-final-mode-decision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify accepted final audit authorizes hidden revalidation only
        run: |
          node --check scripts/verify-12a5-twitch-category-final-mode-decision.mjs
          node scripts/verify-12a5-twitch-category-final-mode-decision.mjs
      - name: Verify hidden controls still absent from production HTML
        run: |
          ! grep -q 'categoryPreview' apps/web/twitch/heatmap/index.html
          ! grep -q 'heatmap-category-preview-controls' apps/web/twitch/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/twitch/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/kick/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/kick/heatmap/index.html
