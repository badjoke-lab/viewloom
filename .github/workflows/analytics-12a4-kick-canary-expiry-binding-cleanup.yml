name: Analytics 12A4 Kick Canary Expiry Binding Cleanup Retired

# Historical retired cleanup record. This is manual-only so its exact old PR
# scope contract cannot block unrelated current development.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-12a4-kick-canary-expiry-binding-cleanup-retired-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-retired-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Verify accepted and retired cleanup package
        run: node scripts/verify-12a4-kick-canary-expiry-binding-cleanup-package.mjs
      - name: Bundle canonical normal Kick collector without deploying
        run: pnpm dlx wrangler@4 deploy --dry-run --outdir artifacts/12a4-kick-canary-expiry-binding-cleanup/dry-run --config workers/collector-kick/wrangler.toml
      - name: Publish retirement summary
        if: always()
        run: |
          {
            echo '## ViewLoom 12A-4 Kick expired binding cleanup retired'
            echo
            echo '- Cleanup package: PR #586'
            echo '- Exact trigger: PR #587'
            echo '- Automatic PR gate: retired'
            echo '- Production push trigger: removed'
            echo '- Production deployment job: removed'
            echo '- Cloudflare credentials referenced: no'
            echo '- Worker deployment: dry-run only'
            echo '- Trigger rearm authorized: no'
          } >> "$GITHUB_STEP_SUMMARY"
