name: Twitch Stream Map Country Review Batches

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/audits/twitch-stream-map-country-review-batch-contract-v0.1.json'
      - 'docs/audits/twitch-stream-map-country-review-result-contract-v0.1.json'
      - 'docs/audits/twitch-stream-map-country-review-batches-2026-08-24-part*.json'
      - 'docs/audits/twitch-stream-map-country-review-result-*.json'
      - 'scripts/verify-twitch-stream-map-country-review-batches.mjs'
      - 'scripts/verify-twitch-stream-map-country-review-result.mjs'
      - '.github/workflows/twitch-stream-map-country-review-batches.yml'
  push:
    branches: [main]
    paths:
      - 'docs/audits/twitch-stream-map-country-review-batch-contract-v0.1.json'
      - 'docs/audits/twitch-stream-map-country-review-result-contract-v0.1.json'
      - 'docs/audits/twitch-stream-map-country-review-batches-2026-08-24-part*.json'
      - 'docs/audits/twitch-stream-map-country-review-result-*.json'
      - 'scripts/verify-twitch-stream-map-country-review-batches.mjs'
      - 'scripts/verify-twitch-stream-map-country-review-result.mjs'
      - '.github/workflows/twitch-stream-map-country-review-batches.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bounded Country review batches
        run: node scripts/verify-twitch-stream-map-country-review-batches.mjs
      - name: Self-test Country review result validator
        run: node scripts/verify-twitch-stream-map-country-review-result.mjs --self-test
      - name: Validate all present Country review results
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          results=(docs/audits/twitch-stream-map-country-review-result-[a-l]-*.json)
          if (( ${#results[@]} == 0 )); then
            echo 'No Country batch result artifacts found.' >&2
            exit 1
          fi
          for result in "${results[@]}"; do
            echo "Validating ${result}"
            node scripts/verify-twitch-stream-map-country-review-result.mjs "$result"
          done
      - name: Publish execution boundary
        shell: bash
        run: |
          {
            echo '## Country coverage review batches'
            echo '- Source population: Top300 run 32704826743'
            echo '- Queued identities: 297'
            echo '- Batch count: 12 (A-L)'
            echo '- Max identities/batch: 25'
            echo '- Max external lookups/identity: 5'
            echo '- Max external lookups/batch: 100'
            echo '- Provider requests/batch: 0'
            echo '- Calendar/week wait: none'
            echo '- Automatic source acceptance: no'
            echo '- Canonical mutation before validator: prohibited'
            echo '- Every present A-L batch result artifact is validated on each run'
          } >> "$GITHUB_STEP_SUMMARY"
