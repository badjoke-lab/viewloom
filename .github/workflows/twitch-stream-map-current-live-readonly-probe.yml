name: Twitch Stream Map Current Live Read-only Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/twitch-stream-map-current-location-live-probe/**'
      - 'tools/twitch-stream-map-current-location/candidate-coverage.mjs'
      - 'workers/collector-twitch/scripts/location-candidate-extractor.mjs'
      - 'scripts/verify-twitch-stream-map-current-live-readonly-probe.mjs'
      - '.github/workflows/twitch-stream-map-current-live-readonly-probe.yml'
  push:
    branches: [main]
    paths:
      - 'docs/audits/twitch-stream-map-current-live-probe-trigger.json'

permissions:
  contents: read

concurrency:
  group: twitch-stream-map-current-live-readonly-probe-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIGGER_FILE: docs/audits/twitch-stream-map-current-live-probe-trigger.json
  ARTIFACT_DIR: artifacts/twitch-stream-map-current-live-readonly-probe

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Current / IRL live probe contract
        run: node scripts/verify-twitch-stream-map-current-live-readonly-probe.mjs
      - name: Bundle preview worker without deploying
        run: npx --yes wrangler@4 deploy --dry-run --config tools/twitch-stream-map-current-location-live-probe/wrangler.toml
      - name: Publish safety boundary
        shell: bash
        run: |
          {
            echo '## Twitch Stream Map Current / IRL live read-only probe'
            echo
            echo '- Production deployment: no'
            echo '- D1 writes: 0'
            echo '- Automatic schedule: none'
            echo '- workflow_dispatch: none'
            echo '- Live execution: exact one-file main trigger only'
            echo '- Max Twitch token requests: 1'
            echo '- Max /helix/streams requests: 3'
            echo '- /helix/users requests: 0'
            echo '- Raw title/tag/language artifact: no'
            echo '- Automatic Current acceptance: no'
            echo '- Public Current / IRL placement: no'
            echo '- Home/Base mutation: no'
          } >> "$GITHUB_STEP_SUMMARY"

  probe:
    needs: contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce exact one-file read-only trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test -f "$TRIGGER_FILE"
          mapfile -t changed < <(git diff --name-only "${GITHUB_SHA}^1" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$TRIGGER_FILE"
          jq -e '
            .schemaVersion == "viewloom-twitch-stream-map-current-live-probe-trigger-v0.1" and
            .oneTime == true and
            .rearm == false and
            .productionDeployment == false and
            .d1Writes == 0 and
            .maxTokenRequests == 1 and
            .maxStreamsRequests == 3 and
            .usersRequests == 0 and
            .rawTextArtifactAllowed == false and
            .automaticAcceptanceAuthorized == false and
            .publicCurrentPlacementAuthorized == false and
            .baseMutationAuthorized == false and
            (.expectedProbePackageMergeSha | type == "string" and length == 40)
          ' "$TRIGGER_FILE" >/dev/null
          package_sha="$(jq -r '.expectedProbePackageMergeSha' "$TRIGGER_FILE")"
          git cat-file -e "${package_sha}^{commit}"
          git merge-base --is-ancestor "$package_sha" HEAD

      - name: Require Cloudflare preview credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - id: upload
        name: Upload non-production Current / IRL preview version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          alias="map-current-probe-${GITHUB_RUN_ID}"
          output="$(npx --yes wrangler@4 versions upload \
            --config tools/twitch-stream-map-current-location-live-probe/wrangler.toml \
            --preview-alias "$alias" \
            --keep-vars 2>&1 | tee "$ARTIFACT_DIR/upload.txt")"
          preview_url="$(printf '%s\n' "$output" | sed -nE 's/.*Version Preview URL: (https:\/\/[^ ]+).*/\1/p' | tail -1)"
          test -n "$preview_url"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Verify preview-only boundary
        shell: bash
        run: |
          set -euo pipefail
          preview_url='${{ steps.upload.outputs.preview_url }}'
          curl --fail --silent --show-error --retry 4 --retry-delay 3 --retry-all-errors \
            "$preview_url/health" -o "$ARTIFACT_DIR/health.json"
          jq -e '
            .ok == true and
            .mode == "current_location_candidate_coverage_top300_preview" and
            .productionDeployment == false and
            .d1Writes == 0 and
            .maxTokenRequests == 1 and
            .maxStreamsRequests == 3 and
            .usersRequests == 0 and
            .publicCurrentPlacementAuthorized == false and
            .baseMutationAuthorized == false and
            .rawTextArtifactAllowed == false and
            .credentialPresence.twitchClientId == true and
            .credentialPresence.twitchClientSecret == true
          ' "$ARTIFACT_DIR/health.json" >/dev/null

      - name: Capture one bounded live candidate-coverage measurement
        shell: bash
        run: |
          set -euo pipefail
          preview_url='${{ steps.upload.outputs.preview_url }}'
          set +e
          http_code="$(curl --silent --show-error -X POST \
            "$preview_url/audit/current-candidate-coverage" \
            -o "$ARTIFACT_DIR/probe.json" -w '%{http_code}')"
          curl_rc=$?
          set -e
          jq -n --arg httpCode "$http_code" --argjson curlExit "$curl_rc" \
            --slurpfile body "$ARTIFACT_DIR/probe.json" \
            '{httpCode:$httpCode,curlExit:$curlExit,response:(if (($body[0] // null)|type)=="object" then {ok:($body[0].ok//false),error:($body[0].error//null),errorClass:($body[0].errorClass//null)} else {ok:false,error:"non_json_or_empty_response",errorClass:"transport"} end)}' \
            > "$ARTIFACT_DIR/post-diagnostic.json"
          if [[ "$curl_rc" -ne 0 || "$http_code" != '200' ]]; then
            cat "$ARTIFACT_DIR/post-diagnostic.json"
            exit 1
          fi
          jq -e '
            .ok == true and
            .result.provider == "twitch" and
            .result.mode == "current_location_candidate_coverage_top300_preview" and
            .result.requestedSize == 300 and
            (.result.sampleSize > 0 and .result.sampleSize <= 300) and
            .result.stableIdentity == "twitchUserId" and
            .result.stableIdentityUnique == true and
            .result.apiRequests.token == 1 and
            (.result.apiRequests.streams > 0 and .result.apiRequests.streams <= 3) and
            .result.apiRequests.users == 0 and
            .result.persistence.d1Writes == 0 and
            .result.persistence.productionDeployment == false and
            .result.persistence.rawTitleStored == false and
            .result.persistence.rawTagsStored == false and
            .result.persistence.rawLanguageStored == false and
            .result.persistence.rawTextArtifactAllowed == false and
            .result.persistence.canonicalMutationApplied == false and
            .result.decision.status == "candidate_only" and
            .result.decision.acceptanceAuthorized == false and
            .result.decision.publicCurrentPlacementAuthorized == false and
            .result.decision.baseMutationAuthorized == false and
            .result.decision.languageUsedForPlacement == false and
            .result.fieldsReturned == ["aggregate_candidate_counts","source_yield","candidate_countries"] and
            .result.measurement.status == "candidate_only" and
            .result.measurement.rawTextRetainedInResult == false
          ' "$ARTIFACT_DIR/probe.json" >/dev/null

      - name: Publish measurement summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Current / IRL live candidate-coverage result'
            if [[ -f "$ARTIFACT_DIR/post-diagnostic.json" ]]; then
              jq -r '"- POST HTTP: \(.httpCode)\n- curl exit: \(.curlExit)\n- response ok: \(.response.ok)\n- error class: \(.response.errorClass // "none")\n- error: \(.response.error // "none")"' "$ARTIFACT_DIR/post-diagnostic.json"
            fi
            if [[ -f "$ARTIFACT_DIR/probe.json" ]]; then
              jq -r '"- Population measured: \(.result.measurement.population)\n- Candidate streams: \(.result.measurement.candidateStreams)\n- Candidate coverage: \((.result.measurement.candidateCoverage * 10000 | round) / 100)%\n- Title candidate streams: \(.result.measurement.counts.titleCandidateStreams)\n- Tag candidate streams: \(.result.measurement.counts.tagCandidateStreams)\n- Future/planned travel titles rejected: \(.result.measurement.counts.rejectedFutureTravelTitles)\n- Public Current placement authorized: \(.result.decision.publicCurrentPlacementAuthorized)"' "$ARTIFACT_DIR/probe.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate-only probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twitch-stream-map-current-live-probe-${{ github.run_id }}
          path: artifacts/twitch-stream-map-current-live-readonly-probe/
          if-no-files-found: error
          retention-days: 30
