name: TMP 823 Restore Hidden Evidence Verifier

on:
  push:
    branches: [work-823-kick-battle-lines-category-public-cutover]
    paths:
      - '.github/workflows/tmp-823-restore-hidden-evidence-verifier.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work-823-kick-battle-lines-category-public-cutover
          fetch-depth: 0
      - name: Restore permanent hidden evidence verifier from main
        run: |
          git fetch origin main
          git checkout origin/main -- scripts/verify-12a10-kick-battle-lines-category-hidden-production-evidence.mjs
      - name: Commit restoration
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add scripts/verify-12a10-kick-battle-lines-category-hidden-production-evidence.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Keep permanent hidden production evidence verifier immutable'
          git push origin HEAD:work-823-kick-battle-lines-category-public-cutover
