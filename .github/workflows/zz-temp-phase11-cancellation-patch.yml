name: Temporary Phase 11 Cancellation Patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/zz-temp-phase11-cancellation-patch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-phase11-cancellation-patch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.repository == 'badjoke-lab/viewloom'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase11-latest-head-cancellation-gaps

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build event-safe latest-head cancellation files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          expression_open = '$' + '{{'
          expression_close = '}' + '}'

          generic = (
            "concurrency:\n"
            "  group: " + expression_open + " github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.event_name, github.ref) " + expression_close + "\n"
            "  cancel-in-progress: " + expression_open + " github.event_name == 'pull_request' " + expression_close + "\n"
          )
          pull_request_only = (
            "concurrency:\n"
            "  group: " + expression_open + " github.workflow " + expression_close + "-" + expression_open + " github.event.pull_request.number || github.ref " + expression_close + "\n"
            "  cancel-in-progress: true\n"
          )
          deploy = (
            "concurrency:\n"
            "  group: " + expression_open + " github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || 'viewloom-collector-worker-production-deploy' " + expression_close + "\n"
            "  cancel-in-progress: " + expression_open + " github.event_name == 'pull_request' " + expression_close + "\n"
          )

          replacements = {
            '.github/workflows/analytics-12a3-execution-cost-probe.yml': generic,
            '.github/workflows/analytics-12a3-generator-enablement.yml': generic,
            '.github/workflows/analytics-12a3-postmerge-acceptance.yml': generic,
            '.github/workflows/analytics-12a4-twitch-canary-start-cancel.yml': generic,
            '.github/workflows/analytics-12a4-twitch-category-capture-canary-storage-preflight.yml': pull_request_only,
            '.github/workflows/deploy-collector-workers.yml': deploy,
            '.github/workflows/primary-domain-production-smoke.yml': generic,
          }

          concurrency_pattern = re.compile(r'^concurrency:\s*\n(?:^[ \t][^\n]*\n)+', re.MULTILINE)
          for filename, block in replacements.items():
            path = Path(filename)
            source = path.read_text()
            if re.search(r'(?m)^concurrency:\s*$', source):
              updated, count = concurrency_pattern.subn(block + '\n', source, count=1)
              if count != 1:
                raise SystemExit(f'{filename}: expected one concurrency block, found {count}')
            else:
              marker = '\njobs:\n'
              if marker not in source:
                raise SystemExit(f'{filename}: jobs marker missing')
              updated = source.replace(marker, '\n' + block + '\njobs:\n', 1)
            if updated == source:
              raise SystemExit(f'{filename}: concurrency patch made no change')
            path.write_text(updated)

          measure = Path('scripts/measure-phase11-ci-ownership.mjs')
          source = measure.read_text()
          old = "  const cancelsInProgress = /cancel-in-progress:\\s*true/.test(source)\n"
          new = "  const cancellationValue = lines.find((line) => /^  cancel-in-progress:\\s*/.test(line))?.replace(/^  cancel-in-progress:\\s*/, '').trim() || ''\n  const cancelsInProgress = cancellationValue === 'true' || /^\\$\\{\\{.*github\\.event_name.*pull_request.*\\}\\}$/.test(cancellationValue)\n"
          if old not in source:
            raise SystemExit('measure-phase11-ci-ownership: expected cancellation parser not found')
          source = source.replace(old, new, 1)
          source = source.replace("      cancelInProgress: cancelsInProgress,\n", "      cancelInProgress: cancelsInProgress,\n      value: cancellationValue,\n", 1)
          measure.write_text(source)

          artifact_root = Path('artifacts/phase11-cancellation-patch')
          for filename in [*replacements.keys(), str(measure)]:
            source_path = Path(filename)
            destination = artifact_root / filename
            destination.parent.mkdir(parents=True, exist_ok=True)
            shutil.copyfile(source_path, destination)
          PY

      - name: Verify measured cancellation gap is zero
        run: |
          node scripts/measure-phase11-ci-ownership.mjs artifacts/phase11-cancellation-patch/ci-ownership.json
          node scripts/verify-phase11-ci-ownership.mjs artifacts/phase11-cancellation-patch/ci-ownership.json
          jq -e '.counts.workflowsMissingLatestHeadCancellation == 0' artifacts/phase11-cancellation-patch/ci-ownership.json > /dev/null
          test "$(find artifacts/phase11-cancellation-patch/.github/workflows -type f | wc -l | tr -d ' ')" = '7'

      - uses: actions/upload-artifact@v4
        with:
          name: phase11-cancellation-patch
          path: artifacts/phase11-cancellation-patch/
          if-no-files-found: error
