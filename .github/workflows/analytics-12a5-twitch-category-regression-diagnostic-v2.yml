name: Analytics 12A5 Twitch Category Regression Diagnostic V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run-12a5-twitch-category-regression-diagnostic-v2.mjs'
      - '.github/workflows/analytics-12a5-twitch-category-regression-diagnostic-v2.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUTPUT_DIR: artifacts/12a5-twitch-category-regression-diagnostic-v2
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Parse diagnostic
        run: node --check scripts/run-12a5-twitch-category-regression-diagnostic-v2.mjs
      - name: Run corrected read-only regression diagnostic
        run: node scripts/run-12a5-twitch-category-regression-diagnostic-v2.mjs
      - name: Upload sanitized diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-12a5-twitch-category-regression-diagnostic-v2
          path: artifacts/12a5-twitch-category-regression-diagnostic-v2/*.json
          if-no-files-found: error
          retention-days: 30
