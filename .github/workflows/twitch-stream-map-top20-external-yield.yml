name: Twitch Stream Map Top 20 External Yield Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - 'workers/collector-twitch/src/entry.ts'
      - '.github/workflows/twitch-stream-map-top20-external-yield.yml'

permissions:
  contents: read

concurrency:
  group: twitch-stream-map-top20-external-yield-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sample:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_DIR: artifacts/twitch-stream-map-top20-external-yield
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler 4
        run: npm install --global wrangler@4

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - id: upload
        name: Upload non-production Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          alias="top20-pr-${{ github.event.pull_request.number }}"
          output="$(wrangler versions upload \
            --config workers/collector-twitch/wrangler.category-permanent.toml \
            --preview-alias "$alias" \
            --keep-vars 2>&1 | tee "$ARTIFACT_DIR/upload.txt")"
          preview_url="$(printf '%s\n' "$output" | sed -nE 's/.*Version Preview URL: (https:\/\/[^ ]+).*/\1/p' | tail -1)"
          test -n "$preview_url"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$preview_url" > "$ARTIFACT_DIR/preview-url.txt"

      - name: Capture fixed Top 20 identity sample
        shell: bash
        run: |
          set -euo pipefail
          preview_url='${{ steps.upload.outputs.preview_url }}'
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 3 --retry-all-errors \
            -X POST "$preview_url/audit/top20-external-yield-sample" \
            -o "$ARTIFACT_DIR/sample.json"

          jq -e '
            .ok == true and
            .result.mode == "read_only_fixed_top20_identity_sample" and
            .result.requestedSize == 20 and
            .result.sampleSize == 20 and
            .result.apiRequests.token == 1 and
            .result.apiRequests.streams == 1 and
            .result.apiRequests.users == 0 and
            .result.persistence.d1Writes == 0 and
            .result.persistence.productionDeployment == false and
            .result.persistence.rawTitleStored == false and
            .result.persistence.rawTagsStored == false and
            .result.persistence.rawLanguageStored == false and
            .result.persistence.rawProfileDescriptionStored == false and
            (.result.identities | length == 20) and
            ([.result.identities[].rank] == [range(1;21)]) and
            ([.result.identities[].login] | all(length > 0))
          ' "$ARTIFACT_DIR/sample.json" >/dev/null

          jq '{provider:.result.provider,mode:.result.mode,observedAt:.result.observedAt,sampleSize:.result.sampleSize,apiRequests:.result.apiRequests,persistence:.result.persistence,fieldsIncluded:.result.fieldsIncluded,identities:.result.identities}' \
            "$ARTIFACT_DIR/sample.json" > "$ARTIFACT_DIR/review-sample.json"
          cat "$ARTIFACT_DIR/review-sample.json"

      - name: Publish sample summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Twitch fixed Top 20 external-evidence sample'
            echo
            echo '- Production deployment: no'
            echo '- D1 writes: 0'
            if [ -f "$ARTIFACT_DIR/review-sample.json" ]; then
              echo "- Observed: $(jq -r '.observedAt' "$ARTIFACT_DIR/review-sample.json")"
              echo "- Sample size: $(jq -r '.sampleSize' "$ARTIFACT_DIR/review-sample.json")"
              echo
              echo '| Rank | Login | Viewers |'
              echo '| ---: | --- | ---: |'
              jq -r '.identities[] | "| \(.rank) | \(.login) | \(.viewers) |"' "$ARTIFACT_DIR/review-sample.json"
            else
              echo '- Sample result: missing'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Top 20 review sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twitch-stream-map-top20-external-yield-pr-${{ github.event.pull_request.number }}
          path: artifacts/twitch-stream-map-top20-external-yield
          if-no-files-found: warn
