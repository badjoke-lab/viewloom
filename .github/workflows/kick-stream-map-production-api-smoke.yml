name: Kick Stream Map Production API Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/functions/api/kick-stream-map.ts'
      - 'apps/web/functions/api/kick-stream-map-country-runtime-core.mjs'
      - 'apps/web/functions/api/kick-stream-map-reviewed-country-runtime-data.mjs'
      - '.github/workflows/kick-stream-map-production-api-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'workers/collector-kick/src/official-livestreams.ts'
      - 'apps/web/functions/api/kick-stream-map.ts'
      - 'apps/web/functions/api/kick-stream-map-public-adapter-core.mjs'
      - 'apps/web/functions/api/kick-stream-map-public-adapter-core.d.mts'
      - 'apps/web/functions/api/kick-stream-map-snapshot-source-core.mjs'
      - 'apps/web/functions/api/kick-stream-map-snapshot-source-core.d.mts'
      - 'apps/web/functions/api/kick-stream-map-country-runtime-core.mjs'
      - 'apps/web/functions/api/kick-stream-map-reviewed-country-runtime-data.mjs'
      - '.github/workflows/deploy-web-pages.yml'
      - '.github/workflows/kick-stream-map-production-api-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: kick-stream-map-production-api-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORIGIN: https://www.viewloom.net
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve production identity
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          require_exact=false

          if [ "$GITHUB_EVENT_NAME" = 'push' ] && git rev-parse HEAD^ >/dev/null 2>&1; then
            changed="$(git diff --name-only HEAD^ HEAD)"
            printf '%s\n' "$changed"
            if printf '%s\n' "$changed" | grep -Eq '^(apps/web/|\.github/workflows/deploy-web-pages\.yml$)'; then
              require_exact=true
            fi
          fi

          if [ "$require_exact" = true ]; then
            for attempt in {1..60}; do
              if curl --silent --show-error --fail --max-time 20 "$ORIGIN/deployment.json?kick-map-smoke=$GITHUB_RUN_ID&attempt=$attempt" -o deployment.json; then
                deployed="$(jq -r '.commit_sha // empty' deployment.json)"
                environment="$(jq -r '.environment // empty' deployment.json)"
                branch="$(jq -r '.branch // empty' deployment.json)"
                if [ "$deployed" = "$expected" ] && [ "$environment" = 'production' ] && [ "$branch" = 'main' ]; then
                  cat deployment.json
                  exit 0
                fi
                echo "Production is not on $expected yet (found $deployed, attempt $attempt/60)."
              fi
              sleep 10
            done
            echo "Exact production deployment $expected was not observed." >&2
            exit 1
          fi

          curl --silent --show-error --fail --max-time 30 "$ORIGIN/deployment.json?kick-map-smoke=$GITHUB_RUN_ID" -o deployment.json
          jq -e '.schema == "viewloom-deployment-v1" and .environment == "production" and .branch == "main" and (.commit_sha | type == "string" and length > 0)' deployment.json >/dev/null
          cat deployment.json

      - name: Verify currently deployed Kick API remains safely gated during PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            curl --silent --show-error --fail --max-time 30 "$ORIGIN/api/kick-stream-map?production-smoke=$GITHUB_RUN_ID&attempt=$attempt" -o kick-stream-map.json
            if jq -e '
              .platform == "kick" and
              .provider == "kick" and
              .source == "real" and
              .geographyMode == "country" and
              .publicActivationAuthorized == false and
              .identity.stableKey == "broadcaster_user_id" and
              .identity.slugIsStableIdentity == false and
              .semantics.twitchEvidenceReuseAllowed == false and
              .semantics.providerAggregationAllowed == false and
              .semantics.cityInferenceAllowed == false and
              .semantics.currentLocationPromotionAllowed == false and
              (
                (.version == "viewloom-kick-stream-map-public-adapter-v0.1" and .state == "blocked_reviewed_evidence") or
                (.version == "viewloom-kick-stream-map-country-runtime-v0.1" and (.state == "blocked_public_activation" or .state == "blocked_stable_identity"))
              )
            ' kick-stream-map.json >/dev/null; then
              break
            fi
            sleep 10
          done

          jq -e '
            .publicActivationAuthorized == false and
            ([paths | .[-1] | tostring | select(. == "stableKickUserId" or . == "broadcaster_user_id")] | length) == 0
          ' kick-stream-map.json >/dev/null
          jq '{version, implementationState, state, publicActivationAuthorized, coverage, identity, activation, semantics}' kick-stream-map.json

      - name: Verify production Kick K3 runtime connection and K4 block
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          observed=0
          stable=0
          reviewed=0
          mapped=0
          state=unknown
          for attempt in {1..60}; do
            curl --silent --show-error --fail --max-time 30 "$ORIGIN/api/kick-stream-map?production-smoke=$GITHUB_RUN_ID&attempt=$attempt" -o kick-stream-map.json
            observed="$(jq -r '.coverage.observedStreams // 0' kick-stream-map.json)"
            stable="$(jq -r '.coverage.stableIdentityStreams // 0' kick-stream-map.json)"
            reviewed="$(jq -r '.coverage.reviewedIdentityStreams // 0' kick-stream-map.json)"
            mapped="$(jq -r '.coverage.mappedStreams // 0' kick-stream-map.json)"
            state="$(jq -r '.state // "unknown"' kick-stream-map.json)"
            echo "Kick K3 production attempt $attempt/60: state=$state observed=$observed stable=$stable reviewed=$reviewed mapped=$mapped"
            if [ "$observed" -gt 0 ] && [ "$stable" -eq "$observed" ] && [ "$state" = 'blocked_public_activation' ]; then
              break
            fi
            sleep 10
          done

          jq '{version, implementationState, platform, provider, sourceMode, updatedAt, state, publicActivationAuthorized, coverage, identity, activation, semantics}' kick-stream-map.json

          jq -e '
            .version == "viewloom-kick-stream-map-country-runtime-v0.1" and
            .implementationState == "reviewed_country_runtime_connected" and
            .platform == "kick" and
            .provider == "kick" and
            .source == "real" and
            .geographyMode == "country" and
            .publicActivationAuthorized == false and
            .state == "blocked_public_activation" and
            .activation.publicCountryActivationReady == true and
            (.activation.blockers | index("public_country_activation_not_authorized")) != null and
            (.activation.blockers | index("reviewed_kick_country_evidence_runtime_not_connected")) == null and
            .identity.stableKey == "broadcaster_user_id" and
            .identity.slugIsStableIdentity == false and
            .coverage.observedStreams > 0 and
            .coverage.stableIdentityStreams == .coverage.observedStreams and
            .coverage.reviewedEvidenceCatalogSize == 100 and
            .coverage.reviewedIdentityStreams >= 0 and
            .coverage.unreviewedStableIdentityStreams >= 0 and
            .coverage.reconciliation.passes == true and
            .coverage.reconciliation.selectedPopulation == .coverage.observedStreams and
            .coverage.reconciliation.reconciledPopulation == .coverage.observedStreams and
            .semantics.stableIdentity == "broadcaster_user_id" and
            .semantics.slugIsStableIdentity == false and
            .semantics.stableIdentityPublished == false and
            .semantics.reviewedEvidenceRuntimeConnected == true and
            .semantics.twitchEvidenceReuseAllowed == false and
            .semantics.twitchCreatorKeyReuseAllowed == false and
            .semantics.providerAggregationAllowed == false and
            .semantics.automaticGeographyPromotionAllowed == false and
            .semantics.cityInferenceAllowed == false and
            .semantics.currentLocationPromotionAllowed == false and
            .semantics.preciseAddressAllowed == false and
            .semantics.preciseCoordinatesAllowed == false and
            ([paths | .[-1] | tostring | select(. == "stableKickUserId" or . == "broadcaster_user_id")] | length) == 0 and
            ([paths | .[-1] | tostring | select(. == "city" or . == "latitude" or . == "longitude" or . == "coordinates" or . == "currentLocation")] | length) == 0 and
            ([.mappedStreams[]? | select(.geography.state != "mapped" or (.geography.countryCode | test("^[A-Z]{2}$") | not))] | length) == 0
          ' kick-stream-map.json >/dev/null

          echo "Kick Stream Map K3 production proof: state=$state observed=$observed stable=$stable reviewed=$reviewed mapped=$mapped"

      - name: Upload production smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kick-stream-map-production-api-smoke
          path: |
            deployment.json
            kick-stream-map.json
          if-no-files-found: warn
          retention-days: 7
