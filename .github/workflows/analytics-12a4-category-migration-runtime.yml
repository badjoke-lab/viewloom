name: Analytics 12A4 Category Migration Runtime Retired

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a4-category-migration-runtime.yml'

permissions:
  contents: read

concurrency:
  group: analytics-12a4-category-migration-runtime-retired-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  retired-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify historical workflow is no longer an active collector gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/analytics-12a4-category-migration-runtime.yml').read_text()
          forbidden = [
              "workers/collector-kick/" + "src/entry.ts",
              "workers/collector-twitch/" + "src/entry.ts",
              "workers/shared/category-" + "capture.ts",
              "workflow_" + "dispatch:",
              "\n  " + "push:",
              "sched" + "ule:",
              "CLOUDFLARE_" + "API_TOKEN",
              "CLOUDFLARE_" + "ACCOUNT_ID",
              "wrangler@4 " + "deploy",
              "actions/" + "upload-artifact",
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'obsolete active surface remains: {token}')
          PY

      - name: Verify current category rollout policy
        run: node scripts/verify-category-rollout-policy.mjs

      - name: Typecheck current collectors
        run: pnpm typecheck:collectors

      - name: Publish retirement boundary
        if: always()
        run: |
          {
            echo '## ViewLoom 12A-4 category migration runtime — historical gate retired'
            echo
            echo '- Historical migration/runtime evidence remains in repository: yes'
            echo '- Active collector-source path trigger: no'
            echo '- Manual production-capable dispatch: no'
            echo '- Current category correctness authority: Category rollout policy + current phase gates'
            echo '- Collector runtime mutation by this workflow: none'
          } >> "$GITHUB_STEP_SUMMARY"
