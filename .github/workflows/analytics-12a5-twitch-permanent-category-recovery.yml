name: Analytics 12A5 Twitch Permanent Category Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a5-twitch-permanent-category-recovery.yml'
      - 'docs/audits/12a2-current-gate-state.json'
      - 'docs/audits/12a2-collector-worker-deploy-contract.json'
      - 'docs/audits/12a5-twitch-seven-day-accumulation-audit-rejection.json'
      - 'docs/audits/12a5-twitch-permanent-category-recovery-contract.json'
      - 'docs/audits/12a5-twitch-permanent-category-recovery-trigger.json'
      - 'scripts/run-12a4-twitch-permanent-category-observer.mjs'
      - 'scripts/verify-12a5-twitch-permanent-category-recovery-package.mjs'
      - 'workers/collector-twitch/wrangler.category-permanent.toml'
      - 'workers/collector-twitch/wrangler.toml'
  push:
    branches: [main]
    paths:
      - 'docs/audits/12a5-twitch-permanent-category-recovery-trigger.json'

permissions:
  contents: read

concurrency:
  group: analytics-12a5-twitch-permanent-category-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trigger_present: ${{ steps.classify.outputs.trigger_present }}
      start_at: ${{ steps.classify.outputs.start_at }}
    steps:
      - uses: actions/checkout@v4
      - id: classify
        name: Detect exact Twitch recovery trigger
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const path = 'docs/audits/12a5-twitch-permanent-category-recovery-trigger.json'
          const present = fs.existsSync(path)
          const trigger = present ? JSON.parse(fs.readFileSync(path, 'utf8')) : null
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `trigger_present=${present}\nstart_at=${trigger?.startAt ?? ''}\n`)
          NODE

  verify-package:
    if: github.event_name == 'pull_request' && needs.classify.outputs.trigger_present != 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Parse recovery package verifier and observer
        run: |
          node --check scripts/verify-12a5-twitch-permanent-category-recovery-package.mjs
          node --check scripts/run-12a4-twitch-permanent-category-observer.mjs
      - name: Verify dormant recovery package
        run: node scripts/verify-12a5-twitch-permanent-category-recovery-package.mjs
      - name: Verify provider-scoped collector deployment workflow
        run: node scripts/verify-12a2-collector-worker-deploy.mjs
      - name: Verify current category rollout policy
        run: node scripts/verify-category-rollout-policy.mjs
      - name: Verify collector typecheck
        run: pnpm typecheck:collectors
      - name: Bundle normal Twitch rollback collector without publishing
        run: pnpm dlx wrangler@4 deploy --dry-run --config workers/collector-twitch/wrangler.toml
      - name: Bundle permanent-category Twitch collector without publishing
        run: pnpm dlx wrangler@4 deploy --dry-run --config workers/collector-twitch/wrangler.category-permanent.toml

  validate-trigger:
    if: needs.classify.outputs.trigger_present == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate accepted package identity and bounded trigger
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const contract = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-permanent-category-recovery-contract.json', 'utf8'))
          const trigger = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-permanent-category-recovery-trigger.json', 'utf8'))
          if (contract.status !== 'accepted') throw new Error('recovery_package_not_accepted')
          if (trigger.schemaVersion !== contract.trigger.schemaVersion) throw new Error('trigger_schema_mismatch')
          if (trigger.status !== 'armed' || trigger.provider !== 'twitch' || trigger.oneTime !== true) throw new Error('trigger_identity_invalid')
          if (trigger.confirmation !== contract.trigger.confirmation) throw new Error('trigger_confirmation_invalid')
          if (trigger.packagePr !== contract.acceptance.packagePr) throw new Error('package_pr_mismatch')
          if (trigger.packageMergeSha !== contract.acceptance.packageMergeSha) throw new Error('package_sha_mismatch')
          const start = Date.parse(String(trigger.startAt ?? ''))
          const now = Date.now()
          if (!Number.isFinite(start) || start < now - 10 * 60_000 || start > now + contract.trigger.maximumStartDelayHours * 3_600_000) throw new Error('trigger_start_out_of_bounds')
          NODE

  inspect-production:
    if: github.event_name == 'pull_request'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUTPUT_DIR: artifacts/12a5-twitch-permanent-category-recovery/preflight
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Run fresh read-only Twitch recovery preflight
        run: MODE=preflight node scripts/run-12a4-twitch-permanent-category-observer.mjs
      - name: Upload sanitized recovery preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-12a5-twitch-permanent-category-recovery-preflight
          path: artifacts/12a5-twitch-permanent-category-recovery/preflight/*.json
          if-no-files-found: error
          retention-days: 30

  recover:
    if: github.event_name == 'push' && needs.classify.outputs.trigger_present == 'true'
    needs:
      - classify
      - validate-trigger
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      START_AT: ${{ needs.classify.outputs.start_at }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Wait for exact Twitch recovery start boundary
        run: |
          node --input-type=module - <<'NODE'
          const start = Date.parse(process.env.START_AT)
          if (!Number.isFinite(start)) throw new Error('invalid_start_at')
          const delay = start - Date.now()
          if (delay > 3 * 3_600_000) throw new Error('start_delay_above_three_hours')
          if (delay > 0) await new Promise((resolve) => setTimeout(resolve, delay))
          NODE
      - id: preflight
        name: Run final read-only Twitch recovery preflight
        continue-on-error: true
        env:
          OUTPUT_DIR: artifacts/12a5-twitch-permanent-category-recovery/final-preflight
        run: MODE=preflight node scripts/run-12a4-twitch-permanent-category-observer.mjs
      - id: deploy
        name: Deploy only the Twitch permanent-category config
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        run: pnpm dlx wrangler@4 deploy --config workers/collector-twitch/wrangler.category-permanent.toml
      - id: observe
        name: Verify two consecutive Twitch category snapshots
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          OUTPUT_DIR: artifacts/12a5-twitch-permanent-category-recovery/observe
        run: |
          set +e
          passed=false
          for attempt in $(seq 1 20); do
            echo "Twitch recovery observation attempt $attempt/20"
            MODE=observe node scripts/run-12a4-twitch-permanent-category-observer.mjs
            status=$?
            if [ "$status" -eq 0 ]; then
              passed=true
              break
            fi
            sleep 60
          done
          test "$passed" = true
      - name: Restore normal Twitch configuration on recovery failure
        if: steps.preflight.outcome == 'success' && (steps.deploy.outcome != 'success' || steps.observe.outcome != 'success')
        run: pnpm dlx wrangler@4 deploy --config workers/collector-twitch/wrangler.toml
      - name: Verify normal Twitch recovery after rollback
        if: steps.preflight.outcome == 'success' && (steps.deploy.outcome != 'success' || steps.observe.outcome != 'success')
        env:
          OUTPUT_DIR: artifacts/12a5-twitch-permanent-category-recovery/rollback
        run: MODE=rollback node scripts/run-12a4-twitch-permanent-category-observer.mjs
      - name: Upload sanitized Twitch recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-12a5-twitch-permanent-category-recovery-start
          path: artifacts/12a5-twitch-permanent-category-recovery/**/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail after bounded recovery or verified rollback
        if: steps.preflight.outcome != 'success' || steps.deploy.outcome != 'success' || steps.observe.outcome != 'success'
        run: exit 1
