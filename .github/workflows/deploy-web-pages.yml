name: Deploy Web Pages

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-web-pages.yml'
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-web-pages.yml'
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || 'viewloom-web-pages-production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VIEWLOOM_PAGES_PROJECT: viewloom
  VIEWLOOM_PAGES_URL: https://viewloom.pages.dev

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Typecheck and build web application
        run: |
          pnpm --filter @viewloom/web typecheck
          pnpm build:web
      - name: Verify deployment workflow boundary
        run: |
          grep -Fq 'VIEWLOOM_PAGES_PROJECT: viewloom' .github/workflows/deploy-web-pages.yml
          grep -Fq 'set -euo pipefail' .github/workflows/deploy-web-pages.yml
          grep -Fq 'wrangler pages deploy apps/web/dist' .github/workflows/deploy-web-pages.yml
          grep -Fq 'CF_PAGES_COMMIT_SHA' .github/workflows/deploy-web-pages.yml
          grep -Fq 'CLOUDFLARE_PAGES_API_TOKEN' .github/workflows/deploy-web-pages.yml
          grep -Fq 'CLOUDFLARE_ACCOUNT_ID' .github/workflows/deploy-web-pages.yml
          grep -Fq "github.event_name != 'pull_request'" .github/workflows/deploy-web-pages.yml
          grep -Fq 'if: always()' .github/workflows/deploy-web-pages.yml
          test -f apps/web/dist/twitch/history/index.html
          test -f apps/web/dist/kick/history/index.html

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Require Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Build current main web application with production identity
        env:
          CF_PAGES: '1'
          CF_PAGES_BRANCH: main
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}
          CF_PAGES_URL: ${{ env.VIEWLOOM_PAGES_URL }}
        run: pnpm build:web
      - name: Record verified Pages project identity
        run: |
          mkdir -p artifacts/web-pages-deploy
          jq -n \
            --arg project "$VIEWLOOM_PAGES_PROJECT" \
            --arg pages_url "$VIEWLOOM_PAGES_URL" \
            --arg commit "$GITHUB_SHA" \
            --arg source_run '30622511725' \
            '{schema:"viewloom-web-pages-deploy-v1", project:$project, pages_url:$pages_url, commit:$commit, identity_source:{type:"retained-production-smoke-artifact", workflow_run:$source_run, observed_pages_url:"https://368de0f6.viewloom.pages.dev"}, recorded_at:(now|todateiso8601)}' \
            > artifacts/web-pages-deploy/resolution.json
          jq -e '.environment == "production" and .branch == "main" and .commit_sha == env.GITHUB_SHA' apps/web/dist/deployment.json
      - name: Install Wrangler 4
        run: npm install --global wrangler@4
      - name: Deploy web build directly to verified Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler pages deploy apps/web/dist \
            --project-name "$VIEWLOOM_PAGES_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Deploy ViewLoom web $GITHUB_SHA" \
            | tee artifacts/web-pages-deploy/wrangler.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-pages-deploy-evidence
          path: artifacts/web-pages-deploy/
          if-no-files-found: warn
