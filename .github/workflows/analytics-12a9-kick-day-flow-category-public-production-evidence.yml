name: Analytics 12A9 Kick Day Flow Category Public Production Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a9-kick-day-flow-category-public-production-evidence.yml'
      - '.github/workflows/analytics-12a9-kick-day-flow-category-public-cutover.yml'
      - 'docs/audits/12a9-kick-day-flow-category-public-production-evidence.json'
      - 'docs/audits/12a9-kick-day-flow-category-public-production-acceptance.json'
      - 'scripts/verify-12a9-kick-day-flow-category-public-production-evidence.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a9-kick-day-flow-category-public-production-evidence.yml'
      - '.github/workflows/analytics-12a9-kick-day-flow-category-public-cutover.yml'
      - 'docs/audits/12a9-kick-day-flow-category-public-production-evidence.json'
      - 'docs/audits/12a9-kick-day-flow-category-public-production-acceptance.json'
      - 'scripts/verify-12a9-kick-day-flow-category-public-production-evidence.mjs'

permissions:
  contents: read

concurrency:
  group: analytics-12a9-kick-day-flow-public-production-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Verify exact five-file evidence acceptance scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(\.github/workflows/analytics-12a9-kick-day-flow-category-public-production-evidence\.yml|\.github/workflows/analytics-12a9-kick-day-flow-category-public-cutover\.yml|docs/audits/12a9-kick-day-flow-category-public-production-evidence\.json|docs/audits/12a9-kick-day-flow-category-public-production-acceptance\.json|scripts/verify-12a9-kick-day-flow-category-public-production-evidence\.mjs)$'
          test "${#changed[@]}" -eq 5
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected public evidence acceptance change: $file" >&2; exit 1; }
          done
      - name: Verify frozen public production evidence
        run: node scripts/verify-12a9-kick-day-flow-category-public-production-evidence.mjs
      - name: Verify historical hidden candidate remains auditable
        run: node scripts/verify-12a9-kick-day-flow-category-candidate.mjs
      - name: Verify retained public cutover semantics
        run: node scripts/verify-12a9-kick-day-flow-category-public-cutover.mjs
      - name: Verify retained provider architecture contracts
        run: |
          node scripts/verify-quality-u10g-architecture.mjs
          node scripts/verify-quality-u10d-analysis-coherence.mjs
      - name: Verify retained production and Day Flow contracts
        working-directory: apps/web
        run: |
          node scripts/verify-production-source.mjs
          node scripts/verify-dayflow-qa.mjs
          node scripts/verify-launch-readiness.mjs
      - name: Typecheck and build unchanged product
        run: |
          pnpm typecheck:web
          pnpm build:web
      - name: Publish permanent public acceptance boundary
        if: always()
        run: |
          {
            echo '## Kick Day Flow public Category production evidence'
            echo
            echo '- Public implementation SHA: 851f7a56ea24a5375feb091ec16399e0406f1638'
            echo '- Production run: 31515011810'
            echo '- Production job: 93858031986'
            echo '- Artifact: 9110734867'
            echo '- Scenarios: 5 / 5 pass'
            echo '- Public desktop: 127 category options; selected category 15; 21 bands'
            echo '- 390px mobile: no overflow; retained 44px touch-target contract passed'
            echo '- Unknown category: live global field; selected bands=0; Others=1; no false Empty'
            echo '- Twitch public provider boundary: preserved'
            echo '- Human visual acceptance: pass'
            echo '- One-shot public production workflow: retired'
            echo '- Kick Battle Lines / History category UI: not authorized'
          } >> "$GITHUB_STEP_SUMMARY"
