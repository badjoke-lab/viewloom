name: Analytics 12A4 Kick Category Capture Canary Package Retired

# Historical canary package record. Accepted contracts, fixtures, and verifier
# scripts remain in the repository; this Actions entry point is archival only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-12a4-kick-category-capture-canary-package-retired-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-record:
    runs-on: ubuntu-latest
    steps:
      - name: Publish retirement summary
        run: |
          {
            echo '## ViewLoom 12A-4-8 Kick Category Capture Canary Package — retired record'
            echo
            echo '- Provider: Kick only'
            echo '- Historical contracts/verifiers remain in the repository'
            echo '- Automatic PR gate: retired'
            echo '- Production deployment: no'
            echo '- Production category capture: no'
            echo '- Twitch start: no'
          } >> "$GITHUB_STEP_SUMMARY"
