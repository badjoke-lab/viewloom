name: Analytics 12A7 Twitch History Category Decision

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/audits/12a7-twitch-history-category-feasibility-decision.json'
      - 'scripts/verify-12a7-twitch-history-category-feasibility-decision.mjs'
      - '.github/workflows/analytics-12a7-twitch-history-category-decision.yml'

permissions:
  contents: read

concurrency:
  group: analytics-12a7-twitch-history-category-decision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout decision head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify History category decision and unchanged runtime basis
        run: node scripts/verify-12a7-twitch-history-category-feasibility-decision.mjs

      - name: Verify decision-only PR scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(docs/audits/12a7-twitch-history-category-feasibility-decision\.json|scripts/verify-12a7-twitch-history-category-feasibility-decision\.mjs|\.github/workflows/analytics-12a7-twitch-history-category-decision\.yml)$'
          for path in "${changed[@]}"; do
            if ! [[ "$path" =~ $allowed ]]; then
              echo "Unexpected non-decision change: $path" >&2
              exit 1
            fi
          done
          test "${#changed[@]}" -eq 3

      - name: Publish decision boundary
        if: always()
        run: |
          {
            echo '## Twitch History category feasibility decision'
            echo
            echo '- Current unfiltered History: daily_rollups first, minute_snapshots fallback'
            echo '- Exact category membership source: retained minute_snapshots categoryRefs/categoryIds'
            echo '- Raw category retention boundary: 30 days'
            echo '- History requested range maximum: 90 days'
            echo '- Category-blind daily_rollups: prohibited for selected-category truth'
            echo '- 90-day intraday dominant-category rollups: prohibited as exact category totals/rankings'
            echo '- Category membership: per observed snapshot'
            echo '- Older unsupported days: unavailable, never inferred zero'
            echo '- Hidden Twitch History category candidate: authorized on merge'
            echo '- Default-route public exposure: not authorized'
            echo '- Kick category UI: not authorized'
            echo '- Collector / D1 / cadence / retention / backfill change: not authorized'
          } >> "$GITHUB_STEP_SUMMARY"
