name: Analytics 12A24 Kick History Re-probe Reauthorization Decision

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a24-kick-history-category-reprobe-reauthorization-decision.yml'
      - 'docs/audits/12a24-kick-history-category-reprobe-reauthorization-decision.json'
      - 'scripts/verify-12a24-kick-history-category-reprobe-reauthorization-decision.mjs'

permissions:
  contents: read

concurrency:
  group: analytics-12a24-kick-history-reprobe-reauthorization-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify 12A24 reauthorization decision
        run: node scripts/verify-12a24-kick-history-category-reprobe-reauthorization-decision.mjs

      - name: Verify exact decision scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          expected=(
            '.github/workflows/analytics-12a24-kick-history-category-reprobe-reauthorization-decision.yml'
            'docs/audits/12a24-kick-history-category-reprobe-reauthorization-decision.json'
            'scripts/verify-12a24-kick-history-category-reprobe-reauthorization-decision.mjs'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$path"
          done

      - name: Revalidate accepted failure and root-cause repair
        run: |
          node scripts/verify-12a23-kick-history-category-reprobe-confirmation-root-cause.mjs
          node scripts/verify-12a22-kick-history-category-reprobe-failure.mjs
          node scripts/verify-12a18-kick-history-category-cost-bound.mjs
          python3 scripts/test-12a18-kick-history-category-cost-bound.py
          pnpm typecheck:collectors
          pnpm verify:collectors
          pnpm typecheck:web
          pnpm build:web

      - name: Verify production surface remains retired
        run: |
          set -euo pipefail
          retired='.github/workflows/analytics-12a20-kick-history-category-reprobe-execution.yml'
          ! grep -Eq '^[[:space:]]+push:' "$retired"
          ! grep -q 'production-reprobe:' "$retired"
          ! grep -q 'CLOUDFLARE_API_TOKEN' "$retired"
          ! grep -q 'CLOUDFLARE_ACCOUNT_ID' "$retired"
          ! grep -q 'actions/upload-artifact' "$retired"
          ! test -f docs/audits/12a25-kick-history-category-reprobe-trigger.json

      - name: Publish decision boundary
        if: always()
        run: |
          {
            echo '## Kick History re-probe — 12A24 reauthorization decision'
            echo
            echo '- Decision: YES, authorize exactly one new dormant execution package only'
            echo '- Production execution: not authorized'
            echo '- New trigger merge: not authorized'
            echo '- Old #876 trigger: consumed and retired'
            echo '- Retired 12A20/12A21 production workflow: remains retired'
            echo '- Historical completed measurement: 843,288 rows read / 250,000 max = FAIL'
            echo '- Replacement run 31959926240: cost not measured; confirmation mismatch repaired'
            echo '- Runner/Worker confirmation equality: enforced'
            echo '- Rows-read hard maximum: 250,000 unchanged'
            echo '- Next gate: build one new dormant package under new authority'
          } >> "$GITHUB_STEP_SUMMARY"
