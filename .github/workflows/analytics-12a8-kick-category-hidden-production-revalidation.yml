name: Analytics 12A8 Kick Category Hidden Production Revalidation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a8-kick-category-hidden-production-revalidation.yml'
      - 'docs/audits/12a8-kick-heatmap-category-hidden-production-revalidation-contract.json'
      - 'apps/web/scripts/kick-category-hidden-production-revalidation.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a8-kick-category-hidden-production-revalidation.yml'
      - 'docs/audits/12a8-kick-heatmap-category-hidden-production-revalidation-contract.json'
      - 'apps/web/scripts/kick-category-hidden-production-revalidation.mjs'

permissions:
  contents: read

concurrency:
  group: analytics-12a8-kick-category-hidden-production-revalidation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Verify exact revalidation package scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(\.github/workflows/analytics-12a8-kick-category-hidden-production-revalidation\.yml|docs/audits/12a8-kick-heatmap-category-hidden-production-revalidation-contract\.json|apps/web/scripts/kick-category-hidden-production-revalidation\.mjs)$'
          test "${#changed[@]}" -eq 3
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "Unexpected revalidation package change: $path" >&2; exit 1; }
          done
      - name: Verify revalidation authority and read-only boundary
        run: |
          node --check apps/web/scripts/kick-category-hidden-production-revalidation.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const json = (path) => JSON.parse(fs.readFileSync(path, 'utf8'))
          const contract = json('docs/audits/12a8-kick-heatmap-category-hidden-production-revalidation-contract.json')
          const decision = json('docs/audits/12a8-kick-heatmap-category-feasibility-decision.json')
          const api = json('docs/audits/12a8-kick-heatmap-category-api-package-contract.json')
          const controls = json('docs/audits/12a8-kick-heatmap-category-hidden-controls-contract.json')

          if (contract.status !== 'ready_for_validation') throw new Error('revalidation_contract_status_invalid')
          if (contract.provider !== 'kick' || contract.feature !== 'heatmap_category_filter') throw new Error('revalidation_identity_invalid')
          if (contract.authority.decisionPr !== 769 || contract.authority.apiPackagePr !== 771 || contract.authority.controlsPackagePr !== 772) throw new Error('authority_chain_mismatch')
          if (contract.authority.controlsMergeSha !== '555e30a754f4dee74e8ebe21fb59f85ef2b5a4b0') throw new Error('controls_merge_sha_mismatch')
          if (contract.authority.hiddenRevalidationAuthorized !== true || contract.authority.publicCutoverAuthorized !== false) throw new Error('authorization_boundary_invalid')
          if (decision.decision !== 'authorize_hidden_kick_heatmap_category_candidate') throw new Error('decision_contract_mismatch')
          if (decision.authorization.hiddenCandidateImplementationAuthorized !== true || decision.authorization.publicExposureAuthorized !== false) throw new Error('decision_authorization_changed')
          if (api.provider !== 'kick' || api.apiContract.filterBeforeTopN !== true || api.hiddenBoundary.publicExposureAuthorized !== false) throw new Error('api_package_boundary_changed')
          if (controls.provider !== 'kick' || controls.hiddenEntry.kickOnlyHiddenGate !== true || controls.hiddenEntry.publicKickExposureAuthorized !== false) throw new Error('controls_package_boundary_changed')
          if (contract.execution.productionOnPullRequest !== false || contract.execution.productionOnMainPush !== true || contract.execution.productionWaitsForExactWorkflowSha !== true) throw new Error('production_execution_boundary_invalid')
          if (contract.target.hiddenEntry !== 'categoryPreview=1') throw new Error('hidden_entry_changed')
          for (const [key, value] of Object.entries(contract.requiredChecks)) if (value !== true) throw new Error(`required_check_${key}_not_enabled`)
          for (const [key, value] of Object.entries(contract.boundary)) {
            if (key === 'readOnly') {
              if (value !== true) throw new Error('revalidation_must_be_read_only')
            } else if (value !== false) {
              throw new Error(`boundary_${key}_must_remain_false`)
            }
          }
          NODE
      - name: Verify retained hidden Kick packages and rollout policy
        run: |
          node scripts/verify-12a8-kick-heatmap-category-api-package.mjs
          node scripts/verify-12a8-kick-heatmap-category-controls-package.mjs
          node scripts/verify-category-rollout-policy.mjs
      - name: Typecheck and build web
        run: |
          pnpm typecheck:web
          pnpm build:web
      - name: Verify public HTML still contains no hidden Kick controls
        run: |
          test -f apps/web/dist/kick/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/kick/heatmap/index.html
          ! grep -q 'heatmap-category-preview-controls' apps/web/dist/kick/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/kick/heatmap/index.html

  production:
    if: github.event_name == 'push'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUTPUT_DIR: artifacts/12a8-kick-category-hidden-production-revalidation
      VIEWLOOM_ORIGIN: https://www.viewloom.net
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for exact main SHA on primary production
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          success=false
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 20 "$VIEWLOOM_ORIGIN/deployment.json?kickCategoryRevalidation=$GITHUB_RUN_ID-$attempt" -o /tmp/deployment.json; then
              cp /tmp/deployment.json "$OUTPUT_DIR/last-deployment.json"
              observed_sha=$(jq -r '.commit_sha // ""' /tmp/deployment.json)
              environment=$(jq -r '.environment // ""' /tmp/deployment.json)
              branch=$(jq -r '.branch // ""' /tmp/deployment.json)
              printf 'attempt=%s expected=%s observed=%s environment=%s branch=%s\n' "$attempt" "$EXPECTED_SHA" "$observed_sha" "$environment" "$branch"
              if [[ "$observed_sha" == "$EXPECTED_SHA" && "$environment" == 'production' && "$branch" == 'main' ]]; then
                success=true
                break
              fi
            fi
            sleep 5
          done
          if [[ "$success" != true ]]; then
            echo "Primary production did not publish exact validation SHA $EXPECTED_SHA" >&2
            test -f "$OUTPUT_DIR/last-deployment.json" && cat "$OUTPUT_DIR/last-deployment.json" >&2
            exit 1
          fi
      - name: Install Playwright
        run: npm install playwright@1.52.0 --no-save --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - id: browser
        name: Revalidate hidden Kick category filter against exact production SHA
        continue-on-error: true
        run: node apps/web/scripts/kick-category-hidden-production-revalidation.mjs
      - name: Upload hidden production revalidation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-12a8-kick-category-hidden-production-revalidation
          path: artifacts/12a8-kick-category-hidden-production-revalidation/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence upload when revalidation rejects
        if: steps.browser.outcome != 'success'
        run: exit 1
