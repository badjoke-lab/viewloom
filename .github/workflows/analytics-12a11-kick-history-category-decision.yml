name: Analytics 12A11 Kick History Category Decision

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/audits/12a11-kick-history-category-feasibility-decision.json'
      - 'scripts/verify-12a11-kick-history-category-feasibility-decision.mjs'
      - '.github/workflows/analytics-12a11-kick-history-category-decision.yml'

permissions:
  contents: read

concurrency:
  group: analytics-12a11-kick-history-category-decision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout decision head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify Kick History category feasibility decision
        run: node scripts/verify-12a11-kick-history-category-feasibility-decision.mjs

      - name: Verify decision-only PR scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(docs/audits/12a11-kick-history-category-feasibility-decision\.json|scripts/verify-12a11-kick-history-category-feasibility-decision\.mjs|\.github/workflows/analytics-12a11-kick-history-category-decision\.yml)$'
          for path in "${changed[@]}"; do
            if ! [[ "$path" =~ $allowed ]]; then
              echo "Unexpected non-decision change: $path" >&2
              exit 1
            fi
          done
          test "${#changed[@]}" -eq 3

      - name: Verify retained architecture and production boundaries
        run: |
          node scripts/verify-quality-u10g-architecture.mjs
          node scripts/verify-quality-u10d-analysis-coherence.mjs
          cd apps/web
          node scripts/verify-production-source.mjs

      - name: Typecheck and build web
        run: |
          pnpm typecheck:web
          pnpm build:web

      - name: Publish decision boundary
        if: always()
        run: |
          {
            echo '## Kick History category feasibility decision'
            echo
            echo '- Decision: reject category-aware Kick History on current accepted data'
            echo '- Existing unfiltered Kick History: required fallback and unchanged'
            echo '- Exact category source: observation-time snapshot categoryRefs/categoryIds'
            echo '- Exact Kick snapshot retention: 60 days'
            echo '- Existing Kick History custom range: up to 90 days'
            echo '- Existing previous-period comparison: retained contract'
            echo '- Daily rollup retention: 180 days, but category identity/contribution is not retained'
            echo '- Latest-category back-projection / synthetic mapping / zero-filling: prohibited'
            echo '- Hidden Kick History category candidate: not authorized'
            echo '- Collector / Worker / D1 / cadence / retention / backfill change: not authorized'
            echo '- Twitch runtime semantics: unchanged'
          } >> "$GITHUB_STEP_SUMMARY"
