name: Analytics 12A8 Kick Category Hidden Production Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a8-kick-category-hidden-production-evidence.yml'
      - '.github/workflows/analytics-12a8-kick-category-hidden-visual-revalidation.yml'
      - 'docs/audits/12a8-kick-heatmap-category-hidden-corrected-visual-production-evidence.json'
      - 'docs/audits/12a8-kick-heatmap-category-hidden-production-acceptance.json'
      - 'docs/audits/12a8-kick-heatmap-category-hidden-visual-correction-contract.json'
      - 'scripts/verify-12a8-kick-heatmap-category-hidden-production-evidence.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a8-kick-category-hidden-production-evidence.yml'
      - '.github/workflows/analytics-12a8-kick-category-hidden-visual-revalidation.yml'
      - 'docs/audits/12a8-kick-heatmap-category-hidden-corrected-visual-production-evidence.json'
      - 'docs/audits/12a8-kick-heatmap-category-hidden-production-acceptance.json'
      - 'docs/audits/12a8-kick-heatmap-category-hidden-visual-correction-contract.json'
      - 'scripts/verify-12a8-kick-heatmap-category-hidden-production-evidence.mjs'

permissions:
  contents: read

concurrency:
  group: analytics-12a8-kick-category-hidden-production-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Verify corrected evidence-acceptance scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(\.github/workflows/analytics-12a8-kick-category-hidden-production-evidence\.yml|\.github/workflows/analytics-12a8-kick-category-hidden-visual-revalidation\.yml|docs/audits/12a8-kick-heatmap-category-hidden-corrected-visual-production-evidence\.json|docs/audits/12a8-kick-heatmap-category-hidden-production-acceptance\.json|docs/audits/12a8-kick-heatmap-category-hidden-visual-correction-contract\.json|scripts/verify-12a8-kick-heatmap-category-hidden-production-evidence\.mjs)$'
          test "${#changed[@]}" -eq 6
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "Unexpected corrected evidence-acceptance change: $path" >&2; exit 1; }
          done
      - name: Verify accepted corrected production evidence
        run: |
          node --check scripts/verify-12a8-kick-heatmap-category-hidden-production-evidence.mjs
          node scripts/verify-12a8-kick-heatmap-category-hidden-production-evidence.mjs
      - name: Verify one-shot visual workflow is retired
        run: |
          test ! -f .github/workflows/analytics-12a8-kick-category-hidden-visual-revalidation.yml
          test -f apps/web/scripts/kick-category-hidden-visual-revalidation.mjs
      - name: Verify retained provider and rollout boundaries
        run: |
          node scripts/verify-12a8-kick-heatmap-category-controls-package.mjs
          node scripts/verify-12a5-twitch-heatmap-category-public-cutover.mjs
          node scripts/verify-category-rollout-policy.mjs
      - name: Typecheck and build unchanged product
        run: |
          pnpm typecheck:web
          pnpm build:web
      - name: Verify normal Kick HTML remains category-control free
        run: |
          test -f apps/web/dist/kick/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/kick/heatmap/index.html
          ! grep -q 'heatmap-category-preview-controls' apps/web/dist/kick/heatmap/index.html
