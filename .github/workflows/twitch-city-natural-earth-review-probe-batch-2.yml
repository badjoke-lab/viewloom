name: Twitch City Natural Earth Review Probe Batch 2

on:
  push:
    branches:
      - feature/twitch-city-reference-point-review-probe-batch-2
    paths:
      - .github/workflows/twitch-city-natural-earth-review-probe-batch-2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-natural-earth-reference-points:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract Natural Earth v5.1.2 candidate features
        shell: bash
        run: |
          node <<'NODE'
          const version = '5.1.2';
          const base = `https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v${version}`;
          const geojsonUrl = `${base}/geojson/ne_10m_populated_places_simple.geojson`;
          const versionUrl = `${base}/10m_cultural/ne_10m_populated_places_simple.VERSION.txt`;

          const [geojsonResponse, versionResponse] = await Promise.all([
            fetch(geojsonUrl),
            fetch(versionUrl),
          ]);
          if (!geojsonResponse.ok) throw new Error(`Natural Earth GeoJSON fetch failed: ${geojsonResponse.status}`);
          if (!versionResponse.ok) throw new Error(`Natural Earth VERSION fetch failed: ${versionResponse.status}`);

          const reportedVersion = (await versionResponse.text()).trim();
          if (reportedVersion !== version) throw new Error(`Natural Earth version mismatch: expected ${version}, got ${reportedVersion}`);

          const collection = await geojsonResponse.json();
          const targets = [
            { key: 'DE|__none__|cologne', name: 'Cologne', isoA2: 'DE' },
            { key: 'ES|__none__|sant-cugat-del-valles', name: 'Sant Cugat del Valles', isoA2: 'ES' },
            { key: 'RU|__none__|moscow', name: 'Moscow', isoA2: 'RU' },
            { key: 'US|__none__|austin', name: 'Austin', isoA2: 'US' },
            { key: 'US|__none__|los-angeles', name: 'Los Angeles', isoA2: 'US' },
            { key: 'US|__none__|miami', name: 'Miami', isoA2: 'US' },
          ];

          const summarize = (feature) => ({
            name: feature.properties?.name ?? null,
            nameascii: feature.properties?.nameascii ?? null,
            adm0name: feature.properties?.adm0name ?? null,
            adm1name: feature.properties?.adm1name ?? null,
            iso_a2: feature.properties?.iso_a2 ?? null,
            featurecla: feature.properties?.featurecla ?? null,
            ne_id: feature.properties?.ne_id ?? null,
            latitude: feature.properties?.latitude ?? null,
            longitude: feature.properties?.longitude ?? null,
            geometry: feature.geometry ?? null,
          });

          console.log(`dataset=ne_10m_populated_places_simple version=${reportedVersion} featureCount=${collection.features.length}`);
          for (const target of targets) {
            const matches = collection.features.filter((feature) => {
              const p = feature.properties ?? {};
              const names = [p.name, p.nameascii].filter(Boolean);
              return names.includes(target.name) && p.iso_a2 === target.isoA2;
            });
            console.log(JSON.stringify({ key: target.key, matchCount: matches.length, matches: matches.map(summarize) }));
          }
          NODE
