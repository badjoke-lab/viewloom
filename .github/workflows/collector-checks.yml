name: Collector checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'workers/**'
      - 'scripts/verify-collector-contracts.mjs'
      - 'apps/web/functions/_provider-runtime.ts'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/actions/setup-node-pnpm/action.yml'
      - '.github/workflows/collector-checks.yml'
      - '.github/workflows/twitch-location-live-yield-probe.yml'
  push:
    branches:
      - main
    paths:
      - 'workers/**'
      - 'scripts/verify-collector-contracts.mjs'
      - 'apps/web/functions/_provider-runtime.ts'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/actions/setup-node-pnpm/action.yml'
      - '.github/workflows/collector-checks.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collector-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Typecheck collectors
        run: pnpm typecheck:collectors
      - name: Verify collector contracts
        run: pnpm verify:collectors
      - name: Require Twitch probe credentials
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        shell: bash
        run: |
          test -n "$TWITCH_CLIENT_ID"
          test -n "$TWITCH_CLIENT_SECRET"
      - name: Probe live Top 300 location evidence yield
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node workers/collector-twitch/scripts/probe-location-evidence.mjs | tee twitch-location-live-yield.json
      - name: Upload live yield result
        uses: actions/upload-artifact@v4
        with:
          name: twitch-location-live-yield
          path: twitch-location-live-yield.json
          if-no-files-found: error
