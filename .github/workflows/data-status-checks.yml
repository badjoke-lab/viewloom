name: Data Status Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/twitch/status/**'
      - 'apps/web/kick/status/**'
      - 'apps/web/src/status-page.css'
      - 'apps/web/src/live/status-*.ts'
      - 'apps/web/functions/api/twitch-status.ts'
      - 'apps/web/functions/api/kick-status.ts'
      - 'apps/web/scripts/verify-data-status-page.mjs'
      - 'apps/web/scripts/data-status-browser.mjs'
      - 'apps/web/docs/data-status-page-contract.md'
      - '.github/workflows/data-status-checks.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck web
        run: pnpm --filter @viewloom/web typecheck
      - name: Verify Data Status contract
        working-directory: apps/web
        run: node scripts/verify-data-status-page.mjs
      - name: Build web
        run: pnpm build:web
      - name: Start local Data Status preview
        run: |
          pnpm --filter @viewloom/web preview --host 127.0.0.1 --port 4173 > /tmp/data-status-preview.log 2>&1 &
          for attempt in {1..40}; do
            curl --silent --fail http://127.0.0.1:4173/twitch/status/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/data-status-preview.log
          exit 1
      - name: Install Playwright in isolated prefix
        working-directory: apps/web
        run: node scripts/install-ci-playwright.mjs
      - name: Install Chromium
        run: /tmp/viewloom-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Run Data Status browser gate
        working-directory: apps/web
        env:
          STATUS_BASE_URL: http://127.0.0.1:4173
        run: node scripts/data-status-browser.mjs 2>&1 | tee /tmp/data-status-browser.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: data-status-screenshots
          path: /tmp/data-status-*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: data-status-diagnostics
          path: |
            /tmp/data-status-browser.log
            /tmp/data-status-preview.log
          if-no-files-found: warn
