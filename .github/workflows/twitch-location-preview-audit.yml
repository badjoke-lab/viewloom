name: Twitch Location Preview Audit

on:
  push:
    branches:
      - feature/twitch-location-external-source-audit
    paths:
      - 'workers/collector-twitch/src/entry.ts'
      - 'workers/collector-twitch/src/location-evidence-audit.ts'
      - 'workers/collector-twitch/src/location-acquisition-sample.ts'
      - '.github/workflows/twitch-location-preview-audit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'workers/collector-twitch/src/entry.ts'
      - 'workers/collector-twitch/src/location-evidence-audit.ts'
      - 'workers/collector-twitch/src/location-acquisition-sample.ts'
      - '.github/workflows/twitch-location-preview-audit.yml'

permissions:
  contents: read

concurrency:
  group: twitch-location-preview-audit-970
  cancel-in-progress: true

jobs:
  preview-audit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_DIR: artifacts/twitch-location-preview-audit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler 4
        run: npm install --global wrangler@4

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - id: upload
        name: Upload non-production Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          alias="audit-pr-970"
          output="$(wrangler versions upload \
            --config workers/collector-twitch/wrangler.category-permanent.toml \
            --preview-alias "$alias" \
            --keep-vars 2>&1 | tee "$ARTIFACT_DIR/upload.txt")"
          preview_url="$(printf '%s\n' "$output" | sed -nE 's/.*Version Preview URL: (https:\/\/[^ ]+).*/\1/p' | tail -1)"
          if [ -z "$preview_url" ]; then
            echo 'Failed to determine Worker version preview URL.' >&2
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$preview_url" > "$ARTIFACT_DIR/preview-url.txt"

      - name: Run read-only location evidence audit
        shell: bash
        run: |
          set -euo pipefail
          preview_url='${{ steps.upload.outputs.preview_url }}'
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 3 --retry-all-errors \
            -X POST "$preview_url/audit/location-evidence" \
            -o "$ARTIFACT_DIR/result.json"
          jq -e '
            .ok == true and
            .result.mode == "read_only_manual_audit" and
            .result.persistence.d1Writes == 0 and
            .result.persistence.rawTitleStored == false and
            .result.persistence.rawTagsStored == false and
            .result.persistence.rawLanguageStored == false and
            .result.persistence.rawProfileDescriptionStored == false and
            .result.persistence.unknownSampleIdentifiersArtifactOnly == true and
            .result.apiRequests.users >= 1 and
            .result.apiRequests.users <= 3 and
            .result.profileAudit.requestedUsers > 0 and
            .result.audit.candidateExtraction.languageUsedForPlacement == false and
            .result.acquisitionSample.scope == "top_ranked_native_candidate_unknown_users" and
            .result.acquisitionSample.rawProfileTitleTagIncluded == false and
            .result.acquisitionSample.requestedLimit == 20 and
            .result.acquisitionSample.recordCount == 20
          ' "$ARTIFACT_DIR/result.json" >/dev/null
          jq . "$ARTIFACT_DIR/result.json"

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Twitch location preview audit'
            echo
            echo '- Production deployment: no'
            echo '- Worker version upload only: yes'
            if [ -f "$ARTIFACT_DIR/result.json" ]; then
              echo "- Streams observed: $(jq -r '.result.streamCount' "$ARTIFACT_DIR/result.json")"
              echo "- Native candidates: $(jq -r '.result.audit.candidateExtraction.counts.anyCandidateStreams' "$ARTIFACT_DIR/result.json")"
              echo "- Native unknown: $(jq -r '.result.audit.candidateExtraction.counts.unknownStreams' "$ARTIFACT_DIR/result.json")"
              echo "- External-profile review sample: $(jq -r '.result.acquisitionSample.recordCount' "$ARTIFACT_DIR/result.json")"
              echo "- Raw noncandidate profile/title/tag included: $(jq -r '.result.acquisitionSample.rawProfileTitleTagIncluded' "$ARTIFACT_DIR/result.json")"
            else
              echo '- Audit result: missing'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twitch-location-preview-audit-pr-970
          path: artifacts/twitch-location-preview-audit
          if-no-files-found: warn
