name: Twitch Stream Map Coverage Remediation Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - 'workers/collector-twitch/src/entry.ts'
      - 'workers/collector-twitch/src/location-evidence-audit.ts'
      - '.github/workflows/twitch-location-preview-audit.yml'

permissions:
  contents: read

concurrency:
  group: twitch-stream-map-coverage-remediation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_DIR: artifacts/twitch-stream-map-coverage-remediation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler 4
        run: npm install --global wrangler@4

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - id: upload
        name: Upload non-production Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          alias="audit-pr-${{ github.event.pull_request.number }}"
          output="$(wrangler versions upload \
            --config workers/collector-twitch/wrangler.category-permanent.toml \
            --preview-alias "$alias" \
            --keep-vars 2>&1 | tee "$ARTIFACT_DIR/upload.txt")"
          preview_url="$(printf '%s\n' "$output" | sed -nE 's/.*Version Preview URL: (https:\/\/[^ ]+).*/\1/p' | tail -1)"
          if [ -z "$preview_url" ]; then
            echo 'Failed to determine Worker version preview URL.' >&2
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$preview_url" > "$ARTIFACT_DIR/preview-url.txt"

      - name: Run read-only supported-source audit
        shell: bash
        run: |
          set -euo pipefail
          preview_url='${{ steps.upload.outputs.preview_url }}'
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 3 --retry-all-errors \
            -X POST "$preview_url/audit/location-evidence" \
            -o "$ARTIFACT_DIR/result.json"
          jq -e '
            .ok == true and
            .result.mode == "read_only_manual_audit" and
            .result.persistence.d1Writes == 0 and
            .result.persistence.rawTitleStored == false and
            .result.persistence.rawTagsStored == false and
            .result.persistence.rawLanguageStored == false and
            .result.persistence.rawProfileDescriptionStored == false and
            .result.persistence.candidateEvidenceArtifactOnly == true and
            .result.apiRequests.token == 1 and
            .result.apiRequests.streams >= 1 and
            .result.apiRequests.streams <= 3 and
            .result.apiRequests.users >= 1 and
            .result.apiRequests.users <= 3 and
            .result.profileAudit.requestedUsers > 0 and
            .result.audit.candidateExtraction.languageUsedForPlacement == false
          ' "$ARTIFACT_DIR/result.json" >/dev/null

      - name: Compare candidates with retained reviewed evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > "$ARTIFACT_DIR/reviewed-logins.json"
          import { TWITCH_REVIEWED_LOCATION_RECORDS } from './apps/web/functions/api/twitch-stream-map-reviewed-evidence.mjs'
          const logins = [...new Set(TWITCH_REVIEWED_LOCATION_RECORDS.map((record) => String(record.streamerLogin ?? '').trim().toLowerCase()).filter(Boolean))].sort()
          process.stdout.write(JSON.stringify(logins, null, 2))
          NODE

          jq '[.result.candidateEvidence.records[].userLogin | ascii_downcase] | unique' \
            "$ARTIFACT_DIR/result.json" > "$ARTIFACT_DIR/candidate-logins.json"

          jq -n \
            --slurpfile candidates "$ARTIFACT_DIR/candidate-logins.json" \
            --slurpfile reviewed "$ARTIFACT_DIR/reviewed-logins.json" '
              {
                candidateLogins: $candidates[0],
                reviewedLogins: $reviewed[0],
                candidateCount: ($candidates[0] | length),
                retainedReviewedCount: ($reviewed[0] | length),
                alreadyReviewedCandidates: [$candidates[0][] | select(. as $login | ($reviewed[0] | index($login)) != null)],
                incrementalCandidateLogins: [$candidates[0][] | select(. as $login | ($reviewed[0] | index($login)) == null)]
              }
              | .alreadyReviewedCandidateCount = (.alreadyReviewedCandidates | length)
              | .incrementalCandidateCount = (.incrementalCandidateLogins | length)
            ' > "$ARTIFACT_DIR/candidate-overlap.json"

          jq -n \
            --slurpfile result "$ARTIFACT_DIR/result.json" \
            --slurpfile overlap "$ARTIFACT_DIR/candidate-overlap.json" '
              {
                provider: "twitch",
                auditMode: "non-production-worker-version-preview",
                observedAt: $result[0].result.observedAt,
                streamCount: $result[0].result.streamCount,
                apiRequests: $result[0].result.apiRequests,
                profileAudit: $result[0].result.profileAudit,
                sourceAvailability: $result[0].result.audit.sourceAvailability.availableCounts,
                candidateCounts: $result[0].result.audit.candidateExtraction.counts,
                sourceYield: $result[0].result.audit.candidateExtraction.sourceYield,
                candidateCountries: $result[0].result.audit.candidateExtraction.candidateCountries,
                candidateEvidenceRecordCount: $result[0].result.candidateEvidence.recordCount,
                alreadyReviewedCandidateCount: $overlap[0].alreadyReviewedCandidateCount,
                alreadyReviewedCandidates: $overlap[0].alreadyReviewedCandidates,
                incrementalCandidateCount: $overlap[0].incrementalCandidateCount,
                incrementalCandidateLogins: $overlap[0].incrementalCandidateLogins,
                persistence: $result[0].result.persistence,
                acceptance: {
                  automated: false,
                  requiresBoundedManualReview: true,
                  tagOnlyAcceptedAutomatically: false,
                  languageUsedForPlacement: false
                }
              }
            ' > "$ARTIFACT_DIR/summary.json"

          jq . "$ARTIFACT_DIR/summary.json"

      - name: Publish remediation summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Twitch Stream Map coverage remediation audit'
            echo
            echo '- Production deployment: no'
            echo '- Worker version upload only: yes'
            echo '- D1 writes: 0'
            echo '- Automated acceptance: no'
            if [ -f "$ARTIFACT_DIR/summary.json" ]; then
              echo "- Streams observed: $(jq -r '.streamCount' "$ARTIFACT_DIR/summary.json")"
              echo "- Profile descriptions present: $(jq -r '.profileAudit.descriptionsPresent' "$ARTIFACT_DIR/summary.json")"
              echo "- Profile candidates: $(jq -r '.candidateCounts.profileCandidateStreams' "$ARTIFACT_DIR/summary.json")"
              echo "- Strong-title candidates: $(jq -r '.candidateCounts.titleCandidateStreams' "$ARTIFACT_DIR/summary.json")"
              echo "- Ambiguous tag candidates: $(jq -r '.candidateCounts.tagCandidateStreams' "$ARTIFACT_DIR/summary.json")"
              echo "- Any candidates: $(jq -r '.candidateCounts.anyCandidateStreams' "$ARTIFACT_DIR/summary.json")"
              echo "- Already-reviewed candidates: $(jq -r '.alreadyReviewedCandidateCount' "$ARTIFACT_DIR/summary.json")"
              echo "- Incremental candidates requiring review: $(jq -r '.incrementalCandidateCount' "$ARTIFACT_DIR/summary.json")"
              echo "- Current-location candidates: $(jq -r '.candidateCounts.currentLocationCandidateStreams' "$ARTIFACT_DIR/summary.json")"
              echo "- Conflicting same-claim candidates: $(jq -r '.candidateCounts.multipleLocationCandidateStreams' "$ARTIFACT_DIR/summary.json")"
              echo "- Future-travel rejects: $(jq -r '.candidateCounts.rejectedFutureTravelTitles' "$ARTIFACT_DIR/summary.json")"
            else
              echo '- Audit result: missing'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twitch-stream-map-coverage-remediation-pr-${{ github.event.pull_request.number }}
          path: artifacts/twitch-stream-map-coverage-remediation
          if-no-files-found: warn
