name: History UI P9H7 Acceptance

# P9H7 is permanent Phase 9 evidence. Later accepted History work changed the
# live publishing surface, so replaying the old hosted acceptance against the
# current production UI would incorrectly rewrite a historical gate. Keep the
# repository/evidence contract active; retire hosted Preview/production reruns.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/README.md'
      - 'docs/product/current-roadmap.md'
      - 'docs/product/current-schedule.md'
      - 'docs/product/post-watchlist-program-plan.md'
      - 'docs/product/history-ui-repair-plan.md'
      - 'docs/work-in-progress/history-ui-repair-working-note.md'
      - 'docs/work-in-progress/p9h7-acceptance.md'
      - 'apps/web/scripts/history-ui-h7-hosted-acceptance.mjs'
      - 'apps/web/scripts/history-ui-h7-preview-trigger.json'
      - 'scripts/verify-history-ui-h7-acceptance.mjs'
      - 'scripts/verify-history-ui-h7-evidence.mjs'
      - 'scripts/verify-development-policy.mjs'
      - '.github/workflows/history-ui-h7-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify P9H7 permanent evidence syntax
        run: |
          node --check apps/web/scripts/history-ui-h7-hosted-acceptance.mjs
          node --check scripts/verify-history-ui-h7-acceptance.mjs
          node --check scripts/verify-history-ui-h7-evidence.mjs

      - name: Verify development policy
        run: node scripts/verify-development-policy.mjs

      - name: Verify P9H7 permanent repository contract
        run: node scripts/verify-history-ui-h7-acceptance.mjs

      - name: Typecheck web application
        run: pnpm --filter @viewloom/web typecheck:app

      - name: Build web application
        run: pnpm build:web

      - name: Publish permanent-evidence boundary
        run: |
          {
            echo '## History UI P9H7 permanent acceptance'
            echo
            echo '- Phase 9 production acceptance remains permanently recorded.'
            echo '- Later roadmap phases do not rewrite Phase 9 evidence.'
            echo '- Hosted Preview/production replay jobs are retired.'
            echo '- Current History production behavior is governed by later History acceptance workflows.'
          } >> "$GITHUB_STEP_SUMMARY"
