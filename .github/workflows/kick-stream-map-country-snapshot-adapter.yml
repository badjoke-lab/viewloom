name: Kick Stream Map Country Snapshot Adapter

on:
  pull_request:
    paths:
      - 'scripts/kick-stream-map-country-snapshot-adapter-core.mjs'
      - 'scripts/verify-kick-stream-map-country-snapshot-adapter.mjs'
      - 'docs/audits/kick-stream-map-country-snapshot-adapter-fixture-v0.1.json'
      - '.github/workflows/kick-stream-map-country-snapshot-adapter.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/kick-stream-map-country-snapshot-adapter-core.mjs'
      - 'scripts/verify-kick-stream-map-country-snapshot-adapter.mjs'
      - 'docs/audits/kick-stream-map-country-snapshot-adapter-fixture-v0.1.json'
      - '.github/workflows/kick-stream-map-country-snapshot-adapter.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Kick Country snapshot adapter
        run: node scripts/verify-kick-stream-map-country-snapshot-adapter.mjs
