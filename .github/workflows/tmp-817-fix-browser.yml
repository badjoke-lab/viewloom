name: TMP 817 Fix Battle Lines Browser Script

on:
  push:
    branches: [work-817-kick-battle-lines-hidden-production-revalidation]
    paths:
      - '.github/workflows/tmp-817-fix-browser.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work-817-kick-battle-lines-hidden-production-revalidation
      - name: Remove stray Node-side document assertion
        run: sed -i "/assert(!document, '')/d" apps/web/scripts/kick-battle-lines-category-hidden-production-revalidation.mjs
      - name: Commit browser script fix
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add apps/web/scripts/kick-battle-lines-category-hidden-production-revalidation.mjs
          git commit -m 'Fix Battle Lines production browser script'
          git push origin HEAD:work-817-kick-battle-lines-hidden-production-revalidation
