name: Analytics 12A5 Twitch Category Public Production Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a5-twitch-category-public-production-acceptance.yml'
      - 'apps/web/scripts/twitch-category-public-production-acceptance.mjs'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/features/twitch-heatmap/category-preview-controls.ts'
      - 'apps/web/src/features/twitch-heatmap/model.ts'
      - 'apps/web/functions/api/twitch-heatmap.ts'
      - 'docs/audits/12a5-twitch-heatmap-category-public-cutover-decision.json'
      - 'apps/web/scripts/twitch-category-public-production-acceptance.mjs'
      - '.github/workflows/analytics-12a5-twitch-category-public-production-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: analytics-12a5-twitch-category-public-production-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify acceptance script syntax and public decision
        run: |
          node --check apps/web/scripts/twitch-category-public-production-acceptance.mjs
          node scripts/verify-12a5-twitch-heatmap-category-public-cutover.mjs

  production:
    if: github.event_name == 'push'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      VIEWLOOM_ORIGIN: https://www.viewloom.net
      OUTPUT_DIR: artifacts/12a5-twitch-category-public-production-acceptance
      MAX_ATTEMPTS: 20
      RETRY_MS: 15000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install playwright@1.52.0 --no-save --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - id: browser
        name: Verify public Twitch category controls after deployment propagation
        continue-on-error: true
        run: node apps/web/scripts/twitch-category-public-production-acceptance.mjs
      - name: Upload production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-12a5-twitch-category-public-production-acceptance
          path: artifacts/12a5-twitch-category-public-production-acceptance/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence upload when public production acceptance rejects
        if: steps.browser.outcome != 'success'
        run: exit 1
