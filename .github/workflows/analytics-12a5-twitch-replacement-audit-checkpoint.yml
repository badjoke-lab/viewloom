name: Analytics 12A5 Twitch Replacement Audit Checkpoint

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a5-twitch-replacement-audit-checkpoint.yml'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-package-contract.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-package-acceptance.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-trigger-contract.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-trigger.json'
      - 'docs/audits/12a5-twitch-replacement-seven-day-audit-package-contract.json'
      - 'docs/audits/12a5-twitch-replacement-seven-day-audit-package-acceptance.json'
      - 'docs/audits/12a5-twitch-replacement-seven-day-audit-runner-repair-contract.json'
      - 'docs/audits/12a5-twitch-replacement-seven-day-audit-runner-repair-acceptance.json'
      - 'docs/audits/12a2-current-gate-state.json'
      - 'docs/product/twitch-replacement-seven-day-audit-spec.md'
      - 'docs/product/current-roadmap.md'
      - 'docs/product/current-schedule.md'
      - 'docs/work-in-progress/phase12a4-category-parallel-execution.md'
      - 'scripts/run-12a5-twitch-replacement-seven-day-audit.mjs'
      - 'scripts/test-12a5-twitch-replacement-seven-day-audit.mjs'
      - 'scripts/verify-12a5-twitch-replacement-audit-checkpoint-package.mjs'
      - 'scripts/verify-12a5-twitch-replacement-seven-day-audit-runner-repair.mjs'
      - 'scripts/verify-category-rollout-policy.mjs'
      - 'scripts/verify-development-policy.mjs'
      - 'workers/collector-twitch/wrangler.category-permanent.toml'
      - 'workers/collector-twitch/wrangler.toml'
      - 'workers/collector-kick/wrangler.category-permanent.toml'
      - 'workers/collector-kick/wrangler.toml'
  push:
    branches: [main]
    paths:
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-trigger.json'

permissions:
  contents: read

concurrency:
  group: analytics-12a5-twitch-replacement-audit-checkpoint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trigger_present: ${{ steps.classify.outputs.trigger_present }}
      start_at: ${{ steps.classify.outputs.start_at }}
    steps:
      - uses: actions/checkout@v4
      - id: classify
        name: Detect exact Twitch checkpoint trigger
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const path = 'docs/audits/12a5-twitch-replacement-audit-checkpoint-trigger.json'
          const present = fs.existsSync(path)
          const trigger = present ? JSON.parse(fs.readFileSync(path, 'utf8')) : null
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `trigger_present=${present}\nstart_at=${trigger?.startAt ?? ''}\n`)
          NODE

  verify-package:
    if: github.event_name == 'pull_request' && needs.classify.outputs.trigger_present != 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Confirm production trigger is absent
        run: test ! -f docs/audits/12a5-twitch-replacement-audit-checkpoint-trigger.json
      - name: Parse checkpoint package and accepted runner
        run: |
          node --check scripts/verify-12a5-twitch-replacement-audit-checkpoint-package.mjs
          node --check scripts/verify-12a5-twitch-replacement-seven-day-audit-runner-repair.mjs
          node --check scripts/run-12a5-twitch-replacement-seven-day-audit.mjs
          node --check scripts/test-12a5-twitch-replacement-seven-day-audit.mjs
      - name: Verify bounded checkpoint package
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-package.mjs
      - name: Verify accepted runner repair
        run: node scripts/verify-12a5-twitch-replacement-seven-day-audit-runner-repair.mjs
      - name: Test exact replacement audit window and slot accounting
        run: node scripts/test-12a5-twitch-replacement-seven-day-audit.mjs
      - name: Verify current category rollout policy
        run: node scripts/verify-category-rollout-policy.mjs
      - name: Verify current development policy
        run: node scripts/verify-development-policy.mjs
      - name: Typecheck web
        run: pnpm typecheck:web
      - name: Build web
        run: pnpm build:web
      - name: Verify production build still contains no public category controls
        run: |
          test -f apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'heatmap-category-preview-controls' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/twitch/heatmap/index.html
          test -f apps/web/dist/kick/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/kick/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/kick/heatmap/index.html
      - name: Summarize accepted checkpoint boundary
        run: |
          {
            echo '## Twitch replacement audit checkpoint package'
            echo
            echo '- Package PR / acceptance PR: `#665` / `#666`'
            echo '- Mode: `checkpoint` only'
            echo '- Exact start: `2026-07-29T05:30:00Z`'
            echo '- End: latest completed five-minute boundary capped at `2026-08-05T05:30:00Z`'
            echo '- Production credentials or execution on package/acceptance PRs: no'
            echo '- New Worker cron: no'
            echo '- Worker/D1/Kick/public UI mutation: no'
            echo '- Next branch: `work-659-twitch-replacement-audit-checkpoint-trigger`'
          } >> "$GITHUB_STEP_SUMMARY"

  validate-trigger:
    if: needs.classify.outputs.trigger_present == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate accepted checkpoint package identity and exact trigger
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const packageContract = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-replacement-audit-checkpoint-package-contract.json', 'utf8'))
          const triggerContract = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-replacement-audit-checkpoint-trigger-contract.json', 'utf8'))
          const trigger = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-replacement-audit-checkpoint-trigger.json', 'utf8'))
          if (packageContract.status !== 'accepted') throw new Error('checkpoint_package_not_accepted')
          if (triggerContract.status !== 'accepted') throw new Error('checkpoint_trigger_contract_not_accepted')
          if (trigger.schemaVersion !== triggerContract.trigger.schemaVersion) throw new Error('trigger_schema_mismatch')
          if (trigger.status !== 'armed' || trigger.provider !== 'twitch' || trigger.mode !== 'checkpoint' || trigger.oneTime !== true) throw new Error('trigger_identity_invalid')
          if (trigger.confirmation !== triggerContract.trigger.confirmation) throw new Error('trigger_confirmation_invalid')
          if (trigger.packagePr !== packageContract.acceptance.packagePr) throw new Error('package_pr_mismatch')
          if (trigger.packageMergeSha !== packageContract.acceptance.packageMergeSha) throw new Error('package_sha_mismatch')
          if (trigger.packagePr !== triggerContract.acceptedPackageIdentity.packagePr) throw new Error('trigger_contract_package_pr_mismatch')
          if (trigger.packageMergeSha !== triggerContract.acceptedPackageIdentity.packageMergeSha) throw new Error('trigger_contract_package_sha_mismatch')
          const start = Date.parse(String(trigger.startAt ?? ''))
          const now = Date.now()
          const pastSkew = Number(triggerContract.trigger.allowedPastSkewMinutes) * 60_000
          const futureLimit = Number(triggerContract.trigger.maximumStartDelayHours) * 3_600_000
          if (!Number.isFinite(start) || start < now - pastSkew || start > now + futureLimit) throw new Error('trigger_start_out_of_bounds')
          NODE

  checkpoint:
    if: github.event_name == 'push' && needs.classify.outputs.trigger_present == 'true'
    needs:
      - classify
      - validate-trigger
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      START_AT: ${{ needs.classify.outputs.start_at }}
      OUTPUT_DIR: artifacts/12a5-twitch-replacement-audit-checkpoint/run
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Wait for exact checkpoint start boundary
        run: |
          node --input-type=module - <<'NODE'
          const start = Date.parse(process.env.START_AT)
          if (!Number.isFinite(start)) throw new Error('invalid_start_at')
          const delay = start - Date.now()
          if (delay > 3 * 3_600_000) throw new Error('start_delay_above_three_hours')
          if (delay > 0) await new Promise((resolve) => setTimeout(resolve, delay))
          NODE
      - id: audit
        name: Run bounded read-only Twitch checkpoint
        continue-on-error: true
        run: AUDIT_MODE=checkpoint node scripts/run-12a5-twitch-replacement-seven-day-audit.mjs
      - name: Upload sanitized Twitch checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-12a5-twitch-replacement-audit-checkpoint
          path: artifacts/12a5-twitch-replacement-audit-checkpoint/run/evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence upload when checkpoint is unhealthy
        if: steps.audit.outcome != 'success'
        run: exit 1
