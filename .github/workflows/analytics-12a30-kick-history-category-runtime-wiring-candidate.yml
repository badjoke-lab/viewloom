name: Analytics 12A30 Kick History Runtime Wiring Historical Guard

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a30-kick-history-category-runtime-wiring-candidate.yml'

permissions:
  contents: read

concurrency:
  group: analytics-12a30-kick-history-runtime-wiring-historical-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  historical-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify historical guard-only scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/analytics-12a30-kick-history-category-runtime-wiring-candidate.yml'

      - name: Verify historical 12A-30 records remain retained
        run: |
          test -f docs/audits/12a30-kick-history-category-runtime-wiring-candidate.json
          test -f scripts/verify-12a30-kick-history-category-runtime-wiring-candidate.mjs

      - name: Verify historical workflow cannot gate future runtime edits
        run: |
          set -euo pipefail
          file='.github/workflows/analytics-12a30-kick-history-category-runtime-wiring-candidate.yml'
          ! grep -Fq "workers/collector-kick/src/entry.ts" "$file"
          ! grep -Fq "docs/audits/12a30-kick-history-category-runtime-wiring-candidate.json'" "$file"
          ! grep -Fq "scripts/verify-12a30-kick-history-category-runtime-wiring-candidate.mjs'" "$file"

      - name: Verify no production execution surface
        run: |
          set -euo pipefail
          file='.github/workflows/analytics-12a30-kick-history-category-runtime-wiring-candidate.yml'
          ! grep -Eq '^  (push|workflow_dispatch|schedule|repository_dispatch):' "$file"
          secret_needle='sec''rets.'
          remote_needle='--re''mote'
          d1_needle='d1'' execute'
          deploy_needle='wrangler ''deploy'
          ! grep -Fq -- "$secret_needle" "$file"
          ! grep -Fq -- "$remote_needle" "$file"
          ! grep -Fq -- "$d1_needle" "$file"
          ! grep -Fq -- "$deploy_needle" "$file"

      - name: Publish historical-only boundary
        run: |
          {
            echo '## Kick History Category — retired 12A-30 runtime candidate guard'
            echo
            echo '- Historical artifact retained: yes'
            echo '- Historical verifier retained: yes'
            echo '- Future Kick entry.ts trigger: no'
            echo '- Runtime files changed by this cleanup: no'
            echo '- Production execution surface: none'
          } >> "$GITHUB_STEP_SUMMARY"
