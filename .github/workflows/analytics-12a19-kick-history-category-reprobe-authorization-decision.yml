name: Analytics 12A19 Kick History Category Re-probe Authorization Decision

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/audits/12a19-kick-history-category-reprobe-authorization-decision.json'
      - 'scripts/verify-12a19-kick-history-category-reprobe-authorization-decision.mjs'
      - '.github/workflows/analytics-12a19-kick-history-category-reprobe-authorization-decision.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Verify exact decision-only scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          expected=(
            '.github/workflows/analytics-12a19-kick-history-category-reprobe-authorization-decision.yml'
            'docs/audits/12a19-kick-history-category-reprobe-authorization-decision.json'
            'scripts/verify-12a19-kick-history-category-reprobe-authorization-decision.mjs'
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fxq "$path"; done
      - name: Verify decision contract
        run: node scripts/verify-12a19-kick-history-category-reprobe-authorization-decision.mjs
      - name: Prove this PR has no production execution authority
        run: |
          set -euo pipefail
          workflow='.github/workflows/analytics-12a19-kick-history-category-reprobe-authorization-decision.yml'
          ! grep -Eq 'workflow_dispatch|schedule:|cloudflare|CLOUDFLARE|wrangler.*deploy|d1 execute|secrets\.' "$workflow"
          ! grep -Eq 'workflow_dispatch|schedule:|cloudflare|CLOUDFLARE|wrangler.*deploy|d1 execute|secrets\.' scripts/verify-12a19-kick-history-category-reprobe-authorization-decision.mjs
      - name: Revalidate accepted 12A18 repository bound
        run: |
          node scripts/verify-12a18-kick-history-category-cost-bound.mjs
          python3 scripts/test-12a18-kick-history-category-cost-bound.py
      - name: Publish decision boundary
        if: always()
        run: |
          {
            echo '## Kick History category re-probe authorization decision'
            echo
            echo '- Previous accepted production measurement: 843,288 rows read — FAIL'
            echo '- Production maximum: 250,000 rows read — unchanged'
            echo '- 12A18 repository model +25%: 112,355 logical touches'
            echo '- Repository model is remote D1 evidence: no'
            echo '- Decision: authorize construction of exactly one separately gated future measurement package'
            echo '- Production execution available in this PR: no'
            echo '- Permanent generator/API/UI/Twitch rollout: unauthorized'
          } >> "$GITHUB_STEP_SUMMARY"
