name: Analytics 12A4 Twitch Category Canary Storage Preflight Acceptance Retired

# Historical storage-preflight acceptance. The exact old candidate-scope gate
# is preserved in its scripts/evidence but is no longer a current PR gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-12a4-twitch-category-canary-storage-preflight-retired-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-acceptance-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Verify accepted evidence candidate
        run: node scripts/verify-12a4-twitch-category-capture-canary-storage-preflight-package.mjs
      - name: Verify parser and read-only fixtures
        run: node scripts/test-12a4-twitch-category-capture-canary-storage-preflight.mjs
      - name: Publish retired acceptance summary
        if: always()
        run: |
          {
            echo '## ViewLoom 12A-4-15 Twitch storage preflight acceptance — historical record'
            echo
            echo '- Accepted observation run: 29598193753'
            echo '- Evidence artifact: 8413901173'
            echo '- All original read-only gates: pass'
            echo '- Production observation paths: retired'
            echo '- Automatic PR gate: retired'
            echo '- Current Twitch category rollout authority: separate 12A5 evidence chain'
          } >> "$GITHUB_STEP_SUMMARY"
