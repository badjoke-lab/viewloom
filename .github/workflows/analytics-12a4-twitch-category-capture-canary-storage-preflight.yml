name: Analytics 12A4 Twitch Category Canary Storage Preflight Acceptance Retired

# Historical 12A4 storage-preflight acceptance. Its original contracts,
# evidence, and verifier scripts remain available; this Actions entry point no
# longer evaluates the current gate or unrelated pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-12a4-twitch-category-canary-storage-preflight-retired-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-record:
    runs-on: ubuntu-latest
    steps:
      - name: Publish retired acceptance summary
        run: |
          {
            echo '## ViewLoom 12A-4-15 Twitch storage preflight — retired record'
            echo
            echo '- Accepted observation run: 29598193753'
            echo '- Accepted observation job: 87943655515'
            echo '- Evidence artifact: 8413901173'
            echo '- Historical contracts/verifiers remain in the repository'
            echo '- Original read-only gates: accepted'
            echo '- Production observation paths: retired'
            echo '- Automatic PR gate: retired'
            echo '- Current Twitch category authority: separate 12A5 evidence chain'
          } >> "$GITHUB_STEP_SUMMARY"
