name: Analytics 12A4 Category Capture Enablement Decision Retired

# Historical enablement decision record. Its accepted decision contract and
# verifier remain available; this Actions entry point is archival only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-12a4-category-capture-enablement-decision-retired-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-record:
    runs-on: ubuntu-latest
    steps:
      - name: Publish retirement summary
        run: |
          {
            echo '## ViewLoom 12A-4-7 Category Capture Enablement Decision — retired record'
            echo
            echo '- Historical decision contract/verifier remain in the repository'
            echo '- Automatic PR gate: retired'
            echo '- Production runtime capture from this workflow: no'
            echo '- New cron: no'
            echo '- Backfill: no'
            echo '- Cross-provider category identity: no'
          } >> "$GITHUB_STEP_SUMMARY"
