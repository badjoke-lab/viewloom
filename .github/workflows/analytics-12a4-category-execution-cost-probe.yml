name: Analytics 12A4 Category Execution Cost Probe Package Retired

# Historical 12A4 package retained for auditability. It is no longer a current
# pull-request gate after the accepted 12A5 Twitch category rollout.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-12a4-category-cost-probe-package-retired-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify accepted bounded execution-cost package
        run: node scripts/verify-12a4-category-execution-cost-probe.mjs

      - name: Verify local SQLite first-pass, no-op, failure, and cleanup fixture
        run: python scripts/test-12a4-category-execution-cost-probe.py

      - name: Verify sanitized success and failure evidence fixtures
        run: node scripts/test-12a4-category-execution-cost-probe-evidence.mjs

      - name: Bundle Twitch bounded probe Worker without deploying
        run: pnpm dlx wrangler@4 deploy --dry-run --config workers/category-cost-probe/wrangler.twitch.toml

      - name: Bundle Kick bounded probe Worker without deploying
        run: pnpm dlx wrangler@4 deploy --dry-run --config workers/category-cost-probe/wrangler.kick.toml

      - name: Publish retired package boundary
        if: always()
        run: |
          {
            echo '## ViewLoom 12A-4-5 Category Execution-Cost Probe Package — historical record'
            echo
            echo '- Tracking issue: #519'
            echo '- Package acceptance: PR #547'
            echo '- Automatic PR gate: retired after the accepted 12A5 rollout'
            echo '- Production execution from this workflow: no'
            echo '- Cloudflare credentials used: no'
            echo '- Category capture enablement: no'
          } >> "$GITHUB_STEP_SUMMARY"
