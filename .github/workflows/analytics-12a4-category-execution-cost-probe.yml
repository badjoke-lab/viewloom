name: Analytics 12A4 Category Execution Cost Probe Package Retired

# Historical 12A4 package retained for auditability. The accepted evidence,
# contracts, and verifier scripts remain in the repository; this Actions entry
# point is manual-only and performs no production or current-gate validation.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-12a4-category-cost-probe-package-retired-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-record:
    runs-on: ubuntu-latest
    steps:
      - name: Publish retired package boundary
        run: |
          {
            echo '## ViewLoom 12A-4-5 Category Execution-Cost Probe Package — retired record'
            echo
            echo '- Tracking issue: #519'
            echo '- Package acceptance: PR #547'
            echo '- Historical contracts/verifiers remain in the repository'
            echo '- Automatic PR gate: retired'
            echo '- Production execution: no'
            echo '- Cloudflare credentials: no'
            echo '- Category capture enablement: no'
          } >> "$GITHUB_STEP_SUMMARY"
