name: Analytics 12A9 Kick Day Flow Category Post-Repair Production Revalidation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a9-kick-day-flow-category-post-repair-production-revalidation.yml'
      - 'docs/audits/12a9-kick-day-flow-category-post-repair-production-revalidation-contract.json'
      - 'apps/web/scripts/kick-day-flow-category-post-repair-production-revalidation.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a9-kick-day-flow-category-post-repair-production-revalidation.yml'
      - 'docs/audits/12a9-kick-day-flow-category-post-repair-production-revalidation-contract.json'
      - 'apps/web/scripts/kick-day-flow-category-post-repair-production-revalidation.mjs'

permissions:
  contents: read

concurrency:
  group: analytics-12a9-kick-day-flow-category-post-repair-production-revalidation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout post-repair validation package
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify three-file validation scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(\.github/workflows/analytics-12a9-kick-day-flow-category-post-repair-production-revalidation\.yml|docs/audits/12a9-kick-day-flow-category-post-repair-production-revalidation-contract\.json|apps/web/scripts/kick-day-flow-category-post-repair-production-revalidation\.mjs)$'
          test "${#changed[@]}" -eq 3
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected post-repair validation change: $file" >&2; exit 1; }
          done

      - name: Verify repaired product authority and strengthened honesty contract
        run: |
          node --check apps/web/scripts/kick-day-flow-category-post-repair-production-revalidation.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const read = (p) => fs.readFileSync(p, 'utf8')
          const contract = JSON.parse(read('docs/audits/12a9-kick-day-flow-category-post-repair-production-revalidation-contract.json'))
          const browser = read('apps/web/scripts/kick-day-flow-category-post-repair-production-revalidation.mjs')
          const api = read('apps/web/functions/api/kick-day-flow.ts')
          const candidateVerifier = read('scripts/verify-12a9-kick-day-flow-category-candidate.mjs')
          const productSha = '27b3cca084d62d8badd512c068be415c6865965e'

          if (contract.schemaVersion !== 'viewloom-12a9-kick-day-flow-category-post-repair-production-revalidation-contract-v1') throw new Error('post_repair_contract_version_invalid')
          if (contract.status !== 'ready_for_validation') throw new Error('post_repair_contract_status_invalid')
          if (contract.parentTrackingIssue !== 623 || contract.revalidationIssue !== 797 || contract.repairIssue !== 801 || contract.trackingIssue !== 803) throw new Error('post_repair_tracking_identity_invalid')
          if (contract.provider !== 'kick' || contract.feature !== 'day_flow_category_filter') throw new Error('post_repair_feature_identity_invalid')
          if (contract.productAuthority.repairPr !== 802 || contract.productAuthority.sha !== productSha) throw new Error('repaired_product_authority_invalid')
          if (contract.productAuthority.implementationState !== 'hidden_candidate' || contract.productAuthority.publicCutoverAuthorized !== false) throw new Error('repaired_product_state_invalid')
          if (contract.preRepairEvidence.workflowRun !== 31471759777 || contract.preRepairEvidence.artifactId !== 9093633104 || contract.preRepairEvidence.accepted !== false) throw new Error('pre_repair_evidence_identity_invalid')
          if (contract.preRepairEvidence.visualDefect !== 'unknown_category_rendered_false_empty_and_no_observed_snapshots_copy') throw new Error('pre_repair_defect_not_frozen')
          if (contract.preRepairEvidence.observedBuckets !== 288 || contract.preRepairEvidence.partialBuckets !== 0 || contract.preRepairEvidence.unavailableBuckets !== 0) throw new Error('pre_repair_coverage_not_frozen')

          const authority = contract.productionAuthority
          if (authority.manualDeployWorkflowIsAuthority !== false || authority.pagesGitIntegrationIsAuthority !== true) throw new Error('post_repair_deployment_authority_invalid')
          if (authority.deploymentSha !== 'validation_package_merge_sha' || authority.deploymentShaMayDifferFromProductSha !== true) throw new Error('post_repair_deployment_identity_invalid')
          if (authority.singleDeploymentEvidenceSourceRequired !== true || authority.browserNetworkRefetchOfDeploymentIdentityAllowed !== false) throw new Error('post_repair_single_source_boundary_invalid')
          if (authority.productRuntimeEquivalenceRequired !== true) throw new Error('post_repair_runtime_equivalence_not_required')
          if (!Array.isArray(authority.allowedDifferenceFromProductAuthority) || authority.allowedDifferenceFromProductAuthority.length !== 3) throw new Error('post_repair_diff_allowlist_invalid')

          if (!Array.isArray(contract.requiredScenarios) || contract.requiredScenarios.length !== 5) throw new Error('post_repair_scenario_count_invalid')
          for (const [key, value] of Object.entries(contract.strengthenedUnknownCategoryChecks)) {
            if (value !== true) throw new Error(`strengthened_unknown_check_${key}_not_enabled`)
          }
          for (const [key, value] of Object.entries(contract.boundary)) {
            if (key === 'readOnly') {
              if (value !== true) throw new Error('post_repair_revalidation_must_be_read_only')
            } else if (value !== false) throw new Error(`post_repair_boundary_${key}_must_remain_false`)
          }

          for (const fragment of [
            "if (filterState !== 'selected') {",
            'const others = makeGlobalOthers([], labels, totals, bucketSize)',
            'const bands = others.totalViewerMinutes > 0 ? [others] : []',
            'return { bands, streamers: [], totals, observed }',
          ]) if (!api.includes(fragment)) throw new Error(`repair_source_missing:${fragment}`)

          for (const fragment of [
            'zeroMatchSelectedBandsInferred: false',
            'zeroMatchGlobalOthersPreserved: true',
          ]) if (!candidateVerifier.includes(fragment)) throw new Error(`repair_verifier_missing:${fragment}`)

          for (const fragment of [
            "selectedBands.length === 0",
            "globalOthers.length === 1",
            "json.state !== 'empty' && json.status !== 'empty'",
            ".dayflow-stage svg[data-dayflow-chart]",
            "No observed Day Flow snapshots for this window.",
            "falseNoObservedCopyAbsent: true",
          ]) if (!browser.includes(fragment)) throw new Error(`strengthened_browser_assertion_missing:${fragment}`)
          if (browser.includes('json.bands.length === 0')) throw new Error('stale_unknown_all_band_zero_assertion_remains')
          NODE

      - name: Verify retained candidate and projection contracts
        run: |
          node scripts/verify-12a9-kick-day-flow-category-candidate.mjs
          node apps/web/scripts/day-flow-category-core.test.mjs

      - name: Typecheck and build web
        run: |
          pnpm typecheck:web
          pnpm build:web

      - name: Publish post-repair boundary
        if: always()
        run: |
          {
            echo '## Kick Day Flow post-repair production revalidation'
            echo
            echo '- Repaired product authority: 27b3cca084d62d8badd512c068be415c6865965e'
            echo '- Validation merge SHA: deployment identity only'
            echo '- Production authority: Pages Git integration / primary deployment.json'
            echo '- Same five read-only scenarios retained'
            echo '- Unknown category: selected streamers=0, global Others=1 when global totals exist'
            echo '- False Empty / No observed snapshots copy is forbidden'
            echo '- Public Kick Day Flow category cutover remains unauthorized'
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    if: github.event_name == 'push'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUTPUT_DIR: artifacts/12a9-kick-day-flow-category-post-repair-production-revalidation
      VIEWLOOM_ORIGIN: https://www.viewloom.net
      DAYFLOW_VALIDATION_DATE: '2026-08-10'
      PRODUCT_AUTHORITY_SHA: 27b3cca084d62d8badd512c068be415c6865965e
      EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout validation deployment source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove validation deployment is repaired-product equivalent
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          mapfile -t changed < <(git diff --name-only "$PRODUCT_AUTHORITY_SHA" "$EXPECTED_DEPLOYMENT_SHA")
          printf '%s\n' "${changed[@]}" | tee "$OUTPUT_DIR/product-to-deployment-files.txt"
          allowed='^(\.github/workflows/analytics-12a9-kick-day-flow-category-post-repair-production-revalidation\.yml|docs/audits/12a9-kick-day-flow-category-post-repair-production-revalidation-contract\.json|apps/web/scripts/kick-day-flow-category-post-repair-production-revalidation\.mjs)$'
          test "${#changed[@]}" -eq 3
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Repaired product runtime drift detected: $file" >&2; exit 1; }
          done

      - id: source
        name: Wait for validation SHA through Pages Git integration
        continue-on-error: true
        run: |
          set -euo pipefail
          success=false
          for attempt in $(seq 1 90); do
            observed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$VIEWLOOM_ORIGIN/deployment.json?kickDayFlowPostRepair=$GITHUB_RUN_ID-$attempt" -o /tmp/deployment.json; then
              cp /tmp/deployment.json "$OUTPUT_DIR/last-deployment.json"
              observed_sha=$(jq -r '.commit_sha // ""' /tmp/deployment.json)
              jq -n \
                --arg schema 'viewloom-12a9-kick-day-flow-post-repair-production-source-probe-v1' \
                --arg product "$PRODUCT_AUTHORITY_SHA" \
                --arg expected "$EXPECTED_DEPLOYMENT_SHA" \
                --arg observed "$observed_sha" \
                --arg observed_at "$observed_at" \
                --argjson attempt "$attempt" \
                --slurpfile deployment /tmp/deployment.json \
                '{schema:$schema,product_authority_sha:$product,expected_deployment_sha:$expected,observed_deployment_sha:$observed,observed_at:$observed_at,attempt:$attempt,deployment:$deployment[0]}' \
                > "$OUTPUT_DIR/source-probe.json"
              if [[ "$observed_sha" == "$EXPECTED_DEPLOYMENT_SHA" ]] \
                && [[ "$(jq -r '.environment // ""' /tmp/deployment.json)" == 'production' ]] \
                && [[ "$(jq -r '.branch // ""' /tmp/deployment.json)" == 'main' ]]; then
                success=true
                break
              fi
            fi
            sleep 5
          done
          if [[ "$success" != true ]]; then
            jq -n \
              --arg schema 'viewloom-12a9-kick-day-flow-post-repair-production-path-failure-v1' \
              --arg product "$PRODUCT_AUTHORITY_SHA" \
              --arg expected "$EXPECTED_DEPLOYMENT_SHA" \
              --slurpfile probe "$OUTPUT_DIR/source-probe.json" \
              '{schema:$schema,product_authority_sha:$product,expected_deployment_sha:$expected,product_failure_established:false,classification:"pages_git_integration_exact_sha_not_observed",last_probe:$probe[0]}' \
              > "$OUTPUT_DIR/production-path-failure.json"
            exit 1
          fi
          jq '.' "$OUTPUT_DIR/source-probe.json"

      - name: Setup Node.js
        if: steps.source.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        if: steps.source.outcome == 'success'
        run: npm install playwright@1.52.0 --no-save --no-audit --no-fund

      - name: Install Chromium
        if: steps.source.outcome == 'success'
        run: npx playwright install --with-deps chromium

      - id: browser
        name: Revalidate repaired Kick Day Flow category candidate against production
        if: steps.source.outcome == 'success'
        continue-on-error: true
        run: node apps/web/scripts/kick-day-flow-category-post-repair-production-revalidation.mjs

      - name: Upload corrected production revalidation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-12a9-kick-day-flow-category-post-repair-production-revalidation
          path: artifacts/12a9-kick-day-flow-category-post-repair-production-revalidation/
          if-no-files-found: error
          retention-days: 30

      - name: Fail after evidence upload when source or browser rejects
        if: steps.source.outcome != 'success' || steps.browser.outcome != 'success'
        run: exit 1
