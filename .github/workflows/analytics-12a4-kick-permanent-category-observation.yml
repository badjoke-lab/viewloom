name: Analytics 12A4 Kick Permanent Category Observation

on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a4-kick-permanent-category-observation.yml'
      - 'docs/audits/12a4-kick-permanent-category-observation-contract.json'
      - 'docs/audits/12a4-kick-permanent-category-start-acceptance.json'
      - 'scripts/run-12a4-kick-permanent-category-observer.mjs'
      - 'workers/collector-kick/wrangler.toml'

permissions:
  contents: read

concurrency:
  group: analytics-12a4-kick-permanent-category-observation
  cancel-in-progress: false

jobs:
  verify-package:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Parse observer
        run: node --check scripts/run-12a4-kick-permanent-category-observer.mjs
      - name: Verify observation contract
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const contract = JSON.parse(fs.readFileSync('docs/audits/12a4-kick-permanent-category-observation-contract.json', 'utf8'))
          const start = JSON.parse(fs.readFileSync('docs/audits/12a4-kick-permanent-category-start-acceptance.json', 'utf8'))
          if (contract.status !== 'active') throw new Error('observation_not_active')
          if (contract.startAt !== start.startAt) throw new Error('start_identity_mismatch')
          if (start.allInitialGatesPass !== true || start.rollbackOccurred !== false) throw new Error('start_not_accepted')
          if (contract.rollback?.automaticOnHardStop !== true) throw new Error('automatic_rollback_missing')
          if (contract.boundaries?.twitchChanged !== false) throw new Error('twitch_boundary_missing')
          NODE
      - name: Bundle normal Kick rollback collector without publishing
        run: pnpm dlx wrangler@4 deploy --dry-run --config workers/collector-kick/wrangler.toml

  observe:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      START_AT: '2026-07-25T07:10:00.000Z'
      OUTPUT_DIR: artifacts/12a4-kick-permanent-category-observation/current
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - id: health
        name: Run read-only Kick observation
        continue-on-error: true
        run: MODE=observe node scripts/run-12a4-kick-permanent-category-observer.mjs
      - name: Roll back normal Kick configuration on hard stop
        if: steps.health.outcome != 'success'
        run: pnpm dlx wrangler@4 deploy --config workers/collector-kick/wrangler.toml
      - name: Verify normal Kick recovery after rollback
        if: steps.health.outcome != 'success'
        env:
          OUTPUT_DIR: artifacts/12a4-kick-permanent-category-observation/rollback
        run: MODE=rollback node scripts/run-12a4-kick-permanent-category-observer.mjs
      - name: Upload sanitized observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-12a4-kick-permanent-category-observation
          path: artifacts/12a4-kick-permanent-category-observation/**/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail after verified rollback
        if: steps.health.outcome != 'success'
        run: exit 1
