name: Analytics 12A10 Kick Battle Lines Category Candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a10-kick-battle-lines-category-candidate.yml'
      - 'scripts/verify-12a10-kick-battle-lines-category-candidate.mjs'
      - 'apps/web/scripts/verify-kick-battle-lines-category-candidate.mjs'
      - 'apps/web/functions/_lib/battle-lines-core.ts'
      - 'apps/web/functions/_lib/battle-lines-category.ts'
      - 'apps/web/functions/api/kick-battle-lines.ts'
      - 'apps/web/src/live/battle-lines-current-shell-entry.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a10-kick-battle-lines-category-candidate.yml'
      - 'scripts/verify-12a10-kick-battle-lines-category-candidate.mjs'
      - 'apps/web/functions/_lib/battle-lines-core.ts'
      - 'apps/web/functions/_lib/battle-lines-category.ts'
      - 'apps/web/functions/api/kick-battle-lines.ts'
      - 'apps/web/src/live/battle-lines-current-shell-entry.ts'

permissions:
  contents: read

concurrency:
  group: analytics-12a10-kick-battle-lines-category-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Verify accepted hidden candidate historically
        run: node scripts/verify-12a10-kick-battle-lines-category-candidate.mjs
      - name: Run retained Battle Lines base and category fixtures
        working-directory: apps/web
        run: |
          node scripts/verify-battle-lines-core.mjs
          node scripts/verify-kick-battle-lines-category-candidate.mjs
      - name: Verify retained architecture contracts
        run: |
          node scripts/verify-quality-u10g-architecture.mjs
          node scripts/verify-quality-u10d-analysis-coherence.mjs
      - name: Verify current production source remains bounded
        working-directory: apps/web
        run: node scripts/verify-production-source.mjs
      - name: Typecheck and build current web
        run: |
          pnpm typecheck:web
          pnpm build:web
      - name: Publish historical candidate boundary
        if: always()
        run: |
          {
            echo '## Kick Battle Lines hidden Category candidate — historical authority'
            echo
            echo '- Accepted hidden product SHA: a802e7fe1e964180904c72744b7228c549a54660'
            echo '- Decision authority: #813 / PR #814'
            echo '- Hidden implementation: #815 / PR #816'
            echo '- Historical source is read with git show; later public runtime cannot rewrite hidden acceptance meaning'
            echo '- Retained category point-state/scoring fixtures still run against current shared core'
            echo '- Current runtime may advance through separately authorized public gates'
          } >> "$GITHUB_STEP_SUMMARY"
