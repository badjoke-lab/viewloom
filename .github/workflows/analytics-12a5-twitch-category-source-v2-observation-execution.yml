name: Analytics 12A5 Twitch Category Source V2 Observation Execution

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a5-twitch-category-source-v2-observation-execution.yml'
      - 'docs/audits/12a5-twitch-category-source-v2-observation-execution-package-contract.json'
      - 'docs/audits/12a5-twitch-category-source-v2-observation-execution-package-acceptance.json'
      - 'docs/audits/12a5-twitch-category-source-v2-observation-trigger-contract.json'
      - 'docs/audits/12a5-twitch-category-source-v2-observation-trigger.json'
      - 'docs/audits/12a5-twitch-category-source-v2-observation-failure-evidence.json'
      - 'docs/audits/12a5-twitch-category-source-v2-observation-recovery-package-contract.json'
      - 'docs/audits/12a5-twitch-category-source-v2-completeness-package-contract.json'
      - 'docs/audits/12a5-twitch-category-source-v2-completeness-package-acceptance.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-decision.json'
      - 'scripts/build-12a5-twitch-category-source-v2-observation-worker.mjs'
      - 'scripts/run-12a5-twitch-category-source-v2-observation.mjs'
      - 'scripts/verify-12a5-twitch-category-source-v2-observation-execution-package.mjs'
      - 'execution-packages/twitch-category-source-v2-observation/wrangler.toml'
      - 'workers/shared/category-capture-v2-candidate.ts'
      - 'workers/collector-twitch/src/index-category.ts'
      - 'workers/collector-twitch/src/entry.ts'
      - 'workers/collector-twitch/wrangler.category-permanent.toml'
      - 'workers/collector-kick/**'
      - 'docs/product/current-roadmap.md'
      - 'docs/product/current-schedule.md'
      - 'docs/product/twitch-replacement-seven-day-audit-spec.md'
      - 'docs/work-in-progress/phase12a4-category-parallel-execution.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'apps/web/**'
  push:
    branches: [main]
    paths:
      - 'docs/audits/12a5-twitch-category-source-v2-observation-trigger.json'

permissions:
  contents: read

concurrency:
  group: analytics-12a5-twitch-category-source-v2-observation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trigger_present: ${{ steps.classify.outputs.trigger_present }}
    steps:
      - uses: actions/checkout@v4
      - id: classify
        name: Detect exact Twitch category-source-v2 observation trigger
        run: |
          path='docs/audits/12a5-twitch-category-source-v2-observation-trigger.json'
          if test -f "$path"; then
            echo 'trigger_present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'trigger_present=false' >> "$GITHUB_OUTPUT"
          fi

  verify-package:
    if: github.event_name == 'pull_request' && needs.classify.outputs.trigger_present != 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Confirm exact trigger is absent
        run: test ! -f docs/audits/12a5-twitch-category-source-v2-observation-trigger.json
      - name: Parse execution package scripts
        run: |
          node --check scripts/build-12a5-twitch-category-source-v2-observation-worker.mjs
          node --check scripts/run-12a5-twitch-category-source-v2-observation.mjs
          node --check scripts/verify-12a5-twitch-category-source-v2-observation-execution-package.mjs
      - name: Generate exact-source observation worker
        run: node scripts/build-12a5-twitch-category-source-v2-observation-worker.mjs
      - name: Compile generated observation worker
        run: pnpm exec tsc --target ES2022 --module ES2022 --moduleResolution Bundler --strict --skipLibCheck --noEmit --types @cloudflare/workers-types workers/collector-twitch/.generated-v2-observation/entry.ts
      - name: Bundle observation worker without deployment
        run: pnpm dlx wrangler@4 deploy --dry-run --outdir artifacts/12a5-twitch-category-source-v2-observation/dry-run --config execution-packages/twitch-category-source-v2-observation/wrangler.toml
      - name: Verify accepted bounded execution package and recovery correction
        run: node scripts/verify-12a5-twitch-category-source-v2-observation-execution-package.mjs
      - name: Verify accepted dormant candidate package
        run: node scripts/verify-12a5-twitch-category-source-v2-completeness-package.mjs
      - name: Verify governing recovery decision
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-decision.mjs
      - name: Verify category rollout policy
        run: node scripts/verify-category-rollout-policy.mjs
      - name: Verify development policy
        run: node scripts/verify-development-policy.mjs
      - name: Typecheck active collectors
        run: pnpm typecheck:collectors
      - name: Typecheck web
        run: pnpm typecheck:web
      - name: Build web
        run: pnpm build:web
      - name: Verify public category controls remain absent
        run: |
          test -f apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'heatmap-category-preview-controls' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/twitch/heatmap/index.html
          test -f apps/web/dist/kick/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/kick/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/kick/heatmap/index.html
      - name: Remove generated worker
        if: always()
        run: rm -rf workers/collector-twitch/.generated-v2-observation
      - name: Summarize accepted execution boundary
        run: |
          {
            echo '## Twitch category-source-v2 observation recovery package'
            echo
            echo '- Original package / acceptance: `#685` / `#686`'
            echo '- Failed production observation: run `30608982443`'
            echo '- Corrected package: `#692`'
            echo '- Generated Worker remains under `workers/collector-twitch/.generated-v2-observation`'
            echo '- Evidence remains under `artifacts/12a5-twitch-category-source-v2-observation/run`'
            echo '- Production observation skipped on this PR'
            echo '- Separate acceptance and exact trigger remain required'
            echo '- Canonical v1 rollback remains mandatory'
          } >> "$GITHUB_STEP_SUMMARY"

  validate-trigger:
    if: needs.classify.outputs.trigger_present == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate accepted execution package and exact immediate trigger
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const packageContract = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-category-source-v2-observation-execution-package-contract.json', 'utf8'))
          const triggerContract = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-category-source-v2-observation-trigger-contract.json', 'utf8'))
          const trigger = JSON.parse(fs.readFileSync('docs/audits/12a5-twitch-category-source-v2-observation-trigger.json', 'utf8'))
          if (packageContract.status !== 'accepted') throw new Error('execution_package_not_accepted')
          if (triggerContract.status !== 'accepted') throw new Error('trigger_contract_not_accepted')
          if (trigger.schemaVersion !== triggerContract.trigger.schemaVersion) throw new Error('trigger_schema_mismatch')
          if (trigger.status !== 'armed' || trigger.provider !== 'twitch' || trigger.mode !== 'category_source_v2_observation' || trigger.oneTime !== true) throw new Error('trigger_identity_invalid')
          if (trigger.confirmation !== triggerContract.trigger.confirmation || trigger.executeImmediately !== true) throw new Error('trigger_confirmation_invalid')
          if ('startAt' in trigger) throw new Error('start_at_forbidden')
          if (trigger.packagePr !== packageContract.packageIdentity.packagePr || trigger.packageMergeSha !== packageContract.packageIdentity.packageMergeSha || trigger.acceptancePr !== packageContract.packageIdentity.acceptancePr) throw new Error('package_identity_mismatch')
          NODE

  observe:
    if: github.event_name == 'push' && needs.classify.outputs.trigger_present == 'true'
    needs:
      - classify
      - validate-trigger
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Install Wrangler 4
        run: npm install --global wrangler@4
      - id: observation
        name: Run bounded Twitch category-source-v2 observation
        continue-on-error: true
        run: node scripts/run-12a5-twitch-category-source-v2-observation.mjs
      - name: Upload Twitch category-source-v2 observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-12a5-twitch-category-source-v2-observation
          path: artifacts/12a5-twitch-category-source-v2-observation/run/evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence upload when observation is unhealthy
        if: steps.observation.outcome != 'success'
        run: exit 1
