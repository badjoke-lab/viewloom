name: Analytics 12A10 Kick Battle Lines Category Feasibility Decision

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analytics-12a10-kick-battle-lines-category-feasibility-decision.yml'
      - 'docs/audits/12a10-kick-battle-lines-category-feasibility-decision.json'
      - 'scripts/verify-12a10-kick-battle-lines-category-feasibility-decision.mjs'

permissions:
  contents: read

concurrency:
  group: analytics-12a10-kick-battle-lines-category-decision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Verify exact three-file decision scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(\.github/workflows/analytics-12a10-kick-battle-lines-category-feasibility-decision\.yml|docs/audits/12a10-kick-battle-lines-category-feasibility-decision\.json|scripts/verify-12a10-kick-battle-lines-category-feasibility-decision\.mjs)$'
          test "${#changed[@]}" -eq 3
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "Unexpected non-decision change: $file" >&2; exit 1; }
          done
      - name: Verify permanent Kick Day Flow category authority
        run: node scripts/verify-12a9-kick-day-flow-category-public-production-evidence.mjs
      - name: Verify Kick Battle Lines category feasibility decision
        run: node scripts/verify-12a10-kick-battle-lines-category-feasibility-decision.mjs
      - name: Typecheck and build unchanged product
        run: |
          pnpm typecheck:web
          pnpm build:web
      - name: Publish decision boundary
        if: always()
        run: |
          {
            echo '## Kick Battle Lines Category feasibility decision'
            echo
            echo '- Decision: authorize hidden Kick-only Battle Lines Category candidate'
            echo '- Current accepted snapshot data is sufficient; no collector/D1/schema/backfill expansion'
            echo '- Category contract must be validated before candidate compaction'
            echo '- Category filter must run before Top N and Recommended Battle scoring'
            echo '- Top remains 3 / 5 / 10, default 5'
            echo '- Viewers / Indexed remain the existing metrics'
            echo '- New selected-category honesty states: outside_category / category_unavailable'
            echo '- Those states are never inferred as zero, offline, or missing'
            echo '- Battle scoring/events use mutually category-qualified observed buckets only'
            echo '- Normal Kick Battle Lines route remains category-free'
            echo '- Public exposure remains unauthorized'
          } >> "$GITHUB_STEP_SUMMARY"
