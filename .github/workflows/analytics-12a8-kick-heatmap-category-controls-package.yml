name: Analytics 12A8 Kick Heatmap Category Controls Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/audits/12a8-kick-heatmap-category-hidden-controls-contract.json'
      - 'apps/web/src/features/twitch-heatmap/model.ts'
      - 'apps/web/src/features/twitch-heatmap/category-preview-controls.ts'
      - 'apps/web/src/live/twitch-heatmap.ts'
      - 'scripts/verify-12a8-kick-heatmap-category-controls-package.mjs'
      - '.github/workflows/analytics-12a8-kick-heatmap-category-controls-package.yml'

permissions:
  contents: read

concurrency:
  group: analytics-12a8-kick-heatmap-category-controls-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Parse package verifier
        run: node --check scripts/verify-12a8-kick-heatmap-category-controls-package.mjs
      - name: Verify hidden Kick controls and public boundaries
        run: node scripts/verify-12a8-kick-heatmap-category-controls-package.mjs
      - name: Verify Kick category API package and accepted decision boundary
        run: node scripts/verify-12a8-kick-heatmap-category-api-package.mjs
      - name: Verify current category rollout policy
        run: node scripts/verify-category-rollout-policy.mjs
      - name: Typecheck web
        run: pnpm typecheck:web
      - name: Build web
        run: pnpm build:web
      - name: Verify normal public HTML remains free of hidden Kick controls
        run: |
          test -f apps/web/dist/kick/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/kick/heatmap/index.html
          ! grep -q 'heatmap-category-preview-controls' apps/web/dist/kick/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/kick/heatmap/index.html
          test -f apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/twitch/heatmap/index.html
      - name: Publish package summary
        if: always()
        run: |
          {
            echo '## ViewLoom hidden Kick Heatmap category controls package'
            echo
            echo '- Hidden entry: categoryPreview=1'
            echo '- Provider: Kick only for hidden gate'
            echo '- Accepted decision artifact: verified through the transition-safe API package verifier'
            echo '- Normal Kick route controls: no'
            echo '- Twitch public category behavior: preserved'
            echo '- Default category: All categories'
            echo '- Top values: 20 / 50 / 100'
            echo '- Kick preview URL state: preserved on interaction'
            echo '- Unknown/unavailable category states: explicit'
            echo '- Selected-category incompatible momentum: Unavailable'
            echo '- Mobile and keyboard behavior: included'
            echo '- Collector / Worker / D1 / cadence / retention / backfill / credentials: unchanged'
            echo '- Public Kick category exposure: not authorized'
          } >> "$GITHUB_STEP_SUMMARY"
