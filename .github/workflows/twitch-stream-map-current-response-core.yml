name: Twitch Stream Map Current Response Core

on:
  pull_request:
    paths:
      - 'scripts/twitch-stream-map-current-response-core.mjs'
      - 'scripts/verify-twitch-stream-map-current-response-core.mjs'
      - 'scripts/verify-twitch-stream-map-current-public-readiness.mjs'
      - 'scripts/verify-twitch-stream-map-current-r2-preauthorization-readiness.mjs'
      - 'scripts/verify-twitch-stream-map-current-temporal-evidence-2026-09-06.mjs'
      - 'docs/audits/twitch-stream-map-current-response-fixture-v0.1.json'
      - 'docs/audits/twitch-stream-map-current-review-queue-live-result-2026-09-06.json'
      - 'docs/audits/twitch-stream-map-current-temporal-evidence-acquisition-result-2026-09-06.json'
      - 'docs/audits/twitch-stream-map-current-r2-preauthorization-readiness-2026-09-06.json'
      - 'workers/collector-twitch/scripts/current-location-evidence-eligibility.mjs'
      - 'workers/collector-twitch/src/index-category.ts'
      - 'apps/web/functions/api/twitch-stream-map-core.mjs'
      - 'apps/web/functions/api/twitch-stream-map.ts'
      - 'apps/web/src/features/twitch-stream-map/geography-ui-bootstrap.ts'
      - '.github/workflows/twitch-stream-map-current-response-core.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twitch-stream-map-current-response-core.mjs'
      - 'scripts/verify-twitch-stream-map-current-response-core.mjs'
      - 'scripts/verify-twitch-stream-map-current-public-readiness.mjs'
      - 'scripts/verify-twitch-stream-map-current-r2-preauthorization-readiness.mjs'
      - 'scripts/verify-twitch-stream-map-current-temporal-evidence-2026-09-06.mjs'
      - 'docs/audits/twitch-stream-map-current-response-fixture-v0.1.json'
      - 'docs/audits/twitch-stream-map-current-review-queue-live-result-2026-09-06.json'
      - 'docs/audits/twitch-stream-map-current-temporal-evidence-acquisition-result-2026-09-06.json'
      - 'docs/audits/twitch-stream-map-current-r2-preauthorization-readiness-2026-09-06.json'
      - 'workers/collector-twitch/scripts/current-location-evidence-eligibility.mjs'
      - 'workers/collector-twitch/src/index-category.ts'
      - 'apps/web/functions/api/twitch-stream-map-core.mjs'
      - 'apps/web/functions/api/twitch-stream-map.ts'
      - 'apps/web/src/features/twitch-stream-map/geography-ui-bootstrap.ts'
      - '.github/workflows/twitch-stream-map-current-response-core.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Twitch Current response core
        run: node scripts/verify-twitch-stream-map-current-response-core.mjs
      - name: Verify September 6 Current temporal evidence audit
        run: node scripts/verify-twitch-stream-map-current-temporal-evidence-2026-09-06.mjs
      - name: Verify Twitch Current public readiness remains explicitly blocked
        run: node scripts/verify-twitch-stream-map-current-public-readiness.mjs
      - name: Verify Twitch Current R2 pre-authorization readiness
        run: node scripts/verify-twitch-stream-map-current-r2-preauthorization-readiness.mjs
