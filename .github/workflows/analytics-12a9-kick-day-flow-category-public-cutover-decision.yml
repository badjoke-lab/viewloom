name: Analytics 12A9 Kick Day Flow Category Public Cutover Decision

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'docs/audits/12a9-kick-day-flow-category-public-cutover-decision.json'
      - 'scripts/verify-12a9-kick-day-flow-category-public-cutover-decision.mjs'
      - '.github/workflows/analytics-12a9-kick-day-flow-category-public-cutover-decision.yml'

permissions:
  contents: read

concurrency:
  group: analytics-12a9-kick-day-flow-category-public-cutover-decision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout decision head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify accepted corrected hidden evidence remains authoritative
        run: node scripts/verify-12a9-kick-day-flow-category-post-repair-production-revalidation-evidence.mjs

      - name: Verify Kick Day Flow public category cutover decision
        run: node scripts/verify-12a9-kick-day-flow-category-public-cutover-decision.mjs

      - name: Verify decision-only PR scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          allowed='^(docs/audits/12a9-kick-day-flow-category-public-cutover-decision\.json|scripts/verify-12a9-kick-day-flow-category-public-cutover-decision\.mjs|\.github/workflows/analytics-12a9-kick-day-flow-category-public-cutover-decision\.yml)$'
          test "${#changed[@]}" -eq 3
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "Unexpected non-decision change: $path" >&2; exit 1; }
          done

      - name: Publish decision boundary
        if: always()
        run: |
          {
            echo '## Kick Day Flow category public-cutover decision'
            echo
            echo '- Decision: authorize public Kick Day Flow Category controls'
            echo '- Default category: All categories'
            echo '- Existing Top controls unchanged: 10 / 20 / 50, default 20'
            echo '- Existing Bucket controls unchanged: 5m / 10m, default 5m'
            echo '- Category identity: (kick, categoryProviderId)'
            echo '- Membership: per observed snapshot; no latest-category backprojection'
            echo '- Bucket aggregation: average observed stream viewers'
            echo '- Filter: category before Top N; ranking by viewer-minutes'
            echo '- Full Share: all observed Kick viewers per bucket'
            echo '- Top Focus Share: displayed selected-category Top N viewers per bucket'
            echo '- Full Others: global observed Kick remainder outside displayed selected-category Top N'
            echo '- Unknown/unavailable: zero selected streamers, honest global context retained, false Empty forbidden'
            echo '- Legacy categoryPreview=1: compatible but not required; removed after public control interaction'
            echo '- Normal Kick route: public controls authorized only after a later implementation PR'
            echo '- Exact-production browser acceptance: required after implementation'
            echo '- Kick Heatmap / Battle Lines / History semantics: unchanged / not newly authorized'
            echo '- Twitch runtime semantics: unchanged'
            echo '- Collector / Worker / D1 / schema / cadence / retention / backfill / credentials: unchanged'
          } >> "$GITHUB_STEP_SUMMARY"
