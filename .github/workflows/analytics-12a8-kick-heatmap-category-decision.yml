name: Analytics 12A8 Kick Heatmap Category Decision

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/audits/12a8-kick-heatmap-category-feasibility-decision.json'
      - 'scripts/verify-12a8-kick-heatmap-category-feasibility-decision.mjs'
      - '.github/workflows/analytics-12a8-kick-heatmap-category-decision.yml'

permissions:
  contents: read

concurrency:
  group: analytics-12a8-kick-heatmap-category-decision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout decision head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Kick Heatmap category feasibility decision
        run: node scripts/verify-12a8-kick-heatmap-category-feasibility-decision.mjs

      - name: Verify decision-only or verifier-compatibility PR scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "${changed[@]}"
          decision='^(docs/audits/12a8-kick-heatmap-category-feasibility-decision\.json|scripts/verify-12a8-kick-heatmap-category-feasibility-decision\.mjs|\.github/workflows/analytics-12a8-kick-heatmap-category-decision\.yml)$'
          compatibility='^(scripts/verify-12a8-kick-heatmap-category-feasibility-decision\.mjs|\.github/workflows/analytics-12a8-kick-heatmap-category-decision\.yml)$'
          exact_scope() {
            local expected="$1"
            local regex="$2"
            test "${#changed[@]}" -eq "$expected" || return 1
            for path in "${changed[@]}"; do
              [[ "$path" =~ $regex ]] || return 1
            done
          }
          if exact_scope 3 "$decision"; then
            echo 'Validated original decision-only scope.'
          elif exact_scope 2 "$compatibility"; then
            echo 'Validated bounded verifier-compatibility scope.'
          else
            echo 'Unexpected Kick category decision scope.' >&2
            exit 1
          fi

      - name: Publish decision boundary
        if: always()
        run: |
          {
            echo '## Kick Heatmap category feasibility decision'
            echo
            echo '- Decision: authorize hidden Kick-only candidate'
            echo '- Exact identity: provider-scoped Kick category id'
            echo '- Membership: per observed snapshot'
            echo '- Primary category-bearing source: official-livestreams'
            echo '- Fallback source without usable category metadata: category unavailable; never inferred'
            echo '- Filter ordering: category before Top N'
            echo '- Selected-category momentum: compare only compatible same-category observations'
            echo '- Decision evidence API: frozen sourceMainSha, not mutable current runtime'
            echo '- Existing normal Kick Heatmap: unchanged and unfiltered'
            echo '- Public Kick category controls: not authorized'
            echo '- Kick Day Flow / Battle Lines / History category UI: not authorized'
            echo '- Twitch runtime: unchanged'
            echo '- Collector / Worker / D1 / cadence / retention / backfill / credentials: unchanged'
          } >> "$GITHUB_STEP_SUMMARY"
