name: Verify Data Status production 714

on:
  pull_request:
    paths:
      - '.github/workflows/verify-data-status-production-714.yml'

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production browser probe
        run: |
          npm install playwright@1.52.0 --no-save --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify six production pages
        run: |
          node <<'NODE'
          const { chromium } = require('playwright')

          async function main() {
            const checks = [
              ['Twitch Home', 'https://www.viewloom.net/twitch/', 'Open Data Status'],
              ['Kick Home', 'https://www.viewloom.net/kick/', 'Open Data Status'],
              ['Twitch Channel', 'https://www.viewloom.net/twitch/channel/', 'Data Status'],
              ['Kick Channel', 'https://www.viewloom.net/kick/channel/', 'Data Status'],
              ['Twitch Watchlist', 'https://www.viewloom.net/twitch/watchlist/', 'Data Status'],
              ['Kick Watchlist', 'https://www.viewloom.net/kick/watchlist/', 'Data Status'],
            ]

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
            const browser = await chromium.launch()
            let lastFailures = []

            try {
              for (let attempt = 1; attempt <= 12; attempt += 1) {
                const context = await browser.newContext()
                lastFailures = []

                for (const [label, url, expected] of checks) {
                  const page = await context.newPage()
                  try {
                    const response = await page.goto(`${url}?production_verify_714=${Date.now()}`, {
                      waitUntil: 'domcontentloaded',
                      timeout: 45_000,
                    })
                    await page.waitForTimeout(2500)
                    const status = response?.status() ?? 0
                    const text = (await page.locator('body').innerText()).replace(/\s+/g, ' ').trim()
                    const passed = status === 200 && text.includes(expected)
                    console.log(JSON.stringify({ attempt, label, url, status, expected, passed }))
                    if (!passed) lastFailures.push(`${label}: status=${status}, missing=${expected}`)
                  } catch (error) {
                    lastFailures.push(`${label}: ${error instanceof Error ? error.message : String(error)}`)
                  } finally {
                    await page.close()
                  }
                }

                await context.close()
                if (lastFailures.length === 0) {
                  console.log('DATA_STATUS_PRODUCTION_714_PASS')
                  return
                }

                console.log(`Attempt ${attempt} failures: ${lastFailures.join(' | ')}`)
                if (attempt < 12) await sleep(15_000)
              }

              throw new Error(`production_not_updated: ${lastFailures.join(' | ')}`)
            } finally {
              await browser.close()
            }
          }

          main().catch((error) => {
            console.error(error)
            process.exitCode = 1
          })
          NODE
