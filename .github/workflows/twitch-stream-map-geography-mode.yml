      - 'apps/web/src/features/twitch-stream-map/maplibre-bootstrap.ts'
      - 'apps/web/src/features/twitch-stream-map/unmapped-reason-core.mjs'
      - 'apps/web/src/features/twitch-stream-map/unmapped-reason-view.ts'
      - 'apps/web/fixtures/twitch-stream-map-city-ui-request-fixture.json'
      - 'apps/web/scripts/verify-twitch-stream-map-city-aggregate.mjs'
      - 'apps/web/scripts/verify-twitch-stream-map-city-reference-geometry.mjs'
      - 'apps/web/scripts/verify-twitch-stream-map-city-reference-point-rendering.mjs'
