      - 'scripts/verify-twitch-stream-map-city-ui-gate-audit.mjs'
      - 'scripts/verify-twitch-stream-map-city-ui-request-fixture.mjs'
      - 'scripts/verify-twitch-stream-map-geography-ui-wiring.mjs'
      - 'docs/product/twitch-stream-map-city-ui-gate-v0.1.md'
      - 'docs/audits/twitch-stream-map-city-ui-gate-2026-08-26.json'
      - 'docs/implementation/twitch-stream-map-city-ui-wiring-plan-v0.1.md'
      - '.github/workflows/twitch-stream-map-geography-mode.yml'
      - 'apps/web/twitch/map/index.html'
      - 'apps/web/src/features/twitch-stream-map/stream-map-entry.ts'
  push:
    branches:
      - main
    paths:
      - 'apps/web/functions/api/twitch-stream-map-reviewed-evidence.mjs'
      - 'apps/web/src/features/twitch-stream-map/geography-mode-core.mjs'
      - 'apps/web/src/features/twitch-stream-map/geography-mode-core.d.mts'
      - 'apps/web/src/features/twitch-stream-map/geography-ui-bootstrap.ts'
