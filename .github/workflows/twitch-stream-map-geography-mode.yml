    paths:
      - 'apps/web/functions/api/twitch-stream-map-reviewed-evidence.mjs'
      - 'apps/web/src/features/twitch-stream-map/geography-mode-core.mjs'
      - 'apps/web/src/features/twitch-stream-map/geography-mode-core.d.mts'
