      - 'apps/web/src/features/twitch-stream-map/city-aggregate-core.d.mts'
      - 'apps/web/src/features/twitch-stream-map/city-reference-geometry-registry.mjs'
      - 'apps/web/src/features/twitch-stream-map/city-reference-point-core.mjs'
      - 'apps/web/src/features/twitch-stream-map/city-reference-point-core.d.mts'
      - 'apps/web/src/features/twitch-stream-map/stream-map-runtime.ts'
      - 'apps/web/src/features/twitch-stream-map/maplibre-bootstrap.ts'
      - 'apps/web/src/features/twitch-stream-map/unmapped-reason-core.mjs'
      - 'apps/web/src/features/twitch-stream-map/unmapped-reason-view.ts'
      - 'apps/web/fixtures/twitch-stream-map-city-ui-request-fixture.json'
      - 'apps/web/scripts/verify-twitch-stream-map-city-aggregate.mjs'
      - 'apps/web/scripts/verify-twitch-stream-map-city-reference-geometry.mjs'
      - 'apps/web/scripts/verify-twitch-stream-map-city-reference-point-rendering.mjs'
      - 'scripts/verify-twitch-stream-map-geography-mode.mjs'
      - 'scripts/verify-twitch-stream-map-city-ui-gate-audit.mjs'
      - 'scripts/verify-twitch-stream-map-city-ui-request-fixture.mjs'
      - 'scripts/verify-twitch-stream-map-geography-ui-wiring.mjs'
      - 'docs/product/twitch-stream-map-city-ui-gate-v0.1.md'
      - 'docs/audits/twitch-stream-map-city-ui-gate-2026-08-26.json'
      - 'docs/implementation/twitch-stream-map-city-ui-wiring-plan-v0.1.md'
      - '.github/workflows/twitch-stream-map-geography-mode.yml'
      - 'apps/web/twitch/map/index.html'
      - 'apps/web/src/features/twitch-stream-map/stream-map-entry.ts'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify geography mode contract
        run: node scripts/verify-twitch-stream-map-geography-mode.mjs
      - name: Verify City UI gate audit
        run: node scripts/verify-twitch-stream-map-city-ui-gate-audit.mjs
      - name: Verify City UI request fixture
        run: node scripts/verify-twitch-stream-map-city-ui-request-fixture.mjs
      - name: Verify City UI wiring
        run: node scripts/verify-twitch-stream-map-geography-ui-wiring.mjs
      - name: Verify City aggregate core
        run: node apps/web/scripts/verify-twitch-stream-map-city-aggregate.mjs
      - name: Verify City reference geometry registry
        run: node apps/web/scripts/verify-twitch-stream-map-city-reference-geometry.mjs
      - name: Verify City reference point rendering
        run: node apps/web/scripts/verify-twitch-stream-map-city-reference-point-rendering.mjs
