name: Production Smoke Contract

on:
  pull_request:
    paths:
      - 'apps/web/public/404.html'
      - 'apps/web/ja/**'
      - 'apps/web/scripts/normalize-built-head.mjs'
      - 'apps/web/docs/not-found-and-deployment-contract.md'
      - 'scripts/build-phase11-monitoring-evidence.mjs'
      - 'scripts/verify-phase11-monitoring-evidence.mjs'
      - '.github/workflows/production-smoke*.yml'
      - '.github/workflows/public-readiness-audit.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build:web
      - name: Verify local build contract
        working-directory: apps/web
        run: |
          set -euo pipefail
          test -f dist/404.html
          grep -q 'data-viewloom-not-found="v1"' dist/404.html
          test -f dist/deployment.json
          jq -e '.schema == "viewloom-deployment-v1" and .environment == "local"' dist/deployment.json > /dev/null
          for file in \
            dist/ja/index.html \
            dist/ja/about/index.html \
            dist/ja/support/index.html \
            dist/ja/contact/index.html \
            dist/ja/changelog/index.html \
            dist/ja/terms/index.html \
            dist/ja/privacy/index.html \
            dist/ja/refund-policy/index.html \
            dist/ja/commercial-disclosure/index.html \
            dist/ja/twitch/index.html \
            dist/ja/kick/index.html \
            dist/ja/twitch/heatmap/index.html \
            dist/ja/kick/heatmap/index.html \
            dist/ja/twitch/day-flow/index.html \
            dist/ja/kick/day-flow/index.html \
            dist/ja/twitch/battle-lines/index.html \
            dist/ja/kick/battle-lines/index.html \
            dist/ja/twitch/history/index.html \
            dist/ja/kick/history/index.html \
            dist/ja/twitch/map/index.html \
            dist/ja/kick/map/index.html \
            dist/ja/twitch/status/index.html \
            dist/ja/kick/status/index.html \
            dist/ja/twitch/channel/index.html \
            dist/ja/kick/channel/index.html \
            dist/ja/twitch/watchlist/index.html \
            dist/ja/kick/watchlist/index.html
          do
            test -f "$file"
            grep -Eqi '<html[^>]+lang="ja"' "$file"
            grep -Eqi '<meta[^>]+name="robots"[^>]+content="noindex,follow"|<meta[^>]+content="noindex,follow"[^>]+name="robots"' "$file"
            ! grep -qi 'hreflang=' "$file"
          done
          grep -q '異なる問いを、異なる画面で見るための観測ツールです。' dist/ja/about/index.html
          grep -q '観測を継続するための支援です。' dist/ja/support/index.html
          grep -q 'ViewLoomで確認した内容をお知らせください。' dist/ja/contact/index.html
          grep -q 'レビュー済みのViewLoom主要マイルストーン' dist/ja/changelog/index.html
          grep -q '利用規約' dist/ja/terms/index.html
          grep -q 'プライバシー' dist/ja/privacy/index.html
          grep -q '返金ポリシー' dist/ja/refund-policy/index.html
          grep -q '特定商取引法に基づく表記' dist/ja/commercial-disclosure/index.html
          grep -q '観測日の集計基準はUTCです。' dist/ja/twitch/heatmap/index.html
          grep -q '観測日の集計基準はUTCです。' dist/ja/kick/heatmap/index.html
          grep -q 'UTCの実時間をたどり' dist/ja/twitch/day-flow/index.html
          grep -q 'UTCの実時間をたどり' dist/ja/kick/day-flow/index.html
          grep -q 'UTC基準' dist/ja/twitch/battle-lines/index.html
          grep -q 'UTC基準' dist/ja/kick/battle-lines/index.html
          grep -q 'UTC基準' dist/ja/twitch/history/index.html
          grep -q 'UTC基準' dist/ja/kick/history/index.html
          grep -q 'Current / IRL' dist/ja/twitch/map/index.html
          grep -q 'Current / IRL' dist/ja/kick/map/index.html
          grep -q '鮮度' dist/ja/twitch/status/index.html
          grep -q '鮮度' dist/ja/kick/status/index.html
          grep -q '保持ランキング履歴' dist/ja/twitch/channel/index.html
          grep -q '保持ランキング履歴' dist/ja/kick/channel/index.html
          grep -q 'このブラウザだけに保存' dist/ja/twitch/watchlist/index.html
          grep -q 'このブラウザだけに保存' dist/ja/kick/watchlist/index.html
          grep -q '/src/live/watchlist-ja-presentation.ts' ja/twitch/watchlist/index.html
          grep -q '/src/live/watchlist-ja-presentation.ts' ja/kick/watchlist/index.html
          grep -q '/src/live/watchlist-page.ts' ja/twitch/watchlist/index.html
          grep -q '/src/live/watchlist-page.ts' ja/kick/watchlist/index.html
          grep -q '/src/live/channel-ja-presentation.ts' ja/twitch/channel/index.html
          grep -q '/src/live/channel-ja-presentation.ts' ja/kick/channel/index.html
          grep -q '/src/live/status-ja-presentation.ts' ja/twitch/status/index.html
          grep -q '/src/live/status-ja-presentation.ts' ja/kick/status/index.html
          grep -q '/src/features/twitch-stream-map/stream-map-ja-presentation.ts' ja/twitch/map/index.html
          grep -q '/src/features/twitch-stream-map/stream-map-ja-presentation.ts' ja/kick/map/index.html
          for file in ja/about/index.html ja/support/index.html ja/contact/index.html ja/terms/index.html ja/privacy/index.html ja/refund-policy/index.html ja/commercial-disclosure/index.html; do
            grep -q '/src/static-page.ts' "$file"
          done
          grep -q '/src/changelog-page.ts' ja/changelog/index.html
          grep -q 'href="/data/changelog.json"' ja/changelog/index.html
          ! grep -q '<loc>https://www.viewloom.net/ja/' dist/sitemap.xml
      - name: Verify production smoke workflow contract
        run: |
          set -euo pipefail
          grep -q 'Wait for the matching production deployment' .github/workflows/production-smoke.yml
          grep -q 'Verify hidden Japanese candidates' .github/workflows/production-smoke.yml
          grep -q "test \"\${#routes\[@\]}\" = '54'" .github/workflows/production-smoke.yml
          for route in \
            'ja-about|https://www.viewloom.net/ja/about/' \
            'ja-support|https://www.viewloom.net/ja/support/' \
            'ja-contact|https://www.viewloom.net/ja/contact/' \
            'ja-changelog|https://www.viewloom.net/ja/changelog/' \
            'ja-terms|https://www.viewloom.net/ja/terms/' \
            'ja-privacy|https://www.viewloom.net/ja/privacy/' \
            'ja-refund-policy|https://www.viewloom.net/ja/refund-policy/' \
            'ja-commercial-disclosure|https://www.viewloom.net/ja/commercial-disclosure/' \
            'ja-twitch-heatmap|https://www.viewloom.net/ja/twitch/heatmap/' \
            'ja-kick-heatmap|https://www.viewloom.net/ja/kick/heatmap/' \
            'ja-twitch-day-flow|https://www.viewloom.net/ja/twitch/day-flow/' \
            'ja-kick-day-flow|https://www.viewloom.net/ja/kick/day-flow/' \
            'ja-twitch-battle-lines|https://www.viewloom.net/ja/twitch/battle-lines/' \
            'ja-kick-battle-lines|https://www.viewloom.net/ja/kick/battle-lines/' \
            'ja-twitch-history|https://www.viewloom.net/ja/twitch/history/' \
            'ja-kick-history|https://www.viewloom.net/ja/kick/history/' \
            'ja-twitch-map|https://www.viewloom.net/ja/twitch/map/' \
            'ja-kick-map|https://www.viewloom.net/ja/kick/map/' \
            'ja-twitch-status|https://www.viewloom.net/ja/twitch/status/' \
            'ja-kick-status|https://www.viewloom.net/ja/kick/status/' \
            'ja-twitch-channel|https://www.viewloom.net/ja/twitch/channel/' \
            'ja-kick-channel|https://www.viewloom.net/ja/kick/channel/' \
            'ja-twitch-watchlist|https://www.viewloom.net/ja/twitch/watchlist/' \
            'ja-kick-watchlist|https://www.viewloom.net/ja/kick/watchlist/'
          do
            grep -Fq "$route" .github/workflows/production-smoke.yml
          done
          grep -q 'Verify Twitch production status' .github/workflows/production-smoke.yml
          grep -q 'Verify Kick production status' .github/workflows/production-smoke.yml
          grep -q 'Build Phase 11 monitoring evidence' .github/workflows/production-smoke.yml
          grep -q 'Verify Phase 11 monitoring evidence' .github/workflows/production-smoke.yml
          grep -q 'Verify explicit not-found behavior' .github/workflows/production-smoke.yml
          test -f scripts/build-phase11-monitoring-evidence.mjs
          test -f scripts/verify-phase11-monitoring-evidence.mjs
