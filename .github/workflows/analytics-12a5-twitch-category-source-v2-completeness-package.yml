name: Analytics 12A5 Twitch Category Source V2 Completeness Package

on:
  pull_request:
    branches: [main]
    paths:
      - 'workers/shared/category-capture-v2-candidate.ts'
      - 'scripts/test-12a5-twitch-category-source-v2-completeness-candidate.mjs'
      - 'scripts/verify-12a5-twitch-category-source-v2-completeness-package.mjs'
      - 'docs/audits/12a5-twitch-category-source-v2-completeness-package-contract.json'
      - 'docs/audits/12a5-twitch-category-source-v2-completeness-package-acceptance.json'
      - 'docs/audits/12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-decision.json'
      - 'docs/product/current-roadmap.md'
      - 'docs/product/current-schedule.md'
      - 'docs/product/twitch-replacement-seven-day-audit-spec.md'
      - 'docs/work-in-progress/phase12a4-category-parallel-execution.md'
      - 'docs/README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'workers/collector-twitch/**'
      - 'workers/collector-kick/**'
      - 'apps/web/**'
      - '.github/workflows/analytics-12a5-twitch-category-source-v2-completeness-package.yml'
  push:
    branches: [main]
    paths:
      - 'workers/shared/category-capture-v2-candidate.ts'
      - 'scripts/test-12a5-twitch-category-source-v2-completeness-candidate.mjs'
      - 'scripts/verify-12a5-twitch-category-source-v2-completeness-package.mjs'
      - 'docs/audits/12a5-twitch-category-source-v2-completeness-package-contract.json'
      - 'docs/audits/12a5-twitch-category-source-v2-completeness-package-acceptance.json'
      - '.github/workflows/analytics-12a5-twitch-category-source-v2-completeness-package.yml'

permissions:
  contents: read

concurrency:
  group: analytics-12a5-twitch-category-source-v2-completeness-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup repository toolchain
        uses: ./.github/actions/setup-node-pnpm
      - name: Parse package scripts
        run: |
          node --check scripts/test-12a5-twitch-category-source-v2-completeness-candidate.mjs
          node --check scripts/verify-12a5-twitch-category-source-v2-completeness-package.mjs
      - name: Compile dormant candidate
        run: pnpm exec tsc --target ES2022 --module ES2022 --moduleResolution Bundler --strict --noEmit workers/shared/category-capture-v2-candidate.ts
      - name: Run candidate unit and capacity tests
        run: node scripts/test-12a5-twitch-category-source-v2-completeness-candidate.mjs
      - name: Verify accepted dormant package
        run: node scripts/verify-12a5-twitch-category-source-v2-completeness-package.mjs
      - name: Verify governing recovery decision
        run: node scripts/verify-12a5-twitch-replacement-audit-checkpoint-failure-diagnosis-decision.mjs
      - name: Verify category rollout policy
        run: node scripts/verify-category-rollout-policy.mjs
      - name: Verify development policy
        run: node scripts/verify-development-policy.mjs
      - name: Verify active collectors remain candidate-free
        run: |
          ! grep -R "category-capture-v2-candidate\|encodeCategorySourceCompletenessV2Candidate" workers/collector-twitch workers/collector-kick
          ! grep -R "CATEGORY_SOURCE_V2\|category-source-v2-candidate" workers/collector-twitch/*.toml workers/collector-kick/*.toml
      - name: Typecheck active collectors
        run: pnpm typecheck:collectors
      - name: Typecheck web
        run: pnpm typecheck:web
      - name: Build web
        run: pnpm build:web
      - name: Verify public category controls remain absent
        run: |
          test -f apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'heatmap-category-preview-controls' apps/web/dist/twitch/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/twitch/heatmap/index.html
          test -f apps/web/dist/kick/heatmap/index.html
          ! grep -q 'categoryPreview' apps/web/dist/kick/heatmap/index.html
          ! grep -q 'data-category-preview-select' apps/web/dist/kick/heatmap/index.html
      - name: Summarize accepted dormant package
        run: |
          {
            echo '## Accepted Twitch category-source-v2 completeness package'
            echo
            echo '- Package / acceptance: `#682` / `#684`'
            echo '- Contract: `category-source-v2-candidate`'
            echo '- Capacity: 300 items, 348-byte overhead under 400-byte limit'
            echo '- Active collector import or production binding: no'
            echo '- Production activation or semantic mapping accepted: no'
            echo '- Kick, cadence, D1 schema, retention, public UI: unchanged'
            echo '- Next gate: bounded Twitch-only execution package'
          } >> "$GITHUB_STEP_SUMMARY"
