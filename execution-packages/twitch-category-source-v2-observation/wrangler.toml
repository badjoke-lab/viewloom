name = "viewloom-collector-twitch"
main = "../../workers/collector-twitch/.generated-v2-observation/entry.ts"
compatibility_date = "2026-05-18"

# One-time observation configuration only. Normal main-push deployment does not
# watch execution-packages/**. Deployment requires a separately accepted
# execution package and exact trigger. The workflow must always redeploy
# workers/collector-twitch/wrangler.category-permanent.toml in its rollback path.
[vars]
INTRADAY_GENERATION_ENABLED = "true"
CATEGORY_CAPTURE_ENABLED = "true"
CATEGORY_SOURCE_V2_OBSERVATION_ENABLED = "true"

[triggers]
crons = ["*/5 * * * *"]

# Existing Worker secrets remain unchanged:
#   TWITCH_CLIENT_ID
#   TWITCH_CLIENT_SECRET
#   TWITCH_INGEST_TOKEN (optional)

[[d1_databases]]
binding = "DB_TWITCH_HOT"
database_name = "vl_twitch_hot"
database_id = "b77221fe-80a3-4749-bc0e-d3ad54003dcf"
